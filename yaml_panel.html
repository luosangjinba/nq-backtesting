let gid = 100;
function nid() { gid++; return gid; }

function fmtTime(v) {
  var d = v.replace(/[^0-9]/g, '').slice(0, 4);
  if (d.length >= 3) return d.slice(0, 2) + ':' + d.slice(2);
  return d;
}

function okTime(t) {
  if (!/^\d{2}:\d{2}$/.test(t)) return false;
  var h = Number(t.slice(0, 2));
  var m = Number(t.slice(3, 5));
  return h >= 0 && h <= 23 && m >= 0 && m <= 59;
}

function timeToMin(t) {
  if (!okTime(t)) return -1;
  return parseInt(t.slice(0, 2)) * 60 + parseInt(t.slice(3, 5));
}

function calcSession(timeStr) {
  var m = timeToMin(timeStr);
  if (m < 0) return null;
  for (var i = 0; i < SESSION_MAP.length; i++) {
    if (m >= SESSION_MAP[i].min && m <= SESSION_MAP[i].max) return SESSION_MAP[i];
  }
  if (m < 570) return { value: 'before_ny_open', label: 'Before NY Open (< 9:30)', color: 'bg-gray-100 text-gray-600 border-gray-300' };
  return null;
}

function pad2(n) {
  return String(n).padStart(2, '0');
}

function parseFlexibleDateTime(raw) {
  var value = String(raw || '').trim().replace(/^\uFEFF/, '');
  if (!value) return null;

  var m = value.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if (m) {
    return {
      year: Number(m[3]),
      month: Number(m[1]),
      day: Number(m[2]),
      hour: Number(m[4]),
      minute: Number(m[5])
    };
  }

  m = value.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if (m) {
    return {
      year: Number(m[1]),
      month: Number(m[2]),
      day: Number(m[3]),
      hour: Number(m[4]),
      minute: Number(m[5])
    };
  }

  return null;
}

function minuteIdFromParts(parts) {
  if (!parts) return null;
  return Math.floor(Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute) / 60000);
}

function keyFromMinuteId(minuteId) {
  var d = new Date(minuteId * 60000);
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()) + ' ' + pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes());
}

function parseLookupDateTime(dateStr, timeStr) {
  var m = String(dateStr || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m || !okTime(timeStr)) return null;
  return {
    year: Number(m[1]),
    month: Number(m[2]),
    day: Number(m[3]),
    hour: Number(timeStr.slice(0, 2)),
    minute: Number(timeStr.slice(3, 5))
  };
}

function getWeekdayLabel(dateStr) {
  var m = String(dateStr || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return '';
  var d = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
  var weekdays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  return weekdays[d.getUTCDay()];
}

function getWeekdayIndex(dateStr) {
  var m = String(dateStr || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return -1;
  var d = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
  return d.getUTCDay();
}

function shiftIsoDate(dateStr, dayOffset) {
  var m = String(dateStr || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return dateStr || '';
  var offset = Number(dayOffset || 0);
  if (!offset) return dateStr;
  var d = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
  d.setUTCDate(d.getUTCDate() + offset);
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
}

function normalizeDayOffset(value) {
  var num = Number(value);
  if (isNaN(num)) return 0;
  if (num > 0) return 0;
  if (num < -30) return -30;
  return Math.trunc(num);
}

function parsePriceCsv(text) {
  var lines = String(text || '').split(/\r?\n/).filter(line => line.trim() !== '');
  if (lines.length < 2) throw new Error('CSV 至少需要表头和一行数据。');

  var headers = lines[0].split(',').map(h => h.trim().replace(/^\uFEFF/, '').toLowerCase());
  var idx = {
    datetime: headers.indexOf('datetime'),
    open: headers.indexOf('open'),
    high: headers.indexOf('high'),
    low: headers.indexOf('low'),
    close: headers.indexOf('close'),
    volume: headers.indexOf('volume')
  };

  if (idx.datetime < 0 || idx.open < 0 || idx.high < 0 || idx.low < 0 || idx.close < 0) {
    throw new Error('CSV 表头需要包含 datetime, open, high, low, close。');
  }

  var rowsByMinute = {};
  var firstMinuteId = null;
  var lastMinuteId = null;
  var loadedCount = 0;

  for (var i = 1; i < lines.length; i++) {
    var cols = lines[i].split(',');
    if (cols.length <= idx.close) continue;

    var parts = parseFlexibleDateTime(cols[idx.datetime]);
    var minuteId = minuteIdFromParts(parts);
    if (minuteId == null) continue;

    var key = keyFromMinuteId(minuteId);
    var row = {
      minuteId: minuteId,
      key: key,
      datetime: key,
      open: parseFloat(cols[idx.open]),
      high: parseFloat(cols[idx.high]),
      low: parseFloat(cols[idx.low]),
      close: parseFloat(cols[idx.close]),
      volume: idx.volume >= 0 ? parseFloat(cols[idx.volume]) : null
    };

    if ([row.open, row.high, row.low, row.close].some(v => isNaN(v))) continue;

    rowsByMinute[key] = row;
    loadedCount++;
    if (firstMinuteId == null || minuteId < firstMinuteId) firstMinuteId = minuteId;
    if (lastMinuteId == null || minuteId > lastMinuteId) lastMinuteId = minuteId;
  }

  if (loadedCount === 0) throw new Error('没有解析到有效 OHLC 数据。');

  return {
    rowsByMinute: rowsByMinute,
    count: loadedCount,
    firstKey: keyFromMinuteId(firstMinuteId),
    lastKey: keyFromMinuteId(lastMinuteId)
  };
}

}

  lines.push(pad + 'images:');
  validImages.forEach((img, index) => {
    lines.push(pad + '  - url: ' + yamlQuote(img.url || ''));
    if (img.title) lines.push(pad + '    title: ' + yamlQuote(img.title));
    if (img.note) lines.push(pad + '    note: ' + yamlQuote(img.note));
    lines.push(pad + '    sort: ' + (index + 1));

function inferLookupFieldForKeyPoint(labelValue) {
  if (!labelValue) return '';
  if (labelValue === 'ny_open' || labelValue === 'midnight_open') return 'open';
  if (labelValue.endsWith('_high')) return 'high';
  if (labelValue.endsWith('_low')) return 'low';
  return '';
}

function parseFvgTimeframe(raw) {
  var value = String(raw || '').trim().toLowerCase();
  var m = value.match(/^(\d{1,2})\s*([mhd])$/);
  if (!m) return { num: '', unit: 'm' };

  if (!num || num < 1 || num > 30) return { num: '', unit: 'm' };
  return { num: String(num), unit: m[2] };
}

function formatFvgTimeframe(num, unit) {
  var n = String(num || '').trim();
  var u = String(unit || '').trim().toLowerCase();
  if (!n || !u) return '';
  return n + u;
}

function fvgTimeframeToMinutes(num, unit) {
  var n = parseInt(String(num || '').trim(), 10);
  var u = String(unit || '').trim().toLowerCase();
  if (!n || n <= 0) return 0;
  if (u === 'm') return n;
  if (u === 'h') return n * 60;
  if (u === 'd') return n * 1440;
  return 0;
}

function inferSuggestedKeyPointLabel(labelValue, dayOffset, timeStr) {
  var normalizedLabel = String(labelValue || '').toLowerCase();
  var offset = normalizeDayOffset(dayOffset);
  var minute = timeToMin(timeStr);
  if (minute < 0 || !normalizedLabel) return 'Other Label';

  if (normalizedLabel === 'ny_open') {
    return offset === 0 && timeStr === '09:30' ? 'NY Open' : 'Other Label';
  }

  if (normalizedLabel === 'midnight_open') {
    return offset === 0 && timeStr === '00:00' ? 'Midnight Open' : 'Other Label';
  }

  function inOvernightWindow(startMinute, endMinute) {
    return offset === 0 && minute >= startMinute && minute <= endMinute;
  }

  function inGlobexWindow() {
    return (offset === -1 && minute >= 18 * 60) || (offset === 0 && minute <= 9 * 60 + 29);
  }

  if (normalizedLabel.indexOf('asia_') === 0) {
    if ((offset === -1 && minute >= 18 * 60) || (offset === 0 && minute <= 1 * 60 + 59)) {
      return normalizedLabel.indexOf('_high') >= 0 ? 'Asia High' : 'Asia Low';
    }
    return 'Other Label';
  }

  if (normalizedLabel.indexOf('ldn_') === 0) {
    if (inOvernightWindow(2 * 60, 4 * 60 + 59)) {
      return normalizedLabel.indexOf('_high') >= 0 ? 'LDN High' : 'LDN Low';
    }
    return 'Other Label';
  }

  if (normalizedLabel.indexOf('transition_') === 0) {
    if (inOvernightWindow(5 * 60, 6 * 60 + 59)) {
      return normalizedLabel.indexOf('_high') >= 0 ? 'Transition High' : 'Transition Low';
    }
    return 'Other Label';
  }

  if (normalizedLabel.indexOf('pm_') === 0) {
    if (inOvernightWindow(7 * 60, 9 * 60 + 29)) {
      return normalizedLabel.indexOf('_high') >= 0 ? 'PM High' : 'PM Low';
    }
    return 'Other Label';
  }

  if (normalizedLabel.indexOf('globex_') === 0) {
    if (inGlobexWindow()) {
      return normalizedLabel.indexOf('_high') >= 0 ? 'Globex High' : 'Globex Low';
    }
    return 'Other Label';
  }

  if (normalizedLabel.indexOf('prev_day_') === 0) {
    if (offset === -1) {
      return normalizedLabel.indexOf('_high') >= 0 ? 'Prev Day High' : 'Prev Day Low';
    }
    return 'Other Label';
  }

  if (normalizedLabel === 'other') {
    return 'Other Label';
  }

  if (inferLookupFieldForKeyPoint(normalizedLabel) === 'open') {
    if (offset === 0 && timeStr === '09:30') return 'NY Open';
    if (offset === 0 && timeStr === '00:00') return 'Midnight Open';
    return 'Other Label';
  }

  var normalizedField = inferLookupFieldForKeyPoint(normalizedLabel);
  if (normalizedField !== 'high' && normalizedField !== 'low') {
    return 'Other Label';
  }

  var suffix = normalizedField === 'high' ? 'High' : 'Low';
  if ((offset === -1 && minute >= 18 * 60) || (offset === 0 && minute <= 1 * 60 + 59)) return 'Asia ' + suffix;
  if (offset === 0 && minute >= 2 * 60 && minute <= 4 * 60 + 59) return 'LDN ' + suffix;
  if (offset === 0 && minute >= 5 * 60 && minute <= 6 * 60 + 59) return 'Transition ' + suffix;
  if (offset === 0 && minute >= 7 * 60 && minute <= 9 * 60 + 29) return 'PM ' + suffix;
  return 'Other Label';
}

function getKeyPointSessionStatus(labelValue, dayOffset, timeStr) {
  if (!okTime(timeStr) || !labelValue) return '';
  return inferSuggestedKeyPointLabel(labelValue, dayOffset, timeStr) === 'Other Label'
    ? 'out of session'
    : 'in session';
}

  async function computeFvg(target, saveRecord) {
    if (!target) return;

    var timeframe = fvgTimeframeToMinutes(target.timeframeNum, target.timeframeUnit);
    if (!timeframe) {
      setLookupError('请先为 FVG 选择有效周期。');
      return;
    }
    if (!okTime(target.middleTime)) {
      setLookupError('请先填写 FVG 的中间K线时间。');
      return;
    }

    var effectiveDate = shiftIsoDate(date, target.dayOffset);
    if (!effectiveDate || !/^\d{4}-\d{2}-\d{2}$/.test(effectiveDate)) {
      setLookupError('FVG 的有效日期无效。');
      return;
    }

    var middleParts = parseLookupDateTime(effectiveDate, target.middleTime);
    var middleMinuteId = minuteIdFromParts(middleParts);
    if (middleMinuteId == null) {
      setLookupError('盘前 FVG 的时间无法解析。');
      return;
    }

    function minuteIdToDateTime(minuteId) {
      var d = new Date(minuteId * 60000);
      return {
        date: d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()),
        time: pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes())
      };
    }

    var prevInfo = minuteIdToDateTime(middleMinuteId - timeframe);
    var nextInfo = minuteIdToDateTime(middleMinuteId + timeframe);

    setLookupLoading(true);
    var prevResult = await runPriceLookup(prevInfo.date, prevInfo.time, String(timeframe), 'close');
    if (prevResult.error) {
      setLookupError('前一根K线查询失败：' + prevResult.error);
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }
    var nextResult = await runPriceLookup(nextInfo.date, nextInfo.time, String(timeframe), 'close');
    if (nextResult.error) {
      setLookupError('后一根K线查询失败：' + nextResult.error);
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }

    var prevOhlc = prevResult.ohlc || {};
    var nextOhlc = nextResult.ohlc || {};
    var prevHigh = parseFloat(prevOhlc.high);
    var prevLow = parseFloat(prevOhlc.low);
    var nextHigh = parseFloat(nextOhlc.high);
    var nextLow = parseFloat(nextOhlc.low);

    if ([prevHigh, prevLow, nextHigh, nextLow].some(isNaN)) {
      setLookupError('FVG 自动计算失败：前后K线 OHLC 数据不完整。');
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }

    var direction = '';
    var high = '';
    var low = '';
    if (nextLow > prevHigh) {
      direction = 'bullish';
      high = String(nextLow);
      low = String(prevHigh);
    } else if (prevLow > nextHigh) {
      direction = 'bearish';
      high = String(prevLow);
      low = String(nextHigh);
    } else {
      setLookupError('这组三根K线没有形成有效 FVG。');
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }

    saveRecord(direction, high, low);
    setLookupError('');
    setLookupResult({
      field: 'fvg',
      timeframe: timeframe,
      value: direction,
      foundBars: (prevResult.foundBars || 0) + (nextResult.foundBars || 0),
      expectedBars: (prevResult.expectedBars || 0) + (nextResult.expectedBars || 0),
      startKey: prevResult.startKey,
      endKey: nextResult.endKey,
      missingBars: (prevResult.missingBars || 0) + (nextResult.missingBars || 0),
      ohlc: { prev: prevOhlc, next: nextOhlc }
    });
    setLookupDate(effectiveDate);
    setLookupTime(target.middleTime);
    setLookupLoading(false);
  }

  async function computePremarketFvg(id) {
    var target = null;
    for (var i = 0; i < premarketFvgs.length; i++) {
      if (premarketFvgs[i].id === id) {
        target = premarketFvgs[i];
        break;
      }
    }
    await computeFvg(target, (direction, high, low) => {
      setPremarketFvgs(p => p.map(fvg => fvg.id === id ? { ...fvg, direction: direction, high: high, low: low } : fvg));
    });
  }

  async function computeIntradayFvg(id) {
    var target = null;
    for (var i = 0; i < intradayFvgs.length; i++) {
      if (intradayFvgs[i].id === id) {
        target = intradayFvgs[i];
        break;
      }
    }
    await computeFvg(target, (direction, high, low) => {
      setIntradayFvgs(p => p.map(fvg => fvg.id === id ? { ...fvg, direction: direction, high: high, low: low } : fvg));
    });
  }

  function getOvernightGapWindow(type, anchorDate) {
    if (!anchorDate || !/^\d{4}-\d{2}-\d{2}$/.test(anchorDate)) {
      return { error: 'NWOG/NDOG 的有效日期无效。' };
    }
    var weekday = getWeekdayIndex(anchorDate);
    if (type === 'ndog') {
      if (weekday < 1 || weekday > 4) {
        return { error: 'NDOG 只能使用周一到周四的 T日。' };
      }
      return {
        startDate: anchorDate,
        startTime: '16:59',
        endDate: anchorDate,
        endTime: '18:00'
      };
    }
    if (type === 'nwog') {
      if (weekday !== 1) {
        return { error: 'NWOG 只能使用周一的 T日，系统会自动连接上一个周五 16:59 与该周一 18:00。' };
      }
      return {
        startDate: shiftIsoDate(anchorDate, -3),
        startTime: '16:59',
        endDate: anchorDate,
        endTime: '18:00'
      };
    }
    return { error: '请先选择 NWOG 或 NDOG。' };
  }

  async function computeOvernightGap(id) {
    var target = null;
    for (var i = 0; i < overnightGaps.length; i++) {
      if (overnightGaps[i].id === id) {
        target = overnightGaps[i];
        break;
      }
    }
    if (!target) return;

    var anchorDate = shiftIsoDate(date, target.dayOffset);
    var window = getOvernightGapWindow(target.type, anchorDate);
    if (window.error) {
      setLookupError(window.error);
      setLookupResult(null);
      return;
    }

    setLookupLoading(true);
    var closeResult = await runPriceLookup(window.startDate, window.startTime, '1', 'close', { fallback: 'prev', maxLookback: 360 });
    if (closeResult.error) {
      setLookupError('NWOG/NDOG 起点查询失败：' + closeResult.error);
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }

    var openResult = await runPriceLookup(window.endDate, window.endTime, '1', 'open');
    if (openResult.error) {
      setLookupError('NWOG/NDOG 终点查询失败：' + openResult.error);
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }

    var closePrice = parseFloat(closeResult.value);
    var openPrice = parseFloat(openResult.value);
    if (isNaN(closePrice) || isNaN(openPrice)) {
      setLookupError('NWOG/NDOG 自动计算失败：价格数据不完整。');
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }
    if (closePrice === openPrice) {
      setLookupError('这组价格没有形成有效 gap。');
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }

    var direction = openPrice > closePrice ? 'bullish' : 'bearish';
    var high = String(Math.max(closePrice, openPrice));
    var low = String(Math.min(closePrice, openPrice));

    setOvernightGaps(p => p.map(gap => gap.id === id ? {
      ...gap,
      startDate: closeResult.actualDate || window.startDate,
      startTime: closeResult.actualTime || window.startTime,
      endDate: window.endDate,
      endTime: window.endTime,
      direction: direction,
      high: high,
      low: low
    } : gap));

    setLookupError('');
    setLookupResult({
      field: 'gap',
      timeframe: 1,
      value: direction,
      foundBars: (closeResult.foundBars || 0) + (openResult.foundBars || 0),
      expectedBars: (closeResult.expectedBars || 0) + (openResult.expectedBars || 0),
      startKey: closeResult.startKey,
      endKey: openResult.endKey,
      missingBars: (closeResult.missingBars || 0) + (openResult.missingBars || 0),
      ohlc: {
        start: closeResult.ohlc || {},
        end: openResult.ohlc || {}
      }
    });
    setLookupDate(window.endDate);
    setLookupTime(window.endTime);
    setLookupLoading(false);
  }

  function calcRR(en) {
    var ep = parseFloat(en.entryPrice);
    var sl = parseFloat(en.stop);
    var ti = parseFloat(en.targetInternal);
    if (isNaN(ep) || isNaN(sl) || sl === ep) return null;
    var risk = Math.abs(ep - sl);
    var reward = ti && !isNaN(ti) ? Math.abs(ti - ep) : null;
    return { risk, reward, rr: reward ? (reward / risk).toFixed(2) : null };
  }

  function calcActualRR(en) {
    var ep = parseFloat(en.entryPrice);
    var sl = parseFloat(en.stop);
    var exP = parseFloat(en.exitPrice);
    if (isNaN(ep) || isNaN(sl) || isNaN(exP) || sl === ep) return null;
    var risk = Math.abs(ep - sl);
    var pnl = en.direction === 'long' ? exP - ep : ep - exP;
    return { pnl, rr: (pnl / risk).toFixed(2) };
  }

  async function runPriceLookup(dateStr, timeStr, timeframeStr, field, options) {
    var lookupOptions = options || {};
    if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
      return { error: '查询日期格式需要是 YYYY-MM-DD。' };
    }
    if (!okTime(timeStr)) {
      return { error: '查询时间格式需要是 HH:MM。' };
    }

    var parts = parseLookupDateTime(dateStr, timeStr);
    var startMinuteId = minuteIdFromParts(parts);
    var timeframe = parseInt(timeframeStr, 10);
    if (!timeframe || timeframe <= 0) {
      return { error: '周期设置无效。' };
    }

    try {
      var qs = new URLSearchParams({
        instrument: inst || 'NQ',
        date: dateStr,
        time: timeStr,
        tf: String(timeframe),
        field: field
      });
      if (lookupOptions.fallback) qs.set('fallback', lookupOptions.fallback);
      if (lookupOptions.maxLookback != null) qs.set('max_lookback', String(lookupOptions.maxLookback));
      var resp = await fetch(apiBaseUrl.replace(/\/$/, '') + '/price?' + qs.toString());
      var payload = await resp.json();
      if (!resp.ok || !payload.ok) {
        return { error: payload && payload.error ? payload.error : '查询失败，请检查本地 API 和数据库。' };
      }
      var result = payload.result;
      return {
        value: result.value,
        field: result.field,
        timeframe: result.timeframe,
        actualDate: result.actualDate,
        actualTime: result.actualTime,
        ohlc: result.ohlc,
        foundBars: result.foundBars,
        expectedBars: result.expectedBars,
        startKey: result.startTs,
        endKey: result.endTs,
        missingBars: result.missingBars
      };
    } catch (err) {
      return { error: '无法连接本地查价服务，请先启动 price_lookup_api.py。' };
    }
  }

  async function checkApiHealth() {
    var baseUrl = apiBaseUrl.replace(/\/$/, '');
    try {
      var resp = await fetch(baseUrl + '/health');
      var payload = await resp.json();
      if (!resp.ok || !payload.ok) {
        setApiStatus({ ok: false, error: payload && payload.error ? payload.error : 'health check failed' });
        return;
      }
      setApiStatus({ ok: true, details: payload.details || '' });
    } catch (err) {
      var message = err && err.message ? err.message : '未连接';
      setApiStatus({ ok: false, error: message, details: 'health: ' + baseUrl + '/health' });
    }
  }

  async function applyLookupResult(dateStr, timeStr, setter, options) {
    var lookupOptions = options || {};
    var fieldToUse = lookupOptions.field || lookupField;
    var dateToUse = lookupOptions.date || dateStr || lookupDate;
    setLookupLoading(true);
    var result = await runPriceLookup(dateToUse, timeStr, lookupTimeframe, fieldToUse);
    if (result.error) {
      setLookupError(result.error);
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }
    setter(String(result.value));
    setLookupError('');
    setLookupResult(result);
    setLookupDate(dateToUse);
    setLookupTime(timeStr);
    if (fieldToUse !== lookupField) setLookupField(fieldToUse);
    setLookupLoading(false);
  }

  async function handleLookupSubmit() {
    setLookupLoading(true);
    var result = await runPriceLookup(lookupDate, lookupTime, lookupTimeframe, lookupField);
    if (result.error) {
      setLookupResult(null);
      setLookupError(result.error);
      setLookupLoading(false);
      return;
    }
    setLookupResult(result);
    setLookupError('');
    setLookupLoading(false);
  }

  function getReversalRefInfo(en) {
    if (!en.reversalRef) return null;
    for (var i = 0; i < reversalOptions.length; i++) {
      if (reversalOptions[i].value === en.reversalRef) return reversalOptions[i];
    }
    return null;
  }

  function buildYaml() {
    var L = [];
    L.push('date: ' + date);
    L.push('instrument: ' + inst);
    pushImagesYaml(L, 0, basicInfoImages);
    if (news.length > 0 && news.some(n => n.event)) {
      L.push('red_folder_news:');
      news.forEach(n => {
        if (n.event) {
          L.push('  - event: ' + n.event);
          if (n.time) L.push('    time: "' + n.time + '"');
        }
      });
    }
    L.push('');
    L.push('overnight_structure:');
    L.push('  key_points:');
    pts.forEach(p => {
      if (p.time) {
        var lb = getLabelText(p);
        L.push('    - label: ' + (lb || '""'));
        L.push('      day_offset: ' + normalizeDayOffset(p.dayOffset));
        L.push('      time: "' + p.time + '"');
        if (p.price) L.push('      price: ' + p.price);
        pushImagesYaml(L, 6, p.images);
      }
    });
    if (premarketFvgs.some(fvg => fvg.dayOffset || fvg.timeframeNum || fvg.middleTime || fvg.direction || fvg.high || fvg.low)) {
      L.push('  premarket_key_fvgs:');
      premarketFvgs.forEach(fvg => {
        var timeframe = formatFvgTimeframe(fvg.timeframeNum, fvg.timeframeUnit);
        if (fvg.dayOffset || timeframe || fvg.middleTime || fvg.direction || fvg.high || fvg.low) {
          L.push('    - timeframe: ' + (timeframe || '""'));
          L.push('      day_offset: ' + normalizeDayOffset(fvg.dayOffset));
          L.push('      middle_candle_time: "' + (fvg.middleTime || '') + '"');
          if (fvg.direction) L.push('      direction: ' + fvg.direction);
          if (fvg.high) L.push('      fvg_high: ' + fvg.high);
          if (fvg.low) L.push('      fvg_low: ' + fvg.low);
        }
      });
    }
    if (eqLevels.some(isMeaningfulEqLevel)) {
      L.push('  eq_levels:');
      eqLevels.forEach(level => {
        var pointRefs = normalizeEqLevelPointRefs(level.pointRefs);
        if (level.type || pointRefs.length > 0 || (Array.isArray(level.images) && level.images.length > 0)) {
          L.push('    - type: ' + (level.type || '""'));
          if (pointRefs.length > 0) {
            L.push('      key_points:');
            pointRefs.forEach(ref => {
              var point = findPtBySelection(ref);
              if (!point) return;
              L.push('        - ' + yamlQuote(getEqLevelPointToken(point)));
            });
          }
          pushImagesYaml(L, 6, level.images);
        }
      });
    }
    if (overnightGaps.some(isMeaningfulOvernightGap)) {
      L.push('  key_nwog_ndog:');
      overnightGaps.forEach(gap => {
        if (isMeaningfulOvernightGap(gap)) {
          L.push('    - type: ' + (gap.type || 'ndog'));
          L.push('      day_offset: ' + normalizeDayOffset(gap.dayOffset));
          if (gap.startDate) L.push('      start_date: ' + yamlQuote(gap.startDate));
          if (gap.startTime) L.push('      start_time: ' + yamlQuote(gap.startTime));
          if (gap.endDate) L.push('      end_date: ' + yamlQuote(gap.endDate));
          if (gap.endTime) L.push('      end_time: ' + yamlQuote(gap.endTime));
          if (gap.direction) L.push('      direction: ' + gap.direction);
          if (gap.high) L.push('      gap_high: ' + gap.high);
          if (gap.low) L.push('      gap_low: ' + gap.low);
        }
      });
    }
    if (segs.some(s => s.st || s.et || (s.actions && s.actions.length > 0))) {
      L.push('  market_segments:');
      segs.forEach(s => {
        if (s.st || s.et || (s.actions && s.actions.length > 0)) {
          L.push('    - start: "' + getPtTimeValue(s.st) + '"');
          L.push('      end: "' + getPtTimeValue(s.et) + '"');
          if (s.dir === 'consolidation') {
            L.push('      direction: consolidation');
            if (s.consBias) L.push('      bias: ' + s.consBias);
          } else if (s.dir) {
            L.push('      direction: ' + s.dir);
          }
          if (s.actions && s.actions.length > 0) {
            var validActions = s.actions.filter(action => action && (action.type || action.ref || action.note));
            if (validActions.length > 0) {
                L.push('      actions:');
              validActions.forEach(action => {
                L.push('        - type: ' + (action.type || '""'));
                if (action.type === 'tap_fvg' || action.type === 'fill_fvg') {
                  var actionFvg = findPremarketFvgBySelection(action.ref);
                  var actionFvgTimeframe = actionFvg ? formatFvgTimeframe(actionFvg.timeframeNum, actionFvg.timeframeUnit) : '';
                  if (actionFvg) L.push('          fvg_day_offset: ' + normalizeDayOffset(actionFvg.dayOffset));
                  if (actionFvgTimeframe) L.push('          fvg_timeframe: ' + actionFvgTimeframe);
                  if (actionFvg && actionFvg.middleTime) L.push('          fvg_middle_candle_time: "' + actionFvg.middleTime + '"');
                } else if (action.type === 'sweep_eq_level') {
                  var actionEqLevel = findEqLevelBySelection(action.ref);
                  var actionEqRefs = actionEqLevel ? normalizeEqLevelPointRefs(actionEqLevel.pointRefs) : [];
                  if (actionEqLevel && actionEqLevel.type) L.push('          eq_level_type: ' + actionEqLevel.type);
                  if (actionEqRefs.length > 0) {
                    L.push('          eq_key_points:');
                    actionEqRefs.forEach(ref => {
                      var eqPoint = findPtBySelection(ref);
                      if (!eqPoint) return;
                      L.push('            - ' + yamlQuote(getEqLevelPointToken(eqPoint)));
                    });
                  }
                } else if (action.type === 'tap_gap' || action.type === 'tap_gap_ce' || action.type === 'fill_gap') {
                  var actionGap = findOvernightGapBySelection(action.ref);
                  if (actionGap) {
                    L.push('          gap_type: ' + (actionGap.type || 'ndog'));
                    L.push('          gap_day_offset: ' + normalizeDayOffset(actionGap.dayOffset));
                    if (actionGap.startDate) L.push('          gap_start_date: ' + yamlQuote(actionGap.startDate));
                    if (actionGap.startTime) L.push('          gap_start_time: ' + yamlQuote(actionGap.startTime));
                    if (actionGap.endDate) L.push('          gap_end_date: ' + yamlQuote(actionGap.endDate));
                    if (actionGap.endTime) L.push('          gap_end_time: ' + yamlQuote(actionGap.endTime));
                  }
                } else if (action.ref) {
                  L.push('          key_point: "' + getPtTimeValue(action.ref) + '"');
                }
                if (action.note) L.push('          note: ' + action.note);
              });
            }
          }
          if (s.note) L.push('      note: ' + s.note);
          pushImagesYaml(L, 6, s.images);
        }
      });
    }
    L.push('  open_reference_range:');
    L.push('    start: "' + getPtTimeValue(orr.st) + '"');
    L.push('    end: "' + getPtTimeValue(orr.et) + '"');
    if (orr.note) L.push('    note: ' + orr.note);
    pushImagesYaml(L, 4, orr.images);
    L.push('');
    L.push('execution_observation:');
    if (execs.some(e => e.time)) {
      L.push('  key_points:');
      execs.forEach(e => {
        if (e.time) {
          L.push('    - time: "' + e.time + '"');
          if (e.price) L.push('      price: ' + e.price);
          if (e.note) L.push('      note: ' + e.note);
          pushImagesYaml(L, 6, e.images);
        }
      });
    }
    if (intradayFvgs.some(fvg => fvg.dayOffset || fvg.timeframeNum || fvg.middleTime || fvg.direction || fvg.high || fvg.low)) {
      L.push('  intraday_fvgs:');
      intradayFvgs.forEach(fvg => {
        var timeframe = formatFvgTimeframe(fvg.timeframeNum, fvg.timeframeUnit);
        if (fvg.dayOffset || timeframe || fvg.middleTime || fvg.direction || fvg.high || fvg.low) {
          L.push('    - timeframe: ' + (timeframe || '""'));
          L.push('      day_offset: ' + normalizeDayOffset(fvg.dayOffset));
          L.push('      middle_candle_time: "' + (fvg.middleTime || '') + '"');
          if (fvg.direction) L.push('      direction: ' + fvg.direction);
          if (fvg.high) L.push('      fvg_high: ' + fvg.high);
          if (fvg.low) L.push('      fvg_low: ' + fvg.low);
        }
      });
    }
    if (revs.some(r => r.execRef || r.shape)) {
      L.push('  reversals:');
      revs.forEach((r, ri) => {
        if (r.execRef || r.shape) {
          var sess = getRevSession(r);
          var price = getRevPrice(r);
          L.push('    - id: ' + (ri + 1));
          L.push('      time: "' + (r.execRef || '') + '"');
          L.push('      session: ' + (sess ? sess.value : '""'));
          if (price) L.push('      price: ' + price);
          if (r.shape) L.push('      shape: ' + r.shape);
          L.push('      smt: ' + (r.smt ? 'true' : 'false'));
          if (r.reasons.length > 0) {
            L.push('      reasons:');
            r.reasons.forEach(rr => L.push('        - ' + rr));
          }
          if (r.note) L.push('      note: ' + r.note);
          pushImagesYaml(L, 6, r.images);
        }
      });
    }

    var validEntries = entries.filter(e => e.time);
    if (validEntries.length > 0) {
      L.push('');
      L.push('entry:');
      validEntries.forEach((en, idx) => {
        L.push('  - id: ' + (idx + 1));
        L.push('    time: "' + en.time + '"');
        L.push('    direction: ' + en.direction);
        if (en.primaryPick) L.push('    primary_pick: true');
        if (en.entryStyle) L.push('    entry_style: ' + en.entryStyle);
        if (en.entryPrice) L.push('    entry_price: ' + en.entryPrice);
        if (en.stop) L.push('    stop: ' + en.stop);
        if (en.targetInternal) L.push('    target_internal: ' + en.targetInternal);
        if (en.targetSwing) L.push('    target_swing: ' + en.targetSwing);
        if (en.targetExternal) L.push('    target_external: ' + en.targetExternal);
        if (en.mae) L.push('    mae: ' + en.mae);
        if (en.mfe) L.push('    mfe: ' + en.mfe);
        if (en.basedOn) L.push('    based_on: ' + en.basedOn);
        var revInfo = getReversalRefInfo(en);
        if (revInfo) {
          L.push('    reversal_ref: ' + revInfo.revId);
        } else if (en.reversalRef === 'none') {
          L.push('    reversal_ref: none');
        }
        pushImagesYaml(L, 4, en.images);
        var hasResult = en.exitTime || en.exitPrice || en.exitType || en.outcome || en.positive.length > 0 || en.negative.length > 0;
        if (hasResult) {
          L.push('    result:');
          if (en.exitTime) L.push('      exit_time: "' + en.exitTime + '"');
          if (en.exitPrice) L.push('      exit_price: ' + en.exitPrice);
          if (en.exitType) L.push('      exit_type: ' + en.exitType);
          if (en.outcome) L.push('      outcome: ' + en.outcome);
          if (en.positive.length > 0) {
            L.push('      positive: [' + en.positive.join(', ') + ']');
          }
          if (en.negative.length > 0) {
            L.push('      negative: [' + en.negative.join(', ') + ']');
          } else if (hasResult) {
            L.push('      negative: none');
          }
        }
        if (idx < validEntries.length - 1) L.push('');
      });
    }

    if (keyLesson.trim()) {
      L.push('');
      L.push('key_lesson: "' + keyLesson.trim().replace(/"/g, '\\"') + '"');
    }

    setYaml(L.join('\n'));
    setTab(4);
  }

  function copyYaml() {
    navigator.clipboard.writeText(yaml);
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  }

  function saveYaml() {
    if (!yaml) return;
    var fileName = (inst || 'journal').trim() + '_' + (date || 'draft') + '.yaml';
    var blob = new Blob([yaml], { type: 'text/yaml;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
