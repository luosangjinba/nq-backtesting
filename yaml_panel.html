        border: 1px solid rgba(52, 211, 153, 0.22);

      .status-pill {
        display: inline-flex;
        align-items: center;
        padding: 0.28rem 0.62rem;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
        border: 1px solid transparent;
      }

      .status-pill--info {
        background: rgba(96, 165, 250, 0.14);
        color: #dbeafe;
        border-color: rgba(96, 165, 250, 0.28);
      }

      .status-pill--warn {
        background: rgba(251, 191, 36, 0.14);
        color: #fde68a;
        border-color: rgba(251, 191, 36, 0.25);
      }

      .status-pill--success {
        background: rgba(52, 211, 153, 0.14);
        color: #d1fae5;
        border-color: rgba(52, 211, 153, 0.26);

        border-color: rgba(248, 113, 113, 0.24);

        color: #f3e8ff;
        border-color: rgba(168, 85, 247, 0.24);
      }

      .field-cluster {
        border-radius: 1rem;
        padding: 0.95rem 1rem;
        background: rgba(18, 27, 43, 0.18);
        border: 1px solid rgba(138, 155, 195, 0.16);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      .field-cluster__title {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 0.75rem;
      }

      .helper-button {
        width: 100%;
        margin-top: 0.35rem;
        padding: 0.45rem 0.7rem;
        border-radius: 0.65rem;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.01em;
        border: 1px solid transparent;
        transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;

      .helper-button--info {
        background: rgba(96, 165, 250, 0.12);
        color: #bfdbfe;
        border-color: rgba(96, 165, 250, 0.26);
      }

      .helper-button--info:hover {
        background: rgba(96, 165, 250, 0.18);
      }

      .helper-button--warm {
        background: rgba(251, 191, 36, 0.12);
        color: #fde68a;
        border-color: rgba(251, 191, 36, 0.22);
      }

      .helper-button--warm:hover {
        background: rgba(251, 191, 36, 0.18);
      }

        grid-template-columns: repeat(1, minmax(0, 1fr));
        gap: 0.75rem;

      .field-grid-tight-3 {
        display: grid;
        grid-template-columns: repeat(1, minmax(0, 1fr));
        gap: 0.75rem;

      .field-grid-core-entry {
        display: grid;
        grid-template-columns: repeat(1, minmax(0, 1fr));
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

        margin-top: 0.95rem;
        border: 1px solid rgba(71, 85, 105, 0.95);
        border-radius: 1rem;
        overflow: hidden;
        background-color: rgba(17, 26, 44, 0.42);
      }

      .image-panel__body {
        padding: 0 1rem 1rem;
        border-top: 1px solid rgba(71, 85, 105, 0.95);
        background-color: rgba(17, 26, 44, 0.3);
      }

      .image-item-card {
        margin-top: 0.9rem;
        border: 1px solid rgba(71, 85, 105, 0.95);
        border-radius: 0.9rem;
        padding: 0.9rem;
        background-color: #243149;
      }

      @media (min-width: 768px) {
        .field-grid-tight-2 {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .field-grid-tight-3 {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .field-grid-core-entry {
          grid-template-columns: 110px 150px 170px minmax(0, 1fr);
        }

function nid() { gid++; return gid; }

function fmtTime(v) {
  var d = v.replace(/[^0-9]/g, '').slice(0, 4);
  if (d.length >= 3) return d.slice(0, 2) + ':' + d.slice(2);
  return d;
}

function okTime(t) {
  if (!/^\d{2}:\d{2}$/.test(t)) return false;
  var h = Number(t.slice(0, 2));
  var m = Number(t.slice(3, 5));
  return h >= 0 && h <= 23 && m >= 0 && m <= 59;
}

function timeToMin(t) {
  if (!okTime(t)) return -1;
  return parseInt(t.slice(0, 2)) * 60 + parseInt(t.slice(3, 5));
}

function calcSession(timeStr) {
  var m = timeToMin(timeStr);
  if (m < 0) return null;
  for (var i = 0; i < SESSION_MAP.length; i++) {
    if (m >= SESSION_MAP[i].min && m <= SESSION_MAP[i].max) return SESSION_MAP[i];
  }
  if (m < 570) return { value: 'before_ny_open', label: 'Before NY Open (< 9:30)', color: 'bg-gray-100 text-gray-600 border-gray-300' };
  return null;
}

function pad2(n) {
  return String(n).padStart(2, '0');
}

function parseFlexibleDateTime(raw) {
  var value = String(raw || '').trim().replace(/^\uFEFF/, '');
  if (!value) return null;

  var m = value.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if (m) {
    return {
      year: Number(m[3]),
      month: Number(m[1]),
      day: Number(m[2]),
      hour: Number(m[4]),
      minute: Number(m[5])
    };
  }

  m = value.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if (m) {
    return {
      year: Number(m[1]),
      month: Number(m[2]),
      day: Number(m[3]),
      hour: Number(m[4]),
      minute: Number(m[5])
    };
  }

  return null;
}

function minuteIdFromParts(parts) {
  if (!parts) return null;
  return Math.floor(Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute) / 60000);
}

function keyFromMinuteId(minuteId) {
  var d = new Date(minuteId * 60000);
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()) + ' ' + pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes());
}

function parseLookupDateTime(dateStr, timeStr) {
  var m = String(dateStr || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m || !okTime(timeStr)) return null;
  return {
    year: Number(m[1]),
    month: Number(m[2]),
    day: Number(m[3]),
    hour: Number(timeStr.slice(0, 2)),
    minute: Number(timeStr.slice(3, 5))
  };
}

function getWeekdayLabel(dateStr) {
  var m = String(dateStr || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return '';
  var d = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
  var weekdays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  return weekdays[d.getUTCDay()];
}

function formatIsoDateDisplay(dateStr) {
  var m = String(dateStr || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return dateStr || '';
  return m[2] + '/' + m[3] + '/' + m[1];
}

function getWeekdayIndex(dateStr) {
  var m = String(dateStr || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return -1;
  var d = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
  return d.getUTCDay();
}

function shiftIsoDate(dateStr, dayOffset) {
  var m = String(dateStr || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return dateStr || '';
  var offset = Number(dayOffset || 0);
  if (!offset) return dateStr;
  var d = new Date(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])));
  d.setUTCDate(d.getUTCDate() + offset);
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
}

function normalizeDayOffset(value) {
  var num = Number(value);
  if (isNaN(num)) return 0;
  if (num > 0) return 0;
  if (num < -30) return -30;
  return Math.trunc(num);
}

function parsePriceCsv(text) {
  var lines = String(text || '').split(/\r?\n/).filter(line => line.trim() !== '');
  if (lines.length < 2) throw new Error('CSV 至少需要表头和一行数据。');

  var headers = lines[0].split(',').map(h => h.trim().replace(/^\uFEFF/, '').toLowerCase());
  var idx = {
    datetime: headers.indexOf('datetime'),
    open: headers.indexOf('open'),
    high: headers.indexOf('high'),
    low: headers.indexOf('low'),
    close: headers.indexOf('close'),
    volume: headers.indexOf('volume')
  };

  if (idx.datetime < 0 || idx.open < 0 || idx.high < 0 || idx.low < 0 || idx.close < 0) {
    throw new Error('CSV 表头需要包含 datetime, open, high, low, close。');
  }

  var rowsByMinute = {};
  var firstMinuteId = null;
  var lastMinuteId = null;
  var loadedCount = 0;

  for (var i = 1; i < lines.length; i++) {
    var cols = lines[i].split(',');
    if (cols.length <= idx.close) continue;

    var parts = parseFlexibleDateTime(cols[idx.datetime]);
    var minuteId = minuteIdFromParts(parts);
    if (minuteId == null) continue;

    var key = keyFromMinuteId(minuteId);
    var row = {
      minuteId: minuteId,
      key: key,
      datetime: key,
      open: parseFloat(cols[idx.open]),
      high: parseFloat(cols[idx.high]),
      low: parseFloat(cols[idx.low]),
      close: parseFloat(cols[idx.close]),
      volume: idx.volume >= 0 ? parseFloat(cols[idx.volume]) : null
    };

    if ([row.open, row.high, row.low, row.close].some(v => isNaN(v))) continue;

    rowsByMinute[key] = row;
    loadedCount++;
    if (firstMinuteId == null || minuteId < firstMinuteId) firstMinuteId = minuteId;
    if (lastMinuteId == null || minuteId > lastMinuteId) lastMinuteId = minuteId;
  }

  if (loadedCount === 0) throw new Error('没有解析到有效 OHLC 数据。');

  return {
    rowsByMinute: rowsByMinute,
    count: loadedCount,
    firstKey: keyFromMinuteId(firstMinuteId),
    lastKey: keyFromMinuteId(lastMinuteId)
  };
}

    })).filter(isMeaningfulOb) : makeInitialIntradayObs();
    var importedExecs = Array.isArray(execution.key_points) ? execution.key_points.map(item => ({

    })).filter(item => item.time || item.price || item.note || item.images.length > 0) : makeInitialExecs();
    var importedIntradayEqLevels = Array.isArray(execution.intraday_eq_levels) ? execution.intraday_eq_levels.map(item => ({
      id: nid(),

      pointRefs: Array.isArray(item && item.key_points) ? item.key_points.map(pointToken => {
        var rawToken = String(pointToken || '').trim();
        var overnightMatch = rawToken.match(/^overnight\|T(-?\d+)\s+(\d{2}:\d{2})$/);
        if (overnightMatch) {
          var overnightPoint = findImportedPtByDayOffsetAndTime(Number(overnightMatch[1]), overnightMatch[2]);
          if (overnightPoint) return 'pt:' + String(overnightPoint.id);
        }
        var execMatch = rawToken.match(/^execution\|T-0\s+(\d{2}:\d{2})$/);
        if (execMatch) {
          for (var exi = 0; exi < importedExecs.length; exi++) {
            if (importedExecs[exi].time === execMatch[1] && okTime(importedExecs[exi].time)) return 'exec:' + String(importedExecs[exi].id);
          }

      images: normalizeImportedImages(item && item.images)
    })).filter(item => isMeaningfulIntradayEqLevel(item)) : makeInitialIntradayEqLevels();
    importedIntradayObs.forEach(item => {
      importedIntradayObRefMap[
        normalizeDayOffset(item.dayOffsetFrom) + '|' + (item.fromTime || '') + '|' + normalizeDayOffset(item.dayOffsetTo) + '|' + (item.toTime || '') + '|' + formatObTimeframe(item.timeframeNum, item.timeframeUnit)
      ] = String(item.id);

            )
          ] || '';
          if (importedRevActionRef) importedRevActionRef = 'eq:' + importedRevActionRef;
        } else if (item && typeof item.key_point === 'string') {
          var importedRevPoint = findImportedPtBySelection(item.key_point);
          if (importedRevPoint) importedRevActionRef = 'pt:' + String(importedRevPoint.id);
        } else if (item && typeof item.execution_key_point === 'string') {

            if (importedExecs[rei].time === item.execution_key_point && okTime(importedExecs[rei].time)) {
              importedRevActionRef = 'exec:' + String(importedExecs[rei].id);

            }
          }
        } else if (Array.isArray(item && item.intraday_eq_key_points)) {
          for (var iei = 0; iei < importedIntradayEqLevels.length; iei++) {
            var candidateIntradayEq = importedIntradayEqLevels[iei];
            if (getIntradayEqLevelSignatureFromTokens(
              item && typeof item.intraday_eq_type === 'string' ? item.intraday_eq_type : '',
              item.intraday_eq_key_points.map(pointToken => String(pointToken || '').trim())
            ) === getIntradayEqLevelSignatureFromRefs(candidateIntradayEq.type, candidateIntradayEq.pointRefs)) {

            }

      }

      return {

        execRef: item && typeof item.time === 'string' ? item.time : '',
        shape: item && typeof item.shape === 'string' ? item.shape : '',
        actionType: rawRevActionType,

        immediateRebalance: !!(item && item.immediate_rebalance),
        note: item && typeof item.note === 'string' ? item.note : '',
        images: normalizeImportedImages(item && item.images)
      };
    }).filter(item => item.execRef || item.shape || item.actionType || item.actionRef || item.smt || item.immediateRebalance || item.note || item.images.length > 0);

    var importedEntries = Array.isArray(parsed.entry) ? parsed.entry.map(item => {
      var result = item && typeof item.result === 'object' ? item.result : {};
      var rawReversalRef = item && item.reversal_ref != null ? String(item.reversal_ref) : '';
      return {

        entryPrice: item && item.entry_price != null ? String(item.entry_price) : '',

        basedOn: item && typeof item.based_on === 'string' ? item.based_on : '',

        primaryPick: !!(item && item.primary_pick),

        exitPrice: result.exit_price != null ? String(result.exit_price) : '',

        outcome: typeof result.outcome === 'string' ? result.outcome : '',
        positive: Array.isArray(result.positive) ? result.positive.map(String) : [],

        resultOpen: !!(result.exit_time || result.exit_price || result.exit_type || result.outcome || (Array.isArray(result.positive) && result.positive.length) || (Array.isArray(result.negative) && result.negative.length)),

    }).filter(item => item.time || item.entryModel || item.entryStyle.length > 0 || item.entryPrice || item.stop || item.targetInternal || item.targetSwing || item.targetExternal || item.basedOn || item.exitTime || item.exitPrice || item.images.length > 0) : makeInitialEntries();

    setDate(importedDate);

    setKeyLesson(typeof parsed.key_lesson === 'string' ? parsed.key_lesson : '');

  function validateAndImportYaml(rawText) {
    var text = String(rawText || '').trim();
    if (!text) {
      setImportYamlOk('');
      setImportYamlError('请先粘贴 YAML 内容或选择 YAML 文件。');
      return;
    }
    confirmReset('确认导入这份 YAML 吗？当前内容会被新数据覆盖。', () => {
      try {
        var parsed = parseSimpleYaml(text);
        if (!parsed || typeof parsed !== 'object') throw new Error('YAML 解析结果为空。');
        if (!parsed.date || !parsed.instrument) throw new Error('YAML 缺少 date 或 instrument。');
        applyImportedYamlData(parsed, text);
      } catch (err) {
        setImportYamlOk('');
        setImportYamlError(err && err.message ? err.message : 'YAML 校验失败，无法导入。');
      }
    });
  }

  function handleYamlFileSelected(e) {
    var file = e && e.target && e.target.files ? e.target.files[0] : null;
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      var text = ev && ev.target ? String(ev.target.result || '') : '';
      setImportYamlText(text);
      setImportYamlError('');
      setImportYamlOk('已读取 YAML 文件，可以点击“导入 YAML”开始校验。');
    };
    reader.onerror = function() {
      setImportYamlOk('');
      setImportYamlError('读取 YAML 文件失败，请重试。');
    };
    reader.readAsText(file, 'utf-8');
    e.target.value = '';
  }

  function handleSegTimeChange(id, field, value) {
    setSegs(p => p.map(seg => {
      if (seg.id !== id) return seg;
      var updated = { ...seg, [field]: value };
      var detected = autoDetectDir(
        field === 'st' ? value : updated.st,
        field === 'et' ? value : updated.et
      );
      if (detected && updated.dir !== 'consolidation') {
        updated.dir = detected;
      }
      return updated;
    }));
  }

  async function computeFvg(target, saveRecord) {
    if (!target) return;

    var fvgType = String(target.fvgType || '').trim().toLowerCase();
    if (fvgType !== 'fvg' && fvgType !== 'ifvg') {
      setLookupError('请先为 FVG 选择类型。');
      return;
    }

    var timeframe = fvgTimeframeToMinutes(target.timeframeNum, target.timeframeUnit);
    if (!timeframe) {
      setLookupError('请先为 FVG 选择有效周期。');
      return;
    }
    if (!okTime(target.middleTime)) {
      setLookupError('请先填写 FVG 的中间K线时间。');
      return;
    }

    var effectiveDate = shiftIsoDate(date, target.dayOffset);
    if (!effectiveDate || !/^\d{4}-\d{2}-\d{2}$/.test(effectiveDate)) {
      setLookupError('FVG 的有效日期无效。');
      return;
    }

    var middleParts = parseLookupDateTime(effectiveDate, target.middleTime);
    var middleMinuteId = minuteIdFromParts(middleParts);
    if (middleMinuteId == null) {
      setLookupError('盘前 FVG 的时间无法解析。');
      return;
    }

    function minuteIdToDateTime(minuteId) {
      var d = new Date(minuteId * 60000);
      return {
        date: d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()),
        time: pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes())
      };
    }

    var prevInfo = minuteIdToDateTime(middleMinuteId - timeframe);
    var nextInfo = minuteIdToDateTime(middleMinuteId + timeframe);

    setLookupLoading(true);
    var prevResult = await runPriceLookup(prevInfo.date, prevInfo.time, String(timeframe), 'close');
    if (prevResult.error) {
      setLookupError('前一根K线查询失败：' + prevResult.error);
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }
    var middleResult = await runPriceLookup(effectiveDate, target.middleTime, String(timeframe), 'close');
    if (middleResult.error) {
      setLookupError('中间K线查询失败：' + middleResult.error);
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }
    var nextResult = await runPriceLookup(nextInfo.date, nextInfo.time, String(timeframe), 'close');
    if (nextResult.error) {
      setLookupError('后一根K线查询失败：' + nextResult.error);
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }

    var prevOhlc = prevResult.ohlc || {};
    var middleOhlc = middleResult.ohlc || {};
    var nextOhlc = nextResult.ohlc || {};
    var prevHigh = parseFloat(prevOhlc.high);
    var prevLow = parseFloat(prevOhlc.low);
    var middleOpen = parseFloat(middleOhlc.open);
    var middleClose = parseFloat(middleOhlc.close);
    var nextHigh = parseFloat(nextOhlc.high);
    var nextLow = parseFloat(nextOhlc.low);

    if ([prevHigh, prevLow, middleOpen, middleClose, nextHigh, nextLow].some(isNaN)) {
      setLookupError('FVG 自动计算失败：三根K线 OHLC 数据不完整。');
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }
    if (middleClose === middleOpen) {
      setLookupError('中间K线为十字/平盘，无法自动判断 FVG 方向。');
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }

    var middleIsUp = middleClose > middleOpen;
    var direction = fvgType === 'fvg'
      ? (middleIsUp ? 'bullish' : 'bearish')
      : (middleIsUp ? 'bearish' : 'bullish');
    var high = '';
    var low = '';
    if (direction === 'bullish') {
      if (!(nextLow > prevHigh)) {
        setLookupError('按当前类型与中间K线方向推算为 bullish，但三根K线未形成有效 bullish FVG。');
        setLookupResult(null);
        setLookupLoading(false);
        return;
      }
      high = String(nextLow);
      low = String(prevHigh);
    } else {
      if (!(prevLow > nextHigh)) {
        setLookupError('按当前类型与中间K线方向推算为 bearish，但三根K线未形成有效 bearish FVG。');
        setLookupResult(null);
        setLookupLoading(false);
        return;
      }
      high = String(prevLow);
      low = String(nextHigh);
    }

    if (!high || !low) {
      setLookupError('这组三根K线没有形成有效 FVG。');
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }

    saveRecord(direction, high, low);
    setLookupError('');
    setLookupResult({
      field: 'fvg',
      timeframe: timeframe,
      value: direction,
      foundBars: (prevResult.foundBars || 0) + (middleResult.foundBars || 0) + (nextResult.foundBars || 0),
      expectedBars: (prevResult.expectedBars || 0) + (middleResult.expectedBars || 0) + (nextResult.expectedBars || 0),
      startKey: prevResult.startKey,
      endKey: nextResult.endKey,
      missingBars: (prevResult.missingBars || 0) + (middleResult.missingBars || 0) + (nextResult.missingBars || 0),
      ohlc: { prev: prevOhlc, middle: middleOhlc, next: nextOhlc }
    });
    setLookupDate(effectiveDate);
    setLookupTime(target.middleTime);
    setLookupLoading(false);
  }

  async function computePremarketFvg(id) {
    var target = null;
    for (var i = 0; i < premarketFvgs.length; i++) {
      if (premarketFvgs[i].id === id) {
        target = premarketFvgs[i];
        break;
      }
    }
    await computeFvg(target, (direction, high, low) => {
      setPremarketFvgs(p => p.map(fvg => fvg.id === id ? { ...fvg, direction: direction, high: high, low: low } : fvg));
    });
  }

  async function computeIntradayFvg(id) {
    var target = null;
    for (var i = 0; i < intradayFvgs.length; i++) {
      if (intradayFvgs[i].id === id) {
        target = intradayFvgs[i];
        break;
      }
    }
    await computeFvg(target, (direction, high, low) => {
      setIntradayFvgs(p => p.map(fvg => fvg.id === id ? { ...fvg, direction: direction, high: high, low: low } : fvg));
    });
  }

  async function computeOb(target, saveRecord) {
    if (!target) return;

    var timeframe = obTimeframeToMinutes(target.timeframeNum, target.timeframeUnit);
    if (!timeframe) {
      setLookupError('请先为 OB 选择有效周期。');
      return;
    }
    if (!okTime(target.fromTime) || !okTime(target.toTime)) {
      setLookupError('请先填写 OB 的 from / to 时间。');
      return;
    }

    var fromDate = shiftIsoDate(date, target.dayOffsetFrom);
    var toDate = shiftIsoDate(date, target.dayOffsetTo);
    var fromParts = parseLookupDateTime(fromDate, target.fromTime);
    var toParts = parseLookupDateTime(toDate, target.toTime);
    var fromMinuteId = minuteIdFromParts(fromParts);
    var toMinuteId = minuteIdFromParts(toParts);
    if (fromMinuteId == null || toMinuteId == null) {
      setLookupError('OB 的时间范围无法解析。');
      return;
    }
    if (fromMinuteId > toMinuteId) {
      setLookupError('OB 的 from 时间不能晚于 to 时间。');
      return;
    }

    var rangeMinutes = (toMinuteId - fromMinuteId) + timeframe;
    if (rangeMinutes <= 0) {
      setLookupError('OB 的查询范围无效。');
      return;
    }

    setLookupLoading(true);
    var fromResult = await runPriceLookup(fromDate, target.fromTime, String(timeframe), 'close');
    if (fromResult.error) {
      setLookupError('OB 起点K线查询失败：' + fromResult.error);
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }
    var toResult = await runPriceLookup(toDate, target.toTime, String(timeframe), 'close');
    if (toResult.error) {
      setLookupError('OB 终点K线查询失败：' + toResult.error);
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }
    var rangeResult = await runPriceLookup(fromDate, target.fromTime, String(rangeMinutes), 'close');
    if (rangeResult.error) {
      setLookupError('OB 区间极值查询失败：' + rangeResult.error);
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }

    var fromOhlc = fromResult.ohlc || {};
    var toOhlc = toResult.ohlc || {};
    var rangeOhlc = rangeResult.ohlc || {};
    var fromLow = parseFloat(fromOhlc.low);
    var fromHigh = parseFloat(fromOhlc.high);
    var toLow = parseFloat(toOhlc.low);
    var toHigh = parseFloat(toOhlc.high);
    var rangeHigh = parseFloat(rangeOhlc.high);
    var rangeLow = parseFloat(rangeOhlc.low);

    if ([fromLow, fromHigh, toLow, toHigh, rangeHigh, rangeLow].some(isNaN)) {
      setLookupError('OB 自动计算失败：区间 OHLC 数据不完整。');
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }

    var bullish = fromLow < toHigh;
    var bearish = fromHigh > toLow;
    var direction = '';
    if (bullish && !bearish) direction = 'bearish';
    else if (bearish && !bullish) direction = 'bullish';

    saveRecord(direction, String(rangeHigh), String(rangeLow));
    setLookupError(direction ? '' : '已计算区间高低点，但方向不明确。');
    setLookupResult({
      field: 'ob',
      timeframe: timeframe,
      value: direction || 'unclear',
      foundBars: (fromResult.foundBars || 0) + (toResult.foundBars || 0) + (rangeResult.foundBars || 0),
      expectedBars: (fromResult.expectedBars || 0) + (toResult.expectedBars || 0) + (rangeResult.expectedBars || 0),
      startKey: rangeResult.startKey || fromResult.startKey,
      endKey: rangeResult.endKey || toResult.endKey,
      missingBars: (fromResult.missingBars || 0) + (toResult.missingBars || 0) + (rangeResult.missingBars || 0),
      ohlc: { from: fromOhlc, to: toOhlc, range: rangeOhlc }
    });
    setLookupDate(fromDate);
    setLookupTime(target.fromTime);
    setLookupLoading(false);
  }

  async function computePremarketOb(id) {

  function getOvernightGapWindow(type, anchorDate) {
    if (!anchorDate || !/^\d{4}-\d{2}-\d{2}$/.test(anchorDate)) {
      return { error: 'NWOG/NDOG 的有效日期无效。' };
    }
    var weekday = getWeekdayIndex(anchorDate);
    if (type === 'ndog') {
      if (weekday < 1 || weekday > 4) {
        return { error: 'NDOG 只能使用周一到周四的 T日。' };
      }
      return {
        startDate: anchorDate,
        startTime: '16:59',
        endDate: anchorDate,
        endTime: '18:00'
      };
    }
    if (type === 'nwog') {
      if (weekday !== 1) {
        return { error: 'NWOG 只能使用周一的 T日，系统会自动连接上一个周五 16:59 与该周一 18:00。' };
      }
      return {
        startDate: shiftIsoDate(anchorDate, -3),
        startTime: '16:59',
        endDate: anchorDate,
        endTime: '18:00'
      };
    }
    return { error: '请先选择 NWOG 或 NDOG。' };
  }

  async function computeOvernightGap(id) {
    var target = null;
    for (var i = 0; i < overnightGaps.length; i++) {
      if (overnightGaps[i].id === id) {
        target = overnightGaps[i];
        break;
      }
    }
    if (!target) return;

    var anchorDate = shiftIsoDate(date, target.dayOffset);
    var window = getOvernightGapWindow(target.type, anchorDate);
    if (window.error) {
      setLookupError(window.error);
      setLookupResult(null);
      return;
    }

    setLookupLoading(true);
    var closeResult = await runPriceLookup(window.startDate, window.startTime, '1', 'close', { fallback: 'prev', maxLookback: 360 });
    if (closeResult.error) {
      setLookupError('NWOG/NDOG 起点查询失败：' + closeResult.error);
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }

    var openResult = await runPriceLookup(window.endDate, window.endTime, '1', 'open');
    if (openResult.error) {
      setLookupError('NWOG/NDOG 终点查询失败：' + openResult.error);
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }

    var closePrice = parseFloat(closeResult.value);
    var openPrice = parseFloat(openResult.value);
    if (isNaN(closePrice) || isNaN(openPrice)) {
      setLookupError('NWOG/NDOG 自动计算失败：价格数据不完整。');
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }
    if (closePrice === openPrice) {
      setLookupError('这组价格没有形成有效 gap。');
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }

    var direction = openPrice > closePrice ? 'bullish' : 'bearish';
    var high = String(Math.max(closePrice, openPrice));
    var low = String(Math.min(closePrice, openPrice));

    setOvernightGaps(p => p.map(gap => gap.id === id ? {
      ...gap,
      startDate: closeResult.actualDate || window.startDate,
      startTime: closeResult.actualTime || window.startTime,
      endDate: window.endDate,
      endTime: window.endTime,
      direction: direction,
      high: high,
      low: low
    } : gap));

    setLookupError('');
    setLookupResult({
      field: 'gap',
      timeframe: 1,
      value: direction,
      foundBars: (closeResult.foundBars || 0) + (openResult.foundBars || 0),
      expectedBars: (closeResult.expectedBars || 0) + (openResult.expectedBars || 0),
      startKey: closeResult.startKey,
      endKey: openResult.endKey,
      missingBars: (closeResult.missingBars || 0) + (openResult.missingBars || 0),
      ohlc: {
        start: closeResult.ohlc || {},
        end: openResult.ohlc || {}
      }
    });
    setLookupDate(window.endDate);
    setLookupTime(window.endTime);
    setLookupLoading(false);
  }

  function calcRR(en) {
    var ep = parseFloat(en.entryPrice);
    var sl = parseFloat(en.stop);
    var ti = parseFloat(en.targetInternal);
    if (isNaN(ep) || isNaN(sl) || sl === ep) return null;
    var risk = Math.abs(ep - sl);
    var reward = ti && !isNaN(ti) ? Math.abs(ti - ep) : null;
    return { risk, reward, rr: reward ? (reward / risk).toFixed(2) : null };
  }

  function calcActualRR(en) {
    var ep = parseFloat(en.entryPrice);
    var sl = parseFloat(en.stop);
    var exP = parseFloat(en.exitPrice);
    if (isNaN(ep) || isNaN(sl) || isNaN(exP) || sl === ep) return null;
    var risk = Math.abs(ep - sl);
    var pnl = en.direction === 'long' ? exP - ep : ep - exP;
    return { pnl, rr: (pnl / risk).toFixed(2) };
  }

  async function runPriceLookup(dateStr, timeStr, timeframeStr, field, options) {
    var lookupOptions = options || {};
    if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
      return { error: '查询日期格式需要是 YYYY-MM-DD。' };
    }
    if (!okTime(timeStr)) {
      return { error: '查询时间格式需要是 HH:MM。' };
    }

    var parts = parseLookupDateTime(dateStr, timeStr);
    var startMinuteId = minuteIdFromParts(parts);
    var timeframe = parseInt(timeframeStr, 10);
    if (!timeframe || timeframe <= 0) {
      return { error: '周期设置无效。' };
    }

    try {
      var qs = new URLSearchParams({
        instrument: inst || 'NQ',
        date: dateStr,
        time: timeStr,
        tf: String(timeframe),
        field: field
      });
      if (lookupOptions.fallback) qs.set('fallback', lookupOptions.fallback);
      if (lookupOptions.maxLookback != null) qs.set('max_lookback', String(lookupOptions.maxLookback));
      var resp = await fetch(apiBaseUrl.replace(/\/$/, '') + '/price?' + qs.toString());
      var payload = await resp.json();
      if (!resp.ok || !payload.ok) {
        return { error: payload && payload.error ? payload.error : '查询失败，请检查本地 API 和数据库。' };
      }
      var result = payload.result;
      return {
        value: result.value,
        field: result.field,
        timeframe: result.timeframe,
        actualDate: result.actualDate,
        actualTime: result.actualTime,
        ohlc: result.ohlc,
        foundBars: result.foundBars,
        expectedBars: result.expectedBars,
        startKey: result.startTs,
        endKey: result.endTs,
        missingBars: result.missingBars
      };
    } catch (err) {
      return { error: '无法连接本地查价服务，请先启动 price_lookup_api.py。' };
    }
  }

  async function checkApiHealth() {
    var baseUrl = apiBaseUrl.replace(/\/$/, '');
    try {
      var resp = await fetch(baseUrl + '/health');
      var payload = await resp.json();
      if (!resp.ok || !payload.ok) {
        setApiStatus({ ok: false, error: payload && payload.error ? payload.error : 'health check failed' });
        return;
      }
      setApiStatus({ ok: true, details: payload.details || '' });
    } catch (err) {
      var message = err && err.message ? err.message : '未连接';
      setApiStatus({ ok: false, error: message, details: 'health: ' + baseUrl + '/health' });
    }
  }

  async function applyLookupResult(dateStr, timeStr, setter, options) {
    var lookupOptions = options || {};
    var fieldToUse = lookupOptions.field || lookupField;
    var dateToUse = lookupOptions.date || dateStr || lookupDate;
    setLookupLoading(true);
    var result = await runPriceLookup(dateToUse, timeStr, lookupTimeframe, fieldToUse);
    if (result.error) {
      setLookupError(result.error);
      setLookupResult(null);
      setLookupLoading(false);
      return;
    }
    setter(String(result.value));
    setLookupError('');
    setLookupResult(result);
    setLookupDate(dateToUse);
    setLookupTime(timeStr);
    if (fieldToUse !== lookupField) setLookupField(fieldToUse);
    setLookupLoading(false);
  }

  async function handleLookupSubmit() {
    setLookupLoading(true);
    var result = await runPriceLookup(lookupDate, lookupTime, lookupTimeframe, lookupField);
    if (result.error) {
      setLookupResult(null);
      setLookupError(result.error);
      setLookupLoading(false);
      return;
    }
    setLookupResult(result);
    setLookupError('');
    setLookupLoading(false);
  }

  function getReversalRefInfo(en) {
    if (!en.reversalRef) return null;
    for (var i = 0; i < reversalOptions.length; i++) {
      if (reversalOptions[i].value === en.reversalRef) return reversalOptions[i];
    }
    return null;
  }
