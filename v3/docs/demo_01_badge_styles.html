<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重叠 PDA 数字徽章 - 弱遮挡样式对比</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #0a0e27;
      color: #e0e3eb;
    }
    #info {
      margin-bottom: 20px;
      padding: 15px;
      background: #1e222d;
      border-radius: 4px;
      font-size: 14px;
    }
    .controls {
      margin-bottom: 20px;
      padding: 15px;
      background: #1e222d;
      border-radius: 4px;
    }
    .controls label {
      margin-right: 20px;
      font-size: 14px;
      display: block;
      margin-bottom: 10px;
    }
    .controls input[type="radio"] {
      margin-right: 5px;
    }
    #chart {
      width: 100%;
      height: 600px;
      background: #131722;
    }
    .log {
      margin-top: 20px;
      padding: 15px;
      background: #1e222d;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    .log-item {
      padding: 4px 0;
      border-bottom: 1px solid #2a2e39;
    }
    .success { color: #26a69a; }
    .warn { color: #ffb74d; }
    .info { color: #5b9cf6; }
  </style>
</head>
<body>
  <div id="info">
    <h2>重叠 PDA 数字徽章 - 弱遮挡样式对比</h2>
    <p><strong>目标：</strong>保留数字徽章的清晰性，但降低视觉遮挡感。</p>
    <p><strong>测试场景：</strong></p>
    <ul>
      <li>左侧：3 个 BSL 完全重叠（×3）</li>
      <li>中间：2 个 FVG 完全重叠（×2）</li>
      <li>右侧：BSL 和 FVG 部分重叠（×2）</li>
    </ul>
  </div>

  <div class="controls">
    <strong>选择数字徽章样式：</strong>
    <label><input type="radio" name="badge" value="original"> 原版：红色实心圆 + 白色文字（对比参考）</label>
    <label><input type="radio" name="badge" value="outline" checked> 样式 1：空心圆 + 半透明背景（推荐）</label>
    <label><input type="radio" name="badge" value="minimal"> 样式 2：纯文字 + 淡色背景</label>
    <label><input type="radio" name="badge" value="small"> 样式 3：小号实心圆（缩小尺寸）</label>
    <label><input type="radio" name="badge" value="corner"> 样式 4：方形角标 + 半透明</label>
    <label><input type="radio" name="badge" value="underline"> 样式 5：下划线数字（最弱遮挡）</label>
  </div>

  <div id="chart"></div>

  <div class="log" id="log">
    <div class="log-item">切换不同样式观察效果...</div>
  </div>

  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    const log = document.getElementById('log');
    function addLog(message, type = 'info') {
      const item = document.createElement('div');
      item.className = `log-item ${type}`;
      item.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      log.insertBefore(item, log.firstChild);
    }

    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
      width: document.getElementById('chart').clientWidth,
      height: 600,
      layout: { background: { color: '#131722' }, textColor: '#e0e3eb' },
      grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
      timeScale: { timeVisible: true, secondsVisible: false },
    });

    const candlestickSeries = chart.addCandlestickSeries({
      upColor: '#26a69a',
      downColor: '#ef5350',
      borderVisible: false,
      wickUpColor: '#26a69a',
      wickDownColor: '#ef5350',
    });

    // 生成测试数据
    const data = [];
    let time = Math.floor(Date.now() / 1000) - 100 * 60;
    let price = 2300;
    for (let i = 0; i < 100; i++) {
      const change = (Math.random() - 0.5) * 10;
      const open = price;
      const close = price + change;
      const high = Math.max(open, close) + Math.random() * 5;
      const low = Math.min(open, close) - Math.random() * 5;
      data.push({ time, open, high, low, close });
      price = close;
      time += 60;
    }
    candlestickSeries.setData(data);
    chart.timeScale().fitContent();

    // PDA 数据
    const pdaList = [
      { id: 'bsl_1', type: 'bsl', anchorTime: data[30].time, price: data[30].high + 5, label: 'BSL-A', group: 'g1' },
      { id: 'bsl_2', type: 'bsl', anchorTime: data[30].time, price: data[30].high + 5, label: 'BSL-B', group: 'g1' },
      { id: 'bsl_3', type: 'bsl', anchorTime: data[30].time, price: data[30].high + 5, label: 'BSL-C', group: 'g1' },
      { id: 'fvg_1', type: 'fvg', startTime: data[60].time, endTime: data[65].time, topPrice: data[60].high, bottomPrice: data[60].low - 5, label: 'FVG-X', group: 'g2' },
      { id: 'fvg_2', type: 'fvg', startTime: data[60].time, endTime: data[65].time, topPrice: data[60].high, bottomPrice: data[60].low - 5, label: 'FVG-Y', group: 'g2' },
      { id: 'bsl_m', type: 'bsl', anchorTime: data[80].time, price: data[80].high + 2, label: 'BSL-M', group: 'g3' },
      { id: 'fvg_m', type: 'fvg', startTime: data[78].time, endTime: data[83].time, topPrice: data[80].high + 3, bottomPrice: data[80].high + 1, label: 'FVG-M', group: 'g3' },
    ];

    const groupCounts = {};
    pdaList.forEach(pda => {
      groupCounts[pda.group] = (groupCounts[pda.group] || 0) + 1;
    });

    let selectedPdaId = null;
    const primitives = [];

    const LIQUIDITY_DEFAULTS = {
      lineLength: 2,
      showLabel: true,
      lineWidth: 1,
      labelFont: '11px sans-serif',
      labelPadding: 4,
    };

    // 绘制数字徽章的函数
    function drawBadge(ctx, x, y, count, style, hRatio, vRatio) {
      const badgeText = `×${count}`;
      const ratio = Math.min(hRatio, vRatio);

      if (style === 'original') {
        // 原版：红色实心圆 + 白色文字
        ctx.fillStyle = '#ef5350';
        ctx.beginPath();
        ctx.arc(x, y, 10 * ratio, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${9 * ratio}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(badgeText, x, y);
      } else if (style === 'outline') {
        // 样式 1：空心圆 + 半透明背景
        ctx.fillStyle = 'rgba(255, 235, 59, 0.15)';
        ctx.beginPath();
        ctx.arc(x, y, 10 * ratio, 0, 2 * Math.PI);
        ctx.fill();
        ctx.strokeStyle = '#ffb74d';
        ctx.lineWidth = 1.5 * ratio;
        ctx.stroke();
        ctx.fillStyle = '#ffb74d';
        ctx.font = `bold ${8 * ratio}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
      ctx.fillText(badgeText, x, y);
      } else if (style === 'minimal') {
        // 样式 2：纯文字 + 淡色背景
        ctx.fillStyle = 'rgba(91, 156, 246, 0.2)';
        ctx.fillRect(x - 12 * hRatio, y - 8 * vRatio, 24 * hRatio, 16 * vRatio);
        ctx.fillStyle = '#5b9cf6';
      ctx.font = `${9 * ratio}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(badgeText, x, y);
      } else if (style === 'small') {
        // 样式 3：小号实心圆
     ctx.fillStyle = 'rgba(255, 152, 0, 0.8)';
      ctx.beginPath();
        ctx.arc(x, y, 7 * ratio, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${7 * ratio}px sans-serif`;
        ctx.textAlign = 'center';
     ctx.textBaseline = 'middle';
        ctx.fillText(badgeText, x, y);
    } else if (style === 'corner') {
     // 样式 4：方形角标 + 半透明
        ctx.fillStyle = 'rgba(156, 39, 176, 0.3)';
        ctx.fillRect(x - 10 * hRatio, y - 8 * vRatio, 20 * hRatio, 16 * vRatio);
        ctx.strokeStyle = '#ab47bc';
        ctx.lineWidth = 1 * ratio;
        ctx.strokeRect(x - 10 * hRatio, y - 8 * vRatio, 20 * hRatio, 16 * vRatio);
        ctx.fillStyle = '#ab47bc';
        ctx.font = `bold ${8 * ratio}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
      ctx.fillText(badgeText, x, y);
      } else if (style === 'underline') {
        // 样式 5：下划线数字（最弱遮挡）
        ctx.fillStyle = '#787b86';
        ctx.font = `${9 * ratio}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(badgeText, x, y);
      // 下划线
        ctx.strokeStyle = '#787b86';
        ctx.lineWidth = 1 * ratio;
        ctx.beginPath();
        ctx.moveTo(x - 8 * hRatio, y + 6 * vRatio);
        ctx.lineTo(x + 8 * hRatio, y + 6 * vRatio);
      ctx.stroke();
      }
    }

    class LiquidityRenderer {
      constructor(p1, p2, lineColor, textColor, label, position, options, isSelected, badgeStyle, overlapCount) {
        this._p1 = p1;
        this._p2 = p2;
     this._lineColor = lineColor;
        this._textColor = textColor;
      this._label = label;
        this._position = position;
        this._options = options;
        this._isSelected = isSelected;
        this._badgeStyle = badgeStyle;
        this._overlapCount = overlapCount;
      }

      draw(target) {
        target.useBitmapCoordinateSpace((scope) => {
        if (this._p1.x === null || this._p2.x === null || this._p1.y === null) return;

          const ctx = scope.context;
          const hRatio = scope.horizontalPixelRatio;
          const vRatio = scope.verticalPixelRatio;

          const x1 = this._p1.x * hRatio;
        const x2 = this._p2.x * hRatio;
          const y = this._p1.y * vRatio;

          // 主线段
          ctx.strokeStyle = this._isSelected ? '#ffeb3b' : this._lineColor;
          ctx.lineWidth = (this._isSelected ? 2 : this._options.lineWidth) * Math.min(hRatio, vRatio);
          ctx.beginPath();
          ctx.moveTo(x1, y);
          ctx.lineTo(x2, y);
          ctx.stroke();

          // 文字标签
          if (this._options.showLabel && this._label) {
            ctx.fillStyle = this._isSelected ? '#ffeb3b' : this._textColor;
            ctx.font = this._options.labelFont;
            const padding = this._options.labelPadding * vRatio;
            ctx.textAlign = 'right';
            if (this._position === 'above') {
            ctx.textBaseline = 'bottom';
              ctx.fillText(this._label, x2, y - padding);
            } else {
              ctx.textBaseline = 'top';
              ctx.fillText(this._label, x2, y + padding);
            }
          }

          // 数字徽章
       if (this._overlapCount > 1) {
            const badgeX = x2 + 15 * hRatio;
            const badgeY = y - 15 * vRatio;
            drawBadge(ctx, badgeX, badgeY, this._overlapCount, this._badgeStyle, hRatio, vRatio);
          }
        });
      }
    }

    class LiquidityView {
   constructor(source) {
        this._source = source;
        this._p1 = { x: null, y: null };
        this._p2 = { x: null, y: null };
      }

      update() {
        const series = this._source._series;
      const chart = this._source._chart;
        const timeScale = chart.timeScale();
        const y = series.priceToCoordinate(this._source._price);
        const anchorCoord = timeScale.timeToCoordinate(this._source._anchorTime);
        let rightX = null;
      if (anchorCoord !== null) {
          const logical = timeScale.coordinateToLogical(anchorCoord);
          if (logical !== null) {
        rightX = timeScale.logicalToCoordinate(logical + this._source._options.lineLength);
        }
        }
        this._p1 = { x: anchorCoord, y };
        this._p2 = { x: rightX, y };
   }

      renderer() {
        return new LiquidityRenderer(
          this._p1, this._p2, this._source._lineColor, this._source._textColor,
          this._source._label, this._source._position, this._source._options,
          this._source._isSelected, this._source._badgeStyle, this._source._overlapCount
        );
      }
    }

    class LiquidityPrimitive {
      constructor(chart, series, anchorTime, price, lineColor, textColor, label, position, options, isSelected, badgeStyle, overlapCount) {
        this._chart = chart;
        this._series = series;
        this._anchorTime = anchorTime;
        this._price = price;
        this._lineColor = lineColor;
        this._textColor = textColor;
        this._label = label;
        this._position = position;
        this._options = { ...LIQUIDITY_DEFAULTS, ...options };
        this._isSelected = isSelected;
        this._badgeStyle = badgeStyle;
        this._overlapCount = overlapCount;
        this._view = new LiquidityView(this);
      }

      updateAllViews() {
        this._view.update();
      }

      paneViews() {
        return [this._view];
      }
    }

    class FvgRenderer {
      constructor(p1, p2, fillColor, isSelected, badgeStyle, overlapCount) {
        this._p1 = p1;
        this._p2 = p2;
        this._fillColor = fillColor;
        this._isSelected = isSelected;
        this._badgeStyle = badgeStyle;
        this._overlapCount = overlapCount;
      }

      draw(target) {
    target.useBitmapCoordinateSpace((scope) => {
          if (this._p1.x === null || this._p1.y === null || this._p2.x === null || this._p2.y === null) return;

          const ctx = scope.context;
          const x = Math.min(this._p1.x, this._p2.x) * scope.horizontalPixelRatio;
          const y = Math.min(this._p1.y, this._p2.y) * scope.verticalPixelRatio;
          const width = Math.abs(this._p2.x - this._p1.x) * scope.horizontalPixelRatio;
          const height = Math.abs(this._p2.y - this._p1.y) * scope.verticalPixelRatio;

       // 主矩形
          ctx.fillStyle = this._isSelected ? 'rgba(255, 235, 59, 0.3)' : this._fillColor;
          ctx.fillRect(x, y, width, height);

          // 中间虚线
          const midY = y + height / 2;
          ctx.strokeStyle = this._isSelected ? '#ffeb3b' : this._fillColor.replace('33', '');
          ctx.lineWidth = this._isSelected ? 2 : 1;
        ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(x, midY);
          ctx.lineTo(x + width, midY);
          ctx.stroke();
          ctx.setLineDash([]);

          if (this._isSelected) {
            ctx.strokeStyle = '#ffeb3b';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, width, height);
          }

          // 数字徽章
          if (this._overlapCount > 1) {
            const badgeX = x + width - 15 * scope.horizontalPixelRatio;
            const badgeY = y + 15 * scope.verticalPixelRatio;
            drawBadge(ctx, badgeX, badgeY, this._overlapCount, this._badgeStyle, scope.horizontalPixelRatio, scope.verticalPixelRatio);
          }
        });
      }
    }

    class FvgView {
      constructor(source) {
        this._source = source;
        this._p1 = { x: null, y: null };
        this._p2 = { x: null, y: null };
      }

    update() {
        const series = this._source._series;
      const chart = this._source._chart;
        const y1 = series.priceToCoordinate(this._source._topPrice);
     const y2 = series.priceToCoordinate(this._source._bottomPrice);
        const timeScale = chart.timeScale();
        const x1 = timeScale.timeToCoordinate(this._source._startTime);
        const x2 = timeScale.timeToCoordinate(this._source._endTime);
        this._p1 = { x: x1, y: y1 };
    this._p2 = { x: x2, y: y2 };
      }

      renderer() {
        return new FvgRenderer(this._p1, this._p2, this._source._fillColor, this._source._isSelected, this._source._badgeStyle, this._source._overlapCount);
      }
    }

    class FvgPrimitive {
      constructor(chart, series, startTime, endTime, topPrice, bottomPrice, color, isSelected, badgeStyle, overlapCount) {
        this._chart = chart;
     this._series = series;
    this._startTime = startTime;
        this._endTime = endTime;
        this._topPrice = topPrice;
        this._bottomPrice = bottomPrice;
        this._fillColor = color;
        this._isSelected = isSelected;
        this._badgeStyle = badgeStyle;
        this._overlapCount = overlapCount;
        this._view = new FvgView(this);
      }

      updateAllViews() {
        this._view.update();
      }

      paneViews() {
        return [this._view];
      }
    }

    function renderPdas() {
      primitives.forEach(p => candlestickSeries.detachPrimitive(p));
      primitives.length = 0;

      const badgeStyle = document.querySelector('input[name="badge"]:checked').value;

      pdaList.forEach(pda => {
        const isSelected = pda.id === selectedPdaId;
     const overlapCount = groupCounts[pda.group];
        let primitive;

        if (pda.type === 'bsl') {
          primitive = new LiquidityPrimitive(
            chart, candlestickSeries, pda.anchorTime, pda.price,
            '#5b9cf6', '#26a69a', pda.label, 'above', {},
            isSelected, badgeStyle, overlapCount
          );
        } else if (pda.type === 'fvg') {
     primitive = new FvgPrimitive(
            chart, candlestickSeries, pda.startTime, pda.endTime,
        pda.topPrice, pda.bottomPrice, '#ab47bc33',
         isSelected, badgeStyle, overlapCount
        );
        }

        if (primitive) {
          candlestickSeries.attachPrimitive(primitive);
          primitives.push(primitive);
        }
      });
    }

    renderPdas();

    document.querySelectorAll('input[name="badge"]').forEach(radio => {
      radio.addEventListener('change', () => {
        renderPdas();
        addLog(`切换到: ${radio.parentElement.textContent.trim()}`, 'info');
      });
    });

    chart.subscribeClick(() => {
      const index = pdaList.findIndex(p => p.id === selectedPdaId);
    selectedPdaId = pdaList[(index + 1) % pdaList.length].id;
    renderPdas();
    });

    addLog('图表加载完成，切换不同样式观察弱遮挡效果', 'success');
  </script>
</body>
</html>
