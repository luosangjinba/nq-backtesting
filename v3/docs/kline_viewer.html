<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../styles/chart-viewer.css">
</head>
<body>
  <div id="app">
    <div class="toolbar">
      <div class="toolbar-group">
        <span class="toolbar-label">开始时间:</span>
     <input type="text" id="startInput" placeholder="2012-01-09 09:30" />
      </div>
      <div class="toolbar-group">
        <span class="toolbar-label">结束时间:</span>
        <input type="text" id="endInput" placeholder="2012-01-09 16:00" />
      </div>
      <div class="toolbar-group">
        <span class="toolbar-label">周期:</span>
        <select id="tfSelect">
      <option value="1">1m</option>
          <option value="5">5m</option>
          <option value="15">15m</option>
          <option value="60" selected>1H</option>
          <option value="240">4H</option>
        </select>
      </div>
      <button id="loadBtn">加载</button>
      <span id="statusText">就绪</span>
    </div>

    <div id="chart">
      <div class="hint" id="hint">
        <div class="hint-icon">📊</div>
        <div>输入时间范围，点击"加载"查看 K线图表</div>
      <div style="margin-top: 8px; font-size: 12px; color: #5a5e6b;">
          示例: 2012-01-09 09:30 至 2012-01-09 16:00
        </div>
      </div>
    </div>
  </div>

  <!-- Lightweight Charts -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

  <script>
    // ================================================
    // 全局状态
    // ==================================
    const state = {
      chart: null,
      candlestickSeries: null,
      loading: false,
      markers: [],        // Series Markers (BSL/SSL)
      fvgPrimitives: [],  // Custom Primitives (FVG)
    };

    // ======================================
    // 配置
    // ===================================================
    const API_BASE = 'http://127.0.0.1:8765';

    // ==========================================================
    // 工具函数
    // ================================================

    /**
     * 显示/隐藏加载状态
     */
    function showLoading(show) {
      state.loading = show;

      let overlay = document.querySelector('.loading-overlay');
      if (show) {
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.className = 'loading-overlay';
        overlay.innerHTML = `
          <div class="loading-content">
              <div class="loading-spinner"></div>
              <div class="loading-text">加载中...</div>
            </div>
          `;
          document.getElementById('chart').appendChild(overlay);
        }
      } else {
        if (overlay) {
          overlay.remove();
        }
      }
    }

    /**
     * 更新状态文本
     */
    function updateStatus(text, isError = false) {
      const statusEl = document.getElementById('statusText');
      statusEl.textContent = text;
      statusEl.style.color = isError ? '#ef5350' : '#787b86';
    }

    /**
     * 隐藏提示信息
   */
    function hideHint() {
      const hint = document.getElementById('hint');
      if (hint) {
        hint.style.display = 'none';
      }
    }

    // ======================================================
    // 图表初始化
    // ===============================================

    /**
     * 初始化 Lightweight Charts
     */
    function initChart() {
      const container = document.getElementById('chart');

      state.chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
          background: { color: '#131722' },
          textColor: '#d1d4dc',
        },
        grid: {
        vertLines: { color: '#1e222d' },
          horzLines: { color: '#1e222d' },
        },
        crosshair: {
          mode: LightweightCharts.CrosshairMode.Normal,
      },
        rightPriceScale: {
          borderColor: '#2a2e39',
        },
        timeScale: {
          borderColor: '#2a2e39',
          timeVisible: true,
          secondsVisible: false,
        },
      });

      state.candlestickSeries = state.chart.addCandlestickSeries({
      upColor: '#26a69a',
        downColor: '#ef5350',
      borderVisible: false,
        wickUpColor: '#26a69a',
        wickDownColor: '#ef5350',
      });

      // 响应式调整
      window.addEventListener('resize', () => {
        state.chart.applyOptions({
       width: container.clientWidth,
          height: container.clientHeight,
        });
      });

      console.log('✓ 图表初始化完成');
    }

    // PDA 标记功能
    function clearPdaMarkers() {
      state.candlestickSeries.setMarkers([]);
      state.markers = [];
    }

    function addSslMarker(timestamp, price, label = 'SSL') {
      const marker = {
        time: timestamp,
        position: 'belowBar',
        color: '#ef5350',
        shape: 'arrowUp',
     text: label
      };
      state.markers.push(marker);
      state.candlestickSeries.setMarkers(state.markers);
      console.log(`✓ 添加 SSL 标记: time=${timestamp}, label=${label}`);
    }

    function addBslMarker(timestamp, price, label = 'BSL') {
      const marker = {
        time: timestamp,
        position: 'aboveBar',
        color: '#26a69a',
        shape: 'arrowDown',
     text: label
      };
      state.markers.push(marker);
      state.candlestickSeries.setMarkers(state.markers);
      console.log(`✓ 添加 BSL 标记: time=${timestamp}, label=${label}`);
    }

    // =========================================
    // PDA 渲染 - FVG 矩形
    // ======================================

    /**
     * FVG Custom Primitive
     * 用 Canvas API 绘制价格区间矩形
     */
    class FvgPrimitive {
      constructor(centerTime, topPrice, bottomPrice, color = '#ab47bc') {
        this._centerTime = centerTime;
        this._topPrice = topPrice;
        this._bottomPrice = bottomPrice;
        this._color = color;
      }

      updateAllViews() {
        // 通知图表重绘
      }

      draw(target) {
        const series = target.series;
        const timeScale = target.chart.timeScale();
        const priceScale = series.priceScale();

        // 坐标转换：时间 → 逻辑索引 → 像素 x
        const centerCoord = timeScale.timeToCoordinate(this._centerTime);

        const centerLogical = timeScale.coordinateToLogical(centerCoord);
        if (centerLogical === null) return;

        // 时间范围：中心点 ± 2 个逻辑单位（约 2 根 K 线）
        const startLogical = centerLogical - 2;
        const endLogical = centerLogical + 2;

        const x1 = timeScale.logicalToCoordinate(startLogical);
        const x2 = timeScale.logicalToCoordinate(endLogical);
        if (x1 === null || x2 === null) return;

        // 坐标转换：价格 → 像素 y
        const y1 = priceScale.priceToCoordinate(this._topPrice);
        const y2 = priceScale.priceToCoordinate(this._bottomPrice);
        if (y1 === null || y2 === null) return;

     // 绘制矩形
        const ctx = target.context;

        // 填充（半透明）
      ctx.fillStyle = this._color + '33'; // 20% 不透明度
        ctx.fillRect(x1, y1, x2 - x1, y2 - y1);

        // 边框
        ctx.strokeStyle = this._color;
        ctx.lineWidth = 1;
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
      }
    }

    function addFvgMarker(centerTime, topPrice, bottomPrice, label = 'FVG') {
      const primitive = new FvgPrimitive(centerTime, topPrice, bottomPrice);
      state.candlestickSeries.attachPrimitive(primitive);

      // 存储引用，方便后续清理
      state.fvgPrimitives.push(primitive);

      console.log(`✓ 添加 FVG 标记: time=${centerTime}, top=${topPrice}, bottom=${bottomPrice}`);
    }

    function clearFvgMarkers() {
      state.fvgPrimitives.forEach(primitive => {
        state.candlestickSeries.detachPrimitive(primitive);
      });
      state.fvgPrimitives = [];
    }

    function addTestPdaMarkers() {
    addSslMarker(1326106800, 2344.25, 'SSL');  // 2012-01-09 11:00
      addBslMarker(1326092400, 2340.50, 'BSL');  // 2012-01-09 07:00
      addFvgMarker(1326074400, 2343.50, 2342.00, 'FVG');  // 2012-01-09 02:00
    }


    // ====================================================
    // 数据加载
    // ================================================

    /**
     * 加载 K线数据
     */
    async function loadKlineData() {
      const start = document.getElementById('startInput').value.trim();
      const end = document.getElementById('endInput').value.trim();
      const tf = document.getElementById('tfSelect').value;

      // 验证输入
      if (!start || !end) {
      alert('请输入开始和结束时间\n格式: 2012-01-09 09:30');
        return;
      }

      showLoading(true);
      updateStatus('加载 K线数据...');
      hideHint();

      try {
        // 构建 API URL
        const url = `${API_BASE}/v2/bars?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}&tf=${tf}`;
        console.log('请求 URL:', url);

      // 发起请求
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        console.log('API 响应:', data);

        // 检查响应格式
        if (!data.ok) {
          throw new Error(data.error || '未知错误');
        }

      const bars = data.result;
      if (!bars || bars.length === 0) {
          throw new Error('该时段无数据');
     }

        // 转换数据格式
        // v2 API 返回的 timestamp 是 Unix 时间戳（秒）
        // Lightweight Charts 需要 Unix 时间戳（秒）
        const candleData = bars.map(bar => ({
          time: bar.timestamp, // 直接使用秒级时间戳
          open: bar.open,
          high: bar.high,
          low: bar.low,
          close: bar.close,
        }));

        console.log('转换后的数据:', candleData.slice(0, 3));

        // 设置数据
     state.candlestickSeries.setData(candleData);

        // 自动缩放到合适的视图
        state.chart.timeScale().fitContent();

        // 锁定价格范围，防止滚轮缩放时间轴时价格轴跟着跳动
        state.chart.priceScale('right').applyOptions({ autoScale: false });

      updateStatus(`已加载 ${candleData.length} 根 K线 (${tf}m)`);
        console.log(`✓ 成功加载 ${candleData.length} 根 K线`);
        addTestPdaMarkers();

      } catch (error) {
      console.error('加载失败:', error);
     updateStatus(`错误: ${error.message}`, true);
        alert(`加载失败: ${error.message}`);
      } finally {
        showLoading(false);
      }
    }


    // 时间格式化工具
    function formatTimeInput(value) {
      const digits = value.replace(/\D/g, '');
      if (digits.length !== 12) return value;
      const year = digits.substring(0, 4);
      const month = digits.substring(4, 6);
      const day = digits.substring(6, 8);
      const hour = digits.substring(8, 10);
      const minute = digits.substring(10, 12);
      if (parseInt(month) < 1 || parseInt(month) > 12) return value;
      if (parseInt(day) < 1 || parseInt(day) > 31) return value;
      if (parseInt(hour) > 23) return value;
      if (parseInt(minute) > 59) return value;
      return `${year}-${month}-${day} ${hour}:${minute}`;
    }

    // =========================================================
    // 事件监听
    // ===================================================

    /**
     * 初始化事件监听
     */
    function initEventListeners() {
      document.getElementById('loadBtn').addEventListener('click', loadKlineData);

      ['startInput', 'endInput'].forEach(id => {
        const input = document.getElementById(id);
        input.addEventListener('blur', (e) => {
          e.target.value = formatTimeInput(e.target.value.trim());
        });
        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            e.target.value = formatTimeInput(e.target.value.trim());
            loadKlineData();
          }
        });
      });

      document.getElementById('tfSelect').addEventListener('change', () => {
        const start = document.getElementById('startInput').value.trim();
        const end = document.getElementById('endInput').value.trim();
        if (start && end) {
          loadKlineData();
      }
      });

      console.log('✓ 事件监听初始化完成');
    }

    // =============================================
    // 应用启动
    // ========================================================

    /**
     * 初始化应用
     */
    function init() {
    console.log('=== V3 K线查看器启动 ===');

      initChart();
      initEventListeners();

      updateStatus('就绪');
      console.log('✓ 应用初始化完成');
    }

    // 页面加载完成后初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
