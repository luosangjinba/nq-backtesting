<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/chart-viewer.css" />
    <link rel="stylesheet" href="../styles/kline_viewer.css" />
  </head>
  <body>
    <div id="app">
      <div class="toolbar">
        <div class="toolbar-group">
          <span class="toolbar-label">开始时间:</span>
          <input type="text" id="startInput" placeholder="2012-01-09 02:00" />
        </div>
        <div class="toolbar-group">
          <span class="toolbar-label">结束时间:</span>
          <input type="text" id="endInput" placeholder="2012-01-09 16:00" />
        </div>
        <div class="toolbar-group">
          <span class="toolbar-label">周期:</span>
          <select id="tfSelect">
            <option value="1">1M</option>
            <option value="5">5M</option>
            <option value="15">15M</option>
            <option value="60" selected>1H</option>
            <option value="240">4H</option>
            <option value="1440">D</option>
            <option value="10080">W</option>
          </select>
        </div>
        <button id="loadBtn">加载</button>
        <button id="exportSwingYamlBtn">导出 YAML</button>
        <div class="status-bar">
          <span id="statusText">就绪</span>
        </div>
      </div>

      <!-- 主内容区域：图表 + 侧边栏 -->
      <div class="main-content">
        <!-- 图表区域容器 -->
        <div class="chart-area">
          <div id="chart"></div>
          <!-- 回放控制栏 -->
          <div id="replayControls" class="replay-controls" style="display: none">
            <div class="replay-controls-inner">
              <!-- 播放控制按钮 -->
              <div class="replay-buttons">
                <button id="replayStepBackBtn" class="replay-btn" title="后退一根K线">
                  <span class="icon">⏮</span>
                </button>
                <button id="replayPlayBtn" class="replay-btn replay-btn-primary" title="播放/暂停">
                  <span class="icon" id="replayPlayIcon">▶</span>
                </button>
                <button id="replayStopBtn" class="replay-btn" title="停止">
                  <span class="icon">⏹</span>
                </button>
                <button id="replayStepForwardBtn" class="replay-btn" title="前进一根K线">
                  <span class="icon">⏭</span>
                </button>
              </div>

              <!-- 进度条 -->
              <div class="replay-progress-container">
                <input
                  type="range"
                  id="replayProgressBar"
                  class="replay-progress-bar"
                  min="0"
                  max="100"
                  value="0"
                />
                <div class="replay-time-display">
                  <span id="replayCurrentTime">--:--</span>
                  <span class="replay-time-separator">/</span>
                  <span id="replayTotalTime">--:--</span>
                </div>
              </div>

              <!-- 速度控制 -->
              <div class="replay-speed-control">
                <span class="replay-speed-label">速度:</span>
                <select id="replaySpeedSelect" class="replay-speed-select">
                  <option value="1">1x</option>
                  <option value="2">2x</option>
                  <option value="5">5x</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- API 错误提示 -->
        <div id="apiErrorMessage" class="api-error-message" style="display: none">
          <span class="error-icon">⚠️</span>
          <span id="apiErrorText" class="error-text"></span>
          <button id="apiErrorCloseBtn" class="error-close-btn" type="button">×</button>
        </div>
      </div>
      <!-- /main-content -->

      <div id="hint" class="hint">
        <p>💡 提示：右键点击 PDA 标记查看详情</p>
        <p>⌨️ 快捷键：F5 刷新数据 | ESC 关闭菜单 | 空格 播放/暂停</p>
      </div>
    </div>

    <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
    <script type="module">
      // ======================
      // 模块导入
      // ===========================
      import { state, API_BASE, initChart, updateChartData } from '../modules/chart.js';
      import { showLoading, formatTimeInput, formatTimestamp } from '../modules/utils.js';
      import {
        loadPdaData,
        addManualBsl,
        addManualSsl,
        addManualFvg,
      } from '../modules/pda-renderer.js';
      import { findPdaAtPosition } from '../modules/pda-detector.js';
      import {
        showPdaMenu,
        showBlankAreaMenu,
        showKlineMenu,
        closeContextMenu,
        createContextMenu,
      } from '../modules/context-menu.js';
      import { showPdaDetail, closePdaDetail } from '../modules/pda-detail.js';
      import { initKeyboardNavigation } from '../modules/keyboard.js';
      import { initReplay, loadReplayData } from '../modules/replay.js';
      import { identifyFvg } from '../modules/pda-identifier.js';
      import {
        addSwingLow,
        addSwingHigh,
        addFvgAnnotation,
        createSegmentFromRecentSwings,
        undoLastStage3Action,
        clearStage3Annotations,
        hasDirtyStage3Annotations,
        buildSwingLegYaml,
        markStage3AnnotationsExported,
      } from '../modules/annotation.js';

      // ==================
      // 工具函数
      // ========================

      /**
       * 更新状态文本
       */
      function updateStatus(text, isError = false) {
        const statusEl = document.getElementById('statusText');
        statusEl.textContent = text;
        statusEl.style.color = isError ? '#ef5350' : '#b2b5be';
        statusEl.style.fontWeight = '500';
      }

      /**
       * 隐藏提示信息
       */
      function hideHint() {
        const hint = document.getElementById('hint');
        if (hint) {
          hint.style.display = 'none';
        }
      }

      /**
       * 处理添加 PDA 请求（右键菜单回调）
       * @param {string} pdaType - PDA 类型 (fvg, bsl, ssl)
       * @param {Object} chartCoordinates - 图表坐标 { time, price }
       */
      function handleAddPda(pdaType, chartCoordinates) {
        console.log(`[添加 PDA] 类型: ${pdaType}, 坐标:`, chartCoordinates);

        const tfSelect = document.getElementById('tfSelect');
        const timeframe = parseInt(tfSelect.value);
        const tfStr = convertTimeframeToString(timeframe);

        if (pdaType === 'bsl') {
          addManualBsl(chartCoordinates.time, chartCoordinates.price, tfStr);
          saveManualPda(
            'bsl',
            chartCoordinates.time,
            chartCoordinates.price,
            null,
            null,
            null,
            timeframe
          );
          updateStatus(`已标注 BSL ${tfStr}: ${chartCoordinates.price.toFixed(2)}`);
        } else if (pdaType === 'ssl') {
          addManualSsl(chartCoordinates.time, chartCoordinates.price, tfStr);
          saveManualPda(
            'ssl',
            chartCoordinates.time,
            chartCoordinates.price,
            null,
            null,
            null,
            timeframe
          );
          updateStatus(`已标注 SSL ${tfStr}: ${chartCoordinates.price.toFixed(2)}`);
        } else if (pdaType === 'fvg') {
          const fvgResult = identifyFvg(state.candleData, chartCoordinates.time);
          if (fvgResult) {
            addManualFvg(
              fvgResult.anchorTime,
              fvgResult.high,
              fvgResult.low,
              fvgResult.direction,
              tfStr
            );
            saveManualPda(
              'fvg',
              fvgResult.anchorTime,
              null,
              fvgResult.high,
              fvgResult.low,
              timeframe,
              fvgResult.direction
            );
            updateStatus(`已标注 FVG ${tfStr}: ${fvgResult.direction}`);
          } else {
            updateStatus('未识别到 FVG，请点击 FVG 的 K1/K2/K3 位置', true);
          }
        }
      }

      /**
       * 将数字 timeframe 转换为字符串格式
       * @param {number} tf - 数字格式的 timeframe（如 60）
       * @returns {string} 字符串格式的 timeframe（如 "1H"）
       */
      function convertTimeframeToString(tf) {
        const map = {
          1: '1M',
          5: '5M',
          15: '15M',
          30: '30M',
          60: '1H',
          240: '4H',
          1440: 'D',
          10080: '1W',
        };
        return map[tf] || '1H';
      }

      /**
       * 显示 API 错误提示
       * @param {string} message - 错误信息
       */
      function showApiError(message) {
        const errorDiv = document.getElementById('apiErrorMessage');
        const errorText = document.getElementById('apiErrorText');
        errorText.textContent = message;
        errorDiv.style.display = 'flex';
      }

      /**
       * 隐藏 API 错误提示
       */
      function hideApiError() {
        const errorDiv = document.getElementById('apiErrorMessage');
        errorDiv.style.display = 'none';
      }

      function getSessionDate() {
        const startValue = document.getElementById('startInput').value.trim();
        const fallback = formatTimestamp(
          state.candleData?.[0]?.time || Math.floor(Date.now() / 1000)
        ).slice(0, 10);
        if (!startValue) {
          return fallback;
        }
        const formatted = formatTimeInput(startValue);
        return formatted.slice(0, 10) || fallback;
      }

      function getGeneratedAt() {
        const now = new Date();
        const year = now.getUTCFullYear();
        const month = String(now.getUTCMonth() + 1).padStart(2, '0');
        const day = String(now.getUTCDate()).padStart(2, '0');
        const hour = String(now.getUTCHours()).padStart(2, '0');
        const minute = String(now.getUTCMinutes()).padStart(2, '0');
        const second = String(now.getUTCSeconds()).padStart(2, '0');
        return `${year}-${month}-${day} ${hour}:${minute}:${second}`;
      }

      function confirmDiscardStage3Annotations() {
        if (hasDirtyStage3Annotations()) {
          const confirmed = window.confirm(
            '当前有未导出的阶段 3 标注。继续后会清空这些标注，是否继续？'
          );
          if (!confirmed) {
            return false;
          }
        }

        clearStage3Annotations();
        return true;
      }

      function exportSwingYaml() {
        try {
          const sessionDate = getSessionDate();
          const yaml = buildSwingLegYaml({
            date: sessionDate,
            timeframe: convertTimeframeToString(
              parseInt(document.getElementById('tfSelect').value, 10)
            ),
            generatedAt: getGeneratedAt(),
          });

          const blob = new Blob([yaml], { type: 'text/yaml;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${sessionDate}.yaml`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          markStage3AnnotationsExported();
          updateStatus('阶段 3 YAML 导出成功');
        } catch (error) {
          console.error('[导出 YAML] 失败:', error);
          updateStatus(`导出 YAML 失败: ${error.message}`, true);
        }
      }

      // 错误提示关闭按钮事件
      document.getElementById('apiErrorCloseBtn').addEventListener('click', hideApiError);

      /**
       * 根据时间戳查找 K 线数据
       * @param {number} timestamp - 时间戳（秒）
       * @returns {Object|null} K 线数据或 null
       */
      function findBarAtTime(timestamp) {
        if (!state.candleData || state.candleData.length === 0) {
          return null;
        }

        const timeframe = parseInt(document.getElementById('tfSelect').value, 10);
        const tolerance = (timeframe * 60) / 2;

        for (const bar of state.candleData) {
          if (Math.abs(bar.time - timestamp) <= tolerance) {
            return bar;
          }
        }

        return null;
      }

      /**
       * 处理标注请求（右键菜单回调）
       * @param {string} annotationType - 标注类型
       * @param {Object} barData - K 线数据 { time, open, high, low, close }
       * @param {number} timeframe - 周期（分钟）
       */
      function handleAnnotate(annotationType, barData, timeframe) {
        console.log(`[标注] 类型: ${annotationType}, K 线:`, barData, `周期: ${timeframe}分钟`);

        try {
          if (annotationType === 'bsl') {
            const tfStr = convertTimeframeToString(timeframe);
            addManualBsl(barData.time, barData.high, tfStr);
            saveManualPda('bsl', barData.time, barData.high, null, null, null, timeframe);
            updateStatus(`已标注 BSL ${tfStr}: ${barData.high.toFixed(2)}`);
          } else if (annotationType === 'ssl') {
            const tfStr = convertTimeframeToString(timeframe);
            addManualSsl(barData.time, barData.low, tfStr);
            saveManualPda('ssl', barData.time, barData.low, null, null, null, timeframe);
            updateStatus(`已标注 SSL ${tfStr}: ${barData.low.toFixed(2)}`);
          } else if (annotationType === 'fvg') {
            const fvgResult = identifyFvg(state.candleData, barData.time);
            if (fvgResult) {
              const tfStr = convertTimeframeToString(timeframe);
              addManualFvg(
                fvgResult.anchorTime,
                fvgResult.high,
                fvgResult.low,
                fvgResult.direction,
                tfStr
              );
              saveManualPda(
                'fvg',
                fvgResult.anchorTime,
                null,
                fvgResult.high,
                fvgResult.low,
                timeframe,
                fvgResult.direction
              );
              updateStatus(
                `已标注 FVG ${tfStr}: ${fvgResult.direction} [${fvgResult.low.toFixed(2)} - ${fvgResult.high.toFixed(2)}]`
              );
            } else {
              updateStatus('未识别到 FVG，请点击 FVG 的 K1/K2/K3 位置', true);
            }
          } else if (annotationType === 'swingLow') {
            addSwingLow(barData.time, barData.low, timeframe);
            updateStatus(`已标注 Swing Low: ${barData.low.toFixed(2)}`);
          } else if (annotationType === 'swingHigh') {
            addSwingHigh(barData.time, barData.high, timeframe);
            updateStatus(`已标注 Swing High: ${barData.high.toFixed(2)}`);
          } else if (annotationType === 'createSegment') {
            const { startSwing, endSwing, segment } = createSegmentFromRecentSwings();
            updateStatus(
              `已创建行情段: ${segment.direction} ${startSwing.price.toFixed(2)} → ${endSwing.price.toFixed(2)}`
            );
          } else if (annotationType === 'undoStage3') {
            undoLastStage3Action();
            updateStatus('已撤销上一步阶段 3 标注');
          } else if (annotationType === 'clearStage3') {
            clearStage3Annotations();
            updateStatus('已清空阶段 3 标注');
          }
        } catch (error) {
          console.error('[标注] 失败:', error);
          updateStatus('标注失败: ' + error.message, true);
        }
      }

      async function saveManualPda(
        pdaType,
        anchorTime,
        price,
        priceHigh,
        priceLow,
        timeframe,
        direction
      ) {
        const tfStr = convertTimeframeToString(timeframe);
        const timeStr = formatTimestamp(anchorTime);
        const apiParams = {
          instrument: 'NQ',
          timeframe: tfStr,
          pdaType,
          direction: direction || '',
          note: '',
          memberRefs: '',
          extraFields: { visible_on_timeframes: [tfStr] },
        };
        if (pdaType === 'fvg') {
          apiParams.anchorTime = timeStr;
          apiParams.confirmTime = '';
          apiParams.price = null;
          apiParams.priceHigh = priceHigh;
          apiParams.priceLow = priceLow;
        } else {
          apiParams.anchorTime = timeStr;
          apiParams.confirmTime = null;
          apiParams.price = price;
          apiParams.priceHigh = null;
          apiParams.priceLow = null;
        }
        try {
          const response = await fetch(`${API_BASE}/v2/pda_manual_add`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(apiParams),
          });
          const result = await response.json();
          if (result.ok) {
            console.log('[入库] PDA 已保存:', result.result.pdaId);
          } else {
            console.error('[入库] 保存失败:', result.error);
          }
        } catch (error) {
          console.error('[入库] 请求失败:', error);
        }
      }

      function handleVisibilityChange(pda, x, y) {
        const currentTf = convertTimeframeToString(
          parseInt(document.getElementById('tfSelect').value, 10)
        );
        const allTimeframes = ['1W', '1D', '4H', '1H', '30M', '15M', '5M', '1M'];
        const currentVisible = pda.extraFields?.visible_on_timeframes || [currentTf];

        const items = allTimeframes.map((tf) => ({
          icon: currentVisible.includes(tf) ? '☑' : '☐',
          label: tf,
          action: () => {
            const newVisible = currentVisible.includes(tf)
              ? currentVisible.filter((t) => t !== tf)
              : [...currentVisible, tf];
            updatePdaVisibility(pda.pdaId, newVisible);
            if (pda.extraFields) {
              pda.extraFields.visible_on_timeframes = newVisible;
            } else {
              pda.extraFields = { visible_on_timeframes: newVisible };
            }
            closeContextMenu();
            reloadPdaData();
          },
        }));

        createContextMenu(x, y, items);
      }

      async function updatePdaVisibility(pdaId, visibleOnTimeframes) {
        try {
          await fetch(`${API_BASE}/v2/pda_update_visibility`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pdaId, visibleOnTimeframes }),
          });
          console.log('[可见周期] 已更新:', pdaId, visibleOnTimeframes);
        } catch (error) {
          console.error('[可见周期] 更新失败:', error);
        }
      }

      async function handleDeletePda(pda) {
        const confirmed = window.confirm(`确认删除 PDA: ${pda.pdaId}?`);
        if (!confirmed) return;

        try {
          const response = await fetch(`${API_BASE}/v2/pda_delete`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pdaId: pda.pdaId }),
          });
          const result = await response.json();
          if (result.ok || result.status === 'success') {
            updateStatus('PDA 已删除');
            await reloadPdaData();
          } else {
            updateStatus(`删除失败: ${result.error || result.message}`, true);
          }
        } catch (error) {
          console.error('[删除] 请求失败:', error);
          updateStatus('删除请求失败', true);
        }
      }

      async function savePda(formData) {
        console.log('[保存 PDA] 表单数据:', formData);

        try {
          // 构建 API 请求参数（字段名转换：下划线 → 驼峰）
          const apiParams = {
            instrument: 'NQ',
            timeframe: convertTimeframeToString(formData.timeframe),
            pdaType: formData.pda_type,
            direction: '', // FVG 不需要方向，BSL/SSL 会自动推断
            note: formData.notes || '',
            memberRefs: '',
            extraFields: {},
          };

          // 根据 PDA 类型设置不同的字段
          if (formData.pda_type === 'fvg') {
            // FVG: 使用 start_time 作为 anchorTime，end_time 作为 confirmTime
            apiParams.anchorTime = formData.start_time;
            apiParams.confirmTime = formData.end_time;
            apiParams.price = null;
            apiParams.priceHigh = formData.price_high;
            apiParams.priceLow = formData.price_low;
            apiParams.direction = formData.direction || ''; // 使用表单中的 direction
          } else {
            // BSL/SSL: 使用 anchor_time
            apiParams.anchorTime = formData.anchor_time;
            apiParams.confirmTime = null;
            apiParams.price = formData.price;
            apiParams.priceHigh = null;
            apiParams.priceLow = null;
          }

          console.log('[保存 PDA] API 请求参数:', apiParams);
          // 发送 POST 请求
          const response = await fetch('/v2/pda_manual_add', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(apiParams),
          });

          const result = await response.json();
          console.log('[保存 PDA] API 响应:', result);

          if (result.ok) {
            // 保存成功
            console.log('[保存 PDA] 保存成功:', result.result);
            hideApiError(); // 隐藏可能存在的错误提示
            hidePdaForm();

            // 刷新图表显示新 PDA
            await reloadPdaData();

            updateStatus('PDA 保存成功');
          } else {
            // 保存失败
            console.error('[保存 PDA] 保存失败:', result.error);
            showApiError(result.error);
          }
        } catch (error) {
          console.error('[保存 PDA] 请求失败:', error);
          showApiError('请求失败: ' + error.message);
        }
      }

      // 设置保存回调
      setOnSaveCallback(savePda);

      /**
       * 重新加载 PDA 数据并刷新图表
       */
      async function reloadPdaData() {
        try {
          const start = document.getElementById('startInput').value.trim();
          const end = document.getElementById('endInput').value.trim();

          if (!start || !end) {
            console.warn('[刷新 PDA] 缺少时间范围，跳过加载');
            return;
          }

          console.log('[刷新 PDA] 重新加载 PDA 数据...');
          updateStatus('加载 PDA 数据...');

          // 加载 PDA 数据
          await loadPdaData(start, end);

          // 强制图表重绘以显示 PDA 标记
          state.chart.timeScale().fitContent();

          const pdaCount = state.pdaRecords.length;
          console.log(`[刷新 PDA] 成功加载 ${pdaCount} 个 PDA`);
          updateStatus(`已加载 ${pdaCount} 个 PDA`);
        } catch (error) {
          console.error('[刷新 PDA] 加载失败:', error);
          updateStatus(`PDA 加载失败: ${error.message}`, true);
        }
      }

      /**
       * 刷新数据（快捷键 F5）
       */
      function refreshData() {
        console.log('[快捷键] F5 刷新数据');

        if (!confirmDiscardStage3Annotations()) {
          updateStatus('已取消刷新，保留阶段 3 标注');
          return;
        }

        const startInput = document.getElementById('startInput');
        const endInput = document.getElementById('endInput');
        startInput.value = formatTimeInput(startInput.value.trim());
        endInput.value = formatTimeInput(endInput.value.trim());

        const start = startInput.value.trim();
        const end = endInput.value.trim();
        if (start && end) {
          loadKlineData();
        } else {
          updateStatus('请先输入时间范围', true);
        }
      }

      /**
       * 加载 K线数据
       */
      async function loadKlineData() {
        console.log('[loadKlineData] 开始执行');

        if (!confirmDiscardStage3Annotations()) {
          updateStatus('已取消加载，保留阶段 3 标注');
          return;
        }

        // 先格式化时间输入（防止用户输入后直接点击加载，未触发 blur）
        const startInput = document.getElementById('startInput');
        const endInput = document.getElementById('endInput');

        console.log('[loadKlineData] 原始输入:', {
          start: startInput.value,
          end: endInput.value,
        });

        startInput.value = formatTimeInput(startInput.value.trim());
        endInput.value = formatTimeInput(endInput.value.trim());
        console.log('[loadKlineData] 格式化后:', {
          start: startInput.value,
          end: endInput.value,
        });

        const start = startInput.value.trim();
        const end = endInput.value.trim();
        const tf = document.getElementById('tfSelect').value;

        // 验证输入
        if (!start || !end) {
          alert('请输入开始和结束时间\\n格式: 2012-01-09 09:30');
          return;
        }

        showLoading(true);
        updateStatus('加载 K线数据...');
        hideHint();

        try {
          // 构建 API URL
          const url = `${API_BASE}/v2/bars?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}&tf=${tf}`;
          console.log('请求 URL:', url);

          // 发起请求
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const data = await response.json();
          console.log('API 响应:', data);

          // 检查响应格式
          if (!data.ok) {
            throw new Error(data.error || '未知错误');
          }

          const bars = data.result;
          if (!bars || bars.length === 0) {
            throw new Error('该时段无数据');
          }

          // 转换数据格式
          const candleData = bars.map((bar) => ({
            time: bar.timestamp,
            open: bar.open,
            high: bar.high,
            low: bar.low,
            close: bar.close,
          }));

          console.log('转换后的数据:', candleData.slice(0, 3));

          // 更新图表数据
          updateChartData(candleData);

          // 自动缩放到合适的视图
          state.chart.timeScale().fitContent();

          // 锁定价格范围
          state.chart.priceScale('right').applyOptions({ autoScale: false });

          console.log(`✓ 成功加载 ${candleData.length} 根 K线`);

          //           // 加载 PDA 数据
          //           updateStatus('加载 PDA 数据...');
          //           await loadPdaData(start, end);
          //           // 强制图表重绘以显示 PDA 标记
          //           state.chart.timeScale().fitContent();
          //
          //           const pdaCount = state.pdaRecords.length;
          //           updateStatus(`已加载 ${candleData.length} 根 K线 + ${pdaCount} 个 PDA`);
          //
          //           // 加载回放数据
          //           loadReplayData(candleData, state.pdaRecords, start, end, parseInt(tf));

          // 默认不加载 PDA 数据
          updateStatus(`已加载 ${candleData.length} 根 K线`);

          // 加载回放数据（PDA 列表为空）
          loadReplayData(candleData, [], start, end, parseInt(tf));
        } catch (error) {
          console.error('加载失败:', error);
          updateStatus(`错误: ${error.message}`, true);
          alert(`加载失败: ${error.message}`);
        } finally {
          showLoading(false);
        }
      }

      // =================================
      // 事件监听
      // =================================

      /**
       * 初始化事件监听
       */
      function initEventListeners() {
        console.log('✓ 初始化事件监听器');

        // 加载按钮
        document.getElementById('loadBtn').addEventListener('click', loadKlineData);
        document.getElementById('exportSwingYamlBtn').addEventListener('click', exportSwingYaml);

        // 周期切换
        document.getElementById('tfSelect').addEventListener('change', () => {
          console.log('[周期切换] 触发重新加载');
          // 如果已经加载过数据，则自动刷新
          if (state.candleData && state.candleData.length > 0) {
            refreshData();
          }
        });

        // 时间输入框格式化
        ['startInput', 'endInput'].forEach((id) => {
          const input = document.getElementById(id);
          input.addEventListener('blur', (e) => {
            const formatted = formatTimeInput(e.target.value);
            if (formatted !== e.target.value) {
              e.target.value = formatted;
            }
          });
        });

        // 图表右键菜单
        const chartContainer = document.getElementById('chart');
        chartContainer.addEventListener('contextmenu', (e) => {
          e.preventDefault();

          const pda = findPdaAtPosition(e.clientX, e.clientY);

          if (pda) {
            // 点击到 PDA，显示 PDA 菜单
            showPdaMenu(
              e.clientX,
              e.clientY,
              pda,
              showPdaDetail,
              updateStatus,
              handleVisibilityChange,
              handleDeletePda
            );
          } else {
            // 获取点击位置的图表坐标
            const rect = chartContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const timeScale = state.chart.timeScale();
            const timestamp = timeScale.coordinateToTime(x);
            const price = state.candlestickSeries.coordinateToPrice(y);

            // 检测是否点击在 K 线上
            const barData = findBarAtTime(timestamp);

            if (barData) {
              // 点击在 K 线上，显示标注菜单
              const timeframe = parseInt(document.getElementById('tfSelect').value);
              showKlineMenu(e.clientX, e.clientY, barData, timeframe, handleAnnotate);
            } else {
              // 空白区域，显示手动添加 PDA 菜单
              const chartCoordinates = {
                time: timestamp,
                price: price,
                clientX: e.clientX,
                clientY: e.clientY,
              };

              showBlankAreaMenu(e.clientX, e.clientY, chartCoordinates, handleAddPda);
            }
          }
        });

        // 点击图表关闭菜单
        chartContainer.addEventListener('click', (e) => {
          if (state.currentMenu) {
            closeContextMenu();
          }
        });

        // 初始化键盘导航
        initKeyboardNavigation(refreshData);

        console.log('✓ 事件监听初始化完成');
      }

      // ====================================
      // 应用启动
      // ===================

      /**
       * 初始化应用
       */
      function init() {
        console.log('=== V3 K线查看器启动 ===');

        initChart();
        initEventListeners();
        initReplay();

        updateStatus('就绪');
        console.log('✓ 应用初始化完成');
      }

      // 页面加载完成后初始化
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>
  </body>
</html>
