<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/chart-viewer.css" />
    <link rel="stylesheet" href="../styles/kline_viewer.css" />
  </head>
  <body>
    <div id="app">
      <div class="toolbar">
        <div class="toolbar-group">
          <span class="toolbar-label">开始时间:</span>
          <input type="text" id="startInput" placeholder="2012-01-09 02:00" />
        </div>
        <div class="toolbar-group">
          <span class="toolbar-label">结束时间:</span>
          <input type="text" id="endInput" placeholder="2012-01-09 16:00" />
        </div>
        <div class="toolbar-group">
          <span class="toolbar-label">周期:</span>
          <select id="tfSelect">
            <option value="1">1M</option>
            <option value="5">5M</option>
            <option value="15">15M</option>
            <option value="60" selected>1H</option>
            <option value="240">4H</option>
            <option value="1440">D</option>
            <option value="10080">W</option>
          </select>
        </div>
        <button id="loadBtn">加载</button>
        <div class="status-bar">
          <span id="statusText">就绪</span>
        </div>
      </div>

      <!-- 主内容区域：图表 + 侧边栏 -->
      <div class="main-content">
        <!-- 图表区域容器 -->
        <div class="chart-area">
          <div id="chart"></div>
          <!-- 回放控制栏 -->
          <div id="replayControls" class="replay-controls" style="display: none">
            <div class="replay-controls-inner">
              <!-- 播放控制按钮 -->
              <div class="replay-buttons">
                <button id="replayStepBackBtn" class="replay-btn" title="后退一根K线">
                  <span class="icon">⏮</span>
                </button>
                <button id="replayPlayBtn" class="replay-btn replay-btn-primary" title="播放/暂停">
                  <span class="icon" id="replayPlayIcon">▶</span>
                </button>
                <button id="replayStopBtn" class="replay-btn" title="停止">
                  <span class="icon">⏹</span>
                </button>
                <button id="replayStepForwardBtn" class="replay-btn" title="前进一根K线">
                  <span class="icon">⏭</span>
                </button>
              </div>

              <!-- 进度条 -->
              <div class="replay-progress-container">
                <input
                  type="range"
                  id="replayProgressBar"
                  class="replay-progress-bar"
                  min="0"
                  max="100"
                  value="0"
                />
                <div class="replay-time-display">
                  <span id="replayCurrentTime">--:--</span>
                  <span class="replay-time-separator">/</span>
                  <span id="replayTotalTime">--:--</span>
                </div>
              </div>

              <!-- 速度控制 -->
              <div class="replay-speed-control">
                <span class="replay-speed-label">速度:</span>
                <select id="replaySpeedSelect" class="replay-speed-select">
                  <option value="1">1x</option>
                  <option value="2">2x</option>
                  <option value="5">5x</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- 侧边栏 -->
        <div class="sidebar collapsed" id="pdaFormSidebar">
          <div class="sidebar-header">
            <h3 id="sidebarTitle">添加 PDA</h3>
            <button id="sidebarCloseBtn" class="sidebar-close-btn">×</button>
          </div>

          <div class="sidebar-body">
            <!-- PDA 类型（只读显示） -->
            <div class="form-group">
              <label class="form-label">PDA 类型</label>
              <input type="text" id="formPdaType" class="form-input" readonly />
            </div>

            <!-- 时间周期（只读显示） -->
            <div class="form-group">
              <label class="form-label">时间周期</label>
              <input type="text" id="formTimeframe" class="form-input" readonly />
            </div>

            <!-- FVG 字段 -->
            <div id="fvgFields" style="display: none">
              <div class="form-group">
                <label class="form-label">起始时间</label>
                <input
                  type="text"
                  id="formFvgStartTime"
                  class="form-input"
                  placeholder="2012-01-09 10:00"
                />
                <span id="errorFvgStartTime" class="form-error"></span>
              </div>

              <div class="form-group">
                <label class="form-label">结束时间</label>
                <input
                  type="text"
                  id="formFvgEndTime"
                  class="form-input"
                  placeholder="2012-01-09 10:02"
                />
                <span id="errorFvgEndTime" class="form-error"></span>
              </div>

              <div class="form-group">
                <label class="form-label">上边界价格</label>
                <input
                  type="number"
                  id="formFvgHigh"
                  class="form-input"
                  placeholder="2310.50"
                  step="0.01"
                />
                <span id="errorFvgHigh" class="form-error"></span>
              </div>

              <div class="form-group">
                <label class="form-label">下边界价格</label>
                <input
                  type="number"
                  id="formFvgLow"
                  class="form-input"
                  placeholder="2305.25"
                  step="0.01"
                />
                <span id="errorFvgLow" class="form-error"></span>
              </div>
            </div>

            <!-- BSL/SSL 字段 -->
            <div id="bslSslFields" style="display: none">
              <div class="form-group">
                <label class="form-label">时间</label>
                <input
                  type="text"
                  id="formBslSslTime"
                  class="form-input"
                  placeholder="2012-01-09 10:00"
                />
                <span id="errorBslSslTime" class="form-error"></span>
              </div>

              <div class="form-group">
                <label class="form-label">价格</label>
                <input
                  type="number"
                  id="formBslSslPrice"
                  class="form-input"
                  placeholder="2310.50"
                  step="0.01"
                />
                <span id="errorBslSslPrice" class="form-error"></span>
              </div>
            </div>

            <!-- 备注（通用） -->
            <div class="form-group">
              <label class="form-label">备注（可选）</label>
              <textarea
                id="formNotes"
                class="form-textarea"
                placeholder="添加备注信息..."
                rows="3"
              ></textarea>
            </div>

            <!-- 操作按钮 -->
            <div class="form-actions">
              <button id="sidebarCancelBtn" class="form-btn form-btn-secondary">取消</button>
              <button id="sidebarSaveBtn" class="form-btn form-btn-primary">保存</button>
            </div>
          </div>
        </div>
      </div>
      <!-- /main-content -->

      <div id="hint" class="hint">
        <p>💡 提示：右键点击 PDA 标记查看详情</p>
        <p>⌨️ 快捷键：F5 刷新数据 | ESC 关闭菜单 | 空格 播放/暂停</p>
      </div>
    </div>

    <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
    <script type="module">
      // ======================
      // 模块导入
      // ===========================
      import { state, API_BASE, initChart, updateChartData } from '../modules/chart.js';
      import { showLoading, formatTimeInput } from '../modules/utils.js';
      import { loadPdaData } from '../modules/pda-renderer.js';
      import { findPdaAtPosition } from '../modules/pda-detector.js';
      import { showPdaMenu, showBlankAreaMenu, closeContextMenu } from '../modules/context-menu.js';
      import { showPdaDetail, closePdaDetail } from '../modules/pda-detail.js';
      import { initKeyboardNavigation } from '../modules/keyboard.js';
      import { initReplay, loadReplayData } from '../modules/replay.js';
      import { showPdaForm, hidePdaForm, setOnSaveCallback } from '../modules/pda-form.js';
      import { identifyFvg, formatTimestamp } from '../modules/pda-identifier.js';

      // ==================
      // 工具函数
      // ========================

      /**
       * 更新状态文本
       */
      function updateStatus(text, isError = false) {
        const statusEl = document.getElementById('statusText');
        statusEl.textContent = text;
        statusEl.style.color = isError ? '#ef5350' : '#b2b5be';
        statusEl.style.fontWeight = '500';
      }

      /**
       * 隐藏提示信息
       */
      function hideHint() {
        const hint = document.getElementById('hint');
        if (hint) {
          hint.style.display = 'none';
        }
      }

      /**
       * 处理添加 PDA 请求（右键菜单回调）
       * @param {string} pdaType - PDA 类型 (fvg, bsl, ssl)
       * @param {Object} chartCoordinates - 图表坐标 { time, price }
       */
      function handleAddPda(pdaType, chartCoordinates) {
        console.log(`[添加 PDA] 类型: ${pdaType}, 坐标:`, chartCoordinates);

        // 获取当前周期
        const tfSelect = document.getElementById('tfSelect');
        const timeframe = parseInt(tfSelect.value);

        // 准备自动填充数据
        const autoFill = {};

        if (pdaType === 'bsl' || pdaType === 'ssl') {
          // BSL/SSL: 自动填充点击位置的时间和价格
          const time = new Date(chartCoordinates.time * 1000);
          const timeStr = time.toISOString().slice(0, 16).replace('T', ' ');
          autoFill.time = timeStr;
          autoFill.price = chartCoordinates.price.toFixed(2);
        } else if (pdaType === 'fvg') {
          // FVG: 自动识别逻辑
          const fvgResult = identifyFvg(state.candleData, chartCoordinates.time);

          if (fvgResult) {
            // 识别成功，自动填充所有字段
            console.log('[FVG 识别] 成功:', fvgResult);
            autoFill.startTime = formatTimestamp(fvgResult.anchorTime);
            autoFill.endTime = '';
            autoFill.high = fvgResult.high.toFixed(2);
            autoFill.low = fvgResult.low.toFixed(2);
          } else {
            // 识别失败，只填充点击位置的时间
            console.log('[FVG 识别] 未识别到 FVG，请手动输入');
            const time = new Date(chartCoordinates.time * 1000);
            const timeStr = time.toISOString().slice(0, 16).replace('T', ' ');
            autoFill.startTime = timeStr;
          }
        }

        // 显示侧边栏表单
        showPdaForm({ pdaType, timeframe, autoFill });
      }

      /**
       * 保存 PDA 到后端
       * @param {Object} formData - 表单数据
       */
      async function savePda(formData) {
        console.log('[保存 PDA] 表单数据:', formData);
        // TODO: 调用 API 保存
        alert('保存功能待实现:\n' + JSON.stringify(formData, null, 2));
        hidePdaForm();
      }

      // 设置保存回调
      setOnSaveCallback(savePda);

      /**
       * 刷新数据（快捷键 F5）
       */
      function refreshData() {
        console.log('[快捷键] F5 刷新数据');
        const start = document.getElementById('startInput').value.trim();
        const end = document.getElementById('endInput').value.trim();
        if (start && end) {
          loadKlineData();
        } else {
          updateStatus('请先输入时间范围', true);
        }
      }

      /**
       * 加载 K线数据
       */
      async function loadKlineData() {
        const start = document.getElementById('startInput').value.trim();
        const end = document.getElementById('endInput').value.trim();
        const tf = document.getElementById('tfSelect').value;

        // 验证输入
        if (!start || !end) {
          alert('请输入开始和结束时间\\n格式: 2012-01-09 09:30');
          return;
        }

        showLoading(true);
        updateStatus('加载 K线数据...');
        hideHint();

        try {
          // 构建 API URL
          const url = `${API_BASE}/v2/bars?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}&tf=${tf}`;
          console.log('请求 URL:', url);

          // 发起请求
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const data = await response.json();
          console.log('API 响应:', data);

          // 检查响应格式
          if (!data.ok) {
            throw new Error(data.error || '未知错误');
          }

          const bars = data.result;
          if (!bars || bars.length === 0) {
            throw new Error('该时段无数据');
          }

          // 转换数据格式
          const candleData = bars.map((bar) => ({
            time: bar.timestamp,
            open: bar.open,
            high: bar.high,
            low: bar.low,
            close: bar.close,
          }));

          console.log('转换后的数据:', candleData.slice(0, 3));

          // 更新图表数据
          updateChartData(candleData);

          // 自动缩放到合适的视图
          state.chart.timeScale().fitContent();

          // 锁定价格范围
          state.chart.priceScale('right').applyOptions({ autoScale: false });

          console.log(`✓ 成功加载 ${candleData.length} 根 K线`);

          //           // 加载 PDA 数据
          //           updateStatus('加载 PDA 数据...');
          //           await loadPdaData(start, end);
          //           // 强制图表重绘以显示 PDA 标记
          //           state.chart.timeScale().fitContent();
          //
          //           const pdaCount = state.pdaRecords.length;
          //           updateStatus(`已加载 ${candleData.length} 根 K线 + ${pdaCount} 个 PDA`);
          //
          //           // 加载回放数据
          //           loadReplayData(candleData, state.pdaRecords, start, end, parseInt(tf));

          // 默认不加载 PDA 数据
          updateStatus(`已加载 ${candleData.length} 根 K线`);

          // 加载回放数据（PDA 列表为空）
          loadReplayData(candleData, [], start, end, parseInt(tf));
        } catch (error) {
          console.error('加载失败:', error);
          updateStatus(`错误: ${error.message}`, true);
          alert(`加载失败: ${error.message}`);
        } finally {
          showLoading(false);
        }
      }

      // =================================
      // 事件监听
      // =================================

      /**
       * 初始化事件监听
       */
      function initEventListeners() {
        console.log('✓ 初始化事件监听器');

        // 加载按钮
        document.getElementById('loadBtn').addEventListener('click', loadKlineData);

        // 时间输入框格式化
        ['startInput', 'endInput'].forEach((id) => {
          const input = document.getElementById(id);
          input.addEventListener('blur', (e) => {
            const formatted = formatTimeInput(e.target.value);
            if (formatted !== e.target.value) {
              e.target.value = formatted;
            }
          });
        });

        // 图表右键菜单
        const chartContainer = document.getElementById('chart');
        chartContainer.addEventListener('contextmenu', (e) => {
          e.preventDefault();

          const pda = findPdaAtPosition(e.clientX, e.clientY);

          if (pda) {
            // 点击到 PDA，显示 PDA 菜单
            showPdaMenu(e.clientX, e.clientY, pda, showPdaDetail, updateStatus);
          } else {
            // 空白区域，显示手动添加 PDA 菜单
            // 获取点击位置的图表坐标
            const rect = chartContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const timeScale = state.chart.timeScale();
            const timestamp = timeScale.coordinateToTime(x);
            const price = state.candlestickSeries.coordinateToPrice(y);

            const chartCoordinates = {
              time: timestamp,
              price: price,
              clientX: e.clientX,
              clientY: e.clientY,
            };

            showBlankAreaMenu(e.clientX, e.clientY, chartCoordinates, handleAddPda);
          }
        });

        // 点击图表关闭菜单
        chartContainer.addEventListener('click', (e) => {
          if (state.currentMenu) {
            closeContextMenu();
          }
        });

        // 初始化键盘导航
        initKeyboardNavigation(refreshData);

        console.log('✓ 事件监听初始化完成');
      }

      // ====================================
      // 应用启动
      // ===================

      /**
       * 初始化应用
       */
      function init() {
        console.log('=== V3 K线查看器启动 ===');

        initChart();
        initEventListeners();
        initReplay();

        updateStatus('就绪');
        console.log('✓ 应用初始化完成');
      }

      // 页面加载完成后初始化
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>
  </body>
</html>
