<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/chart-viewer.css" />
  </head>
  <body>
    <div id="app">
      <div class="toolbar">
        <div class="toolbar-group">
          <span class="toolbar-label">开始时间:</span>
          <input type="text" id="startInput" placeholder="2012-01-09 02:00" />
        </div>
        <div class="toolbar-group">
          <span class="toolbar-label">结束时间:</span>
          <input type="text" id="endInput" placeholder="2012-01-09 16:00" />
        </div>
        <div class="toolbar-group">
          <span class="toolbar-label">周期:</span>
          <select id="tfSelect">
            <option value="1">1m</option>
            <option value="5">5m</option>
            <option value="15">15m</option>
            <option value="60" selected>1H</option>
            <option value="240">4H</option>
          </select>
        </div>
        <button id="loadBtn">加载</button>
        <span id="statusText">就绪</span>
        <span style="margin-left: auto; font-size: 12px; color: #888"
          >图表时间 = 美东时间 (EST/EDT)</span
        >
      </div>

      <div id="chart">
        <div class="hint" id="hint">
          <div class="hint-icon">📊</div>
          <div>输入时间范围，点击"加载"查看 K线图表</div>
          <div style="margin-top: 8px; font-size: 12px; color: #5a5e6b">
            示例: 2012-01-09 02:00 至 2012-01-09 16:00
          </div>
        </div>
      </div>
    </div>

    <!-- Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

    <script>
      // ================================================
      // 全局状态
      // ==================================
      const state = {
        chart: null,
        candlestickSeries: null,
        loading: false,
        liquidityPrimitives: [], // BSL/SSL 短线 Primitives
        fvgPrimitives: [], // FVG 矩形 Primitives
      };

      // ======================================
      // 配置
      // ===================================================
      const API_BASE = 'http://127.0.0.1:8765';

      // ==========================================================
      // 工具函数
      // ================================================

      /**
       * 显示/隐藏加载状态
       */
      function showLoading(show) {
        state.loading = show;

        let overlay = document.querySelector('.loading-overlay');
        if (show) {
          if (!overlay) {
            overlay = document.createElement('div');
            overlay.className = 'loading-overlay';
            overlay.innerHTML = `
          <div class="loading-content">
              <div class="loading-spinner"></div>
              <div class="loading-text">加载中...</div>
            </div>
          `;
            document.getElementById('chart').appendChild(overlay);
          }
        } else {
          if (overlay) {
            overlay.remove();
          }
        }
      }

      /**
       * 更新状态文本
       */
      function updateStatus(text, isError = false) {
        const statusEl = document.getElementById('statusText');
        statusEl.textContent = text;
        statusEl.style.color = isError ? '#ef5350' : '#787b86';
      }

      /**
       * 隐藏提示信息
       */
      function hideHint() {
        const hint = document.getElementById('hint');
        if (hint) {
          hint.style.display = 'none';
        }
      }

      // ======================================================
      // 图表初始化
      // ===============================================

      /**
       * 初始化 Lightweight Charts
       */
      function initChart() {
        const container = document.getElementById('chart');

        state.chart = LightweightCharts.createChart(container, {
          width: container.clientWidth,
          height: container.clientHeight,
          layout: {
            background: { color: '#131722' },
            textColor: '#d1d4dc',
          },
          grid: {
            vertLines: { color: '#1e222d' },
            horzLines: { color: '#1e222d' },
          },
          crosshair: {
            mode: LightweightCharts.CrosshairMode.Normal,
          },
          rightPriceScale: {
            borderColor: '#2a2e39',
          },
          timeScale: {
            borderColor: '#2a2e39',
            timeVisible: true,
            secondsVisible: false,
          },
        });

        state.candlestickSeries = state.chart.addCandlestickSeries({
          upColor: '#26a69a',
          downColor: '#ef5350',
          borderVisible: false,
          wickUpColor: '#26a69a',
          wickDownColor: '#ef5350',
        });

        // 响应式调整
        window.addEventListener('resize', () => {
          state.chart.applyOptions({
            width: container.clientWidth,
            height: container.clientHeight,
          });
        });

        console.log('✓ 图表初始化完成');
        console.log('✓ 数据库时间 = 美东时间，图表直接显示（无时区转换）');
      }

      // ======================================
      // PDA 渲染 - FVG 矩形（基于官方 Rectangle Drawing Tool）
      // ================================

      /**
       * FVG 矩形渲染器
       */
      class FvgRenderer {
        constructor(p1, p2, fillColor) {
          this._p1 = p1;
          this._p2 = p2;
          this._fillColor = fillColor;
        }

        draw(target) {
          target.useBitmapCoordinateSpace((scope) => {
            if (
              this._p1.x === null ||
              this._p1.y === null ||
              this._p2.x === null ||
              this._p2.y === null
            ) {
              return;
            }

            const ctx = scope.context;

            // 计算矩形位置和大小
            const x = Math.min(this._p1.x, this._p2.x) * scope.horizontalPixelRatio;
            const y = Math.min(this._p1.y, this._p2.y) * scope.verticalPixelRatio;
            const width = Math.abs(this._p2.x - this._p1.x) * scope.horizontalPixelRatio;
            const height = Math.abs(this._p2.y - this._p1.y) * scope.verticalPixelRatio;

            // 填充
            ctx.fillStyle = this._fillColor;
            ctx.fillRect(x, y, width, height);

            // 中间虚线
            const midY = y + height / 2;
            ctx.strokeStyle = this._fillColor.replace('33', ''); // 移除透明度，使用实色
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]); // 虚线：5px 实线，5px 空白
            ctx.beginPath();
            ctx.moveTo(x, midY);
            ctx.lineTo(x + width, midY);
            ctx.stroke();
            ctx.setLineDash([]); // 重置为实线
          });
        }
      }

      /**
       * FVG 视图
       */
      class FvgView {
        constructor(source) {
          this._source = source;
          this._p1 = { x: null, y: null };
          this._p2 = { x: null, y: null };
        }

        update() {
          const series = this._source._series;
          const chart = this._source._chart;

          // 价格 → Y 坐标
          const y1 = series.priceToCoordinate(this._source._topPrice);
          const y2 = series.priceToCoordinate(this._source._bottomPrice);

          // 时间 → X 坐标
          const timeScale = chart.timeScale();
          const x1 = timeScale.timeToCoordinate(this._source._startTime);
          const x2 = timeScale.timeToCoordinate(this._source._endTime);

          this._p1 = { x: x1, y: y1 };
          console.log('FVG update:', {
            startTime: this._source._startTime,
            endTime: this._source._endTime,
            topPrice: this._source._topPrice,
            bottomPrice: this._source._bottomPrice,
            x1,
            x2,
            y1,
            y2,
          });
          this._p2 = { x: x2, y: y2 };
        }

        renderer() {
          return new FvgRenderer(this._p1, this._p2, this._source._fillColor);
        }
      }

      /**
       * FVG Primitive
       */
      class FvgPrimitive {
        constructor(chart, series, startTime, endTime, topPrice, bottomPrice, color = '#ab47bc33') {
          this._chart = chart;
          this._series = series;
          this._startTime = startTime;
          this._endTime = endTime;
          this._topPrice = topPrice;
          this._bottomPrice = bottomPrice;
          this._fillColor = color;
          this._view = new FvgView(this);
        }

        updateAllViews() {
          this._view.update();
        }

        paneViews() {
          return [this._view];
        }
      }

      function addFvgMarker(startTime, endTime, topPrice, bottomPrice, color = '#ab47bc33') {
        const primitive = new FvgPrimitive(
          state.chart,
          state.candlestickSeries,
          startTime,
          endTime,
          topPrice,
          bottomPrice,
          color
        );
        state.candlestickSeries.attachPrimitive(primitive);

        // 存储引用，方便后续清理
        state.fvgPrimitives.push(primitive);

        console.log(
          `✓ 添加 FVG 标记: start=${startTime}, end=${endTime}, top=${topPrice}, bottom=${bottomPrice}`
        );
      }

      function clearFvgMarkers() {
        state.fvgPrimitives.forEach((primitive) => {
          state.candlestickSeries.detachPrimitive(primitive);
        });
        state.fvgPrimitives = [];
      }

      // =================
      // PDA 渲染 - BSL/SSL 流动性短线 + 标签
      // ===============

      /**
       * 流动性默认参数（预留接口，后续可外部覆盖）
       */
      const LIQUIDITY_DEFAULTS = {
        lineLength: 2, // 向右延伸 K 线数（参数可调）
        showLabel: true, // 是否显示文字标签（参数可调）
        lineWidth: 1,
        labelFont: '11px sans-serif',
        labelPadding: 4, // 标签距离线段右端的像素间隔
      };

      /**
       * 流动性短线渲染器
       * - 线段从 anchor 时间（左端 p1）向右延伸到 p2
       * - 文字标签位于线段右端外侧，垂直居中
       */
      class LiquidityRenderer {
        constructor(p1, p2, lineColor, textColor, label, position, options) {
          this._p1 = p1;
          this._p2 = p2;
          this._lineColor = lineColor;
          this._textColor = textColor;
          this._label = label;
          this._position = position; // 'above' | 'below'
          this._options = options;
        }

        draw(target) {
          target.useBitmapCoordinateSpace((scope) => {
            if (this._p1.x === null || this._p2.x === null || this._p1.y === null) return;

            const ctx = scope.context;
            const hRatio = scope.horizontalPixelRatio;
            const vRatio = scope.verticalPixelRatio;

            const x1 = this._p1.x * hRatio;
            const x2 = this._p2.x * hRatio;
            const y = this._p1.y * vRatio;

            // 短线
            ctx.strokeStyle = this._lineColor;
            ctx.lineWidth = this._options.lineWidth * Math.min(hRatio, vRatio);
            ctx.beginPath();
            ctx.moveTo(x1, y);
            ctx.lineTo(x2, y);
            ctx.stroke();

            // 文字标签（线段右端，上方或下方）
            if (this._options.showLabel && this._label) {
              ctx.fillStyle = this._textColor;
              ctx.font = this._options.labelFont;
              const padding = this._options.labelPadding * vRatio;
              ctx.textAlign = 'right';
              if (this._position === 'above') {
                ctx.textBaseline = 'bottom';
                ctx.fillText(this._label, x2, y - padding);
              } else {
                ctx.textBaseline = 'top';
                ctx.fillText(this._label, x2, y + padding);
              }
            }
          });
        }
      }

      /**
       * 流动性视图 - 计算坐标
       * anchor 时间 = 线段左端，向右延伸 lineLength 根 K 线
       */
      class LiquidityView {
        constructor(source) {
          this._source = source;
          this._p1 = { x: null, y: null };
          this._p2 = { x: null, y: null };
        }

        update() {
          const series = this._source._series;
          const chart = this._source._chart;
          const timeScale = chart.timeScale();

          const y = series.priceToCoordinate(this._source._price);
          const anchorCoord = timeScale.timeToCoordinate(this._source._anchorTime);
          let rightX = null;
          if (anchorCoord !== null) {
            const logical = timeScale.coordinateToLogical(anchorCoord);
            if (logical !== null) {
              rightX = timeScale.logicalToCoordinate(logical + this._source._options.lineLength);
            }
          }

          this._p1 = { x: anchorCoord, y };
          this._p2 = { x: rightX, y };
        }

        renderer() {
          return new LiquidityRenderer(
            this._p1,
            this._p2,
            this._source._lineColor,
            this._source._textColor,
            this._source._label,
            this._source._position,
            this._source._options
          );
        }
      }

      /**
       * 流动性 Primitive (BSL/SSL 共用)
       */
      class LiquidityPrimitive {
        constructor(
          chart,
          series,
          anchorTime,
          price,
          lineColor,
          textColor,
          label,
          position,
          options = {}
        ) {
          this._chart = chart;
          this._series = series;
          this._anchorTime = anchorTime;
          this._price = price;
          this._lineColor = lineColor;
          this._textColor = textColor;
          this._label = label;
          this._position = position;
          this._options = { ...LIQUIDITY_DEFAULTS, ...options };
          this._view = new LiquidityView(this);
        }

        updateAllViews() {
          this._view.update();
        }

        paneViews() {
          return [this._view];
        }
      }

      function addBslMarker(timestamp, price, label = 'BSL', options = {}) {
        const primitive = new LiquidityPrimitive(
          state.chart,
          state.candlestickSeries,
          timestamp,
          price,
          '#5b9cf6', // 线段颜色（蓝）
          '#26a69a', // 文字颜色（绿）
          label,
          'above', // BSL: 文字在线段上方
          options
        );
        state.candlestickSeries.attachPrimitive(primitive);
        state.liquidityPrimitives.push(primitive);
      }

      function addSslMarker(timestamp, price, label = 'SSL', options = {}) {
        const primitive = new LiquidityPrimitive(
          state.chart,
          state.candlestickSeries,
          timestamp,
          price,
          '#ffb74d', // 线段颜色（橙）
          '#ef5350', // 文字颜色（红）
          label,
          'below', // SSL: 文字在线段下方
          options
        );
        state.candlestickSeries.attachPrimitive(primitive);
        state.liquidityPrimitives.push(primitive);
      }

      function clearLiquidityMarkers() {
        state.liquidityPrimitives.forEach((primitive) => {
          state.candlestickSeries.detachPrimitive(primitive);
        });
        state.liquidityPrimitives = [];
      }

      /**
       * 清除所有 PDA 标记
       */
      function clearAllPdaMarkers() {
        // 清除 BSL/SSL 流动性短线
        clearLiquidityMarkers();

        // 清除 FVG Primitives
        clearFvgMarkers();
      }

      /**
       * 从 v2 API 批量加载 PDA 数据
       */
      async function loadPdaData(startTime, endTime) {
        try {
          console.log('开始加载 PDA 数据...');

          // 构建 API URL
          // 读取当前选择的时间周期，联动 tfSelect
          const tf = parseInt(document.getElementById('tfSelect').value);
          const tfMap = { 1: '1M', 5: '5M', 15: '15M', 60: '1H', 240: '4H' };
          const timeframe = tfMap[tf] || '1H';

          const url =
            `${API_BASE}/v2/pda_records?` +
            `anchor_time_from=${encodeURIComponent(startTime)}&` +
            `anchor_time_to=${encodeURIComponent(endTime)}&` +
            `timeframe=${timeframe}&` +
            `limit=1000`;

          console.log('PDA API URL:', url);

          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const data = await response.json();
          console.log('PDA API 响应:', data);

          if (!data.ok) {
            throw new Error(data.error || 'PDA 加载失败');
          }

          const records = data.result.records || [];
          console.log(`✓ 获取到 ${records.length} 条 PDA 记录`);

          // 清除旧标记
          clearAllPdaMarkers();

          // 统计各类型数量
          const stats = { bsl: 0, ssl: 0, fvg: 0, other: 0 };

          // 遍历记录，按类型渲染
          records.forEach((record) => {
            const pdaType = record.pdaType;
            const anchorTime = record.anchorTs || record.anchorTime;

            // 转换时间为 Unix 时间戳（秒）
            let timestamp;
            if (typeof anchorTime === 'number') {
              timestamp = anchorTime;
            } else if (typeof anchorTime === 'string') {
              // 数据库存的是美东时间，加 Z 当作 UTC 解析（时区约定）
              timestamp = Math.floor(new Date(anchorTime.replace(' ', 'T') + 'Z').getTime() / 1000);
            } else {
              console.warn('无效的 anchor_time:', anchorTime, record);
              return;
            }

            // 根据类型渲染
            if (pdaType === 'bsl') {
              const price = record.price || record.priceHigh;
              if (price) {
                addBslMarker(timestamp, price, 'BSL');
                stats.bsl++;
              }
            } else if (pdaType === 'ssl') {
              const price = record.price || record.priceLow;
              if (price) {
                addSslMarker(timestamp, price, 'SSL');
                stats.ssl++;
              }
            } else if (pdaType === 'fvg') {
              const priceHigh = record.priceHigh;
              const priceLow = record.priceLow;
              const direction = record.direction;

              if (priceHigh && priceLow) {
                // FVG 需要计算时间范围
                // anchor_time 是中间 K 线（K2）的时间
                // 假设 1H 周期，K1 = anchor - 1H, K3 = anchor + 1H
                const tf = parseInt(document.getElementById('tfSelect').value);
                const tfSeconds = tf * 60;
                const startTime = timestamp - tfSeconds;
                const endTime = timestamp + tfSeconds * 2; // K3 结束时间

                // 根据方向选择颜色
                const color = direction === 'bullish' ? '#26a69a33' : '#ef535033'; // 绿色/红色

                addFvgMarker(startTime, endTime, priceHigh, priceLow, color);
                stats.fvg++;
              }
            } else {
              stats.other++;
            }
          });

          console.log('PDA 渲染统计:', stats);
          return stats;
        } catch (error) {
          console.error('PDA 加载失败:', error);
          throw error;
        }
      }

      // ====================================================
      // 数据加载
      // ================================================

      /**
       * 加载 K线数据
       */
      async function loadKlineData() {
        const start = document.getElementById('startInput').value.trim();
        const end = document.getElementById('endInput').value.trim();
        const tf = document.getElementById('tfSelect').value;

        // 验证输入
        if (!start || !end) {
          alert('请输入开始和结束时间\n格式: 2012-01-09 09:30');
          return;
        }

        showLoading(true);
        updateStatus('加载 K线数据...');
        hideHint();

        try {
          // 构建 API URL
          const url = `${API_BASE}/v2/bars?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}&tf=${tf}`;
          console.log('请求 URL:', url);

          // 发起请求
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const data = await response.json();
          console.log('API 响应:', data);

          // 检查响应格式
          if (!data.ok) {
            throw new Error(data.error || '未知错误');
          }

          const bars = data.result;
          if (!bars || bars.length === 0) {
            throw new Error('该时段无数据');
          }

          // 转换数据格式
          // v2 API 返回的 timestamp 是 Unix 时间戳（秒）
          // Lightweight Charts 需要 Unix 时间戳（秒）
          const candleData = bars.map((bar) => ({
            time: bar.timestamp, // 直接使用秒级时间戳
            open: bar.open,
            high: bar.high,
            low: bar.low,
            close: bar.close,
          }));

          console.log('转换后的数据:', candleData.slice(0, 3));

          // 设置数据
          state.candlestickSeries.setData(candleData);

          // 自动缩放到合适的视图
          state.chart.timeScale().fitContent();

          // 锁定价格范围，防止滚轮缩放时间轴时价格轴跟着跳动
          state.chart.priceScale('right').applyOptions({ autoScale: false });

          console.log(`✓ 成功加载 ${candleData.length} 根 K线`);

          // 加载 PDA 数据
          updateStatus('加载 PDA 数据...');
          const pdaStats = await loadPdaData(start, end);

          updateStatus(
            `已加载 ${candleData.length} 根 K线 + ${pdaStats.bsl + pdaStats.ssl + pdaStats.fvg} 个 PDA (BSL:${pdaStats.bsl} SSL:${pdaStats.ssl} FVG:${pdaStats.fvg})`
          );
        } catch (error) {
          console.error('加载失败:', error);
          updateStatus(`错误: ${error.message}`, true);
          alert(`加载失败: ${error.message}`);
        } finally {
          showLoading(false);
        }
      }

      // 时间格式化工具
      function formatTimeInput(value) {
        console.log('formatTimeInput 调用:', value);
        const digits = value.replace(/\D/g, '');
        console.log('提取数字:', digits, '长度:', digits.length);
        if (digits.length !== 12) return value;
        const year = digits.substring(0, 4);
        const month = digits.substring(4, 6);
        const day = digits.substring(6, 8);
        const hour = digits.substring(8, 10);
        const minute = digits.substring(10, 12);
        if (parseInt(month) < 1 || parseInt(month) > 12) return value;
        if (parseInt(day) < 1 || parseInt(day) > 31) return value;
        if (parseInt(hour) > 23) return value;
        if (parseInt(minute) > 59) return value;
        const formatted = `${year}-${month}-${day} ${hour}:${minute}`;
        console.log('格式化结果:', formatted);
        return formatted;
      }

      // =========================================================
      // 事件监听
      // ===================================================

      /**
       * 初始化事件监听
       */
      function initEventListeners() {
        console.log('✓ 初始化事件监听器');
        document.getElementById('loadBtn').addEventListener('click', loadKlineData);

        ['startInput', 'endInput'].forEach((id) => {
          const input = document.getElementById(id);
          console.log(`✓ 绑定 ${id} 事件`);
          input.addEventListener('blur', (e) => {
            console.log(`${id} blur 事件触发`);
            e.target.value = formatTimeInput(e.target.value.trim());
          });
          input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
              console.log(`${id} Enter 键触发`);
              e.target.value = formatTimeInput(e.target.value.trim());
              loadKlineData();
            }
          });
        });

        document.getElementById('tfSelect').addEventListener('change', () => {
          const start = document.getElementById('startInput').value.trim();
          const end = document.getElementById('endInput').value.trim();
          if (start && end) {
            loadKlineData();
          }
        });

        console.log('✓ 事件监听初始化完成');
      }

      // =============================================
      // 应用启动
      // ========================================================

      /**
       * 初始化应用
       */
      function init() {
        console.log('=== V3 K线查看器启动 ===');

        initChart();
        initEventListeners();

        updateStatus('就绪');
        console.log('✓ 应用初始化完成');
      }

      // 页面加载完成后初始化
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>
  </body>
</html>
