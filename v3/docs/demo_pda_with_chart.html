<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDA 显示控制 Demo - 带 K 线</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1e222d;
        color: #d1d4dc;
        padding: 20px;
      }

      .container {
        max-width: 1600px;
        margin: 0 auto;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 20px;
        color: #fff;
      }

      .layout {
        display: flex;
        gap: 20px;
      }

      .chart-container {
        flex: 1;
        background: #131722;
        border-radius: 8px;
        padding: 20px;
        position: relative;
      }

      #chart {
        width: 100%;
        height: 600px;
      }

      .control-panel {
        width: 320px;
        background: #131722;
        border-radius: 8px;
        padding: 20px;
        max-height: 600px;
        overflow-y: auto;
      }

      .control-section {
        margin-bottom: 24px;
      }

      .control-section h3 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .control-group {
        margin-bottom: 16px;
      }

      .control-group label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
        color: #b2b5be;
      }

      .checkbox-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .checkbox-item input[type='checkbox'] {
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      .checkbox-item label {
        margin: 0;
        cursor: pointer;
        font-size: 13px;
      }

      input[type='range'] {
        width: 100%;
        height: 4px;
        background: #2a2e39;
        border-radius: 2px;
        outline: none;
        -webkit-appearance: none;
      }

      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        background: #2962ff;
        border-radius: 50%;
        cursor: pointer;
      }

      input[type='range']::-moz-range-thumb {
        width: 14px;
        height: 14px;
        background: #2962ff;
        border-radius: 50%;
        cursor: pointer;
        border: none;
      }

      .range-value {
        display: inline-block;
        margin-left: 8px;
        font-size: 12px;
        color: #2962ff;
        font-weight: 600;
      }

      .demo-info {
        background: rgba(41, 98, 255, 0.1);
        border: 1px solid rgba(41, 98, 255, 0.3);
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 20px;
        font-size: 13px;
        line-height: 1.6;
      }

      .demo-info strong {
        color: #2962ff;
      }

      .stats {
        display: flex;
        gap: 16px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #2a2e39;
      }

      .stat-item {
        flex: 1;
      }

      .stat-label {
        font-size: 11px;
        color: #787b86;
        margin-bottom: 4px;
      }

      .stat-value {
        font-size: 16px;
        font-weight: 600;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>PDA 显示控制 Demo - 带 K 线</h1>

      <div class="demo-info">
        <strong>测试功能：</strong><br />
        1. 真实 K 线图表 + 多重周期 PDA 标签<br />
        2. 标签在价格线上方竖排显示（从下往上堆叠）<br />
        3. 通过右侧面板控制周期/类型过滤和显示参数
      </div>

      <div class="layout">
        <div class="chart-container">
          <div id="chart"></div>
        </div>

        <div class="control-panel">
          <div class="control-section">
            <h3>周期过滤</h3>
            <div class="checkbox-group">
              <div class="checkbox-item">
                <input type="checkbox" id="show_d" checked />
                <label for="show_d">Daily</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="show_4h" checked />
                <label for="show_4h">4H</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="show_1h" checked />
                <label for="show_1h">1H</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="show_30m" checked />
                <label for="show_30m">30M</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="show_15m" checked />
                <label for="show_15m">15M</label>
              </div>
            </div>
          </div>

          <div class="control-section">
            <h3>PDA 类型</h3>
            <div class="checkbox-group">
              <div class="checkbox-item">
                <input type="checkbox" id="show_bsl" checked />
                <label for="show_bsl">BSL</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="show_ssl" checked />
                <label for="show_ssl">SSL</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="show_daily_high" checked />
                <label for="show_daily_high">Daily High</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="show_midnight_high" checked />
                <label for="show_midnight_high">ICT Midnight High</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="show_swing_high" checked />
                <label for="show_swing_high">Swing High</label>
              </div>
            </div>
          </div>

          <div class="control-section">
            <h3>显示参数</h3>
            <div class="control-group">
              <label>标签间距: <span class="range-value" id="labelSpacingValue">2px</span></label>
              <input type="range" id="labelSpacing" min="0" max="8" value="2" step="1" />
            </div>
            <div class="control-group">
              <label>字体大小: <span class="range-value" id="fontSizeValue">11px</span></label>
              <input type="range" id="fontSize" min="9" max="16" value="11" step="1" />
            </div>
            <div class="control-group">
              <label>竖线高度: <span class="range-value" id="verticalLineValue">60px</span></label>
              <input type="range" id="verticalLine" min="30" max="120" value="60" step="10" />
            </div>
          </div>

          <div class="stats">
            <div class="stat-item">
              <div class="stat-label">可见 PDA</div>
              <div class="stat-value" id="visibleCount">0</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">总计</div>
              <div class="stat-value" id="totalCount">0</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
    <script>
      // 生成模拟 K 线数据
      function generateCandleData() {
        const data = [];
        let baseTime = Math.floor(Date.now() / 1000) - 86400 * 30; // 30 天前
        let basePrice = 18400;

        for (let i = 0; i < 120; i++) {
          const time = baseTime + i * 3600; // 每小时一根
          const open = basePrice + (Math.random() - 0.5) * 20;
          const close = open + (Math.random() - 0.5) * 50;
          const high = Math.max(open, close) + Math.random() * 30;
          const low = Math.min(open, close) - Math.random() * 30;

          data.push({ time, open, high, low, close });
          basePrice = close;
        }

        return data;
      }

      // 模拟 PDA 数据（基于 K 线数据生成）
      function generatePdaData(candleData) {
        const pdas = [];

        // 在第 60 根 K 线位置创建多重 PDA
        const targetBar = candleData[60];
        const targetPrice = targetBar.high;
        const targetTime = targetBar.time;

        pdas.push(
          {
            id: 'pda_001',
            type: 'midnight_high',
            timeframe: 'D',
            price: targetPrice,
            time: targetTime,
            label: 'midnight high',
          },
          {
            id: 'pda_002',
            type: 'daily_high',
            timeframe: 'D',
            price: targetPrice,
            time: targetTime,
            label: 'daily high',
          },
          {
            id: 'pda_003',
            type: 'swing_high',
            timeframe: '4H',
            price: targetPrice,
            time: targetTime,
            label: 'SH - 4h',
          },
          {
            id: 'pda_004',
            type: 'swing_high',
            timeframe: '1H',
            price: targetPrice,
            time: targetTime,
            label: 'SH - 1h',
          }
        );

        // 添加一些单独的 PDA
        pdas.push(
          {
            id: 'pda_005',
            type: 'bsl',
            timeframe: '1H',
            price: candleData[40].high,
            time: candleData[40].time,
            label: 'BSL',
          },
          {
            id: 'pda_006',
            type: 'ssl',
            timeframe: '30M',
            price: candleData[80].low,
            time: candleData[80].time,
            label: 'SSL',
          },
          {
            id: 'pda_007',
            type: 'bsl',
            timeframe: '15M',
            price: candleData[100].high,
            time: candleData[100].time,
            label: 'BSL',
          }
        );

        return pdas;
      }

      // 状态
      const state = {
        chart: null,
        candlestickSeries: null,
        candleData: [],
        pdas: [],
        pdaPrimitives: [],
        filters: {
          timeframes: new Set(['D', '4H', '1H', '30M', '15M']),
          types: new Set(['bsl', 'ssl', 'daily_high', 'midnight_high', 'swing_high']),
        },
        params: {
          labelSpacing: 2,
          fontSize: 11,
          verticalLine: 60,
        },
      };

      // PDA Primitive 类
      class PdaStackPrimitive {
        constructor(chart, series, pdas, params) {
          this._chart = chart;
          this._series = series;
          this._pdas = pdas; // 同一价格位置的多个 PDA
          this._params = params;
          this._view = new PdaStackView(this);
        }

        updateAllViews() {
          this._view.update();
        }

        paneViews() {
          return [this._view];
        }
      }

      class PdaStackView {
        constructor(source) {
          this._source = source;
          this._priceY = null;
          this._timeX = null;
        }

        update() {
          const series = this._source._series;
          const chart = this._source._chart;
          const pdas = this._source._pdas;

          if (pdas.length === 0) {
            this._priceY = null;
            this._timeX = null;
            return;
          }

          const firstPda = pdas[0];
          this._priceY = series.priceToCoordinate(firstPda.price);
          this._timeX = chart.timeScale().timeToCoordinate(firstPda.time);
        }

        renderer() {
          return new PdaStackRenderer(this);
        }
      }

      class PdaStackRenderer {
        constructor(view) {
          this._view = view;
        }

        draw(target) {
          target.useBitmapCoordinateSpace((scope) => {
            if (this._view._priceY === null || this._view._timeX === null) return;

            const ctx = scope.context;
            const source = this._view._source;
            const pdas = source._pdas;
            const params = source._params;

            const hRatio = scope.horizontalPixelRatio;
            const vRatio = scope.verticalPixelRatio;

            const x = this._view._timeX * hRatio;
            const y = this._view._priceY * vRatio;

            // 水平价格线
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + 80 * hRatio, y);
            ctx.stroke();

            // 标签（从下往上堆叠）
            ctx.font = `${params.fontSize * vRatio}px sans-serif`;
            ctx.textBaseline = 'bottom';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
            ctx.shadowBlur = 3 * Math.min(hRatio, vRatio);
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 1 * vRatio;

            const labelSpacing = params.labelSpacing * vRatio;
            let currentY = y - 4 * vRatio; // 从价格线上方 4px 开始

            // 反向遍历（从下往上）
            for (let i = pdas.length - 1; i >= 0; i--) {
              const pda = pdas[i];

              // 设置颜色
              switch (pda.type) {
                case 'bsl':
                  ctx.fillStyle = '#5b9cf6';
                  break;
                case 'ssl':
                  ctx.fillStyle = '#ffb74d';
                  break;
                case 'daily_high':
                  ctx.fillStyle = '#26a69a';
                  break;
                case 'midnight_high':
                  ctx.fillStyle = '#26a69a';
                  break;
                case 'swing_high':
                  ctx.fillStyle = '#26a69a';
                  break;
                default:
                  ctx.fillStyle = '#ffffff';
              }

              ctx.fillText(pda.label, x + 4 * hRatio, currentY);
              currentY -= params.fontSize * vRatio + labelSpacing;
            }

            // 重置 shadow
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
          });
        }
      }

      // 初始化图表
      function initChart() {
        const chartElement = document.getElementById('chart');

        state.chart = LightweightCharts.createChart(chartElement, {
          width: chartElement.clientWidth,
          height: 600,
          layout: {
            background: { color: '#131722' },
            textColor: '#d1d4dc',
          },
          grid: {
            vertLines: { color: '#1e222d' },
            horzLines: { color: '#1e222d' },
          },
          timeScale: {
            timeVisible: true,
            secondsVisible: false,
          },
        });

        state.candlestickSeries = state.chart.addCandlestickSeries({
          upColor: '#26a69a',
          downColor: '#ef5350',
          borderVisible: false,
          wickUpColor: '#26a69a',
          wickDownColor: '#ef5350',
        });

        // 生成数据
        state.candleData = generateCandleData();
        state.pdas = generatePdaData(state.candleData);

        // 设置 K 线数据
        state.candlestickSeries.setData(state.candleData);

        // 渲染 PDA
        renderPdas();
        updateStats();

        // 响应式调整
        window.addEventListener('resize', () => {
          state.chart.applyOptions({ width: chartElement.clientWidth });
        });
      }

      // 渲染 PDA
      function renderPdas() {
        // 清除旧的 primitives
        state.pdaPrimitives.forEach((primitive) => {
          state.candlestickSeries.detachPrimitive(primitive);
        });
        state.pdaPrimitives = [];

        // 按价格+时间分组
        const groups = {};
        state.pdas.forEach((pda) => {
          const key = `${pda.price}_${pda.time}`;
          if (!groups[key]) {
            groups[key] = [];
          }
          groups[key].push(pda);
        });

        // 为每组创建 primitive
        Object.values(groups).forEach((pdas) => {
          const filteredPdas = pdas.filter(
            (pda) =>
              state.filters.timeframes.has(pda.timeframe) && state.filters.types.has(pda.type)
          );

          if (filteredPdas.length === 0) return;

          const primitive = new PdaStackPrimitive(
            state.chart,
            state.candlestickSeries,
            filteredPdas,
            state.params
          );

          state.candlestickSeries.attachPrimitive(primitive);
          state.pdaPrimitives.push(primitive);
        });
      }

      // 更新统计
      function updateStats() {
        const visibleCount = state.pdas.filter(
          (pda) => state.filters.timeframes.has(pda.timeframe) && state.filters.types.has(pda.type)
        ).length;

        document.getElementById('visibleCount').textContent = visibleCount;
        document.getElementById('totalCount').textContent = state.pdas.length;
      }

      // 设置事件监听
      function setupEventListeners() {
        // 周期过滤
        ['d', '4h', '1h', '30m', '15m'].forEach((tf) => {
          document.getElementById(`show_${tf}`).addEventListener('change', (e) => {
            const tfUpper = tf.toUpperCase();
            if (e.target.checked) {
              state.filters.timeframes.add(tfUpper);
            } else {
              state.filters.timeframes.delete(tfUpper);
            }
            renderPdas();
            updateStats();
          });
        });

        // 类型过滤
        ['bsl', 'ssl', 'daily_high', 'midnight_high', 'swing_high'].forEach((type) => {
          document.getElementById(`show_${type}`).addEventListener('change', (e) => {
            if (e.target.checked) {
              state.filters.types.add(type);
            } else {
              state.filters.types.delete(type);
            }
            renderPdas();
            updateStats();
          });
        });

        // 参数调整
        document.getElementById('labelSpacing').addEventListener('input', (e) => {
          state.params.labelSpacing = parseInt(e.target.value);
          document.getElementById('labelSpacingValue').textContent = `${e.target.value}px`;
          renderPdas();
        });

        document.getElementById('fontSize').addEventListener('input', (e) => {
          state.params.fontSize = parseInt(e.target.value);
          document.getElementById('fontSizeValue').textContent = `${e.target.value}px`;
          renderPdas();
        });

        document.getElementById('verticalLine').addEventListener('input', (e) => {
          state.params.verticalLine = parseInt(e.target.value);
          document.getElementById('verticalLineValue').textContent = `${e.target.value}px`;
          renderPdas();
        });
      }

      // 启动
      initChart();
      setupEventListeners();
    </script>
  </body>
</html>
