<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDA 显示控制 Demo V2</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1e222d;
        color: #d1d4dc;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 20px;
        color: #fff;
      }

      .layout {
        display: flex;
        gap: 20px;
      }

      .chart-area {
        flex: 1;
        background: #131722;
        border-radius: 8px;
        padding: 20px;
        min-height: 600px;
        position: relative;
      }

      .control-panel {
        width: 320px;
        background: #131722;
        border-radius: 8px;
        padding: 20px;
        max-height: 600px;
        overflow-y: auto;
      }

      .control-section {
        margin-bottom: 24px;
      }

      .control-section h3 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .control-group {
        margin-bottom: 16px;
      }

      .control-group label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
        color: #b2b5be;
      }

      .checkbox-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .checkbox-item input[type='checkbox'] {
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      .checkbox-item label {
        margin: 0;
        cursor: pointer;
        font-size: 13px;
      }

      input[type='range'] {
        width: 100%;
        height: 4px;
        background: #2a2e39;
        border-radius: 2px;
        outline: none;
        -webkit-appearance: none;
      }

      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        background: #2962ff;
        border-radius: 50%;
        cursor: pointer;
      }

      input[type='range']::-moz-range-thumb {
        width: 14px;
        height: 14px;
        background: #2962ff;
        border-radius: 50%;
        cursor: pointer;
        border: none;
      }

      .range-value {
        display: inline-block;
        margin-left: 8px;
        font-size: 12px;
        color: #2962ff;
        font-weight: 600;
      }

      /* 多重 PDA 标签容器 */
      .pda-stack {
        position: absolute;
        display: flex;
        flex-direction: column-reverse;
        align-items: flex-start;
        pointer-events: none;
      }

      /* 单个标签 */
      .pda-label {
        background: transparent;
        padding: 1px 4px;
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        line-height: 1.4;
      }

      /* 不同类型的颜色 */
      .pda-label.bsl {
        color: #5b9cf6;
      }
      .pda-label.ssl {
        color: #ffb74d;
      }
      .pda-label.daily-high {
        color: #26a69a;
      }
      .pda-label.midnight-high {
        color: #26a69a;
      }
      .pda-label.manual {
        color: #ff9800;
      }
      .pda-label.swing-high {
        color: #26a69a;
      }

      /* 水平价格线 */
      .pda-line-h {
        position: absolute;
        height: 1px;
        background: rgba(255, 255, 255, 0.25);
        pointer-events: none;
      }

      /* 垂直连接线 */
      .pda-line-v {
        position: absolute;
        width: 1px;
        background: rgba(255, 255, 255, 0.25);
        pointer-events: none;
      }

      .demo-info {
        background: rgba(41, 98, 255, 0.1);
        border: 1px solid rgba(41, 98, 255, 0.3);
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 20px;
        font-size: 13px;
        line-height: 1.6;
      }

      .demo-info strong {
        color: #2962ff;
      }

      .stats {
        display: flex;
        gap: 16px;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #2a2e39;
      }

      .stat-item {
        flex: 1;
      }

      .stat-label {
        font-size: 11px;
        color: #787b86;
        margin-bottom: 4px;
      }

      .stat-value {
        font-size: 16px;
        font-weight: 600;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>PDA 显示控制 Demo V2</h1>

      <div class="demo-info">
        <strong>测试功能：</strong><br />
        1. 通过右侧面板控制不同周期 PDA 的显示/隐藏<br />
        2. 多重周期 PDA 竖排显示（标签在价格线上方，从下往上堆叠）<br />
        3. 调整标签间距、字体大小、竖线高度等参数
      </div>

      <div class="layout">
        <div class="chart-area" id="chartArea">
          <!-- 模拟图表区域，PDA 标记会动态插入这里 -->
        </div>

        <div class="control-panel">
          <div class="control-section">
            <h3>周期过滤</h3>
            <div class="checkbox-group">
              <div class="checkbox-item">
                <input type="checkbox" id="show_4h" checked />
                <label for="show_4h">4H</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="show_1h" checked />
                <label for="show_1h">1H</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="show_30m" checked />
                <label for="show_30m">30M</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="show_15m" checked />
                <label for="show_15m">15M</label>
              </div>
            </div>
          </div>

          <div class="control-section">
            <h3>PDA 类型</h3>
            <div class="checkbox-group">
              <div class="checkbox-item">
                <input type="checkbox" id="show_bsl" checked />
                <label for="show_bsl">BSL</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="show_ssl" checked />
                <label for="show_ssl">SSL</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="show_daily_high" checked />
                <label for="show_daily_high">Daily High</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="show_midnight_high" checked />
                <label for="show_midnight_high">ICT Midnight High</label>
              </div>
              <div class="checkbox-item">
                <input type="checkbox" id="show_manual" checked />
                <label for="show_manual">Manual PDA</label>
              </div>
            </div>
          </div>

          <div class="control-section">
            <h3>显示参数</h3>
            <div class="control-group">
              <label>标签间距: <span class="range-value" id="labelSpacingValue">2px</span></label>
              <input type="range" id="labelSpacing" min="0" max="8" value="2" step="1" />
            </div>
            <div class="control-group">
              <label>字体大小: <span class="range-value" id="fontSizeValue">11px</span></label>
              <input type="range" id="fontSize" min="9" max="16" value="11" step="1" />
            </div>
            <div class="control-group">
              <label>竖线高度: <span class="range-value" id="verticalLineValue">60px</span></label>
              <input type="range" id="verticalLine" min="30" max="120" value="60" step="10" />
            </div>
            <div class="control-group">
              <label
                >水平线长度: <span class="range-value" id="horizontalLineValue">80px</span></label
              >
              <input type="range" id="horizontalLine" min="40" max="200" value="80" step="10" />
            </div>
          </div>

          <div class="stats">
            <div class="stat-item">
              <div class="stat-label">可见 PDA</div>
              <div class="stat-value" id="visibleCount">0</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">总计</div>
              <div class="stat-value" id="totalCount">0</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // 模拟 PDA 数据（多重周期叠加在同一价格位置）
      const mockPdas = [
        {
          id: 'pda_001',
          type: 'midnight_high',
          timeframe: 'D',
          price: 18500.5,
          label: 'midnight high',
        },
        { id: 'pda_002', type: 'daily_high', timeframe: 'D', price: 18500.5, label: 'daily high' },
        { id: 'pda_003', type: 'swing_high', timeframe: '4H', price: 18500.5, label: 'SH - 4h' },
        { id: 'pda_004', type: 'swing_high', timeframe: '1H', price: 18500.5, label: 'SH - 1h' },
        { id: 'pda_005', type: 'manual', timeframe: '1H', price: 18500.5, label: 'Manual' },
        { id: 'pda_006', type: 'ssl', timeframe: '30M', price: 18450.25, label: 'SSL' },
        { id: 'pda_007', type: 'bsl', timeframe: '15M', price: 18550.75, label: 'BSL' },
      ];

      // 状态
      const state = {
        filters: {
          timeframes: new Set(['4H', '1H', '30M', '15M', 'D']),
          types: new Set(['bsl', 'ssl', 'daily_high', 'midnight_high', 'manual', 'swing_high']),
        },
        params: {
          labelSpacing: 2,
          fontSize: 11,
          verticalLine: 60,
          horizontalLine: 80,
        },
      };

      // 初始化
      function init() {
        setupEventListeners();
        renderPdas();
        updateStats();
      }

      // 设置事件监听
      function setupEventListeners() {
        // 周期过滤
        ['4h', '1h', '30m', '15m'].forEach((tf) => {
          document.getElementById(`show_${tf}`).addEventListener('change', (e) => {
            const tfUpper = tf.toUpperCase();
            if (e.target.checked) {
              state.filters.timeframes.add(tfUpper);
            } else {
              state.filters.timeframes.delete(tfUpper);
            }
            renderPdas();
            updateStats();
          });
        });

        // 类型过滤
        ['bsl', 'ssl', 'daily_high', 'midnight_high', 'manual'].forEach((type) => {
          document.getElementById(`show_${type}`).addEventListener('change', (e) => {
            if (e.target.checked) {
              state.filters.types.add(type);
            } else {
              state.filters.types.delete(type);
            }
            renderPdas();
            updateStats();
          });
        });

        // 参数调整
        document.getElementById('labelSpacing').addEventListener('input', (e) => {
          state.params.labelSpacing = parseInt(e.target.value);
          document.getElementById('labelSpacingValue').textContent = `${e.target.value}px`;
          renderPdas();
        });

        document.getElementById('fontSize').addEventListener('input', (e) => {
          state.params.fontSize = parseInt(e.target.value);
          document.getElementById('fontSizeValue').textContent = `${e.target.value}px`;
          renderPdas();
        });

        document.getElementById('verticalLine').addEventListener('input', (e) => {
          state.params.verticalLine = parseInt(e.target.value);
          document.getElementById('verticalLineValue').textContent = `${e.target.value}px`;
          renderPdas();
        });

        document.getElementById('horizontalLine').addEventListener('input', (e) => {
          state.params.horizontalLine = parseInt(e.target.value);
          document.getElementById('horizontalLineValue').textContent = `${e.target.value}px`;
          renderPdas();
        });
      }

      // 渲染 PDA
      function renderPdas() {
        const chartArea = document.getElementById('chartArea');
        chartArea.innerHTML = '';

        // 按价格分组
        const priceGroups = {};
        mockPdas.forEach((pda) => {
          if (!priceGroups[pda.price]) {
            priceGroups[pda.price] = [];
          }
          priceGroups[pda.price].push(pda);
        });

        // 渲染每个价格位置的 PDA 组
        Object.entries(priceGroups).forEach(([price, pdas], index) => {
          const filteredPdas = pdas.filter(
            (pda) =>
              state.filters.timeframes.has(pda.timeframe) && state.filters.types.has(pda.type)
          );

          if (filteredPdas.length === 0) return;

          const baseX = 100;
          const baseY = 100 + index * 150;

          // 水平价格线
          const lineH = document.createElement('div');
          lineH.className = 'pda-line-h';
          lineH.style.left = `${baseX}px`;
          lineH.style.top = `${baseY}px`;
          lineH.style.width = `${state.params.horizontalLine}px`;
          chartArea.appendChild(lineH);

          // 垂直连接线
          const lineV = document.createElement('div');
          lineV.className = 'pda-line-v';
          lineV.style.left = `${baseX}px`;
          lineV.style.top = `${baseY - state.params.verticalLine}px`;
          lineV.style.height = `${state.params.verticalLine}px`;
          chartArea.appendChild(lineV);

          // 标签容器（从下往上堆叠）
          const stack = document.createElement('div');
          stack.className = 'pda-stack';
          stack.style.left = `${baseX + 4}px`;
          stack.style.bottom = `${chartArea.clientHeight - baseY + state.params.verticalLine + 4}px`;

          filteredPdas.forEach((pda) => {
            const label = document.createElement('div');
            label.className = `pda-label ${pda.type.replace('_', '-')}`;
            label.textContent = pda.label;
            label.style.fontSize = `${state.params.fontSize}px`;
            label.style.marginBottom = `${state.params.labelSpacing}px`;
            stack.appendChild(label);
          });

          chartArea.appendChild(stack);
        });
      }

      // 更新统计
      function updateStats() {
        const visibleCount = mockPdas.filter(
          (pda) => state.filters.timeframes.has(pda.timeframe) && state.filters.types.has(pda.type)
        ).length;

        document.getElementById('visibleCount').textContent = visibleCount;
        document.getElementById('totalCount').textContent = mockPdas.length;
      }

      // 启动
      init();
    </script>
  </body>
</html>
