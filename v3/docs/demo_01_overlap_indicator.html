<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重叠 PDA 视觉提示方案对比</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #0a0e27;
      color: #e0e3eb;
    }
    #info {
      margin-bottom: 20px;
      padding: 15px;
      background: #1e222d;
      border-radius: 4px;
      font-size: 14px;
    }
    .controls {
      margin-bottom: 20px;
      padding: 15px;
      background: #1e222d;
    border-radius: 4px;
    }
    .controls label {
      margin-right: 20px;
    font-size: 14px;
      display: block;
      margin-bottom: 10px;
    }
    .controls input[type="radio"] {
      margin-right: 5px;
    }
    #chart {
      width: 100%;
      height: 600px;
      background: #131722;
    }
    .log {
      margin-top: 20px;
      padding: 15px;
      background: #1e222d;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    .log-item {
      padding: 4px 0;
      border-bottom: 1px solid #2a2e39;
    }
    .success { color: #26a69a; }
    .warn { color: #ffb74d; }
    .info { color: #5b9cf6; }
  </style>
</head>
<body>
  <div id="info">
    <h2>重叠 PDA 视觉提示方案对比</h2>
    <p><strong>问题：</strong>肉眼难以观察出重叠的 PDA，需要视觉提示。</p>
    <p><strong>测试场景：</strong></p>
    <ul>
      <li>左侧：3 个 BSL 完全重叠</li>
      <li>中间：2 个 FVG 完全重叠</li>
      <li>右侧：BSL 和 FVG 部分重叠</li>
    </ul>
  </div>

  <div class="controls">
    <strong>选择视觉提示方案：</strong>
    <label><input type="radio" name="indicator" value="none"> 方案 0: 无提示（当前）</label>
    <label><input type="radio" name="indicator" value="badge" checked> 方案 1: 数字徽章（推荐）- 右上角显示 "×3"</label>
    <label><input type="radio" name="indicator" value="stack"> 方案 2: 堆叠效果 - 多层阴影模拟堆叠</label>
    <label><input type="radio" name="indicator" value="pulse"> 方案 3: 脉冲动画 - 重叠区域闪烁提示</label>
    <label><input type="radio" name="indicator" value="border"> 方案 4: 特殊边框 - 虚线边框 + 不同颜色</label>
    <label><input type="radio" name="indicator" value="icon"> 方案 5: 图标标记 - 显示 "⚠" 或 "📚" 图标</label>
  </div>

  <div id="chart"></div>

  <div class="log" id="log">
    <div class="log-item">切换不同方案观察效果...</div>
  </div>

  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    const log = document.getElementById('log');
    function addLog(message, type = 'info') {
      const item = document.createElement('div');
      item.className = `log-item ${type}`;
      item.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      log.insertBefore(item, log.firstChild);
    }

    // 创建图表
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
      width: document.getElementById('chart').clientWidth,
      height: 600,
      layout: {
        background: { color: '#131722' },
        textColor: '#e0e3eb',
      },
      grid: {
        vertLines: { color: '#1e222d' },
        horzLines: { color: '#1e222d' },
      },
    timeScale: {
     timeVisible: true,
        secondsVisible: false,
      },
    });

    const candlestickSeries = chart.addCandlestickSeries({
      upColor: '#26a69a',
      downColor: '#ef5350',
      borderVisible: false,
      wickUpColor: '#26a69a',
      wickDownColor: '#ef5350',
    });

    // 生成测试数据
    const data = [];
    let time = Math.floor(Date.now() / 1000) - 100 * 60;
    let price = 2300;
    for (let i = 0; i < 100; i++) {
      const change = (Math.random() - 0.5) * 10;
      const open = price;
      const close = price + change;
      const high = Math.max(open, close) + Math.random() * 5;
      const low = Math.min(open, close) - Math.random() * 5;
      data.push({ time, open, high, low, close });
      price = close;
      time += 60;
    }
    candlestickSeries.setData(data);
    chart.timeScale().fitContent();

    // PDA 数据结构（故意制造重叠）
    const pdaList = [
      // 场景 1: 3 个 BSL 完全重叠
      { id: 'bsl_1', type: 'bsl', anchorTime: data[30].time, price: data[30].high + 5, label: 'BSL-A', group: 'group1' },
   { id: 'bsl_2', type: 'bsl', anchorTime: data[30].time, price: data[30].high + 5, label: 'BSL-B', group: 'group1' },
      { id: 'bsl_3', type: 'bsl', anchorTime: data[30].time, price: data[30].high + 5, label: 'BSL-C', group: 'group1' },

      // 场景 2: 2 个 FVG 完全重叠
      { id: 'fvg_1', type: 'fvg', startTime: data[60].time, endTime: data[65].time, topPrice: data[60].high, bottomPrice: data[60].low - 5, label: 'FVG-X', group: 'group2' },
      { id: 'fvg_2', type: 'fvg', startTime: data[60].time, endTime: data[65].time, topPrice: data[60].high, bottomPrice: data[60].low - 5, label: 'FVG-Y', group: 'group2' },

      // 场景 3: BSL 和 FVG 部分重叠
      { id: 'bsl_m', type: 'bsl', anchorTime: data[80].time, price: data[80].high + 2, label: 'BSL-M', group: 'group3' },
      { id: 'fvg_m', type: 'fvg', startTime: data[78].time, endTime: data[83].time, topPrice: data[80].high + 3, bottomPrice: data[80].high + 1, label: 'FVG-M', group: 'group3' },
    ];

    // 计算每个 group 的重叠数量
    const groupCounts = {};
    pdaList.forEach(pda => {
      groupCounts[pda.group] = (groupCounts[pda.group] || 0) + 1;
    });

    let selectedPdaId = null;
    const primitives = [];

    // Liquidity Primitive
    const LIQUIDITY_DEFAULTS = {
      lineLength: 2,
      showLabel: true,
      lineWidth: 1,
      labelFont: '11px sans-serif',
      labelPadding: 4,
    };

    class LiquidityRenderer {
      constructor(p1, p2, lineColor, textColor, label, position, options, isSelected, indicator, overlapCount) {
        this._p1 = p1;
        this._p2 = p2;
        this._lineColor = lineColor;
        this._textColor = textColor;
        this._label = label;
        this._position = position;
        this._options = options;
        this._isSelected = isSelected;
        this._indicator = indicator;
        this._overlapCount = overlapCount;
      }

      draw(target) {
        target.useBitmapCoordinateSpace((scope) => {
          if (this._p1.x === null || this._p2.x === null || this._p1.y === null) return;

          const ctx = scope.context;
          const hRatio = scope.horizontalPixelRatio;
          const vRatio = scope.verticalPixelRatio;

          const x1 = this._p1.x * hRatio;
          const x2 = this._p2.x * hRatio;
          const y = this._p1.y * vRatio;

          // 方案 2: 堆叠效果（多层阴影）
          if (this._indicator === 'stack' && this._overlapCount > 1) {
      for (let i = 0; i < Math.min(this._overlapCount, 3); i++) {
              const offset = i * 2 * vRatio;
              ctx.strokeStyle = this._lineColor;
              ctx.globalAlpha = 0.3 + (i * 0.2);
              ctx.lineWidth = this._options.lineWidth * Math.min(hRatio, vRatio);
              ctx.beginPath();
              ctx.moveTo(x1, y + offset);
         ctx.lineTo(x2, y + offset);
              ctx.stroke();
            }
            ctx.globalAlpha = 1.0;
          }

          // 方案 4: 特殊边框（虚线）
          if (this._indicator === 'border' && this._overlapCount > 1) {
            ctx.strokeStyle = '#ffeb3b';
            ctx.lineWidth = 2 * Math.min(hRatio, vRatio);
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(x1 - 5 * hRatio, y - 10 * vRatio, (x2 - x1) + 10 * hRatio, 20 * vRatio);
            ctx.setLineDash([]);
          }

        // 主线段
          ctx.strokeStyle = this._isSelected ? '#ffeb3b' : this._lineColor;
          ctx.lineWidth = (this._isSelected ? 2 : this._options.lineWidth) * Math.min(hRatio, vRatio);
        ctx.beginPath();
          ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
          ctx.stroke();

          // 文字标签
          if (this._options.showLabel && this._label) {
            ctx.fillStyle = this._isSelected ? '#ffeb3b' : this._textColor;
            ctx.font = this._options.labelFont;
          const padding = this._options.labelPadding * vRatio;
            ctx.textAlign = 'right';
            if (this._position === 'above') {
              ctx.textBaseline = 'bottom';
         ctx.fillText(this._label, x2, y - padding);
            } else {
         ctx.textBaseline = 'top';
          ctx.fillText(this._label, x2, y + padding);
         }
          }

          // 方案 1: 数字徽章
          if (this._indicator === 'badge' && this._overlapCount > 1) {
            const badgeX = x2 + 5 * hRatio;
            const badgeY = y - 15 * vRatio;
            const badgeText = `×${this._overlapCount}`;

            // 背景圆
            ctx.fillStyle = '#ef5350';
            ctx.beginPath();
            ctx.arc(badgeX, badgeY, 10 * Math.min(hRatio, vRatio), 0, 2 * Math.PI);
            ctx.fill();

            // 文字
         ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${9 * Math.min(hRatio, vRatio)}px sans-serif`;
            ctx.textAlign = 'center';
         ctx.textBaseline = 'middle';
            ctx.fillText(badgeText, badgeX, badgeY);
        }

       // 方案 5: 图标标记
          if (this._indicator === 'icon' && this._overlapCount > 1) {
            ctx.fillStyle = '#ffeb3b';
            ctx.font = `${14 * Math.min(hRatio, vRatio)}px sans-serif`;
        ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText('⚠', x2 + 5 * hRatio, y);
          }

          // 方案 3: 脉冲动画（简化版，使用透明度变化）
          if (this._indicator === 'pulse' && this._overlapCount > 1) {
      const pulseAlpha = 0.3 + Math.abs(Math.sin(Date.now() / 500)) * 0.4;
         ctx.fillStyle = `rgba(255, 235, 59, ${pulseAlpha})`;
            ctx.fillRect(x1 - 3 * hRatio, y - 8 * vRatio, (x2 - x1) + 6 * hRatio, 16 * vRatio);
          }
      });
      }
    }

    class LiquidityView {
      constructor(source) {
        this._source = source;
        this._p1 = { x: null, y: null };
        this._p2 = { x: null, y: null };
      }

   update() {
        const series = this._source._series;
        const chart = this._source._chart;
     const timeScale = chart.timeScale();

        const y = series.priceToCoordinate(this._source._price);
        const anchorCoord = timeScale.timeToCoordinate(this._source._anchorTime);
     let rightX = null;
        if (anchorCoord !== null) {
        const logical = timeScale.coordinateToLogical(anchorCoord);
          if (logical !== null) {
            rightX = timeScale.logicalToCoordinate(logical + this._source._options.lineLength);
          }
        }

        this._p1 = { x: anchorCoord, y };
        this._p2 = { x: rightX, y };
      }

      renderer() {
        return new LiquidityRenderer(
      this._p1,
          this._p2,
          this._source._lineColor,
          this._source._textColor,
        this._source._label,
          this._source._position,
        this._source._options,
          this._source._isSelected,
          this._source._indicator,
          this._source._overlapCount
        );
      }
    }

    class LiquidityPrimitive {
      constructor(chart, series, anchorTime, price, lineColor, textColor, label, position, options, isSelected, indicator, overlapCount) {
        this._chart = chart;
        this._series = series;
   this._anchorTime = anchorTime;
        this._price = price;
        this._lineColor = lineColor;
        this._textColor = textColor;
        this._label = label;
        this._position = position;
        this._options = { ...LIQUIDITY_DEFAULTS, ...options };
     this._isSelected = isSelected;
     this._indicator = indicator;
        this._overlapCount = overlapCount;
        this._view = new LiquidityView(this);
      }

      updateAllViews() {
    this._view.update();
      }

      paneViews() {
        return [this._view];
      }
    }

    // FVG Primitive（简化，类似逻辑）
    class FvgRenderer {
      constructor(p1, p2, fillColor, isSelected, indicator, overlapCount) {
        this._p1 = p1;
        this._p2 = p2;
        this._fillColor = fillColor;
        this._isSelected = isSelected;
        this._indicator = indicator;
        this._overlapCount = overlapCount;
      }

      draw(target) {
        target.useBitmapCoordinateSpace((scope) => {
          if (this._p1.x === null || this._p1.y === null || this._p2.x === null || this._p2.y === null) return;

          const ctx = scope.context;
        const x = Math.min(this._p1.x, this._p2.x) * scope.horizontalPixelRatio;
          const y = Math.min(this._p1.y, this._p2.y) * scope.verticalPixelRatio;
          const width = Math.abs(this._p2.x - this._p1.x) * scope.horizontalPixelRatio;
          const height = Math.abs(this._p2.y - this._p1.y) * scope.verticalPixelRatio;

          // 方案 2: 堆叠效果
          if (this._indicator === 'stack' && this._overlapCount > 1) {
          for (let i = 0; i < Math.min(this._overlapCount, 3); i++) {
              const offset = i * 3 * scope.horizontalPixelRatio;
              ctx.fillStyle = this._fillColor;
           ctx.globalAlpha = 0.2 + (i * 0.15);
            ctx.fillRect(x + offset, y + offset, width, height);
            }
            ctx.globalAlpha = 1.0;
          }

          // 方案 4: 特殊边框
          if (this._indicator === 'border' && this._overlapCount > 1) {
            ctx.strokeStyle = '#ffeb3b';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 4]);
            ctx.strokeRect(x, y, width, height);
            ctx.setLineDash([]);
          }

          // 主矩形
          ctx.fillStyle = this._isSelected ? 'rgba(255, 235, 59, 0.3)' : this._fillColor;
          ctx.fillRect(x, y, width, height);

       // 中间虚线
          const midY = y + height / 2;
          ctx.strokeStyle = this._isSelected ? '#ffeb3b' : this._fillColor.replace('33', '');
          ctx.lineWidth = this._isSelected ? 2 : 1;
          ctx.setLineDash([5, 5]);
          ctx.beginPath();
          ctx.moveTo(x, midY);
          ctx.lineTo(x + width, midY);
          ctx.stroke();
          ctx.setLineDash([]);

          if (this._isSelected) {
          ctx.strokeStyle = '#ffeb3b';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, width, height);
          }

          // 方案 1: 数字徽章
          if (this._indicator === 'badge' && this._overlapCount > 1) {
          const badgeX = x + width - 15 * scope.horizontalPixelRatio;
            const badgeY = y + 15 * scope.verticalPixelRatio;
            const badgeText = `×${this._overlapCount}`;

         ctx.fillStyle = '#ef5350';
       ctx.beginPath();
            ctx.arc(badgeX, badgeY, 10 * Math.min(scope.horizontalPixelRatio, scope.verticalPixelRatio), 0, 2 * Math.PI);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${9 * Math.min(scope.horizontalPixelRatio, scope.verticalPixelRatio)}px sans-serif`;
          ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
          ctx.fillText(badgeText, badgeX, badgeY);
          }

          // 方案 5: 图标标记
          if (this._indicator === 'icon' && this._overlapCount > 1) {
            ctx.fillStyle = '#ffeb3b';
            ctx.font = `${16 * Math.min(scope.horizontalPixelRatio, scope.verticalPixelRatio)}px sans-serif`;
         ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('📚', x + width / 2, y + 5 * scope.verticalPixelRatio);
          }

          // 方案 3: 脉冲动画
      if (this._indicator === 'pulse' && this._overlapCount > 1) {
            const pulseAlpha = 0.2 + Math.abs(Math.sin(Date.now() / 500)) * 0.3;
            ctx.fillStyle = `rgba(255, 235, 59, ${pulseAlpha})`;
            ctx.fillRect(x, y, width, height);
          }
        });
      }
    }

    class FvgView {
      constructor(source) {
        this._source = source;
        this._p1 = { x: null, y: null };
        this._p2 = { x: null, y: null };
      }

      update() {
        const series = this._source._series;
        const chart = this._source._chart;
        const y1 = series.priceToCoordinate(this._source._topPrice);
        const y2 = series.priceToCoordinate(this._source._bottomPrice);
        const timeScale = chart.timeScale();
        const x1 = timeScale.timeToCoordinate(this._source._startTime);
        const x2 = timeScale.timeToCoordinate(this._source._endTime);
        this._p1 = { x: x1, y: y1 };
        this._p2 = { x: x2, y: y2 };
      }

    renderer() {
      return new FvgRenderer(this._p1, this._p2, this._source._fillColor, this._source._isSelected, this._source._indicator, this._source._overlapCount);
      }
    }

    class FvgPrimitive {
      constructor(chart, series, startTime, endTime, topPrice, bottomPrice, color, isSelected, indicator, overlapCount) {
        this._chart = chart;
    this._series = series;
        this._startTime = startTime;
        this._endTime = endTime;
        this._topPrice = topPrice;
        this._bottomPrice = bottomPrice;
        this._fillColor = color;
        this._isSelected = isSelected;
        this._indicator = indicator;
        this._overlapCount = overlapCount;
        this._view = new FvgView(this);
      }

      updateAllViews() {
     this._view.update();
      }

      paneViews() {
        return [this._view];
      }
    }

    // 渲染所有 PDA
    function renderPdas() {
      primitives.forEach(p => candlestickSeries.detachPrimitive(p));
      primitives.length = 0;

      const indicator = document.querySelector('input[name="indicator"]:checked').value;

      pdaList.forEach(pda => {
        const isSelected = pda.id === selectedPdaId;
        const overlapCount = groupCounts[pda.group];
        let primitive;

        if (pda.type === 'bsl') {
          primitive = new LiquidityPrimitive(
            chart, candlestickSeries, pda.anchorTime, pda.price,
            '#5b9cf6', '#26a69a', pda.label, 'above', {},
            isSelected, indicator, overlapCount
          );
        } else if (pda.type === 'fvg') {
          primitive = new FvgPrimitive(
            chart, candlestickSeries, pda.startTime, pda.endTime,
          pda.topPrice, pda.bottomPrice, '#ab47bc33',
            isSelected, indicator, overlapCount
          );
        }

        if (primitive) {
        candlestickSeries.attachPrimitive(primitive);
          primitives.push(primitive);
        }
      });
    }

    renderPdas();

    // 监听方案切换
    document.querySelectorAll('input[name="indicator"]').forEach(radio => {
      radio.addEventListener('change', () => {
        renderPdas();
        addLog(`切换到: ${radio.parentElement.textContent.trim()}`, 'info');
      });
    });

    // 点击选择（简化版）
    chart.subscribeClick((param) => {
      if (!param.point) return;
      // 简化：点击任意位置切换选中第一个 PDA
      const index = pdaList.findIndex(p => p.id === selectedPdaId);
      selectedPdaId = pdaList[(index + 1) % pdaList.length].id;
      renderPdas();
    });

    // 方案 3 需要动画循环
    setInterval(() => {
      const indicator = document.querySelector('input[name="indicator"]:checked').value;
      if (indicator === 'pulse') {
        renderPdas();
      }
    }, 50);

    addLog('图表加载完成，切换不同方案观察效果', 'success');
  </script>
</body>
</html>
