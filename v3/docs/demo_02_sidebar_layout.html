<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>预研2: 侧边栏布局（v2）</title>
    <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
      :root {
        /* 1080p ≈ 540px（原 360 的 1.5x），2K ≈ 716px，4K 封顶 720px */
        --sidebar-width: clamp(400px, 28vw, 720px);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: sans-serif;
        background: #0a0e27;
        color: #e0e3eb;
        overflow: hidden;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 16px;
        background: #1e222d;
        border-bottom: 1px solid #2a2e39;
        flex-shrink: 0;
      }

      .toolbar button {
        padding: 8px 16px;
        background: #2962ff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }

      .toolbar button:hover {
        background: #1e53e5;
      }

      .main-content {
        display: flex;
        flex: 1;
        overflow: hidden;
        position: relative;
      }

      #chart {
        flex: 1;
        min-width: 0;
        background: #131722;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #b0b5c0;
        font-size: 14px;
      }

      /* 关键：用 margin-right 折叠而非 transform，让 flex 布局真正重算 */
      .sidebar {
        width: var(--sidebar-width);
        background: #1e222d;
        border-left: 1px solid #2a2e39;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        margin-right: 0;
        transition: margin-right 0.3s ease;
      }

      .sidebar.collapsed {
        margin-right: calc(-1 * var(--sidebar-width));
      }

      .sidebar-header {
        padding: 16px;
        border-bottom: 1px solid #2a2e39;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .sidebar-header h3 {
        font-size: 16px;
        font-weight: 600;
        color: #e0e3eb;
      }

      .sidebar-header button {
        padding: 6px 12px;
        background: transparent;
        color: #b0b5c0;
        border: 1px solid #2a2e39;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }

      .sidebar-header button:hover {
        background: #2a2e39;
        color: #e0e3eb;
      }

      .sidebar-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }

      .pda-group {
        margin-bottom: 20px;
      }

      .pda-group-title {
        font-size: 13px;
        font-weight: 600;
        color: #c0c5d0;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .pda-item {
        padding: 12px;
        background: #131722;
        border: 1px solid #2a2e39;
        border-radius: 4px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .pda-item:hover {
        background: #1a1e2e;
        border-color: #2962ff;
      }

      .pda-item.selected {
        background: #1a1e2e;
        border-color: #2962ff;
        box-shadow: 0 0 0 1px #2962ff;
      }

      .pda-item-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      .pda-item-label {
        font-size: 14px;
        font-weight: 600;
        color: #e0e3eb;
      }

      .pda-item-type {
        font-size: 11px;
        padding: 2px 6px;
        background: #2a2e39;
        color: #c0c5d0;
        border-radius: 3px;
        text-transform: uppercase;
      }

      .pda-item-info {
        font-size: 12px;
        color: #b0b5c0;
        line-height: 1.5;
      }

      .pda-detail {
        padding: 16px;
        background: #131722;
        border: 1px solid #2a2e39;
        border-radius: 4px;
        margin-top: 16px;
      }
      .pda-detail-title {
        font-size: 14px;
        font-weight: 600;
        color: #e0e3eb;
        margin-bottom: 12px;
      }

      .pda-detail-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0;
        border-bottom: 1px solid #2a2e39;
        font-size: 12px;
      }

      .pda-detail-row:last-child {
        border-bottom: none;
      }

      .pda-detail-label {
        color: #b0b5c0;
        flex-shrink: 0;
      }

      .pda-detail-value {
        color: #e0e3eb;
        font-weight: 500;
        text-align: right;
        word-break: break-all;
      }

      /* 折叠按钮挂在 main-content 上，right 跟随 sidebar 左沿 */
      .toggle-sidebar-btn {
        position: absolute;
        top: 16px;
        right: calc(var(--sidebar-width) + 16px);
        padding: 8px 12px;
        background: #1e222d;
        color: #e0e3eb;
        border: 1px solid #2a2e39;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        z-index: 10;
        transition: right 0.3s ease;
      }

      .main-content.sidebar-collapsed .toggle-sidebar-btn {
        right: 16px;
      }

      .toggle-sidebar-btn:hover {
        background: #2a2e39;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="toolbar">
        <span style="font-size: 14px; font-weight: 600">预研2: 侧边栏布局（v2）</span>
        <button onclick="addMockPda()">添加测试 PDA</button>
        <button onclick="clearPdas()">清空列表</button>
        <span id="widthIndicator" style="margin-left: auto; font-size: 12px; color: #b0b5c0">
          侧边栏宽度：--
        </span>
      </div>

      <div class="main-content" id="mainContent">
        <div id="chart"></div>

        <button class="toggle-sidebar-btn" onclick="toggleSidebar()">
          <span id="toggleText">折叠侧边栏 →</span>
        </button>

        <div class="sidebar" id="sidebar">
          <div class="sidebar-header">
            <h3>PDA 工作台</h3>
            <button onclick="toggleSidebar()">折叠</button>
          </div>

          <div class="sidebar-body">
            <div id="pdaList"></div>

            <div class="pda-detail" id="pdaDetail" style="display: none">
              <div class="pda-detail-title">PDA 详情</div>
              <div id="pdaDetailRows"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const initialPdas = [
        {
          id: 'bsl_1',
          type: 'bsl',
          label: 'BSL-1',
          time: '2012-01-09 13:00',
          price: 2305.5,
          timeframe: '1H',
          source: 'auto_scan',
          pdaId: 'pda_20120109_1H_bsl_001',
        },
        {
          id: 'bsl_2',
          type: 'bsl',
          label: 'BSL-2',
          time: '2012-01-09 14:30',
          price: 2310.25,
          timeframe: '1H',
          source: 'auto_scan',
          pdaId: 'pda_20120109_1H_bsl_002',
        },
        {
          id: 'fvg_1',
          type: 'fvg',
          label: 'FVG-1',
          time: '2012-01-09 12:00',
          priceHigh: 2300.0,
          priceLow: 2295.0,
          direction: 'bullish',
          timeframe: '1H',
          source: 'auto_scan',
          pdaId: 'pda_20120109_1H_fvg_001',
          note: '测试笔记：bullish 方向的 FVG 示例',
        },
      ];

      const pdas = [...initialPdas];
      let selectedPdaId = null;
      let pdaCount = pdas.length;

      const typeLabels = {
        bsl: 'BSL (Buy Side Liquidity)',
        ssl: 'SSL (Sell Side Liquidity)',
        fvg: 'FVG (Fair Value Gap)',
      };

      /* 详情字段按 type 分组 — 每种 PDA 显示自己的字段 */
      const detailFieldsByType = {
        bsl: [
          ['PDA ID', 'pdaId'],
          ['类型', (d) => d.type.toUpperCase()],
          ['时间周期', 'timeframe'],
          ['锚点时间', 'time'],
          ['价格', (d) => d.price?.toFixed(2)],
          ['来源', 'source'],
          ['备注', 'note'],
        ],
        ssl: [
          ['PDA ID', 'pdaId'],
          ['类型', (d) => d.type.toUpperCase()],
          ['时间周期', 'timeframe'],
          ['锚点时间', 'time'],
          ['价格', (d) => d.price?.toFixed(2)],
          ['来源', 'source'],
          ['备注', 'note'],
        ],
        fvg: [
          ['PDA ID', 'pdaId'],
          ['类型', (d) => d.type.toUpperCase()],
          ['时间周期', 'timeframe'],
          ['起始时间', 'time'],
          ['价格高', (d) => d.priceHigh?.toFixed(2)],
          ['价格低', (d) => d.priceLow?.toFixed(2)],
          ['方向', 'direction'],
          ['来源', 'source'],
          ['备注', 'note'],
        ],
      };

      function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const main = document.getElementById('mainContent');
        const toggleText = document.getElementById('toggleText');

        sidebar.classList.toggle('collapsed');
        main.classList.toggle('sidebar-collapsed');

        toggleText.textContent = sidebar.classList.contains('collapsed')
          ? '← 展开侧边栏'
          : '折叠侧边栏 →';

        setTimeout(updateWidthIndicator, 320);
      }

      function selectPda(pdaId) {
        selectedPdaId = pdaId;
        document.querySelectorAll('.pda-item').forEach((item) => {
          item.classList.toggle('selected', item.dataset.pdaId === pdaId);
        });
        const data = pdas.find((p) => p.id === pdaId);
        if (data) renderDetail(data);
      }

      function renderDetail(data) {
        const fields = detailFieldsByType[data.type] || [];
        const rows = fields
          .map(([label, keyOrFn]) => {
            const value = typeof keyOrFn === 'function' ? keyOrFn(data) : data[keyOrFn];
            if (value === undefined || value === null || value === '') return '';
            return `<div class="pda-detail-row"><span class="pda-detail-label">${label}:</span><span class="pda-detail-value">${value}</span></div>`;
          })
          .filter(Boolean)
          .join('');
        document.getElementById('pdaDetailRows').innerHTML = rows;
        document.getElementById('pdaDetail').style.display = 'block';
      }

      function renderList() {
        const container = document.getElementById('pdaList');
        const grouped = {};
        pdas.forEach((p) => {
          (grouped[p.type] ||= []).push(p);
        });

        container.innerHTML = Object.entries(grouped)
          .map(([type, items]) => {
            const title = typeLabels[type] || type.toUpperCase();
            const info = (p) =>
              p.type === 'fvg'
                ? `时间: ${p.time}<br>区间: ${p.priceLow.toFixed(2)} - ${p.priceHigh.toFixed(2)}`
                : `时间: ${p.time}<br>价格: ${p.price.toFixed(2)}`;
            return `
<div class="pda-group">
<div class="pda-group-title">${title}</div>
${items
  .map(
    (p) => `
<div class="pda-item${p.id === selectedPdaId ? ' selected' : ''}" data-pda-id="${p.id}" onclick="selectPda('${p.id}')">
<div class="pda-item-header">
<span class="pda-item-label">${p.label}</span>
<span class="pda-item-type">${p.type}</span>
</div>
<div class="pda-item-info">${info(p)}</div>
</div>
`
  )
  .join('')}
</div>
`;
          })
          .join('');
      }

      function addMockPda() {
        pdaCount++;
        const types = ['bsl', 'ssl', 'fvg'];
        const type = types[Math.floor(Math.random() * types.length)];
        const hour = String(10 + (pdaCount % 14)).padStart(2, '0');
        const base = {
          id: `${type}_${pdaCount}`,
          type,
          label: `${type.toUpperCase()}-${pdaCount}`,
          time: `2012-01-09 ${hour}:00`,
          timeframe: '1H',
          source: 'auto_scan',
          pdaId: `pda_20120109_1H_${type}_${String(pdaCount).padStart(3, '0')}`,
        };
        if (type === 'fvg') {
          base.priceLow = 2295 + Math.random() * 10;
          base.priceHigh = base.priceLow + 5 + Math.random() * 5;
          base.direction = Math.random() > 0.5 ? 'bullish' : 'bearish';
        } else {
          base.price = 2300 + Math.random() * 20;
        }
        pdas.push(base);
        renderList();
      }

      function clearPdas() {
        pdas.length = 0;
        selectedPdaId = null;
        renderList();
        document.getElementById('pdaDetail').style.display = 'none';
      }

      function updateWidthIndicator() {
        const sidebar = document.getElementById('sidebar');
        const indicator = document.getElementById('widthIndicator');
        const isCollapsed = sidebar.classList.contains('collapsed');
        const width = isCollapsed ? 0 : sidebar.offsetWidth;
        const vw = window.innerWidth;
        const pct = vw > 0 ? ((width / vw) * 100).toFixed(1) : '0';
        indicator.textContent = isCollapsed
          ? `侧边栏：已折叠（视口 ${vw}px）`
          : `侧边栏：${width}px (${pct}% × 视口 ${vw}px)`;
      }

      window.addEventListener('resize', updateWidthIndicator);
      renderList();
      updateWidthIndicator();

      // ========== 初始化图表 ==========
      const chartContainer = document.getElementById('chart');
      const chart = LightweightCharts.createChart(chartContainer, {
        layout: {
          background: { color: '#131722' },
          textColor: '#d1d4dc',
        },
        grid: {
          vertLines: { color: '#1e222d' },
          horzLines: { color: '#1e222d' },
        },
        timeScale: {
          borderColor: '#2a2e39',
          timeVisible: true,
          secondsVisible: false,
        },
        rightPriceScale: {
          borderColor: '#2a2e39',
        },
      });

      const candlestickSeries = chart.addCandlestickSeries({
        upColor: '#26a69a',
        downColor: '#ef5350',
        borderVisible: false,
        wickUpColor: '#26a69a',
        wickDownColor: '#ef5350',
      });

      // 生成模拟 K 线数据（2012-01-09 的 1H 数据）
      const mockKlines = [];
      let baseTime = new Date('2012-01-09T00:00').getTime() / 1000;
      let price = 2300;
      for (let i = 0; i < 24; i++) {
        const open = price;
        const change = (Math.random() - 0.5) * 10;
        const close = open + change;
        const high = Math.max(open, close) + Math.random() * 5;
        const low = Math.min(open, close) - Math.random() * 5;
        mockKlines.push({
          time: baseTime + i * 3600,
          open,
          high,
          low,
          close,
        });
        price = close;
      }
      candlestickSeries.setData(mockKlines);

      // 监听折叠/展开，触发图表 resize（保持当前时间/价格比例）
      const originalToggle = window.toggleSidebar;
      window.toggleSidebar = function () {
        originalToggle();
        setTimeout(() => {
          chart.applyOptions({
            width: chartContainer.clientWidth,
            height: chartContainer.clientHeight,
          });
        }, 320); // 等动画结束
      };

      // 监听窗口 resize
      const resizeObserver = new ResizeObserver(() => {
        chart.applyOptions({
          width: chartContainer.clientWidth,
          height: chartContainer.clientHeight,
        });
      });
      resizeObserver.observe(chartContainer);
    </script>
  </body>
</html>
