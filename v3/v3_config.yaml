# V3 Lightweight Charts 版本配置

# API 配置
api:
  host: "127.0.0.1"
  port: 8765
  base_url: "http://127.0.0.1:8765/api"

# 图表配置
chart:
  theme:
    background: "#131722"
    text_color: "#d1d4dc"
    grid_color: "#1e222d"
    border_color: "#2a2e39"
  
  candlestick:
    up_color: "#26a69a"
    down_color: "#ef5350"

# PDA 类型定义
pda_types:
  - id: bsl
    name: BSL
    color: "#26a69a"
  - id: ssl
    name: SSL
    color: "#ef5350"
  - id: fvg
    name: FVG
    color: "#ab47bc"
  - id: nwog
    name: NWOG
    color: "#ffa726"
  - id: ndog
    name: NDOG
    color: "#42a5f5"
