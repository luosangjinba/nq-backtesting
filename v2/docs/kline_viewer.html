<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K线查看器</title>
  <style>
    :root {
      --bg: #1e1b18;
      --panel: #2a2520;
      --line: #5a5045;
      --text: #f5f0e8;
      --text-dim: #c8bfb0;
      --muted: #a89a8a;
      --accent: #d4a056;
      --success: #7db87d;
      --danger: #c87070;
      --info: #6bafcf;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .chart-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .right-panel {
      width: 640px;
      min-width: 0;
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.2s ease;
    }
    .right-panel.collapsed {
      width: 0;
      border-left: none;
    }
    .right-panel-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .panel-title {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }
    .panel-title strong {
      color: var(--accent);
      font-size: 13px;
      line-height: 1.2;
    }
    .panel-title span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
    }
    .panel-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-link {
      color: var(--text-dim);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      background: var(--bg);
    }
    .panel-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .right-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
    .toggle-panel-btn {
      position: absolute;
      right: 640px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 48px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-right: none;
      border-radius: 4px 0 0 4px;
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      z-index: 10;
      transition: right 0.2s ease;
    }
    .toggle-panel-btn.collapsed {
      right: 0;
    }
    .toggle-panel-btn:hover {
      background: var(--panel-2, #363028);
    }
    .panel-section {
      margin-bottom: 8px;
    }
    .panel-section summary {
      cursor: pointer;
      padding: 8px 0;
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--accent);
      border-bottom: 1px solid var(--line);
      user-select: none;
      list-style: none;
    }
    .panel-section summary::-webkit-details-marker { display: none; }
    .list-fold-btn { margin-bottom: 4px; }
    .pda-list-fold { transition: max-height 0.25s ease, opacity 0.15s ease; overflow: hidden; }
    .pda-list-fold.folded { max-height: 0; opacity: 0; padding: 0; margin: 0; }
    .panel-section summary::before {
      content: '▾ ';
    }
    .panel-section[open] summary::before {
      content: '▾ ';
    }
    .panel-section:not([open]) summary::before {
      content: '▸ ';
    }
    .section-content {
      padding: 8px 0 4px;
    }
    .form-group {
      margin-bottom: 8px;
    }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .form-group select,
    .form-group input,
    .form-group textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 0.82rem;
      font-family: inherit;
    }
    .form-group input:disabled,
    .form-group select:disabled,
    .form-group textarea:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: var(--panel);
      color: var(--muted);
    }
    .form-group select:focus,
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .form-group textarea {
      resize: vertical;
    }
    .btn-sm {
      background: var(--panel-2, #363028);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-sm:hover {
      background: var(--accent);
      color: var(--bg);
    }
    .btn-sm:disabled {
      opacity: 0.35;
      cursor: default;
      color: var(--muted);
    }
    .btn-sm:disabled:hover {
      background: var(--panel-2, #363028);
      color: var(--muted);
    }
    .btn-danger {
      border-color: #8b3a3a;
      color: #e07070;
    }
    .btn-danger:hover {
      background: #8b3a3a;
      color: #fff;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-row.wrap {
      flex-wrap: wrap;
    }
    .btn-sm.primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 700;
    }
    .btn-sm.ghost {
      background: transparent;
    }
    .btn-sm.ghost:hover {
      background: rgba(212, 160, 86, 0.15);
      color: var(--accent);
    }
    .panel-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .panel-tab {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }
    .panel-tab.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .field-row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .inline-field {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: end;
    }
    .scope-strip {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: end;
      margin-bottom: 8px;
    }
    .micro-stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 8px 0;
    }
    .micro-stat {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--bg);
      padding: 6px 8px;
      min-width: 0;
    }
    .micro-stat label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
      margin-bottom: 2px;
    }
    .micro-stat strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .panel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      border: 1px solid var(--line);
      background: var(--bg);
    }
    .panel-table th,
    .panel-table td {
      padding: 6px 7px;
      border-bottom: 1px solid rgba(90, 80, 69, 0.55);
      text-align: left;
      vertical-align: middle;
    }
    .panel-table th {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #241f1b;
      white-space: nowrap;
    }
    .panel-table tr:last-child td {
      border-bottom: none;
    }
    .panel-table tbody tr {
      cursor: pointer;
    }
    .panel-table tbody tr:hover {
      background: rgba(212, 160, 86, 0.08);
    }
    .panel-table tbody tr.selected {
      background: rgba(212, 160, 86, 0.16);
      outline: 1px solid rgba(212, 160, 86, 0.55);
      outline-offset: -1px;
    }
    .mono {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 18px;
      padding: 1px 7px;
      border-radius: 9px;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .pill.auto { background: rgba(107,175,207,0.15); color: var(--info); }
    .pill.manual { background: rgba(212,160,86,0.15); color: var(--accent); }
    .pill.bull { background: rgba(125,184,125,0.15); color: var(--success); }
    .pill.bear { background: rgba(200,112,112,0.15); color: var(--danger); }
    .empty-panel-row {
      height: 92px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }
    .match-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }
    .match-card {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--bg);
      padding: 7px 8px;
    }
    .match-card label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 2px;
    }
    .match-card strong {
      color: var(--text);
      font-size: 14px;
    }
    .panel-pagination {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .panel-pagination button {
      min-width: 28px;
      height: 26px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text-dim);
      cursor: pointer;
      font-size: 11px;
    }
    .panel-pagination button.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .panel-pagination button:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .panel-page-info {
      color: var(--muted);
      font-size: 11px;
      margin-left: auto;
    }
    .toast-container {
      position: fixed;
      top: 14px;
      right: 660px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      padding: 9px 14px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 650;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      max-width: 360px;
    }
    .toast-success { background: var(--success); color: #182718; }
    .toast-error { background: var(--danger); color: #2b1717; }
    .toast-info { background: var(--info); color: #16232a; }
    .toolbar {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }
    .toolbar-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toolbar-row:last-child {
      min-height: 22px;
    }
    .toolbar .tb-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .toolbar .tb-sep {
      width: 1px;
      height: 20px;
      background: var(--line);
      margin: 0 4px;
    }
    .toolbar label {
      color: var(--muted);
      font-size: 0.75rem;
      white-space: nowrap;
    }
    .toolbar input, .toolbar select {
      height: 26px;
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 0 8px;
      border-radius: 4px;
      font-size: 0.82rem;
      line-height: 26px;
      box-sizing: border-box;
    }
    .toolbar input { width: 130px; }
    .toolbar select { width: 58px; }
    .toolbar input[type="number"] { width: 50px; }
    .toolbar .locate-input { width: 110px; }
    .toolbar button {
      height: 26px;
      min-width: 26px;
      padding: 0 10px;
      border-radius: 4px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      line-height: 26px;
      box-sizing: border-box;
      border: 1px solid transparent;
    }
    .toolbar .btn-primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .toolbar .btn-primary:hover { opacity: 0.85; }
    .toolbar .btn-ghost {
      background: var(--bg);
      color: var(--text-dim);
      border: 1px solid var(--line);
      padding: 0 12px;
    }
    .toolbar .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .toolbar .btn-icon {
      background: var(--bg);
      color: var(--text-dim);
      border: 1px solid var(--line);
      padding: 0;
      width: 26px;
      font-size: 14px;
    }
    .toolbar .btn-icon:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .toolbar .btn-icon.anchor-active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .toolbar .tb-check {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.75rem;
      white-space: nowrap;
    }
    .toolbar .tb-check input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--accent);
    }
    .locate-flash {
      animation: locate-flash-anim 0.5s ease-in-out 3;
    }
    @keyframes locate-flash-anim {
      0%, 100% { border-color: var(--line); }
      50% { border-color: #e07070; background: rgba(200, 112, 112, 0.15); }
    }
    .toolbar .info {
      color: var(--text-dim);
      font-size: 0.8rem;
      margin-left: auto;
    }
    .toolbar .warn {
      color: var(--accent);
      font-size: 0.8rem;
      margin-left: 4px;
    }
    .toolbar .pda-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .pda-badge-bsl { background: rgba(125,184,125,0.15); color: var(--success); }
    .pda-badge-ssl { background: rgba(200,112,112,0.15); color: var(--danger); }
    .pda-badge-fvg { background: rgba(107,175,207,0.15); color: var(--info); }
    .pda-badge-ob  { background: rgba(212,160,86,0.15); color: var(--accent); }
    .pda-badge-eqh { background: rgba(180,140,255,0.15); color: #b48cff; }
    .pda-badge-eql { background: rgba(180,140,255,0.15); color: #b48cff; }
    #chartContainer {
      flex: 1;
      min-height: 0;
      background: #1e1b18;
    }
    .loading, .error {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 0.9rem;
    }
    .loading { color: var(--muted); }
    .error { color: var(--danger); }

    /* Replay control bar */
    .replay-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: var(--panel);
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
    }
    .replay-controls {
      display: flex;
      gap: 4px;
    }
    .replay-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text-dim);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .replay-btn:hover {
      background: var(--panel);
      border-color: var(--accent);
      color: var(--accent);
    }
    .replay-btn:active {
      transform: scale(0.95);
    }
    .replay-btn-primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .replay-btn-primary:hover {
      background: #e0b066;
      border-color: #e0b066;
    }
    .replay-progress {
      flex: 1;
      min-width: 200px;
    }
    .replay-slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--line);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    .replay-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      transition: all 0.15s;
    }
    .replay-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
    .replay-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .replay-slider::-moz-range-thumb:hover {
      transform: scale(1.2);
    }
    .replay-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 80px;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .replay-speed select {
      padding: 4px 8px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .replay-speed select:hover {
      border-color: var(--accent);
    }

    .ctx-menu {
      position: fixed;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 0;
      min-width: 160px;
      z-index: 100;
      display: none;
    }
    .ctx-menu-item {
      padding: 6px 14px;
      font-size: 0.85rem;
      color: var(--text-dim);
      cursor: pointer;
      position: relative;
    }
    .ctx-menu-item:hover {
      background: var(--bg);
      color: var(--text);
    }
    .ctx-menu-item.has-submenu::after {
      content: '▶';
      position: absolute;
      right: 10px;
      font-size: 0.7rem;
    }
    .ctx-submenu {
      position: absolute;
      left: 100%;
      top: -5px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 0;
      min-width: 140px;
      display: none;
      z-index: 101;
    }
    .ctx-menu-item.has-submenu:hover .ctx-submenu {
      display: block;
    }
    .ctx-submenu .ctx-menu-item {
      padding: 5px 14px;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <!-- Toggle button for right panel -->
  <button class="toggle-panel-btn" id="togglePanelBtn" title="折叠/展开面板">◀</button>
  <div class="toast-container" id="toastContainer"></div>

  <!-- Left: chart area -->
  <div class="chart-area">
    <div class="toolbar">
      <div class="toolbar-row">
        <div class="tb-group"><label>Start</label><input id="startTime" placeholder="201201091120"></div>
        <div class="tb-group"><label>End</label><input id="endTime" placeholder="2012-01-09 14:37"></div>
        <div class="tb-sep"></div>
        <div class="tb-group"><label>TF</label><select id="tfSelect"><option value="1">1m</option><option value="5">5m</option><option value="15">15m</option><option value="30">30m</option><option value="60" selected>1H</option><option value="240">4H</option><option value="1440">1D</option><option value="10080">1W</option></select></div>
        <div class="tb-sep"></div>
        <div class="tb-group"><label>定位</label><input id="locateTimeInput" class="locate-input" placeholder="201201091120"><button class="btn-icon" id="locateBtn" title="定位">&#x23F1;</button><button class="btn-icon" id="anchorBtn" title="锚定">&#x2693;</button></div>
        <div class="tb-sep"></div>
        <button class="btn-primary" id="loadBtn">加载</button>
        <button class="btn-ghost" id="resetBtn">Reset View</button>
      </div>
      <div class="toolbar-row">
        <label class="tb-check"><input type="checkbox" id="midnightLines" checked>午夜线</label>
        <label class="tb-check"><input type="checkbox" id="showSE">S/E</label>
        <span id="pdaBadge" style="display:none"></span>
        <span class="info" id="infoText"></span>
      </div>
    </div>
    <div id="chartContainer">
      <div class="loading">输入时间范围后点击「加载」</div>
    </div>

    <!-- Replay control bar -->
    <div class="replay-bar" id="replayBar" style="display: none;">
      <div class="replay-controls">
        <button class="replay-btn" id="replayFirst" title="跳到开头">⏮</button>
        <button class="replay-btn" id="replayBackward" title="后退 1 根">⏪</button>
        <button class="replay-btn replay-btn-primary" id="replayPlayPause" title="播放/暂停">▶</button>

  <script>
    const API_BASE = 'http://127.0.0.1:8765';
    const RIGHT_MARGIN_BARS = 10;
    const OVERLAY_GROUP = 'pdaOverlays';
    const MANUAL_TF_TO_CHART_TF = { '1M': '1', '5M': '5', '15M': '15', '30M': '30', '1H': '60', '4H': '240', D: '1440', '1W': '10080' };
    let chart = null;
    let lastCandleData = null;
    let currentPda = null;
    let manualPreviewPda = null;
    let lastMatchResult = null;
    let lastAppliedMerge = null;
    let midnightOverlayIds = [];
    let resizeObserver = null;
    let onDataReadyHandler = null;
    let yAxisWheelHandler = null;
    let obSelectionState = null; // { startIndex, startTime, startBar }

    // Replay state
    let replayState = {
      enabled: false,        // 是否启用回放模式
      fullData: null,        // 完整的 K 线数据
      currentIndex: 0,       // 当前显示到第几根 K 线（从 0 开始）
      totalBars: 0,          // 总共有多少根 K 线
      isPlaying: false,      // 是否正在播放
      speed: 1000,           // 播放速度（毫秒/根）
      intervalId: null,      // setInterval 的 ID
      viewportAnchor: null,  // 视口锚点：记录用户拖动后的视口位置
      yAxisCompressed: false, // Y轴是否已压缩（防止重复压缩）
      savedTimeRange: null   // 保存的时间范围（用于TF切换时保持视图）
    };

    // ── Register custom overlays (v9 API) ──
    function registerCustomOverlays() {
      klinecharts.registerOverlay({
        name: 'arrowMarker',
        totalStep: 2,
        needDefaultPointFigure: false,
        needDefaultXAxisFigure: false,
        needDefaultYAxisFigure: false,
        createPointFigures: ({ overlay, coordinates }) => {
          const { direction, color, label } = overlay.extendData || {};
          if (!coordinates.length) return [];
          const cx = coordinates[0].x;
          const cy = coordinates[0].y;
          const figs = [];
          const size = 7;
          let arrowCoords;
          if (direction === 'down') {
            arrowCoords = [
              { x: cx, y: cy + size },
              { x: cx - size * 0.6, y: cy - size * 0.3 },
              { x: cx + size * 0.6, y: cy - size * 0.3 },
            ];
          } else {
            arrowCoords = [
              { x: cx, y: cy - size },
              { x: cx - size * 0.6, y: cy + size * 0.3 },
              { x: cx + size * 0.6, y: cy + size * 0.3 },
            ];
          }
          figs.push({
            type: 'polygon',
            attrs: { coordinates: arrowCoords },
            styles: { style: 'fill', color: color || '#d4a056' },
            ignoreEvent: true,
          });
          if (label) {
            figs.push({
              type: 'text',
              attrs: {
                x: cx,
                y: direction === 'down' ? cy - size * 0.3 - 2 : cy + size * 0.3 + 12,
                text: label,
                align: 'center',
                baseline: direction === 'down' ? 'bottom' : 'top',
              },
              styles: { color: color || '#d4a056', size: 10, family: 'sans-serif', weight: 'bold' },
              ignoreEvent: true,
            });
          }
          return figs;
        },
      });

      klinecharts.registerOverlay({
        name: 'circleMarker',
        totalStep: 2,
        needDefaultPointFigure: false,
        needDefaultXAxisFigure: false,
        needDefaultYAxisFigure: false,
        createPointFigures: ({ overlay, coordinates }) => {
          const { color, label, above } = overlay.extendData || {};
          if (!coordinates.length) return [];
          const cx = coordinates[0].x;
          const cy = coordinates[0].y;
          const figs = [];
          figs.push({
            type: 'circle',
            attrs: { x: cx, y: cy, r: 5 },
            styles: { style: 'fill', color: color || '#b48cff' },
            ignoreEvent: true,
          });
          if (label) {
            figs.push({
              type: 'text',
              attrs: {
                x: cx,
                y: above ? cy - 14 : cy + 14,
                text: label,
                align: 'center',
                baseline: above ? 'bottom' : 'top',
              },
              styles: { color: color || '#b48cff', size: 10, family: 'sans-serif', weight: 'bold' },
              ignoreEvent: true,
            });
          }
          return figs;
        },
      });

      klinecharts.registerOverlay({
        name: 'fvgZone',
        totalStep: 3,
        needDefaultPointFigure: false,
        needDefaultXAxisFigure: false,
        needDefaultYAxisFigure: false,
        createPointFigures: ({ overlay, coordinates }) => {
          const { timeframe, direction } = overlay.extendData || {};
          if (coordinates.length < 2) return [];
          const figs = [];
          const x1 = Math.min(coordinates[0].x, coordinates[1].x);
          const x2 = Math.max(coordinates[0].x, coordinates[1].x);
          const y1 = Math.min(coordinates[0].y, coordinates[1].y);
          const y2 = Math.max(coordinates[0].y, coordinates[1].y);
          const w = Math.max(x2 - x1, 6);
          const h = y2 - y1;
          const isBullish = direction === 'bullish';
          const fillColor = isBullish ? 'rgba(200, 170, 50, 0.3)' : 'rgba(180, 60, 60, 0.3)';
          const borderColor = isBullish ? '#c8aa32' : '#b43c3c';
          const textColor = '#f5f0e8';
          figs.push({
            type: 'rect',
            attrs: { x: x1, y: y1, width: w, height: h },
            styles: {
              style: 'stroke_fill',
              color: fillColor,
              borderColor: borderColor,
              borderSize: 1,
              borderStyle: 'solid',
            },
            ignoreEvent: true,
          });
          if (timeframe) {
            figs.push({
              type: 'text',
              attrs: { x: x1 + w / 2, y: y1 + h / 2, text: timeframe, align: 'center', baseline: 'middle' },
              styles: { color: textColor, size: 11, family: 'sans-serif', weight: 'bold' },
              ignoreEvent: true,
            });
          }
          return figs;
        },
      });

      klinecharts.registerOverlay({
        name: 'obZone',
        totalStep: 3,
        needDefaultPointFigure: false,
        needDefaultXAxisFigure: false,
        needDefaultYAxisFigure: false,
        createPointFigures: ({ overlay, coordinates }) => {
          const { label } = overlay.extendData || {};
          if (coordinates.length < 2) return [];
          const figs = [];
          const x1 = Math.min(coordinates[0].x, coordinates[1].x);
          const x2 = Math.max(coordinates[0].x, coordinates[1].x);
          const y1 = Math.min(coordinates[0].y, coordinates[1].y);
          const y2 = Math.max(coordinates[0].y, coordinates[1].y);
          const w = Math.max(x2 - x1, 6);
          figs.push({
            type: 'rect',
            attrs: { x: x1, y: y1, width: w, height: y2 - y1 },
            styles: {
              style: 'stroke_fill',
              color: 'rgba(212, 160, 86, 0.12)',
              borderColor: '#d4a056',
              borderSize: 1,
              borderStyle: 'dashed',
              borderDashedValue: [3, 3],
            },
            ignoreEvent: true,
          });
          if (label) {
            figs.push({
              type: 'text',
              attrs: { x: x1 + 4, y: y1 + 14, text: label, align: 'left', baseline: 'top' },
              styles: { color: '#d4a056', size: 10, family: 'sans-serif', weight: 'bold' },
              ignoreEvent: true,
            });
          }
          return figs;
        },
      });
    }

    registerCustomOverlays();

    // ── Utility ──
    function parseTime(text) {
      let t = String(text || '').trim().replace('T', ' ');
      if (!t) return null;
      const compact = t.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})$/);
      if (compact) t = `${compact[1]}-${compact[2]}-${compact[3]} ${compact[4]}:${compact[5]}`;
      const match = t.match(/^(\d{4}-\d{2}-\d{2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
      if (!match) return null;
      return `${match[1]} ${match[2].padStart(2, '0')}:${match[3]}`;
    }

    function timeToTimestamp(text) {
      const match = text.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
      if (!match) return 0;
      return Math.floor(Date.UTC(+match[1], +match[2] - 1, +match[3], +match[4], +match[5]) / 1000);
    }

    function findBarIndex(candleData, targetTsMs) {
      for (let i = candleData.length - 1; i >= 0; i--) {
        if (candleData[i].timestamp <= targetTsMs) return i;
      }
      return -1;
    }

    function getChartBarAtTime(rawTime) {
      const parsedTime = parseTime(rawTime);
      if (!lastCandleData?.length || !parsedTime) return null;
      const tsMs = timeToTimestamp(parsedTime) * 1000;
      const idx = findBarIndex(lastCandleData, tsMs);
      if (idx < 0) return null;
      return { idx, bar: lastCandleData[idx], parsedTime, tsMs };
    }

    function getManualChartBar(fieldLabel = 'Anchor Time') {
      const pdaType = document.getElementById('manualPdaType').value;
      let timeValue, timeFieldLabel;

      // For OB, use start_time instead of anchor_time
      if (pdaType === 'ob') {
        timeValue = document.getElementById('manualStartTime').value.trim();
        timeFieldLabel = 'Start Time';
      } else {
        timeValue = document.getElementById('manualAnchorTime').value.trim();
        timeFieldLabel = fieldLabel;
      }

      if (!timeValue) {
        toast(`请先填写 ${timeFieldLabel}`, 'error');
        return null;
      }
      if (!lastCandleData?.length) {
        toast('请先加载图表数据', 'error');
        return null;
      }
      const point = getChartBarAtTime(timeValue);
      if (!point) {
        toast(`${timeFieldLabel} 不在当前图表范围内`, 'error');
        return null;
      }
      return point.bar;
    }

    function fillManualPriceField(fieldId, priceKind, successLabel) {
      const bar = getManualChartBar();
      if (!bar) return;
      const value = bar[priceKind];
      document.getElementById(fieldId).value = value;
      toast(`${successLabel} = ${value}`, 'success');
    }

    function getManualChartTf() {
      return MANUAL_TF_TO_CHART_TF[document.getElementById('manualPdaTF').value] || '60';
    }

    function getManualTfSpec(rawTf) {
      const map = {
        '1M': { label: '1m', minutes: 1 },
        '5M': { label: '5m', minutes: 5 },
        '15M': { label: '15m', minutes: 15 },
        '30M': { label: '30m', minutes: 30 },
        '1H': { label: '1H', minutes: 60 },
        '4H': { label: '4H', minutes: 240 },
        'D': { label: '1D', minutes: 1440 },
        '1W': { label: '1W', minutes: 10080 },
      };
      return map[String(rawTf || '').trim().toUpperCase()] || null;
    }

    function formatManualPriceValue(value) {
      const num = Number(value);
      if (!Number.isFinite(num)) return String(value ?? '');
      return num.toFixed(2);
    }

    function formatUtcDateTime(date) {
      return `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, '0')}-${String(date.getUTCDate()).padStart(2, '0')} ${String(date.getUTCHours()).padStart(2, '0')}:${String(date.getUTCMinutes()).padStart(2, '0')}`;
    }

    function addMinutesToUtcTime(value, minutes) {
      const parsed = parseTime(value);
      if (!parsed) return '';
      const tsSec = timeToTimestamp(parsed);
      return formatUtcDateTime(new Date((tsSec + (minutes * 60)) * 1000));
    }

    async function fetchPriceWindow(startTime, minutes, field = 'high') {
      const parsed = parseTime(startTime);
      if (!parsed) throw new Error('时间格式无效');
      const [date, time] = parsed.split(' ');
      const params = new URLSearchParams({
        instrument: 'NQ',
        date,
        time,
        tf: String(Math.max(1, Math.round(Number(minutes) || 1))),
        field,
      });
      const response = await apiGet(`/price?${params.toString()}`);
      return response.result || response;
    }

    async function autoFillManualFvgRange() {
      const anchorTime = parseTime(document.getElementById('manualAnchorTime').value.trim());
      if (!anchorTime) throw new Error('请先填写 Anchor Time');
      const tfSpec = getManualTfSpec(document.getElementById('manualPdaTF').value);
      if (!tfSpec) throw new Error('请选择有效周期');
      const firstStart = addMinutesToUtcTime(anchorTime, -tfSpec.minutes);
      const thirdStart = addMinutesToUtcTime(anchorTime, tfSpec.minutes);
      const [first, third] = await Promise.all([
        fetchPriceWindow(firstStart, tfSpec.minutes, 'high'),
        fetchPriceWindow(thirdStart, tfSpec.minutes, 'high'),
      ]);
      const directionEl = document.getElementById('manualPdaDirection');
      const highEl = document.getElementById('manualPriceHigh');
      const lowEl = document.getElementById('manualPriceLow');
      if (Number(first.ohlc.high) < Number(third.ohlc.low)) {
        directionEl.value = 'bullish';
        highEl.value = formatManualPriceValue(third.ohlc.low);
        lowEl.value = formatManualPriceValue(first.ohlc.high);
        return {
          direction: 'bullish',
          priceHigh: highEl.value,
          priceLow: lowEl.value,
          tfLabel: tfSpec.label,
        };
      }
      if (Number(first.ohlc.low) > Number(third.ohlc.high)) {
        directionEl.value = 'bearish';
        highEl.value = formatManualPriceValue(first.ohlc.low);
        lowEl.value = formatManualPriceValue(third.ohlc.high);
        return {
          direction: 'bearish',
          priceHigh: highEl.value,
          priceLow: lowEl.value,
          tfLabel: tfSpec.label,
        };
      }
      throw new Error(`${anchorTime} 所在 ${tfSpec.label} 三根 K 没有形成 FVG`);
    }

    function comparableManualPrice(manual) {
      const candidates = [manual?.price, manual?.priceHigh, manual?.priceLow]
        .map(value => String(value ?? '').trim())
        .filter(Boolean);
      return candidates.length ? candidates[0] : '';
    }

    function getMatchTimeToleranceBars() {
      const value = document.getElementById('matchTimeTolerance').value;
      return value === 'same_bar' ? 0 : Math.max(parseInt(value, 10) || 0, 0);
    }

    function getMatchPriceToleranceTicks() {
      const value = document.getElementById('matchPriceTolerance').value;
      if (value === 'tick') return 1;
      if (value === '2tick') return 2;
      return 4;
    }

    function renderMatchPreviewRows(candidates) {
      const tbody = document.getElementById('matchPreviewBody');
      if (!candidates?.length) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty-panel-row">无匹配候选</td></tr>';
        return;
      }
      tbody.innerHTML = candidates.map(candidate => {
        const autoLabel = [candidate.pdaId, candidate.timeframe, candidate.pdaType?.toUpperCase()].filter(Boolean).join(' · ');
        const resultLabel = `${candidate.matchKind} · score ${candidate.matchScore}`;
        const detail = `ΔT ${candidate.timeDeltaMinutes}m · ΔP ${candidate.priceDelta}`;
        const note = candidate.note ? `<br>${escHtml(candidate.note)}` : '';
        return `<tr>
          <td class="mono">${escHtml(autoLabel)}</td>
          <td>${escHtml(formatTime(candidate.anchorTime || candidate.occurrenceTime || candidate.candidateTime) || '-')}<br>${escHtml(String(candidate.comparePrice ?? '-'))}</td>
          <td>${escHtml(resultLabel)}<br>${escHtml(detail)}${note}</td>
        </tr>`;
      }).join('');
    }

    function updateMatchSummary(result, previewPda) {
      const candidates = result?.candidates || [];
      const best = candidates[0] || null;
      const hasStrongMatch = best && (best.matchKind === 'exact' || best.matchScore >= 0.68);
      document.getElementById('matchAutoCount').textContent = hasStrongMatch ? '1' : '0';
      document.getElementById('matchManualKeepCount').textContent = hasStrongMatch ? '0' : '1';
      document.getElementById('matchConflictCount').textContent = candidates.length;
      renderMatchPreviewRows(candidates);
      if (!best) {
        toast(`未找到 ${previewPda.pdaType.toUpperCase()} 匹配候选`, 'info');
        return;
      }
      if (hasStrongMatch) {
        toast(`匹配到 ${best.pdaId}（score ${best.matchScore}）`, 'success');
        return;
      }
      toast(`最佳候选 ${best.pdaId}（score ${best.matchScore}）未达阈值`, 'info');
    }

    async function previewManualAutoMatch() {
      try {
        const previewPda = buildPreviewPdaFromManualForm();
        const eventTime = previewPda.anchorTime || previewPda.extraFields?.start_time || previewPda.extraFields?.end_time || '';
        const price = comparableManualPrice(previewPda);
        if (!eventTime || !price) throw new Error('匹配预览需要时间和价格');
        const params = new URLSearchParams({
          instrument: 'NQ',
          timeframe: String(previewPda.timeframe || '').toUpperCase(),
          pda_type: String(previewPda.pdaType || '').toLowerCase(),
          event_time: eventTime,
          price: String(price),
          time_tolerance_bars: String(getMatchTimeToleranceBars()),
          price_tolerance_ticks: String(getMatchPriceToleranceTicks()),
          limit: '8',
        });
        const response = await apiGet(`/v2/pda_match?${params.toString()}`);
        const result = response.result || response;
        lastMatchResult = { previewPda, result };
        lastAppliedMerge = null;
        updateMatchSummary(result, previewPda);
      } catch (err) {
        lastMatchResult = null;
        lastAppliedMerge = null;
        document.getElementById('matchAutoCount').textContent = '0';
        document.getElementById('matchManualKeepCount').textContent = '0';
        document.getElementById('matchConflictCount').textContent = '0';
        document.getElementById('matchPreviewBody').innerHTML = `<tr><td colspan="3" class="empty-panel-row">${escHtml(err.message)}</td></tr>`;
        toast(`匹配预览失败: ${err.message}`, 'error');
      }
    }

    function applyManualAutoMerge() {
      if (!lastMatchResult?.previewPda || !lastMatchResult?.result) {
        toast('请先生成匹配预览', 'error');
        return;
      }
      const { previewPda, result } = lastMatchResult;
      const candidates = result.candidates || [];
      const best = candidates[0] || null;
      const hasStrongMatch = best && (best.matchKind === 'exact' || best.matchScore >= 0.68);
      const merged = {
        previewPda,
        matchedAuto: hasStrongMatch ? {
          pdaId: best.pdaId,
          matchKind: best.matchKind,
          matchScore: best.matchScore,
        } : null,
        manualOnly: hasStrongMatch ? [] : [previewPda.pdaId || 'manual_preview'],
        autoOnlyInWindow: candidates
          .filter(candidate => !hasStrongMatch || candidate.pdaId !== best.pdaId)
          .map(candidate => candidate.pdaId)
          .filter(Boolean),
      };
      lastAppliedMerge = merged;
      document.getElementById('matchPreviewBody').innerHTML = hasStrongMatch
        ? `<tr><td class="mono">${escHtml(previewPda.pdaId || 'manual_preview')}</td><td>${escHtml(best.pdaId)}</td><td>采用 Auto · ${escHtml(best.matchKind)} · score ${escHtml(String(best.matchScore))}</td></tr>`
        : `<tr><td class="mono">${escHtml(previewPda.pdaId || 'manual_preview')}</td><td>-</td><td>保留 Manual · 未达到强匹配阈值</td></tr>`;
      document.getElementById('matchAutoCount').textContent = hasStrongMatch ? '1' : '0';
      document.getElementById('matchManualKeepCount').textContent = hasStrongMatch ? '0' : '1';
      document.getElementById('matchConflictCount').textContent = String(merged.autoOnlyInWindow.length);
      toast(hasStrongMatch ? `已采用 Auto ${best.pdaId}` : '已保留 Manual 结果', 'success');
    }

    function buildMergeYaml() {
      if (!lastAppliedMerge?.previewPda) throw new Error('请先应用合并');
      const { previewPda, matchedAuto, manualOnly, autoOnlyInWindow } = lastAppliedMerge;
      const lines = [];
      lines.push(`merge_preview:`);
      lines.push(`  manual_pda:`);
      lines.push(`    pda_id: "${String(previewPda.pdaId || 'manual_preview').replace(/"/g, '\\"')}"`);
      lines.push(`    timeframe: "${String(previewPda.timeframe || '').replace(/"/g, '\\"')}"`);
      lines.push(`    pda_type: "${String(previewPda.pdaType || '').replace(/"/g, '\\"')}"`);
      if (previewPda.anchorTime) lines.push(`    event_time: "${String(previewPda.anchorTime).replace(/"/g, '\\"')}"`);
      if (previewPda.price != null) lines.push(`    price: ${previewPda.price}`);
      if (previewPda.priceHigh != null) lines.push(`    price_high: ${previewPda.priceHigh}`);
      if (previewPda.priceLow != null) lines.push(`    price_low: ${previewPda.priceLow}`);
      lines.push(`  reconciliation:`);
      if (matchedAuto) {
        lines.push(`    matched_auto:`);
        lines.push(`      - pda_id: "${String(matchedAuto.pdaId).replace(/"/g, '\\"')}"`);
        lines.push(`        match_kind: "${String(matchedAuto.matchKind).replace(/"/g, '\\"')}"`);
        lines.push(`        match_score: ${matchedAuto.matchScore}`);
      } else {
        lines.push(`    matched_auto: []`);
      }
      if (manualOnly?.length) {
        lines.push(`    manual_only:`);
        manualOnly.forEach(item => lines.push(`      - "${String(item).replace(/"/g, '\\"')}"`));
      } else {
        lines.push(`    manual_only: []`);
      }
      if (autoOnlyInWindow?.length) {
        lines.push(`    auto_only_in_window:`);
        autoOnlyInWindow.forEach(item => lines.push(`      - "${String(item).replace(/"/g, '\\"')}"`));
      } else {
        lines.push(`    auto_only_in_window: []`);
      }
      return lines.join('\n');
    }

        `export_type: "kline_viewer_merge"`,

        if (tf) lines.push(`  tf: "${String(tf).replace(/"/g, '\\"')}"`);
      }
      lines.push(buildMergeYaml());

    // ── PDA badge ──
    function renderPdaBadge(pda) {
      const el = document.getElementById('pdaBadge');
      if (!pda) { el.style.display = 'none'; return; }
      const type = (pda.pdaType || '').toLowerCase();
      const colorMap = { bsl: 'bsl', ssl: 'ssl', fvg: 'fvg', ob: 'ob', eqh: 'eqh', eql: 'eql',
        daily_high: 'bsl', daily_low: 'ssl', ict_midnight_day_high: 'bsl', ict_midnight_day_low: 'ssl', ndog: 'bsl', nwog: 'bsl' };
      const cls = colorMap[type] || 'ob';
      const label = type.toUpperCase();
      const time = pda.occurrenceTime || pda.anchorTime || '';
      const dir = pda.direction || '';
      const tf = pda.timeframe || '';
      const parts = [`<b>${label}</b>`];
      if (pda.pdaId) parts.push(pda.pdaId);
      if (time) parts.push(time);
      if (tf) parts.push(tf);
      if (dir) parts.push(dir);
      if (pda.price) parts.push(`@ ${pda.price}`);
      el.className = `pda-badge pda-badge-${cls}`;
      el.innerHTML = parts.join(' · ');
      el.style.display = 'inline-flex';
    }

    // ── PDA overlay builder ──
    function buildPdaOverlays(pda, candleData) {
      if (!pda || !candleData?.length) return [];
      const overlays = [];
      const pdaType = (pda.pdaType || '').toLowerCase();
      const pdaTimeSec = timeToTimestamp(pda.occurrenceTime || pda.anchorTime || '');
      const pdaTimeMs = pdaTimeSec * 1000;
      const pdaTimeEndSec = pda.extraFields?.end_time ? timeToTimestamp(pda.extraFields.end_time) : 0;
      const pdaTimeEndMs = pdaTimeEndSec * 1000;

      // In replay mode, check if PDA timestamp is within visible data range
      const lastVisibleBarTime = candleData[candleData.length - 1].timestamp;
      if (replayState.enabled && pdaTimeMs > lastVisibleBarTime) {
        // PDA is in the future (not yet visible in replay), don't draw it
        return [];
      }

      const idx = findBarIndex(candleData, pdaTimeMs);
      if (idx < 0) return [];

      const bar = candleData[idx];
      const highTypes = ['bsl', 'daily_high', 'ict_midnight_day_high', 'ndog', 'nwog'];
      const lowTypes = ['ssl', 'daily_low', 'ict_midnight_day_low'];

      if (highTypes.includes(pdaType)) {
        overlays.push({
          name: 'arrowMarker',
          points: [{ timestamp: bar.timestamp, value: bar.high }],
          extendData: { direction: 'down', color: '#2d7d2d', label: pdaType.toUpperCase() },
          lock: true,
        });
        if (pda.price) {
          overlays.push({
            name: 'horizontalStraightLine',
            points: [{ timestamp: bar.timestamp, value: pda.price }],
            styles: { line: { color: 'rgba(45, 125, 45, 0.5)', style: 'dashed', size: 1, dashedValue: [6, 3] } },
            lock: true,
          });
        }
      } else if (lowTypes.includes(pdaType)) {
        overlays.push({
          name: 'arrowMarker',
          points: [{ timestamp: bar.timestamp, value: bar.low }],
          extendData: { direction: 'up', color: '#d28349', label: pdaType.toUpperCase() },
          lock: true,
        });
        if (pda.price) {
          overlays.push({
            name: 'horizontalStraightLine',
            points: [{ timestamp: bar.timestamp, value: pda.price }],
            styles: { line: { color: 'rgba(210, 131, 73, 0.5)', style: 'dashed', size: 1, dashedValue: [6, 3] } },
            lock: true,
          });
        }
      } else if (pdaType === 'fvg') {
        const priceTop = pda.extraFields?.price_top || pda.extraFields?.priceTop || pda.priceHigh;
        const priceBottom = pda.extraFields?.price_bottom || pda.extraFields?.priceBottom || pda.priceLow;
        const direction = (pda.direction || '').toLowerCase();
        const startIdx = Math.max(idx - 1, 0);
        const endIdx5 = Math.min(idx + 4, candleData.length - 1);
        if (priceTop && priceBottom) {
          overlays.push({
            name: 'fvgZone',
            points: [
              { timestamp: candleData[startIdx].timestamp, value: priceTop },
              { timestamp: candleData[endIdx5].timestamp, value: priceBottom },
            ],
            extendData: { timeframe: pda.timeframe || '1H', direction: direction },
            lock: true,
          });
        } else {
          const fvgColor = direction === 'bullish' ? '#c8aa32' : '#b43c3c';
          overlays.push({
            name: 'circleMarker',
            points: [{ timestamp: bar.timestamp, value: bar.high }],
            extendData: { color: fvgColor, label: 'FVG', above: true },
            lock: true,
          });
        }
      } else if (pdaType === 'ob') {
        const priceTop = pda.extraFields?.price_top || pda.extraFields?.priceTop || pda.priceHigh;
        const priceBottom = pda.extraFields?.price_bottom || pda.extraFields?.priceBottom || pda.priceLow;
        const endIdx = pdaTimeEndMs ? findBarIndex(candleData, pdaTimeEndMs) : idx;
        if (priceTop && priceBottom && endIdx >= 0) {
          overlays.push({
            name: 'obZone',
            points: [
              { timestamp: candleData[idx].timestamp, value: priceTop },
              { timestamp: candleData[endIdx].timestamp, value: priceBottom },
            ],
            extendData: { label: 'OB' },
            lock: true,
          });
        } else {
          overlays.push({
            name: 'circleMarker',
            points: [{ timestamp: bar.timestamp, value: bar.high }],
            extendData: { color: '#d4a056', label: 'OB', above: true },
            lock: true,
          });
          if (endIdx >= 0 && endIdx !== idx) {
            overlays.push({
              name: 'circleMarker',
              points: [{ timestamp: candleData[endIdx].timestamp, value: candleData[endIdx].low }],
              extendData: { color: '#d4a056', label: 'OB', above: false },
              lock: true,
            });
          }
        }
      } else if (pdaType === 'eqh') {
        overlays.push({
          name: 'circleMarker',
          points: [{ timestamp: bar.timestamp, value: bar.high }],
          extendData: { color: '#b48cff', label: 'EQH', above: true },
          lock: true,
        });
      } else if (pdaType === 'eql') {
        overlays.push({
          name: 'circleMarker',
          points: [{ timestamp: bar.timestamp, value: bar.low }],
          extendData: { color: '#b48cff', label: 'EQL', above: false },
          lock: true,
        });
      } else {
        overlays.push({
          name: 'circleMarker',
          points: [{ timestamp: bar.timestamp, value: bar.high }],
          extendData: { color: '#d4a056', label: pdaType.toUpperCase(), above: true },
          lock: true,
        });
      }
      return overlays;
    }

    // ── S/E overlay builder ──
    function buildSEOverlays(candleData) {
      const overlays = [];
      if (!document.getElementById('showSE').checked) return overlays;

      const start = parseTime(document.getElementById('startTime').value.trim());
      const end = parseTime(document.getElementById('endTime').value.trim());
      if (!start || !end) return overlays;

      const startTsMs = timeToTimestamp(start) * 1000;
      const endTsMs = timeToTimestamp(end) * 1000;

      const startIdx = findBarIndex(candleData, startTsMs);
      if (startIdx >= 0) {
        overlays.push({
          name: 'arrowMarker',
          points: [{ timestamp: candleData[startIdx].timestamp, value: candleData[startIdx].low }],
          extendData: { direction: 'up', color: '#d4a056', label: 'S' },
          lock: true,
        });
      }

      const endIdx = findBarIndex(candleData, endTsMs);
      if (endIdx >= 0) {
        overlays.push({
          name: 'arrowMarker',
          points: [{ timestamp: candleData[endIdx].timestamp, value: candleData[endIdx].high }],
          extendData: { direction: 'down', color: '#c87070', label: 'E' },
          lock: true,
        });
      }
      return overlays;
    }

    // ── Midnight lines ──
    function drawMidnightLines(candleData, tfMinutes) {
      midnightOverlayIds.forEach(id => { try { chart.removeOverlay(id); } catch(e){} });
      midnightOverlayIds = [];

      if (tfMinutes > 60) return;
      if (!document.getElementById('midnightLines').checked) return;
      if (!candleData?.length) return;

      const midnights = new Set();
      for (const bar of candleData) {
        const d = new Date(bar.timestamp);
        if (d.getUTCHours() === 0 && d.getUTCMinutes() === 0) {
          midnights.add(bar.timestamp);
        }
      }

      for (const ts of midnights) {
        const idx = findBarIndex(candleData, ts);
        if (idx >= 0) {
          const id = chart.createOverlay({
            name: 'verticalStraightLine',
            points: [{ timestamp: ts, value: candleData[idx].close }],
            styles: { line: { color: 'rgba(180, 80, 80, 0.25)', style: 'solid', size: 1 } },
            lock: true,
          });
          if (id) midnightOverlayIds.push(id);
        }
      }
    }

    // ── Draw all overlays ──
    function drawAllOverlays() {
      if (!chart || !lastCandleData) return;

      // Remove previous overlays by group
      chart.removeOverlay({ groupId: OVERLAY_GROUP });

      const overlays = [];
      overlays.push(...buildSEOverlays(lastCandleData));
      const overlayPda = manualPreviewPda || currentPda;
      if (overlayPda) {
        overlays.push(...buildPdaOverlays(overlayPda, lastCandleData));
      }

      for (const ov of overlays) {
        ov.groupId = OVERLAY_GROUP;
        chart.createOverlay(ov);
      }
    }

    // ── Center on PDA ──
    function centerOnPda(pda, candleData) {
      if (!chart || !candleData?.length) return;
      const pdaTimeSec = timeToTimestamp(pda.occurrenceTime || pda.anchorTime || '');
      if (!pdaTimeSec) { resetView(); return; }

      const pdaTimeMs = pdaTimeSec * 1000;
      const idx = findBarIndex(candleData, pdaTimeMs);
      if (idx < 0) { resetView(); return; }

      const contextBars = 15;
      chart.scrollToDataIndex(idx + contextBars, 0);
      const barSpace = chart.getBarSpace();
      const marginPixels = barSpace * RIGHT_MARGIN_BARS;
      chart.scrollByDistance(-marginPixels, 0);
    }

    // ── Reset view ──
    function resetView() {
      if (!chart || !lastCandleData?.length) return;
      chart.scrollToDataIndex(lastCandleData.length - 1, 0);
      const barSpace = chart.getBarSpace();
      const marginPixels = barSpace * RIGHT_MARGIN_BARS;
      chart.scrollByDistance(-marginPixels, 0);
    }

    // ── Replay functions ──
    function updateReplayDisplay() {
      if (!replayState.enabled || !replayState.fullData) return;

      const currentData = replayState.fullData.slice(0, replayState.currentIndex + 1);
      lastCandleData = currentData;

      if (chart) {
        chart.applyNewData(currentData);

        // TradingView-style replay logic:
        // 1. If no anchor (first time or reset), scroll to latest with margin
        // 2. If anchor exists, keep viewport fixed until latest bar hits the "wall"
        // 3. When hitting the wall, push viewport left

        if (replayState.viewportAnchor === null) {
          // No anchor: scroll to latest bar with right margin (initial state)
          chart.scrollToDataIndex(currentData.length - 1, 0);
          const barSpace = chart.getBarSpace();
          const marginPixels = barSpace * RIGHT_MARGIN_BARS;
          chart.scrollByDistance(-marginPixels, 0);
        } else {
          // Anchor exists: check if latest bar has reached the wall
          const latestIndex = currentData.length - 1;
          const wallPosition = replayState.viewportAnchor + RIGHT_MARGIN_BARS;

          if (latestIndex >= wallPosition) {
            // Latest bar hit the wall: push viewport left
            const pushAmount = latestIndex - wallPosition + 1;
            replayState.viewportAnchor += pushAmount;
            chart.scrollToDataIndex(replayState.viewportAnchor, 0);
            const barSpace = chart.getBarSpace();
            const marginPixels = barSpace * RIGHT_MARGIN_BARS;
            chart.scrollByDistance(-marginPixels, 0);
          } else {
            // Latest bar hasn't hit the wall: keep viewport fixed
            chart.scrollToDataIndex(replayState.viewportAnchor, 0);
            const barSpace = chart.getBarSpace();
            const marginPixels = barSpace * RIGHT_MARGIN_BARS;
            chart.scrollByDistance(-marginPixels, 0);
          }
        }
      }

      // Update info text
      const info = `回放模式：${replayState.currentIndex + 1} / ${replayState.totalBars} bars`;
      document.getElementById('infoText').textContent = info;

      // Redraw overlays and midnight lines
      if (chart) {
        const tf = parseInt(document.getElementById('tfSelect').value);
        drawMidnightLines(currentData, tf);
        drawAllOverlays();
      }

      // Update replay UI
      updateReplayUI();
    }

    function replayStepForward(steps = 1) {
      if (!replayState.enabled || !replayState.fullData) return;

      replayState.currentIndex = Math.min(
        replayState.currentIndex + steps,
        replayState.totalBars - 1
      );
      updateReplayDisplay();
    }

    function replayStepBackward(steps = 1) {
      if (!replayState.enabled || !replayState.fullData) return;

      replayState.currentIndex = Math.max(
        replayState.currentIndex - steps,
        0
      );
      updateReplayDisplay();
    }

    function replayPlay() {
      if (!replayState.enabled || replayState.isPlaying) return;

      replayState.isPlaying = true;
      document.getElementById('replayPlayPause').textContent = '⏸';

      replayState.intervalId = setInterval(() => {
        if (replayState.currentIndex >= replayState.totalBars - 1) {
          replayPause();
          return;
        }
        replayStepForward(1);
      }, replayState.speed);
    }

    function replayPause() {
      if (!replayState.enabled || !replayState.isPlaying) return;

      replayState.isPlaying = false;
      document.getElementById('replayPlayPause').textContent = '▶';

      if (replayState.intervalId) {
        clearInterval(replayState.intervalId);
        replayState.intervalId = null;
      }
    }

    function replaySeekTo(index) {
      if (!replayState.enabled || !replayState.fullData) return;

      replayState.currentIndex = Math.max(0, Math.min(index, replayState.totalBars - 1));
      updateReplayDisplay();
    }

    function updateReplayUI() {
      if (!replayState.enabled) return;

      // Update slider
      const slider = document.getElementById('replaySlider');
      slider.max = replayState.totalBars - 1;
      slider.value = replayState.currentIndex;

      // Update position text
      document.getElementById('replayPosition').textContent =
        `${replayState.currentIndex + 1} / ${replayState.totalBars}`;

      // Update time text
      if (replayState.fullData && replayState.fullData[replayState.currentIndex]) {
        const bar = replayState.fullData[replayState.currentIndex];
        const d = new Date(bar.timestamp);
        const timeStr = `${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')} ${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`;
        document.getElementById('replayTime').textContent = timeStr;
      }
    }

      const end = parseTime(endRaw);

        alert('时间格式：2012-01-09 11:20');
        return;
      }

      try {
        const url = `${API_BASE}/v2/bars?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}&tf=${tf}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        const bars = data.result;
        if (!bars.length) throw new Error('该时段无数据');

        const tfMinutes = parseInt(tf);

        const candleData = bars.map(bar => ({
          timestamp: bar.timestamp * 1000,
          open: bar.open,
          high: bar.high,
          low: bar.low,

        if (resizeObserver) {
          resizeObserver.disconnect();
          resizeObserver = null;
        }
        if (yAxisWheelHandler) {
          container.removeEventListener('wheel', yAxisWheelHandler, { capture: true });
          yAxisWheelHandler = null;
        }

        container.innerHTML = '';

        // Init chart with dark theme, timezone=UTC to match DB timestamps
        chart = klinecharts.init('chartContainer', { timezone: 'UTC' });
        if (!chart) throw new Error('图表初始化失败');

        chart.setStyles({
          grid: {
            show: false,
            horizontal: { show: false, size: 0 },
            vertical: { show: false, size: 0 },
          },
          candle: {
            type: 'candle_solid',
            bar: {
              upColor: '#7db87d',
              downColor: '#c87070',
              noChangeColor: '#888888',
              upBorderColor: '#7db87d',
              downBorderColor: '#c87070',
              noChangeBorderColor: '#888888',
              upWickColor: '#34c9b0',
              downWickColor: '#d28349',
              noChangeWickColor: '#888888',
            },
            priceMark: {
              high: { show: false },
              low: { show: false },
              last: {
                show: true,
                line: { show: false },
                text: { show: true, color: '#f5f0e8', backgroundColor: '#7db87d', borderRadius: 2, size: 10 },
              },
            },
            tooltip: { show: false },
          },
          xAxis: {
            show: true,
            axisLine: { show: true, color: '#5a5045', size: 1 },
            tickText: { color: '#26c6da', size: 11, family: 'sans-serif' },
            tickLine: { show: false },
          },
          yAxis: {
            show: true,
            axisLine: { show: true, color: '#5a5045', size: 1 },
            tickText: { color: '#26c6da', size: 11, family: 'sans-serif' },
            tickLine: { show: false },
          },
          crosshair: {
            show: true,
            horizontal: {
              show: true,
              line: { show: true, style: 'dashed', size: 1, color: '#d4a056', dashedValue: [4, 2] },
              text: { show: true, color: '#1e1b18', backgroundColor: '#d4a056', borderRadius: 2, size: 10 },
            },
            vertical: {
              show: true,
              line: { show: true, style: 'dashed', size: 1, color: '#d4a056', dashedValue: [4, 2] },
              text: { show: true, color: '#1e1b18', backgroundColor: '#d4a056', borderRadius: 2, size: 10 },
            },
          },
          separator: { size: 0 },
          overlay: {
            text: { backgroundColor: 'transparent', color: '#f5f0e8', borderSize: 0, size: 10, family: 'sans-serif' },
            rectText: { backgroundColor: 'transparent', color: '#f5f0e8', borderSize: 0, size: 10, family: 'sans-serif' },
          },
        });

        chart.setPriceVolumePrecision(2, 0);
        setupCrosshairTracking();

        // Store full data for replay
        replayState.fullData = candleData;
        replayState.totalBars = candleData.length;

        // Check if we need to restore a saved time range (from TF switch)
        let initialIndex = 0;
        if (replayState.savedTimeRange) {
          // Find the index that covers the saved time range
          const { startTime, endTime } = replayState.savedTimeRange;

          // Find the last bar that is <= endTime
          let targetIndex = candleData.findIndex(bar => bar.timestamp > endTime);
          if (targetIndex === -1) {
            // All bars are before endTime, use last bar
            targetIndex = candleData.length - 1;
          } else if (targetIndex > 0) {
            // Use the bar just before the one that exceeds endTime
            targetIndex = targetIndex - 1;
          }

          initialIndex = Math.max(0, targetIndex);
          replayState.savedTimeRange = null; // Clear after use
        }

        replayState.currentIndex = initialIndex;
        replayState.viewportAnchor = null;  // Reset anchor
        replayState.enabled = true;

        // Show bars up to the initial index (replay mode)
        const initialData = candleData.slice(0, initialIndex + 1);
        lastCandleData = initialData;

        // Resize observer
        resizeObserver = new ResizeObserver(() => {
          if (chart) chart.resize();
        });
        resizeObserver.observe(container);

        // Wheel zoom on Y-axis area: scroll wheel on right side → vertical zoom
        yAxisWheelHandler = (e) => {
          if (!chart) return;
          // Check if mouse is on Y-axis widget (same region as drag-to-zoom)
          const pane = chart.getDrawPaneById('candle_pane');
          if (!pane) return;
          const yAxisEl = pane.getYAxisWidget()?.getContainer();
          if (!yAxisEl || !yAxisEl.contains(e.target)) return;
          e.preventDefault();
          e.stopPropagation();
          const yAxis = pane.getAxisComponent();
          const range = yAxis.getRange();
          if (!range || range.realRange <= 0) return;
          // Scale: scroll up (deltaY<0) → zoom in (shrink range), scroll down → zoom out
          const factor = e.deltaY > 0 ? 1.08 : 0.92;
          const center = (range.from + range.to) / 2;
          const newRange = range.range * factor;
          const newFrom = center - newRange / 2;
          const newTo = center + newRange / 2;
          const newRealFrom = yAxis.convertToRealValue(newFrom);
          const newRealTo = yAxis.convertToRealValue(newTo);
          yAxis.setRange({
            from: newFrom, to: newTo, range: newTo - newFrom,
            realFrom: newRealFrom, realTo: newRealTo, realRange: newRealTo - newRealFrom,
          });
          chart.adjustPaneViewport(false, true, true, true);
        };
        container.addEventListener('wheel', yAxisWheelHandler, { capture: true });

        // Apply data and draw overlays when ready
        // In replay mode, only show first bar initially
        chart.applyNewData(initialData);
        if (onDataReadyHandler) {
          chart.unsubscribeAction('onDataReady', onDataReadyHandler);
        }
        onDataReadyHandler = () => {
          drawMidnightLines(initialData, tfMinutes);
          drawAllOverlays();

          // In replay mode, reset view to show the first bar
          // But skip reset if we restored from a saved time range (TF switch)
          if (initialIndex === 0) {
            resetView();
          }

          // Compress Y-axis to show more price range (increase density)
          // Only do this once on initial load
          if (!replayState.yAxisCompressed) {
            console.log('[Y-Axis Compression] Starting compression...');
            const pane = chart.getDrawPaneById('candle_pane');
            if (pane) {
              const yAxis = pane.getAxisComponent();
              const range = yAxis.getRange();
              console.log('[Y-Axis Compression] Current range:', range);
              if (range && range.realRange > 0) {
                // Expand the range by 100% to compress K-lines
                const expandFactor = 2.0;
                const center = (range.from + range.to) / 2;
                const newRange = range.range * expandFactor;
                const newFrom = center - newRange / 2;
                const newTo = center + newRange / 2;
                const newRealFrom = yAxis.convertToRealValue(newFrom);
                const newRealTo = yAxis.convertToRealValue(newTo);
                console.log('[Y-Axis Compression] Old range:', range.realFrom, '-', range.realTo, '(', range.realRange, ')');
                console.log('[Y-Axis Compression] New range:', newRealFrom, '-', newRealTo, '(', newRealTo - newRealFrom, ')');
                yAxis.setRange({
                  from: newFrom, to: newTo, range: newTo - newFrom,
                  realFrom: newRealFrom, realTo: newRealTo, realRange: newRealTo - newRealFrom,
                });
                chart.adjustPaneViewport(false, true, true, true);
                replayState.yAxisCompressed = true;  // Mark as compressed
                console.log('[Y-Axis Compression] Compression applied successfully');
              } else {
                console.log('[Y-Axis Compression] Invalid range, skipping');
              }
            } else {
              console.log('[Y-Axis Compression] Pane not found');
            }
          } else {
            console.log('[Y-Axis Compression] Already compressed, skipping');
          }

          let info = `回放模式：${replayState.currentIndex + 1} / ${candleData.length} bars · ${bars[0].time} → ${bars[bars.length - 1].time} · TF=${tf}m`;
          renderPdaBadge(currentPda);
          document.getElementById('infoText').textContent = info;
        };
        chart.subscribeAction('onDataReady', onDataReadyHandler);

        // Listen for user scroll to set viewport anchor (TradingView-style)
        chart.subscribeAction('onScroll', () => {
          if (!replayState.enabled) return;

          // When user scrolls, capture the rightmost visible bar index as anchor
          // This creates the "wall" effect
          const dataList = chart.getDataList();
          if (!dataList || dataList.length === 0) return;

          // Set anchor to current latest bar index
          // This means: "keep viewport here, new bars appear on the left until they hit the wall"
          replayState.viewportAnchor = replayState.currentIndex;
          console.log('User scrolled - viewport anchored at index:', replayState.viewportAnchor);
        });

        // Show replay control bar
        document.getElementById('replayBar').style.display = 'flex';
        updateReplayUI();

      } catch (err) {
        const container = document.getElementById('chartContainer');
        while (container.firstChild) container.removeChild(container.firstChild);
        const errDiv = document.createElement('div');
        errDiv.className = 'error';
        errDiv.textContent = `加载失败: ${err.message}`;
        container.appendChild(errDiv);
      }
    }

    // ── Load PDA mode ──
    async function loadPdaMode(pdaId) {
      try {
        const res = await fetch(`${API_BASE}/v2/pda_records?pda_id=${encodeURIComponent(pdaId)}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        const records = data.result?.records || [];
        const pda = records.find(r => r.pdaId === pdaId);
        if (!pda) throw new Error(`PDA ${pdaId} 未找到`);

        currentPda = pda;

        const pdaTime = pda.occurrenceTime || pda.anchorTime || '';
        if (!pdaTime) throw new Error('PDA 无时间信息');

        const m = String(pdaTime).match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
        if (!m) throw new Error('PDA 时间格式异常');

        const tf = pda.timeframe === 'D' ? 60 : pda.timeframe === '4H' ? 240 : pda.timeframe === '1H' ? 60 : pda.timeframe === '30M' ? 30 : pda.timeframe === '15M' ? 15 : pda.timeframe === '5M' ? 5 : pda.timeframe === '1M' ? 1 : 60;

        const contextMin = Math.max(120, 5 * tf);
        const center = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]));
        const startDt = new Date(center.getTime() - contextMin * 60000);
        const endDt = new Date(center.getTime() + contextMin * 60000);
        const fmt = d => `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;

        document.getElementById('startTime').value = fmt(startDt);
        document.getElementById('endTime').value = fmt(endDt);
        document.getElementById('tfSelect').value = String(tf);
        document.getElementById('paddingInput').value = '50';

        loadData();
      } catch (err) {
        const container = document.getElementById('chartContainer');
        while (container.firstChild) container.removeChild(container.firstChild);
        const errDiv = document.createElement('div');
        errDiv.className = 'error';
        errDiv.textContent = `加载 PDA 失败: ${err.message}`;
        container.appendChild(errDiv);
      }
    }

    // ── URL params ──
    function loadFromParams() {
      const params = new URLSearchParams(window.location.search);

      const pdaId = params.get('pda_id');
      if (pdaId) {
        loadPdaMode(pdaId);
        return;
      }

      const start = params.get('start');
      const end = params.get('end');
      const tf = params.get('tf') || '60';
      const padding = params.get('padding');

      if (start && end) {
        document.getElementById('startTime').value = start;
        document.getElementById('endTime').value = end;
        document.getElementById('tfSelect').value = tf;
        if (padding) document.getElementById('paddingInput').value = padding;
        loadData();
      }
    }

    async function apiGet(path) {
      const res = await fetch(`${API_BASE}${path}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'API error');
      return data;
    }

    async function apiPost(path, body) {
      const res = await fetch(`${API_BASE}${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'API error');
      return data;
    }

    async function apiPut(path, body) {
      const res = await fetch(`${API_BASE}${path}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'API error');
      return data;
    }

    function formatTime(ts) {
      if (!ts) return '';
      return String(ts).replace(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}).*/, '$1 $2');
    }

    function isManualPda(row) {
      return row?.source === 'manual_add' || row?.source === 'manual_eqh_eql';
    }

    function parseNumberOrNull(value) {
      const num = parseFloat(value);
      return Number.isFinite(num) ? num : null;
    }

    function getPanelSelectedRow() {
      return panelPdaRows.find(r => r.pdaId === panelSelectedPdaId) || null;
    }

    function updatePanelStats() {
      const manual = panelPdaRows.filter(isManualPda).length;
      const auto = panelPdaRows.length - manual;
      document.getElementById('panelTotalCount').textContent = panelPdaRows.length;
      document.getElementById('panelAutoCount').textContent = auto;
      document.getElementById('panelManualCount').textContent = manual;
      document.getElementById('panelSelectedCount').textContent = panelSelectedPdaId ? '1' : '0';
    }

    function applyPanelSort() {
      panelPdaRows.sort((a, b) => {
        let va = a[panelSortCol], vb = b[panelSortCol];
        if (panelSortCol === 'price') {
          va = a.price ?? a.priceHigh ?? a.priceLow ?? a.priceCe;
          vb = b.price ?? b.priceHigh ?? b.priceLow ?? b.priceCe;
        }
        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;
        if (typeof va === 'number' && typeof vb === 'number') {
          return panelSortDir === 'asc' ? va - vb : vb - va;
        }
        va = String(va);
        vb = String(vb);
        return panelSortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
      });
    }

    async function panelSearchPdas() {
      const source = document.getElementById('panelFilterSource').value;
      const pdaType = document.getElementById('panelFilterType').value;
      const tf = document.getElementById('panelFilterTF').value;
      const dir = document.getElementById('panelFilterDirection').value;
      const timeFrom = parseTime(document.getElementById('panelFilterTimeFrom').value.trim());
      const timeTo = parseTime(document.getElementById('panelFilterTimeTo').value.trim());

      const params = new URLSearchParams();
      if (pdaType) params.set('type', pdaType);
      if (tf) params.set('timeframe', tf);
      if (dir) params.set('direction', dir);
      if (timeFrom) params.set('anchor_time_from', timeFrom);
      if (timeTo) params.set('anchor_time_to', timeTo);
      params.set('limit', '1000');

      try {
        let rows = [];
        if (source === 'manual') {
          const manualAddParams = new URLSearchParams(params);
          const manualEqParams = new URLSearchParams(params);
          manualAddParams.set('source', 'manual_add');
          manualEqParams.set('source', 'manual_eqh_eql');
          const [manualAdd, manualEq] = await Promise.all([
            apiGet(`/v2/pda_records?${manualAddParams}`),
            apiGet(`/v2/pda_records?${manualEqParams}`),
          ]);
          rows = [
            ...(manualAdd.result?.records || []),
            ...(manualEq.result?.records || []),
          ];
        } else {
          if (source === 'auto') params.set('source_exclude', 'manual_add');
          const data = await apiGet(`/v2/pda_records?${params}`);
          rows = data.result?.records || [];

        const dirTag = row.direction
          ? `<span class="pill ${row.direction === 'bullish' ? 'bull' : 'bear'}">${row.direction === 'bullish' ? 'Bull' : 'Bear'}</span>`
          : '-';
        const priceDisplay = row.price != null ? Number(row.price).toFixed(2)
          : (row.priceHigh != null && row.priceLow != null) ? `${Number(row.priceHigh).toFixed(2)} / ${Number(row.priceLow).toFixed(2)}`
          : '-';

          <td class="mono">${escHtml(priceDisplay)}</td>
          <td><span class="pill ${manual ? 'manual' : 'auto'}">${manual ? '手工' : '自动'}</span></td>
          <td>
            <button class="btn-sm" data-action="locate" data-pda-id="${escHtml(row.pdaId)}">定位</button>
            <button class="btn-sm" data-action="edit" data-pda-id="${escHtml(row.pdaId)}" ${manual ? '' : 'disabled'}>编辑</button>
          </td>
        </tr>`;
      }).join('');

      tbody.querySelectorAll('tr[data-pda-id]').forEach(tr => {
        tr.addEventListener('click', (e) => {
          const action = e.target?.dataset?.action;
          const pdaId = tr.dataset.pdaId;

    function renderPanelPagination() {
      const totalPages = Math.ceil(panelPdaRows.length / panelPageSize) || 1;
      panelCurrentPage = Math.min(panelCurrentPage, totalPages);
      const container = document.getElementById('panelPagination');
      document.getElementById('panelPageInfo').textContent = `${panelPdaRows.length} 条 · 第 ${panelCurrentPage}/${totalPages} 页`;

      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = `<button data-page="${panelCurrentPage - 1}" ${panelCurrentPage <= 1 ? 'disabled' : ''}>&lt;</button>`;
      for (let i = 1; i <= totalPages; i++) {
        if (totalPages > 7 && Math.abs(i - panelCurrentPage) > 2 && i !== 1 && i !== totalPages) {
          if (i === panelCurrentPage - 3 || i === panelCurrentPage + 3) html += '<button disabled>...</button>';
          continue;
        }
        html += `<button class="${i === panelCurrentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
      }
      html += `<button data-page="${panelCurrentPage + 1}" ${panelCurrentPage >= totalPages ? 'disabled' : ''}>&gt;</button>`;
      container.innerHTML = html;
      container.querySelectorAll('button[data-page]').forEach(btn => {
        btn.addEventListener('click', () => {
          panelCurrentPage = parseInt(btn.dataset.page);
          renderPanelPdaTable();
        });
      });
