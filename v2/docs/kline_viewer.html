<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K线查看器</title>
  <style>
    :root {
      --bg: #1e1b18;
      --panel: #2a2520;
      --line: #5a5045;
      --text: #f5f0e8;
      --text-dim: #c8bfb0;
      --muted: #a89a8a;
      --accent: #d4a056;
      --success: #7db87d;
      --danger: #c87070;
      --info: #6bafcf;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .toolbar {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .toolbar label {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .toolbar input, .toolbar select {
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      width: 140px;
    }
    .toolbar select { width: 80px; }
    .toolbar input[type="number"] { width: 60px; }
    .toolbar button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .toolbar button:hover { opacity: 0.85; }
    .toolbar button.secondary {
      background: var(--panel);
      color: var(--text-dim);
      border: 1px solid var(--line);
    }
    .toolbar .info {
      color: var(--text-dim);
      font-size: 0.8rem;
      margin-left: auto;
    }
    .toolbar .warn {
      color: var(--accent);
      font-size: 0.8rem;
      margin-left: 4px;
    }
    .toolbar .pda-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .pda-badge-bsl { background: rgba(125,184,125,0.15); color: var(--success); }
    .pda-badge-ssl { background: rgba(200,112,112,0.15); color: var(--danger); }
    .pda-badge-fvg { background: rgba(107,175,207,0.15); color: var(--info); }
    .pda-badge-ob  { background: rgba(212,160,86,0.15); color: var(--accent); }
    .pda-badge-eqh { background: rgba(180,140,255,0.15); color: #b48cff; }
    .pda-badge-eql { background: rgba(180,140,255,0.15); color: #b48cff; }
    .chart-container {
      flex: 1;
      min-height: 0;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .error {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--danger);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <label>Start</label>
    <input id="startTime" placeholder="2012-01-09 11:20">
    <label>End</label>
    <input id="endTime" placeholder="2012-01-09 14:37">
    <label>TF</label>
    <select id="tfSelect">
      <option value="1">1m</option>
      <option value="5">5m</option>
      <option value="15">15m</option>
      <option value="30">30m</option>
      <option value="60" selected>1H</option>
      <option value="240">4H</option>
      <option value="1440">1D</option>
      <option value="10080">1W</option>
    </select>
    <label>扩展</label>
    <input id="paddingInput" type="number" value="19" min="0" max="500" placeholder="19">
    <button id="loadBtn">加载</button>
    <button class="secondary" id="resetBtn">Reset View</button>
    <label style="color:var(--muted);font-size:0.8rem;cursor:pointer;"><input type="checkbox" id="midnightLines" checked style="margin-right:4px;vertical-align:middle;">午夜线</label>
    <label style="color:var(--muted);font-size:0.8rem;cursor:pointer;"><input type="checkbox" id="showSE" style="margin-right:4px;vertical-align:middle;">S/E</label>
    <span class="warn" id="paddingWarn"></span>
    <span id="pdaBadge" style="display:none"></span>
    <span class="info" id="infoText"></span>
  </div>
  <div class="chart-container" id="chartContainer">
    <div class="loading">输入时间范围后点击「加载」</div>
  </div>

  <script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    const API_BASE = 'http://127.0.0.1:8765';
    const MAX_PADDING = 500;
    const RIGHT_MARGIN_BARS = 10;
    let chart = null;
    let candleSeries = null;
    let seriesMarkers = null;
    let lastCandleData = null;
    let currentPda = null; // PDA data when loaded via pda_id
    let midnightLineSeries = []; // midnight vertical line series

    function getPadding() {
      const input = document.getElementById('paddingInput');
      let val = parseInt(input.value) || 0;
      const warn = document.getElementById('paddingWarn');
      if (val > MAX_PADDING) {
        val = MAX_PADDING;
        input.value = MAX_PADDING;
        warn.textContent = `超限，已调整为 ${MAX_PADDING}`;
      } else {
        warn.textContent = '';
      }
      return val;
    }

    function initChart() {
      const container = document.getElementById('chartContainer');
      container.innerHTML = '';

      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
          background: { color: '#1e1b18' },
          textColor: '#a89a8a',
          fontSize: 12,
        },
        grid: {
          vertLines: { visible: false },
          horzLines: { visible: false },
        },
        crosshair: {
          mode: LightweightCharts.CrosshairMode.Normal,
          vertLine: { color: '#d4a056', width: 1, style: LightweightCharts.LineStyle.Dashed },
          horzLine: { color: '#d4a056', width: 1, style: LightweightCharts.LineStyle.Dashed },
        },
        rightPriceScale: {
          borderColor: '#5a5045',
        },
        timeScale: {
          borderColor: '#5a5045',
          timeVisible: true,
          secondsVisible: false,
        },
        localization: {
          timeFormatter: (ts) => {
            const d = new Date(ts * 1000);
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const yyyy = d.getUTCFullYear();
            const MM = String(d.getUTCMonth() + 1).padStart(2, '0');
            const dd = String(d.getUTCDate()).padStart(2, '0');
            const hh = String(d.getUTCHours()).padStart(2, '0');
            const mm = String(d.getUTCMinutes()).padStart(2, '0');
            return `${days[d.getUTCDay()]} ${yyyy}/${MM}/${dd} ${hh}:${mm}`;
          },
          dateFormat: 'yyyy/MM/dd',
        },
      });

      candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
        upColor: '#7db87d',
        downColor: '#c87070',
        borderUpColor: '#7db87d',
        borderDownColor: '#c87070',
        wickUpColor: '#34c9b0',
        wickDownColor: '#d28349',
      });

      const resizeObserver = new ResizeObserver(entries => {
        for (const entry of entries) {
          chart.applyOptions({ width: entry.contentRect.width, height: entry.contentRect.height });
        }
      });
      resizeObserver.observe(container);
    }

    function parseTime(text) {
      let t = String(text || '').trim().replace('T', ' ');
      if (!t) return null;
      const compact = t.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})$/);
      if (compact) t = `${compact[1]}-${compact[2]}-${compact[3]} ${compact[4]}:${compact[5]}`;
      const match = t.match(/^(\d{4}-\d{2}-\d{2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
      if (!match) return null;
      return `${match[1]} ${match[2].padStart(2, '0')}:${match[3]}`;
    }

    function timeToTimestamp(text) {
      const match = text.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
      if (!match) return 0;
      // Treat as UTC to match lightweight-charts bar timestamps
      return Math.floor(Date.UTC(+match[1], +match[2] - 1, +match[3], +match[4], +match[5]) / 1000);
    }

    // ── PDA badge renderer ──
    function renderPdaBadge(pda) {
      const el = document.getElementById('pdaBadge');
      if (!pda) { el.style.display = 'none'; return; }
      const type = (pda.pdaType || '').toLowerCase();
      const colorMap = { bsl: 'bsl', ssl: 'ssl', fvg: 'fvg', ob: 'ob', eqh: 'eqh', eql: 'eql',
        daily_high: 'bsl', daily_low: 'ssl', ict_midnight_day_high: 'bsl', ict_midnight_day_low: 'ssl', ndog: 'bsl', nwog: 'bsl' };
      const cls = colorMap[type] || 'ob';
      const label = type.toUpperCase();
      const time = pda.occurrenceTime || pda.anchorTime || '';
      const dir = pda.direction || '';
      const tf = pda.timeframe || '';
      const parts = [`<b>${label}</b>`];
      if (pda.pdaId) parts.push(pda.pdaId);
      if (time) parts.push(time);
      if (tf) parts.push(tf);
      if (dir) parts.push(dir);
      if (pda.price) parts.push(`@ ${pda.price}`);
      el.className = `pda-badge pda-badge-${cls}`;
      el.innerHTML = parts.join(' · ');
      el.style.display = 'inline-flex';
    }

    // ── PDA marker builder ──
    function buildPdaMarkers(pda, candleData) {
      if (!pda) return [];
      const markers = [];
      const pdaType = (pda.pdaType || '').toLowerCase();
      const pdaTime = timeToTimestamp(pda.occurrenceTime || pda.anchorTime || '');
      const pdaTimeEnd = pda.extraFields?.end_time ? timeToTimestamp(pda.extraFields.end_time) : 0;

      // Find the bar that CONTAINS the given timestamp (last bar where bar.time <= ts)
      const findBarContaining = (ts) => [...candleData].reverse().find(b => b.time <= ts) || null;

      // High-type PDAs: arrow down from above
      const highTypes = ['bsl', 'daily_high', 'ict_midnight_day_high', 'ndog', 'nwog'];
      // Low-type PDAs: arrow up from below
      const lowTypes = ['ssl', 'daily_low', 'ict_midnight_day_low'];

      if (highTypes.includes(pdaType)) {
        const bar = findBarContaining(pdaTime);
        if (bar) markers.push({ time: bar.time, position: 'aboveBar', color: '#2d7d2d', shape: 'arrowDown', text: pdaType.toUpperCase() });
      } else if (lowTypes.includes(pdaType)) {
        const bar = findBarContaining(pdaTime);
        if (bar) markers.push({ time: bar.time, position: 'belowBar', color: '#d28349', shape: 'arrowUp', text: pdaType.toUpperCase() });
      } else if (pdaType === 'fvg') {
        const bar = findBarContaining(pdaTime);
        if (bar) {
          markers.push({ time: bar.time, position: 'aboveBar', color: '#6bafcf', shape: 'circle', text: 'FVG▲' });
          markers.push({ time: bar.time, position: 'belowBar', color: '#6bafcf', shape: 'circle', text: 'FVG▼' });
        }
      } else if (pdaType === 'ob') {
        const barStart = findBarContaining(pdaTime);
        const barEnd = pdaTimeEnd ? findBarContaining(pdaTimeEnd) : barStart;
        if (barStart) markers.push({ time: barStart.time, position: 'aboveBar', color: '#d4a056', shape: 'circle', text: 'OB▲' });
        if (barEnd && barEnd !== barStart) markers.push({ time: barEnd.time, position: 'belowBar', color: '#d4a056', shape: 'circle', text: 'OB▼' });
      } else if (pdaType === 'eqh') {
        const bar = findBarContaining(pdaTime);
        if (bar) markers.push({ time: bar.time, position: 'aboveBar', color: '#b48cff', shape: 'circle', text: 'EQH' });
      } else if (pdaType === 'eql') {
        const bar = findBarContaining(pdaTime);
        if (bar) markers.push({ time: bar.time, position: 'belowBar', color: '#b48cff', shape: 'circle', text: 'EQL' });
      } else {
        // Fallback: generic marker for unknown types
        const bar = findBarContaining(pdaTime);
        if (bar) markers.push({ time: bar.time, position: 'aboveBar', color: '#d4a056', shape: 'circle', text: pdaType.toUpperCase() });
      }
      return markers;
    }

    async function loadData() {
      const startRaw = document.getElementById('startTime').value.trim();
      const endRaw = document.getElementById('endTime').value.trim();
      const tf = document.getElementById('tfSelect').value;
      const padding = getPadding();

      const start = parseTime(startRaw);
      const end = parseTime(endRaw);
      if (!start || !end) {
        alert('时间格式：2012-01-09 11:20');
        return;
      }

      const container = document.getElementById('chartContainer');
      container.innerHTML = '<div class="loading">加载中...</div>';

      try {
        const url = `${API_BASE}/v2/bars?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}&tf=${tf}&padding=${padding}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        const bars = data.result;
        if (!bars.length) throw new Error('该时段无数据');

        initChart();

        const candleData = bars.map(bar => ({
          time: bar.timestamp,
          open: bar.open,
          high: bar.high,
          low: bar.low,
          close: bar.close,
        }));

        candleSeries.setData(candleData);
        lastCandleData = candleData;

        // Draw midnight vertical lines (1H and below only)
        drawMidnightLines(candleData, parseInt(tf));

        // Build markers: S/E + PDA
        const markers = [];
        const startTs = timeToTimestamp(start);
        const endTs = timeToTimestamp(end);

        if (document.getElementById('showSE').checked) {
          const startBar = [...candleData].reverse().find(b => b.time <= startTs);
          if (startBar) {
            markers.push({ time: startBar.time, position: 'belowBar', color: '#d4a056', shape: 'arrowUp', text: 'S' });
          }

          const endBar = [...candleData].reverse().find(b => b.time <= endTs);
          if (endBar) {
            markers.push({ time: endBar.time, position: 'aboveBar', color: '#c87070', shape: 'arrowDown', text: 'E' });
          }
        }

        // Add PDA markers if we have a PDA loaded
        if (currentPda) {
          const pdaMarkers = buildPdaMarkers(currentPda, candleData);
          markers.push(...pdaMarkers);
        }

        // Sort markers by time (required by createSeriesMarkers)
        markers.sort((a, b) => a.time - b.time);

        if (markers.length) {
          seriesMarkers = LightweightCharts.createSeriesMarkers(candleSeries, markers);
        }

        // If PDA loaded, center viewport on PDA; otherwise full range
        if (currentPda) {
          centerOnPda(currentPda, candleData);
        } else {
          resetView();
        }

        // Draw midnight lines after viewport is set
        drawMidnightLines(candleData, parseInt(tf));

        const first = bars[0];
        const last = bars[bars.length - 1];
        let info = `${bars.length} bars · ${first.time} → ${last.time} · TF=${tf}m`;
        renderPdaBadge(currentPda);
        document.getElementById('infoText').textContent = info;
      } catch (err) {
        container.innerHTML = `<div class="error">加载失败: ${err.message}</div>`;
      }
    }

    function centerOnPda(pda, candleData) {
      if (!chart || !candleData?.length) return;
      const ts = chart.timeScale();
      const pdaTime = timeToTimestamp(pda.occurrenceTime || pda.anchorTime || '');
      if(!pdaTime) { resetView(); return; }

      // Find the bar that contains the PDA time
      const pdaBar = [...candleData].reverse().find(b => b.time <= pdaTime);
      if (!pdaBar) { resetView(); return; }

      const barInterval = candleData.length > 1 ? candleData[1].time - candleData[0].time : 60;
      const contextBars = 15; // bars of context on each side

      ts.setVisibleRange({
        from: pdaBar.time - contextBars * barInterval,
        to: pdaBar.time + (contextBars + RIGHT_MARGIN_BARS) * barInterval,
      });
    }

    function drawMidnightLines(candleData, tfMinutes) {
      // Remove previous midnight lines
      midnightLineSeries.forEach(s => chart.removeSeries(s));
      midnightLineSeries = [];

      if (tfMinutes > 60) return;
      if (!document.getElementById('midnightLines').checked) return;
      if (!candleData?.length) return;

      // Find all unique midnight timestamps in the data
      const midnights = new Set();
      for (const bar of candleData) {
        const d = new Date(bar.time * 1000);
        if (d.getUTCHours() === 0 && d.getUTCMinutes() === 0) {
          midnights.add(bar.time);
        }
      }

      // For each midnight, draw a vertical line using LineSeries
      for (const ts of midnights) {
        const lineSeries = chart.addSeries(LightweightCharts.LineSeries, {
          color: 'rgba(180, 80, 80, 0.25)',
          lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Solid,
          crosshairMarkerVisible: false,
          lastValueVisible: false,
          priceLineVisible: false,
        });
        const bar = candleData.find(b => b.time === ts);
        if (bar) {
          lineSeries.setData([
            { time: ts, value: bar.low * 0.5 },
            { time: ts, value: bar.high * 2 },
          ]);
          midnightLineSeries.push(lineSeries);
        }
      }
    }

    async function loadPdaMode(pdaId) {
      const container = document.getElementById('chartContainer');
      container.innerHTML = '<div class="loading">加载 PDA 数据...</div>';

      try {
        const res = await fetch(`${API_BASE}/v2/pda_records?pda_id=${encodeURIComponent(pdaId)}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        const records = data.result?.records || [];
        const pda = records.find(r => r.pdaId === pdaId);
        if (!pda) throw new Error(`PDA ${pdaId} 未找到`);

        currentPda = pda;

        // Calculate time range around PDA (string-based to avoid timezone issues)
        const pdaTime = pda.occurrenceTime || pda.anchorTime || '';
        if (!pdaTime) throw new Error('PDA 无时间信息');

        const m = String(pdaTime).match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
        if (!m) throw new Error('PDA 时间格式异常');

        // D-level PDAs use 1H for precise positioning; others use their own TF
        const tf = pda.timeframe === 'D' ? 60 : pda.timeframe === '4H' ? 240 : pda.timeframe === '1H' ? 60 : pda.timeframe === '30M' ? 30 : pda.timeframe === '15M' ? 15 : pda.timeframe === '5M' ? 5 : pda.timeframe === '1M' ? 1 : 60;

        // Context: ±2 hours or ±5 bars, whichever is larger
        const contextMin = Math.max(120, 5 * tf);
        const center = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]));
        const startDt = new Date(center.getTime() - contextMin * 60000);
        const endDt = new Date(center.getTime() + contextMin * 60000);
        const fmt = d => `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;

        document.getElementById('startTime').value = fmt(startDt);
        document.getElementById('endTime').value = fmt(endDt);
        document.getElementById('tfSelect').value = String(tf);
        document.getElementById('paddingInput').value = '19';

        loadData();
      } catch (err) {
        container.innerHTML = `<div class="error">加载 PDA 失败: ${err.message}</div>`;
      }
    }

    function loadFromParams() {
      const params = new URLSearchParams(window.location.search);

      // PDA mode: pda_id takes priority
      const pdaId = params.get('pda_id');
      if (pdaId) {
        loadPdaMode(pdaId);
        return;
      }

      // Traditional start/end mode
      const start = params.get('start');
      const end = params.get('end');
      const tf = params.get('tf') || '60';
      const padding = params.get('padding');

      if (start && end) {
        document.getElementById('startTime').value = start;
        document.getElementById('endTime').value = end;
        document.getElementById('tfSelect').value = tf;
        if (padding) document.getElementById('paddingInput').value = padding;
        loadData();
      }
    }

    document.getElementById('loadBtn').onclick = loadData;
    document.getElementById('paddingInput').onchange = getPadding;
    document.getElementById('midnightLines').onchange = () => { if (lastCandleData) drawMidnightLines(lastCandleData, parseInt(document.getElementById('tfSelect').value)); };
    document.getElementById('showSE').onchange = rebuildMarkers;

    function rebuildMarkers() {
      if (!chart || !candleSeries || !lastCandleData) return;
      const tf = document.getElementById('tfSelect').value;
      const start = parseTime(document.getElementById('startTime').value.trim());
      const end = parseTime(document.getElementById('endTime').value.trim());
      if (!start || !end) return;

      const markers = [];
      const startTs = timeToTimestamp(start);
      const endTs = timeToTimestamp(end);

      if (document.getElementById('showSE').checked) {
        const startBar = [...lastCandleData].reverse().find(b => b.time <= startTs);
        if (startBar) {
          markers.push({ time: startBar.time, position: 'belowBar', color: '#d4a056', shape: 'arrowUp', text: 'S' });
        }
        const endBar = [...lastCandleData].reverse().find(b => b.time <= endTs);
        if (endBar) {
          markers.push({ time: endBar.time, position: 'aboveBar', color: '#c87070', shape: 'arrowDown', text: 'E' });
        }
      }

      if (currentPda) {
        const pdaMarkers = buildPdaMarkers(currentPda, lastCandleData);
        markers.push(...pdaMarkers);
      }

      markers.sort((a, b) => a.time - b.time);
      if (seriesMarkers) {
        seriesMarkers.setMarkers([]);
        seriesMarkers = null;
      }
      if (markers.length) {
        seriesMarkers = LightweightCharts.createSeriesMarkers(candleSeries, markers);
      }
    }

    function resetView() {
      if (!chart || !lastCandleData || !lastCandleData.length) return;
      const ts = chart.timeScale();
      ts.scrollToRealTime();
      ts.setVisibleRange({
        from: lastCandleData[0].time,
        to: lastCandleData[lastCandleData.length - 1].time + RIGHT_MARGIN_BARS * (lastCandleData.length > 1 ? lastCandleData[1].time - lastCandleData[0].time : 60),
      });
    }

    document.getElementById('resetBtn').onclick = resetView;

    loadFromParams();
  </script>
</body>
</html>
