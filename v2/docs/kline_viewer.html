    function buildManualPdaBody() {
      const pdaType = document.getElementById('manualPdaType').value;
      const tf = document.getElementById('manualPdaTF').value;
      const direction = document.getElementById('manualPdaDirection').value;
      const anchorTime = parseTime(document.getElementById('manualAnchorTime').value.trim());
      const startTime = parseTime(document.getElementById('manualStartTime').value.trim());
      const endTime = parseTime(document.getElementById('manualEndTime').value.trim());
      const price = parseNumberOrNull(document.getElementById('manualPrice').value);
      const priceHigh = parseNumberOrNull(document.getElementById('manualPriceHigh').value);
      const priceLow = parseNumberOrNull(document.getElementById('manualPriceLow').value);
      const note = document.getElementById('manualPdaNote').value.trim();

      if (!pdaType) throw new Error('请选择 PDA 类型');
      const body = { instrument: 'NQ', timeframe: tf, pdaType, note };

      if (['bsl', 'ssl'].includes(pdaType)) {
        if (!anchorTime) throw new Error('请填写 Anchor Time');
        if (price == null) throw new Error('BSL/SSL 需要 Price');
        body.anchorTime = anchorTime;
        body.price = price;
      } else if (['eqh', 'eql'].includes(pdaType)) {
        if (!anchorTime) throw new Error('请填写 Anchor Time');
        body.anchorTime = anchorTime;
        if (priceHigh != null || priceLow != null) {
          if (priceHigh == null || priceLow == null) throw new Error('EQH/EQL 使用区间时需要 Price High 和 Price Low');
          body.priceHigh = priceHigh;
          body.priceLow = priceLow;
        } else {
          if (price == null) throw new Error('EQH/EQL 需要 Price 或价格区间');
          body.price = price;
        }
      } else if (pdaType === 'fvg') {
        if (!anchorTime) throw new Error('请填写 Anchor Time');
        if (!direction) throw new Error('FVG 需要方向');
        if (priceHigh == null || priceLow == null) throw new Error('FVG 需要 Price High 和 Price Low');
        body.anchorTime = anchorTime;
        body.direction = direction;
        body.priceHigh = priceHigh;
        body.priceLow = priceLow;
      } else if (pdaType === 'ob') {
        if (!direction) throw new Error('OB 需要方向');
        if (priceHigh == null || priceLow == null) throw new Error('OB 需要 Price High 和 Price Low');
        body.extraFields = { start_time: startTime || '', end_time: endTime || '' };
        body.anchorTime = anchorTime || startTime || endTime;
        if (!body.anchorTime) throw new Error('OB 需要 Anchor/Start/End 至少一个时间');
        body.direction = direction;
        body.priceHigh = priceHigh;
        body.priceLow = priceLow;
      }

      if (panelEditingPdaId) body.pdaId = panelEditingPdaId;
      return body;
    }

      if (!lastCandleData?.length) {

      // Check if time is within chart range

      const lastTs = lastCandleData[lastCandleData.length - 1].timestamp;
      if (tsMs < firstTs || tsMs > lastTs) {
        input.classList.add('locate-flash'); setTimeout(() => input.classList.remove('locate-flash'), 1600);
        return;
      }

      chart.scrollToTimestamp(tsMs, 0);
      const barSpace = chart.getBarSpace();
      const marginPixels = barSpace * RIGHT_MARGIN_BARS;
      chart.scrollByDistance(-marginPixels, 0);
    }

    async function autoFillObRange() {
      const startTime = parseTime(document.getElementById('manualStartTime').value.trim());
      const endTime = parseTime(document.getElementById('manualEndTime').value.trim());
      if (!startTime || !endTime) {
        throw new Error('请先填写 Start Time 和 End Time');
      }

      const tfValue = document.getElementById('manualPdaTF').value;
      const tfSpec = getManualTfSpec(tfValue);
      if (!tfSpec) {
        throw new Error('请选择有效周期');
      }

      // Calculate number of bars in the range
      const startTs = timeToTimestamp(startTime);
      const endTs = timeToTimestamp(endTime);
      const barCount = Math.floor((endTs - startTs) / (tfSpec.minutes * 60)) + 1;

      if (barCount < 1) {
        throw new Error('Start Time 必须早于或等于 End Time');
      }
      if (barCount > 100) {
        throw new Error(`范围过大（${barCount} 根 K 线），请缩小范围或使用更大周期`);
      }

      // Fetch all bars in the range
      const barResults = [];
      let currentTime = startTime;
      for (let i = 0; i < barCount; i++) {
        const result = await fetchPriceWindow(currentTime, tfSpec.minutes, 'high');
        barResults.push(result);
        currentTime = addMinutesToUtcTime(currentTime, tfSpec.minutes);
      }

      // Calculate max high and min low
      const allHighs = barResults.map(r => Number(r.ohlc.high));
      const allLows = barResults.map(r => Number(r.ohlc.low));
      const priceHigh = Math.max(...allHighs);
      const priceLow = Math.min(...allLows);

      // Auto-calculate direction based on the first bar's color
      const firstBar = barResults[0].ohlc;
      const direction = firstBar.close >= firstBar.open ? 'bullish' : 'bearish';

      // Fill form fields
      document.getElementById('manualPriceHigh').value = formatManualPriceValue(priceHigh);
      document.getElementById('manualPriceLow').value = formatManualPriceValue(priceLow);
      document.getElementById('manualPdaDirection').value = direction;

      toast(`已取值 ${direction} OB：${priceHigh} / ${priceLow}（${barCount}根${tfSpec.label}）`, 'success');
    }
    document.getElementById('manualPreviewOverlayBtn').onclick = toggleManualPreview;

    function tfToMinutes(tf) {
      const map = { '1M': '1', '5M': '5', '15M': '15', '30M': '30', '1H': '60', '4H': '240', D: '1440', '1W': '10080' };
      return map[tf] || '60';
    }

    // Auto-normalize time inputs on blur (201201091120 → 2012-01-09 11:20)
    ['startTime', 'endTime', 'panelFilterTimeFrom', 'panelFilterTimeTo', 'manualAnchorTime', 'manualStartTime', 'manualEndTime'].forEach(id => {
      document.getElementById(id).addEventListener('focusout', (e) => {
        const normed = parseTime(e.target.value);
        if (normed && normed !== e.target.value) e.target.value = normed;
      });
    });

    // ── Right-click context menu ──
    let crosshairBarIndex = -1;
    const ctxMenu = document.getElementById('ctxMenu');

    function showCtxMenu(x, y) {
      ctxMenu.style.left = x + 'px';
      ctxMenu.style.top = y + 'px';
      ctxMenu.style.display = 'block';
    }
    function hideCtxMenu() {
      ctxMenu.style.display = 'none';
    }

    document.getElementById('chartContainer').addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (!chart || crosshairBarIndex < 0) return;

      // Check if Shift is pressed for OB range selection
      if (e.shiftKey && obSelectionState) {
        // Second click: complete OB range selection
        completeObSelection();
        return;
      }

      showCtxMenu(e.clientX, e.clientY);
    });
    document.addEventListener('click', hideCtxMenu);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (obSelectionState) {
          obSelectionState = null;
          toast('已取消 OB 选择', 'info');
        }
        hideCtxMenu();
      }
    });

    document.getElementById('ctxCopyTime').onclick = () => {
      if (!lastCandleData || crosshairBarIndex < 0 || crosshairBarIndex >= lastCandleData.length) return;
      const ts = lastCandleData[crosshairBarIndex].timestamp;
      const d = new Date(ts);
      const text = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
      navigator.clipboard.writeText(text).then(() => {
        document.getElementById('ctxCopyTime').textContent = '已复制';
        setTimeout(() => { document.getElementById('ctxCopyTime').textContent = '复制当前时间'; }, 800);
      });
      hideCtxMenu();
    };

    // Context menu: Mark PDA
    function markPdaFromChart(pdaType) {
      if (!lastCandleData || crosshairBarIndex < 0 || crosshairBarIndex >= lastCandleData.length) {
        toast('无法获取当前 K 线数据', 'error');
        return;
      }
      const bar = lastCandleData[crosshairBarIndex];
      const d = new Date(bar.timestamp);
      const timeStr = formatUtcDateTime(d);

      // Sync timeframe from chart
      const chartTfMin = document.getElementById('tfSelect').value;
      const manualTf = Object.entries(MANUAL_TF_TO_CHART_TF).find(([, minutes]) => minutes === chartTfMin)?.[0] || '1H';

      // Fill form fields
      document.getElementById('manualPdaType').value = pdaType;
      document.getElementById('manualPdaTF').value = manualTf;
      document.getElementById('manualAnchorTime').value = timeStr;

      // Clear price fields first
      document.getElementById('manualPrice').value = '';
      document.getElementById('manualPriceHigh').value = '';
      document.getElementById('manualPriceLow').value = '';

      // For point types (BSL/SSL), fill price and set direction
      if (pdaType === 'bsl') {
        // BSL = Buy Side Liquidity = high point
        document.getElementById('manualPrice').value = formatManualPriceValue(bar.high);
        document.getElementById('manualPdaDirection').value = 'bullish';
      } else if (pdaType === 'ssl') {
        // SSL = Sell Side Liquidity = low point
        document.getElementById('manualPrice').value = formatManualPriceValue(bar.low);
        document.getElementById('manualPdaDirection').value = 'bearish';
      } else if (pdaType === 'fvg') {
        // FVG = Fair Value Gap, need 3 bars: first, anchor (current), third
        if (crosshairBarIndex < 1 || crosshairBarIndex >= lastCandleData.length - 1) {
          toast('FVG 需要前后各一根 K 线，当前位置无法标记', 'error');
          return;
        }
        const firstBar = lastCandleData[crosshairBarIndex - 1];
        const thirdBar = lastCandleData[crosshairBarIndex + 1];

        // Check for bullish FVG: first.high < third.low
        if (firstBar.high < thirdBar.low) {
          document.getElementById('manualPriceHigh').value = formatManualPriceValue(thirdBar.low);
          document.getElementById('manualPriceLow').value = formatManualPriceValue(firstBar.high);
          document.getElementById('manualPdaDirection').value = 'bullish';
        }
        // Check for bearish FVG: first.low > third.high
        else if (firstBar.low > thirdBar.high) {
          document.getElementById('manualPriceHigh').value = formatManualPriceValue(firstBar.low);
          document.getElementById('manualPriceLow').value = formatManualPriceValue(thirdBar.high);
          document.getElementById('manualPdaDirection').value = 'bearish';
        }
        // No FVG detected
        else {
          toast('当前三根 K 线未形成 FVG，请手动填写', 'warning');
          document.getElementById('manualPdaDirection').value = '';
        }
      } else if (pdaType === 'ob') {
        // OB = Order Block, use start/end time (single bar initially)
        // Direction will be auto-calculated based on bar color
        document.getElementById('manualStartTime').value = timeStr;
        document.getElementById('manualEndTime').value = timeStr;
        document.getElementById('manualPriceHigh').value = formatManualPriceValue(bar.high);
        document.getElementById('manualPriceLow').value = formatManualPriceValue(bar.low);
        // Auto-calculate direction based on bar color
        const isBullish = bar.close >= bar.open;
        document.getElementById('manualPdaDirection').value = isBullish ? 'bullish' : 'bearish';
      }

      // Switch to Manual PDA panel
      const manualSection = document.querySelector('[data-panel-section="manual"]');
      if (manualSection) {
        manualSection.open = true;
        manualSection.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }

      toast(`已填充 ${pdaType.toUpperCase()} 标记`, 'success');
      hideCtxMenu();
    }

    document.getElementById('ctxMarkBsl').onclick = () => markPdaFromChart('bsl');
    document.getElementById('ctxMarkSsl').onclick = () => markPdaFromChart('ssl');
    document.getElementById('ctxMarkFvg').onclick = () => markPdaFromChart('fvg');
    document.getElementById('ctxMarkOb').onclick = () => {
      // Start OB range selection
      startObSelection();
    };

    function startObSelection() {
      if (!lastCandleData || crosshairBarIndex < 0 || crosshairBarIndex >= lastCandleData.length) {
        toast('无法获取当前 K 线数据', 'error');
        return;
      }

      const bar = lastCandleData[crosshairBarIndex];
      const d = new Date(bar.timestamp);
      const timeStr = formatUtcDateTime(d);

      obSelectionState = {
        startIndex: crosshairBarIndex,
        startTime: timeStr,
        startBar: bar
      };

      toast('已选择起点，请 Shift + 右键选择终点', 'info');
      hideCtxMenu();
    }

    function completeObSelection() {
      if (!obSelectionState) return;
      if (!lastCandleData || crosshairBarIndex < 0 || crosshairBarIndex >= lastCandleData.length) {
        toast('无法获取当前 K 线数据', 'error');
        obSelectionState = null;
        return;
      }

      const endBar = lastCandleData[crosshairBarIndex];
      const endD = new Date(endBar.timestamp);
      const endTimeStr = formatUtcDateTime(endD);

      // Ensure start <= end
      let startTime = obSelectionState.startTime;
      let endTime = endTimeStr;
      if (obSelectionState.startIndex > crosshairBarIndex) {
        // Swap if user selected in reverse order
        [startTime, endTime] = [endTime, startTime];
      }

      // Sync timeframe from chart
      const chartTfMin = document.getElementById('tfSelect').value;
      const manualTf = Object.entries(MANUAL_TF_TO_CHART_TF).find(([, minutes]) => minutes === chartTfMin)?.[0] || '1H';

      // Fill form fields
      document.getElementById('manualPdaType').value = 'ob';
      document.getElementById('manualPdaTF').value = manualTf;
      document.getElementById('manualStartTime').value = startTime;
      document.getElementById('manualEndTime').value = endTime;

      // Clear other fields
      document.getElementById('manualAnchorTime').value = '';
      document.getElementById('manualPrice').value = '';
      document.getElementById('manualPriceHigh').value = '';
      document.getElementById('manualPriceLow').value = '';
      document.getElementById('manualPdaDirection').value = '';

      // Update field state
      updateManualFieldState();

      // Switch to Manual PDA panel
      const manualSection = document.querySelector('[data-panel-section="manual"]');
      if (manualSection) {
        manualSection.open = true;
        manualSection.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }

      // Auto-fill price range
      autoFillObRange().then(() => {
        toast('已填充 OB 区间标记', 'success');
      }).catch(err => {
        toast(`OB 取值失败: ${err.message}`, 'error');
      });

      // Clear selection state
      obSelectionState = null;
    }

    // Track crosshair position for context menu
    function setupCrosshairTracking() {
      if (!chart) return;
      chart.subscribeAction('onCrosshairChange', (data) => {
        if (data && data.dataIndex !== undefined) {
          crosshairBarIndex = data.dataIndex;
        }
      });
    }

    loadFromParams();
    panelSearchPdas();
  </script>
</body>
</html>
