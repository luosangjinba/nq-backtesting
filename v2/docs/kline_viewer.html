<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K线查看器</title>
  <style>
    :root {
      --bg: #1e1b18;
      --panel: #2a2520;
      --line: #5a5045;
      --text: #f5f0e8;
      --text-dim: #c8bfb0;
      --muted: #a89a8a;
      --accent: #d4a056;
      --success: #7db87d;
      --danger: #c87070;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .toolbar {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .toolbar label {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .toolbar input, .toolbar select {
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      width: 140px;
    }
    .toolbar select { width: 80px; }
    .toolbar input[type="number"] { width: 60px; }
    .toolbar button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .toolbar button:hover { opacity: 0.85; }
    .toolbar .info {
      color: var(--text-dim);
      font-size: 0.8rem;
      margin-left: auto;
    }
    .toolbar .warn {
      color: var(--accent);
      font-size: 0.8rem;
      margin-left: 4px;
    }
    .chart-container {
      flex: 1;
      min-height: 0;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .error {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--danger);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <label>Start</label>
    <input id="startTime" placeholder="2012-01-09 11:20">
    <label>End</label>
    <input id="endTime" placeholder="2012-01-09 14:37">
    <label>TF</label>
    <select id="tfSelect">
      <option value="1">1m</option>
      <option value="5">5m</option>
      <option value="15">15m</option>
      <option value="30">30m</option>
      <option value="60" selected>1H</option>
      <option value="240">4H</option>
      <option value="1440">1D</option>
      <option value="10080">1W</option>
    </select>
    <label>扩展</label>
    <input id="paddingInput" type="number" value="19" min="0" max="500" placeholder="19">
    <button id="loadBtn">加载</button>
    <span class="warn" id="paddingWarn"></span>
    <div class="info" id="infoText"></div>
  </div>
  <div class="chart-container" id="chartContainer">
    <div class="loading">输入时间范围后点击「加载」</div>
  </div>

  <script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    const API_BASE = 'http://127.0.0.1:8765';
    const MAX_PADDING = 500;
    let chart = null;
    let candleSeries = null;
    let seriesMarkers = null;

    function getPadding() {
      const input = document.getElementById('paddingInput');
      let val = parseInt(input.value) || 0;
      const warn = document.getElementById('paddingWarn');
      if (val > MAX_PADDING) {
        val = MAX_PADDING;
        input.value = MAX_PADDING;
        warn.textContent = `超限，已调整为 ${MAX_PADDING}`;
      } else {
        warn.textContent = '';
      }
      return val;
    }

    function initChart() {
      const container = document.getElementById('chartContainer');
      container.innerHTML = '';

      chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
          background: { color: '#1e1b18' },
          textColor: '#a89a8a',
          fontSize: 12,
        },
        grid: {
          vertLines: { color: '#2a2520' },
          horzLines: { color: '#2a2520' },
        },
        crosshair: {
          mode: LightweightCharts.CrosshairMode.Normal,
          vertLine: { color: '#d4a056', width: 1, style: LightweightCharts.LineStyle.Dashed },
          horzLine: { color: '#d4a056', width: 1, style: LightweightCharts.LineStyle.Dashed },
        },
        rightPriceScale: {
          borderColor: '#5a5045',
        },
        timeScale: {
          borderColor: '#5a5045',
          timeVisible: true,
          secondsVisible: false,
        },
      });

      candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
        upColor: '#7db87d',
        downColor: '#c87070',
        borderUpColor: '#7db87d',
        borderDownColor: '#c87070',
        wickUpColor: '#34c9b0',
        wickDownColor: '#d28349',
      });

      const resizeObserver = new ResizeObserver(entries => {
        for (const entry of entries) {
          chart.applyOptions({ width: entry.contentRect.width, height: entry.contentRect.height });
        }
      });
      resizeObserver.observe(container);
    }

    function parseTime(text) {
      const match = text.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})(?::(\d{2}))?$/);
      if (!match) return null;
      return `${match[1]}-${match[2]}-${match[3]} ${match[4]}:${match[5]}`;
    }

    function timeToTimestamp(text) {
      const match = text.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
      if (!match) return 0;
      return Math.floor(new Date(match[1], match[2] - 1, match[3], match[4], match[5]).getTime() / 1000);
    }

    async function loadData() {
      const startRaw = document.getElementById('startTime').value.trim();
      const endRaw = document.getElementById('endTime').value.trim();
      const tf = document.getElementById('tfSelect').value;
      const padding = getPadding();

      const start = parseTime(startRaw);
      const end = parseTime(endRaw);
      if (!start || !end) {
        alert('时间格式：2012-01-09 11:20');
        return;
      }

      const container = document.getElementById('chartContainer');
      container.innerHTML = '<div class="loading">加载中...</div>';

      try {
        const url = `${API_BASE}/v2/bars?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}&tf=${tf}&padding=${padding}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        const bars = data.result;
        if (!bars.length) throw new Error('该时段无数据');

        initChart();

        const candleData = bars.map(bar => ({
          time: bar.timestamp,
          open: bar.open,
          high: bar.high,
          low: bar.low,
          close: bar.close,
        }));

        candleSeries.setData(candleData);

        // Mark start/end on chart
        const startTs = timeToTimestamp(start);
        const endTs = timeToTimestamp(end);
        const markers = [];

        const startBar = candleData.find(b => b.time >= startTs);
        if (startBar) {
          markers.push({
            time: startBar.time,
            position: 'belowBar',
            color: '#d4a056',
            shape: 'arrowUp',
            text: 'S',
          });
        }

        const endBar = [...candleData].reverse().find(b => b.time <= endTs);
        if (endBar) {
          markers.push({
            time: endBar.time,
            position: 'aboveBar',
            color: '#c87070',
            shape: 'arrowDown',
            text: 'E',
          });
        }

        if (markers.length) {
          seriesMarkers = LightweightCharts.createSeriesMarkers(candleSeries, markers);
        }

        chart.timeScale().fitContent();

        const first = bars[0];
        const last = bars[bars.length - 1];
        document.getElementById('infoText').textContent =
          `${bars.length} bars · ${first.time} → ${last.time} · TF=${tf}m`;
      } catch (err) {
        container.innerHTML = `<div class="error">加载失败: ${err.message}</div>`;
      }
    }

    function loadFromParams() {
      const params = new URLSearchParams(window.location.search);
      const start = params.get('start');
      const end = params.get('end');
      const tf = params.get('tf') || '60';
      const padding = params.get('padding');

      if (start && end) {
        document.getElementById('startTime').value = start;
        document.getElementById('endTime').value = end;
        document.getElementById('tfSelect').value = tf;
        if (padding) document.getElementById('paddingInput').value = padding;
        loadData();
      }
    }

    document.getElementById('loadBtn').onclick = loadData;
    document.getElementById('paddingInput').onchange = getPadding;

    loadFromParams();
  </script>
</body>
</html>
