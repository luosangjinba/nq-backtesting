<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K线查看器</title>
  <style>
    :root {
      --bg: #1e1b18;
      --panel: #2a2520;
      --line: #5a5045;
      --text: #f5f0e8;
      --text-dim: #c8bfb0;
      --muted: #a89a8a;
      --accent: #d4a056;
      --success: #7db87d;
      --danger: #c87070;
      --info: #6bafcf;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .chart-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .right-panel {
      width: 640px;
      min-width: 0;
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.2s ease;
    }
    .right-panel.collapsed {
      width: 0;
      border-left: none;
    }
    .right-panel-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .panel-title {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }
    .panel-title strong {
      color: var(--accent);
      font-size: 13px;
      line-height: 1.2;
    }
    .panel-title span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
    }
    .panel-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-link {
      color: var(--text-dim);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      background: var(--bg);
    }
    .panel-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .right-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
    .toggle-panel-btn {
      position: absolute;
      right: 640px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 48px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-right: none;
      border-radius: 4px 0 0 4px;
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      z-index: 10;
      transition: right 0.2s ease;
    }
    .toggle-panel-btn.collapsed {
      right: 0;
    }
    .toggle-panel-btn:hover {
      background: var(--panel-2, #363028);
    }
    .panel-section {
      margin-bottom: 8px;
    }
    .panel-section summary {
      cursor: pointer;
      padding: 8px 0;
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--accent);
      border-bottom: 1px solid var(--line);
      user-select: none;
      list-style: none;
    }
    .panel-section summary::-webkit-details-marker { display: none; }
    .panel-section summary::before {
      content: '▾ ';
    }
    .panel-section[open] summary::before {
      content: '▾ ';
    }
    .panel-section:not([open]) summary::before {
      content: '▸ ';
    }
    .section-content {
      padding: 8px 0 4px;
    }
    .form-group {
      margin-bottom: 8px;
    }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .form-group select,
    .form-group input,
    .form-group textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 0.82rem;
      font-family: inherit;
    }
    .form-group select:focus,
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .form-group textarea {
      resize: vertical;
    }
    .btn-sm {
      background: var(--panel-2, #363028);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.78rem;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-sm:hover {
      background: var(--accent);
      color: var(--bg);
    }
    .btn-sm:disabled {
      opacity: 0.35;
      cursor: default;
      color: var(--muted);
    }
    .btn-sm:disabled:hover {
      background: var(--panel-2, #363028);
      color: var(--muted);
    }
    .btn-danger {
      border-color: #8b3a3a;
      color: #e07070;
    }
    .btn-danger:hover {
      background: #8b3a3a;
      color: #fff;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-row.wrap {
      flex-wrap: wrap;
    }
    .btn-sm.primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 700;
    }
    .btn-sm.ghost {
      background: transparent;
    }
    .panel-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .panel-tab {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }
    .panel-tab.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .field-row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .inline-field {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      align-items: end;
    }
    .scope-strip {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: end;
      margin-bottom: 8px;
    }
    .micro-stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 8px 0;
    }
    .micro-stat {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--bg);
      padding: 6px 8px;
      min-width: 0;
    }
    .micro-stat label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
      margin-bottom: 2px;
    }
    .micro-stat strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .panel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      border: 1px solid var(--line);
      background: var(--bg);
    }
    .panel-table th,
    .panel-table td {
      padding: 6px 7px;
      border-bottom: 1px solid rgba(90, 80, 69, 0.55);
      text-align: left;
      vertical-align: middle;
    }
    .panel-table th {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #241f1b;
      white-space: nowrap;
    }
    .panel-table tr:last-child td {
      border-bottom: none;
    }
    .panel-table tbody tr {
      cursor: pointer;
    }
    .panel-table tbody tr:hover {
      background: rgba(212, 160, 86, 0.08);
    }
    .panel-table tbody tr.selected {
      background: rgba(212, 160, 86, 0.16);
      outline: 1px solid rgba(212, 160, 86, 0.55);
      outline-offset: -1px;
    }
    .mono {
      font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 18px;
      padding: 1px 7px;
      border-radius: 9px;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .pill.auto { background: rgba(107,175,207,0.15); color: var(--info); }
    .pill.manual { background: rgba(212,160,86,0.15); color: var(--accent); }
    .pill.bull { background: rgba(125,184,125,0.15); color: var(--success); }
    .pill.bear { background: rgba(200,112,112,0.15); color: var(--danger); }
    .empty-panel-row {
      height: 92px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }
    .match-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }
    .match-card {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--bg);
      padding: 7px 8px;
    }
    .match-card label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 2px;
    }
    .match-card strong {
      color: var(--text);
      font-size: 14px;
    }
    .panel-pagination {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .panel-pagination button {
      min-width: 28px;
      height: 26px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text-dim);
      cursor: pointer;
      font-size: 11px;
    }
    .panel-pagination button.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .panel-pagination button:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .panel-page-info {
      color: var(--muted);
      font-size: 11px;
      margin-left: auto;
    }
    .toast-container {
      position: fixed;
      top: 14px;
      right: 660px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      padding: 9px 14px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 650;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      max-width: 360px;
    }
    .toast-success { background: var(--success); color: #182718; }
    .toast-error { background: var(--danger); color: #2b1717; }
    .toast-info { background: var(--info); color: #16232a; }
    .toolbar {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .toolbar label {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .toolbar input, .toolbar select {
      background: var(--bg);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      width: 140px;
    }
    .toolbar select { width: 80px; }
    .toolbar input[type="number"] { width: 60px; }
    .toolbar button {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .toolbar button:hover { opacity: 0.85; }
    .toolbar button.secondary {
      background: var(--panel);
      color: var(--text-dim);
      border: 1px solid var(--line);
    }
    .toolbar .info {
      color: var(--text-dim);
      font-size: 0.8rem;
      margin-left: auto;
    }
    .toolbar .warn {
      color: var(--accent);
      font-size: 0.8rem;
      margin-left: 4px;
    }
    .toolbar .pda-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .pda-badge-bsl { background: rgba(125,184,125,0.15); color: var(--success); }
    .pda-badge-ssl { background: rgba(200,112,112,0.15); color: var(--danger); }
    .pda-badge-fvg { background: rgba(107,175,207,0.15); color: var(--info); }
    .pda-badge-ob  { background: rgba(212,160,86,0.15); color: var(--accent); }
    .pda-badge-eqh { background: rgba(180,140,255,0.15); color: #b48cff; }
    .pda-badge-eql { background: rgba(180,140,255,0.15); color: #b48cff; }
    #chartContainer {
      flex: 1;
      min-height: 0;
      background: #1e1b18;
    }
    .loading, .error {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 0.9rem;
    }
    .loading { color: var(--muted); }
    .error { color: var(--danger); }
    .ctx-menu {
      position: fixed;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 0;
      min-width: 160px;
      z-index: 100;
      display: none;
    }
    .ctx-menu-item {
      padding: 6px 14px;
      font-size: 0.85rem;
      color: var(--text-dim);
      cursor: pointer;
    }
    .ctx-menu-item:hover {
      background: var(--bg);
      color: var(--text);
    }
  </style>
</head>
<body>
  <!-- Toggle button for right panel -->
  <button class="toggle-panel-btn" id="togglePanelBtn" title="折叠/展开面板">◀</button>
  <div class="toast-container" id="toastContainer"></div>

  <!-- Left: chart area -->
  <div class="chart-area">
    <div class="toolbar">
      <label>Start</label>
      <input id="startTime" placeholder="201201091120">
      <label>End</label>
      <input id="endTime" placeholder="2012-01-09 14:37">
      <label>TF</label>
      <select id="tfSelect">
        <option value="1">1m</option>
        <option value="5">5m</option>
        <option value="15">15m</option>
        <option value="30">30m</option>
        <option value="60" selected>1H</option>
        <option value="240">4H</option>
        <option value="1440">1D</option>
        <option value="10080">1W</option>
      </select>
      <label>扩展</label>
      <input id="paddingInput" type="number" value="19" min="0" max="500" placeholder="19">
      <button id="loadBtn">加载</button>
      <button class="secondary" id="resetBtn">Reset View</button>
      <label style="color:var(--muted);font-size:0.8rem;cursor:pointer;"><input type="checkbox" id="midnightLines" checked style="margin-right:4px;vertical-align:middle;">午夜线</label>
      <label style="color:var(--muted);font-size:0.8rem;cursor:pointer;"><input type="checkbox" id="showSE" style="margin-right:4px;vertical-align:middle;">S/E</label>
      <span class="warn" id="paddingWarn"></span>
      <span id="pdaBadge" style="display:none"></span>
      <span class="info" id="infoText"></span>
    </div>
    <div id="chartContainer">
      <div class="loading">输入时间范围后点击「加载」</div>
    </div>
    <div class="ctx-menu" id="ctxMenu">
      <div class="ctx-menu-item" id="ctxCopyTime">复制当前时间</div>
    </div>
  </div>

  <!-- Right: panel (content to be added incrementally) -->
  <div class="right-panel" id="rightPanel">
    <div class="right-panel-header">
      <div class="panel-title">
        <strong>PDA 工作台</strong>
        <span>Chart scope / Manual / Match</span>
      </div>
      <div class="panel-header-actions">
        <a class="panel-link" href="pda_manager.html">PDA Manager</a>
        <button style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;" id="closePanelBtn" title="折叠面板">✕</button>
      </div>
    </div>
    <div class="right-panel-body" id="rightPanelBody">

      <div class="panel-tabs" role="tablist" aria-label="PDA workspace mode">
        <button class="panel-tab active" data-panel-tab="scope">PDA 列表</button>
        <button class="panel-tab" data-panel-tab="manual">Manual PDA</button>
        <button class="panel-tab" data-panel-tab="match">匹配合并</button>
      </div>

      <!-- Section: Chart scope PDA list -->
      <details open class="panel-section" data-panel-section="scope">
        <summary>图表时段 PDA</summary>
        <div class="section-content">
          <div class="scope-strip">
            <div class="form-group">
              <label>From</label>
              <input id="panelFilterTimeFrom" placeholder="2012-01-09 09:30">
            </div>
            <div class="form-group">
              <label>To</label>
              <input id="panelFilterTimeTo" placeholder="2012-01-09 16:00">
            </div>
            <button class="btn-sm ghost" id="useChartRangeBtn">使用图表时段</button>
          </div>

          <div class="field-row-3">
            <div class="form-group">
              <label>来源</label>
              <select id="panelFilterSource">
                <option value="">全部</option>
                <option value="manual">手工</option>
                <option value="auto">自动</option>
              </select>
            </div>
            <div class="form-group">
              <label>类型</label>
              <select id="panelFilterType">
                <option value="">全部</option>
                <option value="bsl">BSL</option>
                <option value="ssl">SSL</option>
                <option value="fvg">FVG</option>
                <option value="ob">OB</option>
                <option value="eqh">EQH</option>
                <option value="eql">EQL</option>
                <option value="daily_high">Daily High</option>
                <option value="daily_low">Daily Low</option>
                <option value="nwog">NWOG</option>
                <option value="ndog">NDOG</option>
              </select>
            </div>
            <div class="form-group">
              <label>周期</label>
              <select id="panelFilterTF">
                <option value="">全部</option>
                <option value="1M">1m</option>
                <option value="5M">5m</option>
                <option value="15M">15m</option>
                <option value="30M">30m</option>
                <option value="1H">1H</option>
                <option value="4H">4H</option>
                <option value="D">D</option>
                <option value="1W">1W</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div class="form-group">
              <label>方向</label>
              <select id="panelFilterDirection">
                <option value="">全部</option>
                <option value="bullish">Bullish</option>
                <option value="bearish">Bearish</option>
              </select>
            </div>
            <div class="form-group">
              <label>每页</label>
              <select id="panelPageSizeSelect">
                <option value="10">10</option>
                <option value="20" selected>20</option>
                <option value="50">50</option>
              </select>
            </div>
          </div>

          <div class="btn-row wrap">
            <button class="btn-sm primary" id="panelSearchPdaBtn">查询 PDA</button>
            <button class="btn-sm" id="panelAddManualBtn">新增 Manual</button>
            <button class="btn-sm" id="panelClearFilterBtn">清空</button>
          </div>

          <div class="micro-stat-grid">
            <div class="micro-stat"><label>总数</label><strong id="panelTotalCount">0</strong></div>
            <div class="micro-stat"><label>自动</label><strong id="panelAutoCount">0</strong></div>
            <div class="micro-stat"><label>手工</label><strong id="panelManualCount">0</strong></div>
            <div class="micro-stat"><label>选中</label><strong id="panelSelectedCount">0</strong></div>
          </div>

          <table class="panel-table">
            <thead>
              <tr>
                <th data-panel-sort="pdaId">ID</th>
                <th data-panel-sort="pdaType">类型</th>
                <th data-panel-sort="timeframe">周期</th>
                <th data-panel-sort="direction">方向</th>
                <th data-panel-sort="anchorTime">时间</th>
                <th data-panel-sort="price">价格</th>
                <th data-panel-sort="source">来源</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="panelPdaTableBody">
              <tr><td colspan="8" class="empty-panel-row">未加载 PDA</td></tr>
            </tbody>
          </table>
          <div class="panel-pagination">
            <div id="panelPagination"></div>
            <span class="panel-page-info" id="panelPageInfo">0 条</span>
          </div>

          <div class="btn-row wrap">
            <button class="btn-sm" id="panelLocatePdaBtn">定位选中 PDA</button>
            <button class="btn-sm" id="panelEditPdaBtn">编辑 Manual</button>
            <button class="btn-sm btn-danger" id="panelDeletePdaBtn">删除 Manual</button>
          </div>
        </div>
      </details>

      <!-- Section: Manual PDA -->
      <details open class="panel-section" data-panel-section="manual">
        <summary>Manual PDA</summary>
        <div class="section-content">
          <div class="field-row-3">
            <div class="form-group">
              <label>类型</label>
              <select id="manualPdaType">
                <option value="bsl">BSL</option>
                <option value="ssl">SSL</option>
                <option value="fvg">FVG</option>
                <option value="ob">OB</option>
                <option value="eqh">EQH</option>
                <option value="eql">EQL</option>
              </select>
            </div>
            <div class="form-group">
              <label>周期</label>
              <select id="manualPdaTF">
                <option value="1M">1m</option>
                <option value="5M">5m</option>
                <option value="15M">15m</option>
                <option value="30M">30m</option>
                <option value="1H" selected>1H</option>
                <option value="4H">4H</option>
                <option value="D">D</option>
                <option value="1W">1W</option>
              </select>
            </div>
            <div class="form-group">

  <script src="https://cdn.jsdelivr.net/npm/klinecharts@9.8.12/dist/umd/klinecharts.min.js"></script>
  <script>
    const API_BASE = 'http://127.0.0.1:8765';
    const MAX_PADDING = 500;
    const RIGHT_MARGIN_BARS = 10;
    const OVERLAY_GROUP = 'pdaOverlays';
    let chart = null;
    let lastCandleData = null;
    let currentPda = null;
    let midnightOverlayIds = [];
    let resizeObserver = null;
    let onDataReadyHandler = null;
    let yAxisWheelHandler = null;

    // ── Register custom overlays (v9 API) ──
    function registerCustomOverlays() {
      klinecharts.registerOverlay({
        name: 'arrowMarker',
        totalStep: 2,
        needDefaultPointFigure: false,
        needDefaultXAxisFigure: false,
        needDefaultYAxisFigure: false,
        createPointFigures: ({ overlay, coordinates }) => {
          const { direction, color, label } = overlay.extendData || {};
          if (!coordinates.length) return [];
          const cx = coordinates[0].x;
          const cy = coordinates[0].y;
          const figs = [];
          const size = 7;
          let arrowCoords;
          if (direction === 'down') {
            arrowCoords = [
              { x: cx, y: cy + size },
              { x: cx - size * 0.6, y: cy - size * 0.3 },
              { x: cx + size * 0.6, y: cy - size * 0.3 },
            ];
          } else {
            arrowCoords = [
              { x: cx, y: cy - size },
              { x: cx - size * 0.6, y: cy + size * 0.3 },
              { x: cx + size * 0.6, y: cy + size * 0.3 },
            ];
          }
          figs.push({
            type: 'polygon',
            attrs: { coordinates: arrowCoords },
            styles: { style: 'fill', color: color || '#d4a056' },
            ignoreEvent: true,
          });
          if (label) {
            figs.push({
              type: 'text',
              attrs: {
                x: cx,
                y: direction === 'down' ? cy - size * 0.3 - 2 : cy + size * 0.3 + 12,
                text: label,
                align: 'center',
                baseline: direction === 'down' ? 'bottom' : 'top',
              },
              styles: { color: color || '#d4a056', size: 10, family: 'sans-serif', weight: 'bold' },
              ignoreEvent: true,
            });
          }
          return figs;
        },
      });

      klinecharts.registerOverlay({
        name: 'circleMarker',
        totalStep: 2,
        needDefaultPointFigure: false,
        needDefaultXAxisFigure: false,
        needDefaultYAxisFigure: false,
        createPointFigures: ({ overlay, coordinates }) => {
          const { color, label, above } = overlay.extendData || {};
          if (!coordinates.length) return [];
          const cx = coordinates[0].x;
          const cy = coordinates[0].y;
          const figs = [];
          figs.push({
            type: 'circle',
            attrs: { x: cx, y: cy, r: 5 },
            styles: { style: 'fill', color: color || '#b48cff' },
            ignoreEvent: true,
          });
          if (label) {
            figs.push({
              type: 'text',
              attrs: {
                x: cx,
                y: above ? cy - 14 : cy + 14,
                text: label,
                align: 'center',
                baseline: above ? 'bottom' : 'top',
              },
              styles: { color: color || '#b48cff', size: 10, family: 'sans-serif', weight: 'bold' },
              ignoreEvent: true,
            });
          }
          return figs;
        },
      });

      klinecharts.registerOverlay({
        name: 'fvgZone',
        totalStep: 3,
        needDefaultPointFigure: false,
        needDefaultXAxisFigure: false,
        needDefaultYAxisFigure: false,
        createPointFigures: ({ overlay, coordinates }) => {
          const { label, startIdx, endIdx } = overlay.extendData || {};
          if (coordinates.length < 2) return [];
          const figs = [];
          const x1 = Math.min(coordinates[0].x, coordinates[1].x);
          const x2 = Math.max(coordinates[0].x, coordinates[1].x);
          const y1 = Math.min(coordinates[0].y, coordinates[1].y);
          const y2 = Math.max(coordinates[0].y, coordinates[1].y);
          const w = Math.max(x2 - x1, 6);
          figs.push({
            type: 'rect',
            attrs: { x: x1, y: y1, width: w, height: y2 - y1 },
            styles: {
              style: 'stroke_fill',
              color: 'rgba(107, 175, 207, 0.15)',
              borderColor: '#6bafcf',
              borderSize: 1,
              borderStyle: 'dashed',
              borderDashedValue: [3, 3],
            },
            ignoreEvent: true,
          });
          if (label) {
            figs.push({
              type: 'text',
              attrs: { x: x1 + 4, y: y1 + 14, text: label, align: 'left', baseline: 'top' },
              styles: { color: '#6bafcf', size: 10, family: 'sans-serif', weight: 'bold' },
              ignoreEvent: true,
            });
          }
          return figs;
        },
      });

      klinecharts.registerOverlay({
        name: 'obZone',
        totalStep: 3,
        needDefaultPointFigure: false,
        needDefaultXAxisFigure: false,
        needDefaultYAxisFigure: false,
        createPointFigures: ({ overlay, coordinates }) => {
          const { label } = overlay.extendData || {};
          if (coordinates.length < 2) return [];
          const figs = [];
          const x1 = Math.min(coordinates[0].x, coordinates[1].x);
          const x2 = Math.max(coordinates[0].x, coordinates[1].x);
          const y1 = Math.min(coordinates[0].y, coordinates[1].y);
          const y2 = Math.max(coordinates[0].y, coordinates[1].y);
          const w = Math.max(x2 - x1, 6);
          figs.push({
            type: 'rect',
            attrs: { x: x1, y: y1, width: w, height: y2 - y1 },
            styles: {
              style: 'stroke_fill',
              color: 'rgba(212, 160, 86, 0.12)',
              borderColor: '#d4a056',
              borderSize: 1,
              borderStyle: 'dashed',
              borderDashedValue: [3, 3],
            },
            ignoreEvent: true,
          });
          if (label) {
            figs.push({
              type: 'text',
              attrs: { x: x1 + 4, y: y1 + 14, text: label, align: 'left', baseline: 'top' },
              styles: { color: '#d4a056', size: 10, family: 'sans-serif', weight: 'bold' },
              ignoreEvent: true,
            });
          }
          return figs;
        },
      });
    }

    registerCustomOverlays();

    // ── Utility ──
    function getPadding() {
      const input = document.getElementById('paddingInput');
      let val = parseInt(input.value) || 0;
      const warn = document.getElementById('paddingWarn');
      if (val > MAX_PADDING) {
        val = MAX_PADDING;
        input.value = MAX_PADDING;
        warn.textContent = `超限，已调整为 ${MAX_PADDING}`;
      } else {
        warn.textContent = '';
      }
      return val;
    }

    function parseTime(text) {
      let t = String(text || '').trim().replace('T', ' ');
      if (!t) return null;
      const compact = t.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})$/);
      if (compact) t = `${compact[1]}-${compact[2]}-${compact[3]} ${compact[4]}:${compact[5]}`;
      const match = t.match(/^(\d{4}-\d{2}-\d{2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
      if (!match) return null;
      return `${match[1]} ${match[2].padStart(2, '0')}:${match[3]}`;
    }

    function timeToTimestamp(text) {
      const match = text.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
      if (!match) return 0;
      return Math.floor(Date.UTC(+match[1], +match[2] - 1, +match[3], +match[4], +match[5]) / 1000);
    }

    function findBarIndex(candleData, targetTsMs) {
      for (let i = candleData.length - 1; i >= 0; i--) {
        if (candleData[i].timestamp <= targetTsMs) return i;
      }
      return -1;
    }

    // ── PDA badge ──
    function renderPdaBadge(pda) {
      const el = document.getElementById('pdaBadge');
      if (!pda) { el.style.display = 'none'; return; }
      const type = (pda.pdaType || '').toLowerCase();
      const colorMap = { bsl: 'bsl', ssl: 'ssl', fvg: 'fvg', ob: 'ob', eqh: 'eqh', eql: 'eql',
        daily_high: 'bsl', daily_low: 'ssl', ict_midnight_day_high: 'bsl', ict_midnight_day_low: 'ssl', ndog: 'bsl', nwog: 'bsl' };
      const cls = colorMap[type] || 'ob';
      const label = type.toUpperCase();
      const time = pda.occurrenceTime || pda.anchorTime || '';
      const dir = pda.direction || '';
      const tf = pda.timeframe || '';
      const parts = [`<b>${label}</b>`];
      if (pda.pdaId) parts.push(pda.pdaId);
      if (time) parts.push(time);
      if (tf) parts.push(tf);
      if (dir) parts.push(dir);
      if (pda.price) parts.push(`@ ${pda.price}`);
      el.className = `pda-badge pda-badge-${cls}`;
      el.innerHTML = parts.join(' · ');
      el.style.display = 'inline-flex';
    }

    // ── PDA overlay builder ──
    function buildPdaOverlays(pda, candleData) {
      if (!pda || !candleData?.length) return [];
      const overlays = [];
      const pdaType = (pda.pdaType || '').toLowerCase();
      const pdaTimeSec = timeToTimestamp(pda.occurrenceTime || pda.anchorTime || '');
      const pdaTimeMs = pdaTimeSec * 1000;
      const pdaTimeEndSec = pda.extraFields?.end_time ? timeToTimestamp(pda.extraFields.end_time) : 0;
      const pdaTimeEndMs = pdaTimeEndSec * 1000;

      const idx = findBarIndex(candleData, pdaTimeMs);
      if (idx < 0) return [];

      const bar = candleData[idx];
      const highTypes = ['bsl', 'daily_high', 'ict_midnight_day_high', 'ndog', 'nwog'];
      const lowTypes = ['ssl', 'daily_low', 'ict_midnight_day_low'];

      if (highTypes.includes(pdaType)) {
        overlays.push({
          name: 'arrowMarker',
          points: [{ timestamp: bar.timestamp, value: bar.high }],
          extendData: { direction: 'down', color: '#2d7d2d', label: pdaType.toUpperCase() },
          lock: true,
        });
        if (pda.price) {
          overlays.push({
            name: 'horizontalStraightLine',
            points: [{ timestamp: bar.timestamp, value: pda.price }],
            styles: { line: { color: 'rgba(45, 125, 45, 0.5)', style: 'dashed', size: 1, dashedValue: [6, 3] } },
            lock: true,
          });
        }
      } else if (lowTypes.includes(pdaType)) {
        overlays.push({
          name: 'arrowMarker',
          points: [{ timestamp: bar.timestamp, value: bar.low }],
          extendData: { direction: 'up', color: '#d28349', label: pdaType.toUpperCase() },
          lock: true,
        });
        if (pda.price) {
          overlays.push({
            name: 'horizontalStraightLine',
            points: [{ timestamp: bar.timestamp, value: pda.price }],
            styles: { line: { color: 'rgba(210, 131, 73, 0.5)', style: 'dashed', size: 1, dashedValue: [6, 3] } },
            lock: true,
          });
        }
      } else if (pdaType === 'fvg') {
        const priceTop = pda.extraFields?.price_top || pda.extraFields?.priceTop || pda.priceHigh;
        const priceBottom = pda.extraFields?.price_bottom || pda.extraFields?.priceBottom || pda.priceLow;
        if (priceTop && priceBottom) {
          overlays.push({
            name: 'fvgZone',
            points: [
              { timestamp: bar.timestamp, value: priceTop },
              { timestamp: bar.timestamp, value: priceBottom },
            ],
            extendData: { label: 'FVG' },
            lock: true,
          });
        } else {
          overlays.push({
            name: 'circleMarker',
            points: [{ timestamp: bar.timestamp, value: bar.high }],
            extendData: { color: '#6bafcf', label: 'FVG', above: true },
            lock: true,
          });
        }
      } else if (pdaType === 'ob') {
        const priceTop = pda.extraFields?.price_top || pda.extraFields?.priceTop || pda.priceHigh;
        const priceBottom = pda.extraFields?.price_bottom || pda.extraFields?.priceBottom || pda.priceLow;
        const endIdx = pdaTimeEndMs ? findBarIndex(candleData, pdaTimeEndMs) : idx;
        if (priceTop && priceBottom && endIdx >= 0) {
          overlays.push({
            name: 'obZone',
            points: [
              { timestamp: candleData[idx].timestamp, value: priceTop },
              { timestamp: candleData[endIdx].timestamp, value: priceBottom },
            ],
            extendData: { label: 'OB' },
            lock: true,
          });
        } else {
          overlays.push({
            name: 'circleMarker',
            points: [{ timestamp: bar.timestamp, value: bar.high }],
            extendData: { color: '#d4a056', label: 'OB', above: true },
            lock: true,
          });
          if (endIdx >= 0 && endIdx !== idx) {
            overlays.push({
              name: 'circleMarker',
              points: [{ timestamp: candleData[endIdx].timestamp, value: candleData[endIdx].low }],
              extendData: { color: '#d4a056', label: 'OB', above: false },
              lock: true,
            });
          }
        }
      } else if (pdaType === 'eqh') {
        overlays.push({
          name: 'circleMarker',
          points: [{ timestamp: bar.timestamp, value: bar.high }],
          extendData: { color: '#b48cff', label: 'EQH', above: true },
          lock: true,
        });
      } else if (pdaType === 'eql') {
        overlays.push({
          name: 'circleMarker',
          points: [{ timestamp: bar.timestamp, value: bar.low }],
          extendData: { color: '#b48cff', label: 'EQL', above: false },
          lock: true,
        });
      } else {
        overlays.push({
          name: 'circleMarker',
          points: [{ timestamp: bar.timestamp, value: bar.high }],
          extendData: { color: '#d4a056', label: pdaType.toUpperCase(), above: true },
          lock: true,
        });
      }
      return overlays;
    }

    // ── S/E overlay builder ──
    function buildSEOverlays(candleData) {
      const overlays = [];
      if (!document.getElementById('showSE').checked) return overlays;

      const start = parseTime(document.getElementById('startTime').value.trim());
      const end = parseTime(document.getElementById('endTime').value.trim());
      if (!start || !end) return overlays;

      const startTsMs = timeToTimestamp(start) * 1000;
      const endTsMs = timeToTimestamp(end) * 1000;

      const startIdx = findBarIndex(candleData, startTsMs);
      if (startIdx >= 0) {
        overlays.push({
          name: 'arrowMarker',
          points: [{ timestamp: candleData[startIdx].timestamp, value: candleData[startIdx].low }],
          extendData: { direction: 'up', color: '#d4a056', label: 'S' },
          lock: true,
        });
      }

      const endIdx = findBarIndex(candleData, endTsMs);
      if (endIdx >= 0) {
        overlays.push({
          name: 'arrowMarker',
          points: [{ timestamp: candleData[endIdx].timestamp, value: candleData[endIdx].high }],
          extendData: { direction: 'down', color: '#c87070', label: 'E' },
          lock: true,
        });
      }
      return overlays;
    }

    // ── Midnight lines ──
    function drawMidnightLines(candleData, tfMinutes) {
      midnightOverlayIds.forEach(id => { try { chart.removeOverlay(id); } catch(e){} });
      midnightOverlayIds = [];

      if (tfMinutes > 60) return;
      if (!document.getElementById('midnightLines').checked) return;
      if (!candleData?.length) return;

      const midnights = new Set();
      for (const bar of candleData) {
        const d = new Date(bar.timestamp);
        if (d.getUTCHours() === 0 && d.getUTCMinutes() === 0) {
          midnights.add(bar.timestamp);
        }
      }

      for (const ts of midnights) {
        const idx = findBarIndex(candleData, ts);
        if (idx >= 0) {
          const id = chart.createOverlay({
            name: 'verticalStraightLine',
            points: [{ timestamp: ts, value: candleData[idx].close }],
            styles: { line: { color: 'rgba(180, 80, 80, 0.25)', style: 'solid', size: 1 } },
            lock: true,
          });
          if (id) midnightOverlayIds.push(id);
        }
      }
    }

    // ── Draw all overlays ──
    function drawAllOverlays() {
      if (!chart || !lastCandleData) return;

      // Remove previous overlays by group
      chart.removeOverlay({ groupId: OVERLAY_GROUP });

      const overlays = [];
      overlays.push(...buildSEOverlays(lastCandleData));
      if (currentPda) {
        overlays.push(...buildPdaOverlays(currentPda, lastCandleData));
      }

      for (const ov of overlays) {
        ov.groupId = OVERLAY_GROUP;
        chart.createOverlay(ov);
      }
    }

    // ── Center on PDA ──
    function centerOnPda(pda, candleData) {
      if (!chart || !candleData?.length) return;
      const pdaTimeSec = timeToTimestamp(pda.occurrenceTime || pda.anchorTime || '');
      if (!pdaTimeSec) { resetView(); return; }

      const pdaTimeMs = pdaTimeSec * 1000;
      const idx = findBarIndex(candleData, pdaTimeMs);
      if (idx < 0) { resetView(); return; }

      const contextBars = 15;
      chart.setOffsetRightDistance(chart.getBarSpace() * RIGHT_MARGIN_BARS);
      chart.scrollToDataIndex(idx + contextBars);
    }

    // ── Reset view ──
    function resetView() {
      if (!chart || !lastCandleData?.length) return;
      chart.setOffsetRightDistance(chart.getBarSpace() * RIGHT_MARGIN_BARS);
      chart.scrollToDataIndex(lastCandleData.length - 1);
    }

    // ── Load data ──
    async function loadData() {
      const startRaw = document.getElementById('startTime').value.trim();
      const endRaw = document.getElementById('endTime').value.trim();
      const tf = document.getElementById('tfSelect').value;
      const padding = getPadding();

      const start = parseTime(startRaw);
      const end = parseTime(endRaw);
      if (!start || !end) {
        alert('时间格式：2012-01-09 11:20');
        return;
      }

      try {
        const url = `${API_BASE}/v2/bars?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}&tf=${tf}&padding=${padding}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        const bars = data.result;
        if (!bars.length) throw new Error('该时段无数据');

        const tfMinutes = parseInt(tf);

        const candleData = bars.map(bar => ({
          timestamp: bar.timestamp * 1000,
          open: bar.open,
          high: bar.high,
          low: bar.low,
          close: bar.close,
          volume: bar.volume || 0,
        }));

        const container = document.getElementById('chartContainer');

        // Dispose previous chart
        if (chart) {
          klinecharts.dispose(chart);
          chart = null;
        }
        if (resizeObserver) {
          resizeObserver.disconnect();
          resizeObserver = null;
        }
        if (yAxisWheelHandler) {
          container.removeEventListener('wheel', yAxisWheelHandler, { capture: true });
          yAxisWheelHandler = null;
        }

        container.innerHTML = '';

        // Init chart with dark theme, timezone=UTC to match DB timestamps
        chart = klinecharts.init('chartContainer', { timezone: 'UTC' });
        if (!chart) throw new Error('图表初始化失败');

        chart.setStyles({
          grid: {
            show: false,
            horizontal: { show: false, size: 0 },
            vertical: { show: false, size: 0 },
          },
          candle: {
            type: 'candle_solid',
            bar: {
              upColor: '#7db87d',
              downColor: '#c87070',
              noChangeColor: '#888888',
              upBorderColor: '#7db87d',
              downBorderColor: '#c87070',
              noChangeBorderColor: '#888888',
              upWickColor: '#34c9b0',
              downWickColor: '#d28349',
              noChangeWickColor: '#888888',
            },
            priceMark: {
              high: { show: false },
              low: { show: false },
              last: {
                show: true,
                line: { show: false },
                text: { show: true, color: '#f5f0e8', backgroundColor: '#7db87d', borderRadius: 2, size: 10 },
              },
            },
            tooltip: { show: false },
          },
          xAxis: {
            show: true,
            axisLine: { show: true, color: '#5a5045', size: 1 },
            tickText: { color: '#a89a8a', size: 11, family: 'sans-serif' },
            tickLine: { show: false },
          },
          yAxis: {
            show: true,
            axisLine: { show: true, color: '#5a5045', size: 1 },
            tickText: { color: '#a89a8a', size: 11, family: 'sans-serif' },
            tickLine: { show: false },
          },
          crosshair: {
            show: true,
            horizontal: {
              show: true,
              line: { show: true, style: 'dashed', size: 1, color: '#d4a056', dashedValue: [4, 2] },
              text: { show: true, color: '#1e1b18', backgroundColor: '#d4a056', borderRadius: 2, size: 10 },
            },
            vertical: {
              show: true,
              line: { show: true, style: 'dashed', size: 1, color: '#d4a056', dashedValue: [4, 2] },
              text: { show: true, color: '#1e1b18', backgroundColor: '#d4a056', borderRadius: 2, size: 10 },
            },
          },
          separator: { size: 0 },
        });

        chart.setPriceVolumePrecision(2, 0);
        setupCrosshairTracking();

        lastCandleData = candleData;

        // Resize observer
        resizeObserver = new ResizeObserver(() => {
          if (chart) chart.resize();
        });
        resizeObserver.observe(container);

        // Wheel zoom on Y-axis area: scroll wheel on right side → vertical zoom
        yAxisWheelHandler = (e) => {
          if (!chart) return;
          // Check if mouse is on Y-axis widget (same region as drag-to-zoom)
          const pane = chart.getDrawPaneById('candle_pane');
          if (!pane) return;
          const yAxisEl = pane.getYAxisWidget()?.getContainer();
          if (!yAxisEl || !yAxisEl.contains(e.target)) return;
          e.preventDefault();
          e.stopPropagation();
          const yAxis = pane.getAxisComponent();
          const range = yAxis.getRange();
          if (!range || range.realRange <= 0) return;
          // Scale: scroll up (deltaY<0) → zoom in (shrink range), scroll down → zoom out
          const factor = e.deltaY > 0 ? 1.08 : 0.92;
          const center = (range.from + range.to) / 2;
          const newRange = range.range * factor;
          const newFrom = center - newRange / 2;
          const newTo = center + newRange / 2;
          const newRealFrom = yAxis.convertToRealValue(newFrom);
          const newRealTo = yAxis.convertToRealValue(newTo);
          yAxis.setRange({
            from: newFrom, to: newTo, range: newTo - newFrom,
            realFrom: newRealFrom, realTo: newRealTo, realRange: newRealTo - newRealFrom,
          });
          chart.adjustPaneViewport(false, true, true, true);
        };
        container.addEventListener('wheel', yAxisWheelHandler, { capture: true });

        // Apply data and draw overlays when ready
        chart.applyNewData(candleData);
        if (onDataReadyHandler) {
          chart.unsubscribeAction('onDataReady', onDataReadyHandler);
        }
        onDataReadyHandler = () => {
          drawMidnightLines(candleData, tfMinutes);
          drawAllOverlays();

          if (currentPda) {
            centerOnPda(currentPda, candleData);
          } else {
            resetView();
          }

          let info = `${bars.length} bars · ${bars[0].time} → ${bars[bars.length - 1].time} · TF=${tf}m`;
          renderPdaBadge(currentPda);
          document.getElementById('infoText').textContent = info;
        };
        chart.subscribeAction('onDataReady', onDataReadyHandler);

      } catch (err) {
        const container = document.getElementById('chartContainer');
        while (container.firstChild) container.removeChild(container.firstChild);
        const errDiv = document.createElement('div');
        errDiv.className = 'error';
        errDiv.textContent = `加载失败: ${err.message}`;
        container.appendChild(errDiv);
      }
    }

    // ── Load PDA mode ──
    async function loadPdaMode(pdaId) {
      try {
        const res = await fetch(`${API_BASE}/v2/pda_records?pda_id=${encodeURIComponent(pdaId)}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);

        const records = data.result?.records || [];
        const pda = records.find(r => r.pdaId === pdaId);
        if (!pda) throw new Error(`PDA ${pdaId} 未找到`);

        currentPda = pda;

        const pdaTime = pda.occurrenceTime || pda.anchorTime || '';
        if (!pdaTime) throw new Error('PDA 无时间信息');

        const m = String(pdaTime).match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
        if (!m) throw new Error('PDA 时间格式异常');

        const tf = pda.timeframe === 'D' ? 60 : pda.timeframe === '4H' ? 240 : pda.timeframe === '1H' ? 60 : pda.timeframe === '30M' ? 30 : pda.timeframe === '15M' ? 15 : pda.timeframe === '5M' ? 5 : pda.timeframe === '1M' ? 1 : 60;

        const contextMin = Math.max(120, 5 * tf);
        const center = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]));
        const startDt = new Date(center.getTime() - contextMin * 60000);
        const endDt = new Date(center.getTime() + contextMin * 60000);
        const fmt = d => `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;

        document.getElementById('startTime').value = fmt(startDt);
        document.getElementById('endTime').value = fmt(endDt);
        document.getElementById('tfSelect').value = String(tf);
        document.getElementById('paddingInput').value = '19';

        loadData();
      } catch (err) {
        const container = document.getElementById('chartContainer');
        while (container.firstChild) container.removeChild(container.firstChild);
        const errDiv = document.createElement('div');
        errDiv.className = 'error';
        errDiv.textContent = `加载 PDA 失败: ${err.message}`;
        container.appendChild(errDiv);
      }
    }

    // ── URL params ──
    function loadFromParams() {
      const params = new URLSearchParams(window.location.search);

      const pdaId = params.get('pda_id');
      if (pdaId) {
        loadPdaMode(pdaId);
        return;
      }

      const start = params.get('start');
      const end = params.get('end');
      const tf = params.get('tf') || '60';
      const padding = params.get('padding');

      if (start && end) {
        document.getElementById('startTime').value = start;
        document.getElementById('endTime').value = end;
        document.getElementById('tfSelect').value = tf;
        if (padding) document.getElementById('paddingInput').value = padding;
        loadData();
      }
    }

    // ── PDA manager panel state ──
    const PANEL_TYPE_STYLES = { bsl: 'bsl', ssl: 'ssl', fvg: 'fvg', ob: 'ob', eqh: 'eqh', eql: 'eql' };
    let panelPdaRows = [];
    let panelCurrentPage = 1;
    let panelPageSize = 20;
    let panelSortCol = 'anchorTime';
    let panelSortDir = 'desc';
    let panelSelectedPdaId = null;
    let panelEditingPdaId = null;

    function escHtml(s) {
      return s == null ? '' : String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function toast(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = `toast toast-${type}`;
      el.textContent = msg;
      document.getElementById('toastContainer').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    async function apiGet(path) {
      const res = await fetch(`${API_BASE}${path}`);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'API error');
      return data;
    }

    async function apiPost(path, body) {
      const res = await fetch(`${API_BASE}${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'API error');
      return data;
    }

    async function apiPut(path, body) {
      const res = await fetch(`${API_BASE}${path}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'API error');
      return data;
    }

    function formatTime(ts) {
      if (!ts) return '';
      return String(ts).replace(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}).*/, '$1 $2');
    }

    function isManualPda(row) {
      return row?.source === 'manual_add' || row?.source === 'manual_eqh_eql';
    }

    function parseNumberOrNull(value) {
      const num = parseFloat(value);
      return Number.isFinite(num) ? num : null;
    }

    function getPanelSelectedRow() {
      return panelPdaRows.find(r => r.pdaId === panelSelectedPdaId) || null;
    }

    function updatePanelStats() {
      const manual = panelPdaRows.filter(isManualPda).length;
      const auto = panelPdaRows.length - manual;
      document.getElementById('panelTotalCount').textContent = panelPdaRows.length;
      document.getElementById('panelAutoCount').textContent = auto;
      document.getElementById('panelManualCount').textContent = manual;
      document.getElementById('panelSelectedCount').textContent = panelSelectedPdaId ? '1' : '0';
    }

    function applyPanelSort() {
      panelPdaRows.sort((a, b) => {
        let va = a[panelSortCol], vb = b[panelSortCol];
        if (panelSortCol === 'price') {
          va = a.price ?? a.priceHigh ?? a.priceLow ?? a.priceCe;
          vb = b.price ?? b.priceHigh ?? b.priceLow ?? b.priceCe;
        }
        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;
        if (typeof va === 'number' && typeof vb === 'number') {
          return panelSortDir === 'asc' ? va - vb : vb - va;
        }
        va = String(va);
        vb = String(vb);
        return panelSortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
      });
    }

    async function panelSearchPdas() {
      const source = document.getElementById('panelFilterSource').value;
      const pdaType = document.getElementById('panelFilterType').value;
      const tf = document.getElementById('panelFilterTF').value;
      const dir = document.getElementById('panelFilterDirection').value;
      const timeFrom = parseTime(document.getElementById('panelFilterTimeFrom').value.trim());
      const timeTo = parseTime(document.getElementById('panelFilterTimeTo').value.trim());

      const params = new URLSearchParams();
      if (pdaType) params.set('type', pdaType);
      if (tf) params.set('timeframe', tf);
      if (dir) params.set('direction', dir);
      if (timeFrom) params.set('anchor_time_from', timeFrom);
      if (timeTo) params.set('anchor_time_to', timeTo);
      params.set('limit', '1000');

      try {
        let rows = [];
        if (source === 'manual') {
          const manualAddParams = new URLSearchParams(params);
          const manualEqParams = new URLSearchParams(params);
          manualAddParams.set('source', 'manual_add');
          manualEqParams.set('source', 'manual_eqh_eql');
          const [manualAdd, manualEq] = await Promise.all([
            apiGet(`/v2/pda_records?${manualAddParams}`),
            apiGet(`/v2/pda_records?${manualEqParams}`),
          ]);
          rows = [
            ...(manualAdd.result?.records || []),
            ...(manualEq.result?.records || []),
          ];
        } else {
          if (source === 'auto') params.set('source_exclude', 'manual_add');
          const data = await apiGet(`/v2/pda_records?${params}`);
          rows = data.result?.records || [];
          if (source === 'auto') rows = rows.filter(row => !isManualPda(row));
        }
        panelPdaRows = rows;
        panelCurrentPage = 1;
        panelSelectedPdaId = null;
        applyPanelSort();
        renderPanelPdaTable();
        updatePanelStats();
      } catch (err) {
        toast('查询失败: ' + err.message, 'error');
      }
    }

    function renderPanelPdaTable() {
      const tbody = document.getElementById('panelPdaTableBody');
      const start = (panelCurrentPage - 1) * panelPageSize;
      const pageRows = panelPdaRows.slice(start, start + panelPageSize);

      if (!panelPdaRows.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty-panel-row">无匹配 PDA</td></tr>';
        renderPanelPagination();
        updatePanelStats();
        return;
      }

      tbody.innerHTML = pageRows.map(row => {
        const manual = isManualPda(row);
        const typeClass = `type-${PANEL_TYPE_STYLES[row.pdaType] || 'other'}`;
        const dirTag = row.direction
          ? `<span class="pill ${row.direction === 'bullish' ? 'bull' : 'bear'}">${row.direction === 'bullish' ? 'Bull' : 'Bear'}</span>`
          : '-';
        const priceDisplay = row.price != null ? Number(row.price).toFixed(2)
          : (row.priceHigh != null && row.priceLow != null) ? `${Number(row.priceHigh).toFixed(2)} / ${Number(row.priceLow).toFixed(2)}`
          : '-';
        const selected = row.pdaId === panelSelectedPdaId ? ' selected' : '';
        return `<tr class="${selected}" data-pda-id="${escHtml(row.pdaId)}">
          <td class="mono">${escHtml(row.pdaId)}</td>
          <td><span class="type-tag ${typeClass}">${escHtml((row.pdaType || '-').toUpperCase())}</span></td>
          <td>${escHtml(row.timeframe || '-')}</td>
          <td>${dirTag}</td>
          <td class="mono">${escHtml(formatTime(row.anchorTime || row.occurrenceTime) || '-')}</td>
          <td class="mono">${escHtml(priceDisplay)}</td>
          <td><span class="pill ${manual ? 'manual' : 'auto'}">${manual ? '手工' : '自动'}</span></td>
          <td>
            <button class="btn-sm" data-action="locate" data-pda-id="${escHtml(row.pdaId)}">定位</button>
            <button class="btn-sm" data-action="edit" data-pda-id="${escHtml(row.pdaId)}" ${manual ? '' : 'disabled'}>编辑</button>
          </td>
        </tr>`;
      }).join('');

      tbody.querySelectorAll('tr[data-pda-id]').forEach(tr => {
        tr.addEventListener('click', (e) => {
          const action = e.target?.dataset?.action;
          const pdaId = tr.dataset.pdaId;
          panelSelectedPdaId = pdaId;
          renderPanelPdaTable();
          if (action === 'locate') panelLocateSelectedPda();
          if (action === 'edit') panelEditSelectedPda();
        });
      });

      renderPanelPagination();
      updatePanelStats();
    }

    function renderPanelPagination() {
      const totalPages = Math.ceil(panelPdaRows.length / panelPageSize) || 1;
      panelCurrentPage = Math.min(panelCurrentPage, totalPages);
      const container = document.getElementById('panelPagination');
      document.getElementById('panelPageInfo').textContent = `${panelPdaRows.length} 条 · 第 ${panelCurrentPage}/${totalPages} 页`;

      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = `<button data-page="${panelCurrentPage - 1}" ${panelCurrentPage <= 1 ? 'disabled' : ''}>&lt;</button>`;
      for (let i = 1; i <= totalPages; i++) {
        if (totalPages > 7 && Math.abs(i - panelCurrentPage) > 2 && i !== 1 && i !== totalPages) {
          if (i === panelCurrentPage - 3 || i === panelCurrentPage + 3) html += '<button disabled>...</button>';
          continue;
        }
        html += `<button class="${i === panelCurrentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
      }
      html += `<button data-page="${panelCurrentPage + 1}" ${panelCurrentPage >= totalPages ? 'disabled' : ''}>&gt;</button>`;
      container.innerHTML = html;
      container.querySelectorAll('button[data-page]').forEach(btn => {
        btn.addEventListener('click', () => {
          panelCurrentPage = parseInt(btn.dataset.page);
          renderPanelPdaTable();
        });
      });
    }

    function panelLocateSelectedPda() {
      const row = getPanelSelectedRow();
      if (!row) { toast('请先选择 PDA', 'error'); return; }
      currentPda = row;
      renderPdaBadge(row);

      // Check if PDA is within current chart range
      const pdaTimeSec = timeToTimestamp(row.occurrenceTime || row.anchorTime || '');
      const pdaTimeMs = pdaTimeSec * 1000;
      const inRange = lastCandleData?.length && pdaTimeMs >= lastCandleData[0].timestamp && pdaTimeMs <= lastCandleData[lastCandleData.length - 1].timestamp;

      if (inRange) {
        drawAllOverlays();
        centerOnPda(row, lastCandleData);
      } else {
        loadPdaMode(row.pdaId);
      }
    }

      document.getElementById('manualPdaDirection').value = '';

      document.getElementById('manualStartTime').value = '';
      document.getElementById('manualEndTime').value = '';
      document.getElementById('manualPrice').value = '';
      document.getElementById('manualPriceHigh').value = '';
      document.getElementById('manualPriceLow').value = '';
      document.getElementById('manualPdaNote').value = '';

      const chartTime = parseTime(document.getElementById('startTime').value);
      if (chartTime) document.getElementById('manualAnchorTime').value = chartTime;

    function panelEditSelectedPda() {
      const row = getPanelSelectedRow();
      if (!row) { toast('请先选择 PDA', 'error'); return; }
      if (!isManualPda(row)) { toast('只能编辑 Manual PDA', 'error'); return; }

      document.getElementById('manualPriceHigh').value = row.priceHigh ?? '';

    function buildManualPdaBody() {
      const pdaType = document.getElementById('manualPdaType').value;
      const tf = document.getElementById('manualPdaTF').value;
      const direction = document.getElementById('manualPdaDirection').value;
      const anchorTime = parseTime(document.getElementById('manualAnchorTime').value.trim());
      const startTime = parseTime(document.getElementById('manualStartTime').value.trim());
      const endTime = parseTime(document.getElementById('manualEndTime').value.trim());
      const price = parseNumberOrNull(document.getElementById('manualPrice').value);
      const priceHigh = parseNumberOrNull(document.getElementById('manualPriceHigh').value);
      const priceLow = parseNumberOrNull(document.getElementById('manualPriceLow').value);
      const note = document.getElementById('manualPdaNote').value.trim();

      if (!pdaType) throw new Error('请选择 PDA 类型');
      const body = { instrument: 'NQ', timeframe: tf, pdaType, note };

      if (['bsl', 'ssl'].includes(pdaType)) {
        if (!anchorTime) throw new Error('请填写 Anchor Time');
        if (price == null) throw new Error('BSL/SSL 需要 Price');
        body.anchorTime = anchorTime;
        body.price = price;
      } else if (['eqh', 'eql'].includes(pdaType)) {
        if (!anchorTime) throw new Error('请填写 Anchor Time');
        body.anchorTime = anchorTime;
        if (priceHigh != null || priceLow != null) {
          if (priceHigh == null || priceLow == null) throw new Error('EQH/EQL 使用区间时需要 Price High 和 Price Low');
          body.priceHigh = priceHigh;
          body.priceLow = priceLow;
        } else {
          if (price == null) throw new Error('EQH/EQL 需要 Price 或价格区间');
          body.price = price;
        }
      } else if (pdaType === 'fvg') {
        if (!anchorTime) throw new Error('请填写 Anchor Time');
        if (!direction) throw new Error('FVG 需要方向');
        if (priceHigh == null || priceLow == null) throw new Error('FVG 需要 Price High 和 Price Low');
        body.anchorTime = anchorTime;
        body.direction = direction;
        body.priceHigh = priceHigh;
        body.priceLow = priceLow;
      } else if (pdaType === 'ob') {
        if (!direction) throw new Error('OB 需要方向');
        if (priceHigh == null || priceLow == null) throw new Error('OB 需要 Price High 和 Price Low');
        body.extraFields = { start_time: startTime || '', end_time: endTime || '' };
        body.anchorTime = anchorTime || startTime || endTime;
        if (!body.anchorTime) throw new Error('OB 需要 Anchor/Start/End 至少一个时间');
        body.direction = direction;
        body.priceHigh = priceHigh;
        body.priceLow = priceLow;
      }

      if (panelEditingPdaId) body.pdaId = panelEditingPdaId;
      return body;
    }

    async function saveManualPdaFromPanel() {
      try {
        const body = buildManualPdaBody();
        if (panelEditingPdaId) {
          await apiPut('/v2/pda_manual_update', body);
          toast('已更新 Manual PDA', 'success');
        } else {
          await apiPost('/v2/pda_manual_add', body);
          toast('已新增 Manual PDA', 'success');
        }
        resetManualForm();
        await panelSearchPdas();
      } catch (err) {
        toast('保存失败: ' + err.message, 'error');
      }
    }

    async function panelDeleteSelectedPda() {
      const row = getPanelSelectedRow();
      if (!row) { toast('请先选择 PDA', 'error'); return; }
      if (!isManualPda(row)) { toast('只能删除 Manual PDA', 'error'); return; }
      if (!confirm(`确认删除 ${row.pdaId}？`)) return;
      try {
        await apiPost('/v2/pda_delete', { pdaId: row.pdaId });
        toast('已删除 Manual PDA', 'success');
        panelSelectedPdaId = null;
        await panelSearchPdas();
      } catch (err) {
        toast('删除失败: ' + err.message, 'error');
      }
    }

    function panelPickCrosshairTime(targetId) {

    }

    document.querySelectorAll('[data-panel-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-panel-tab]').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        const section = document.querySelector(`[data-panel-section="${btn.dataset.panelTab}"]`);
        if (section) {
          section.open = true;
          section.scrollIntoView({ block: 'start', behavior: 'smooth' });
        }
      });
    });

    document.getElementById('useChartRangeBtn').onclick = () => {
      document.getElementById('panelFilterTimeFrom').value = parseTime(document.getElementById('startTime').value) || '';
      document.getElementById('panelFilterTimeTo').value = parseTime(document.getElementById('endTime').value) || '';
    };

    document.getElementById('panelClearFilterBtn').onclick = () => {
      ['panelFilterTimeFrom', 'panelFilterTimeTo', 'panelFilterSource', 'panelFilterType', 'panelFilterTF', 'panelFilterDirection'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
    };

    document.getElementById('panelSearchPdaBtn').onclick = panelSearchPdas;
    document.getElementById('panelAddManualBtn').onclick = panelStartAddManual;
    document.getElementById('panelLocatePdaBtn').onclick = panelLocateSelectedPda;
    document.getElementById('panelEditPdaBtn').onclick = panelEditSelectedPda;
    document.getElementById('panelDeletePdaBtn').onclick = panelDeleteSelectedPda;
    document.getElementById('panelPageSizeSelect').onchange = function() {
      panelPageSize = parseInt(this.value);
      panelCurrentPage = 1;
      renderPanelPdaTable();
    };
    document.querySelectorAll('[data-panel-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.panelSort;
        if (panelSortCol === col) panelSortDir = panelSortDir === 'asc' ? 'desc' : 'asc';
        else { panelSortCol = col; panelSortDir = 'asc'; }
        applyPanelSort();
        renderPanelPdaTable();
      });
    });

    document.getElementById('manualLocateChartBtn').onclick = () => {
      const anchor = parseTime(document.getElementById('manualAnchorTime').value);
      if (!anchor) return;
      document.getElementById('startTime').value = anchor;
      document.getElementById('endTime').value = anchor;
      document.getElementById('tfSelect').value = tfToMinutes(document.getElementById('manualPdaTF').value);
      document.getElementById('paddingInput').value = '80';
      loadData();
    };
    document.getElementById('manualSaveBtn').onclick = saveManualPdaFromPanel;
    document.getElementById('manualResetBtn').onclick = resetManualForm;
    document.getElementById('pickAnchorTimeBtn').onclick = () => panelPickCrosshairTime('manualAnchorTime');
    document.getElementById('pickStartTimeBtn').onclick = () => panelPickCrosshairTime('manualStartTime');
    document.getElementById('pickEndTimeBtn').onclick = () => panelPickCrosshairTime('manualEndTime');
    document.getElementById('pickPriceBtn').onclick = () => toast('图表取价将在下一步接入', 'info');
    document.getElementById('pickPriceHighBtn').onclick = () => toast('图表取价将在下一步接入', 'info');
    document.getElementById('pickPriceLowBtn').onclick = () => toast('图表取价将在下一步接入', 'info');
    document.getElementById('manualPreviewOverlayBtn').onclick = () => toast('Manual overlay 预览将在下一步接入', 'info');

    function tfToMinutes(tf) {
      const map = { '1M': '1', '5M': '5', '15M': '15', '30M': '30', '1H': '60', '4H': '240', D: '1440', '1W': '10080' };
      return map[tf] || '60';
    }

    // Auto-normalize time inputs on blur (201201091120 → 2012-01-09 11:20)
    ['startTime', 'endTime', 'panelFilterTimeFrom', 'panelFilterTimeTo', 'manualAnchorTime', 'manualStartTime', 'manualEndTime'].forEach(id => {
      document.getElementById(id).addEventListener('focusout', (e) => {
        const normed = parseTime(e.target.value);
        if (normed && normed !== e.target.value) e.target.value = normed;
      });
    });

    // ── Right-click context menu ──
    let crosshairBarIndex = -1;
    const ctxMenu = document.getElementById('ctxMenu');

    function showCtxMenu(x, y) {
      ctxMenu.style.left = x + 'px';
      ctxMenu.style.top = y + 'px';
      ctxMenu.style.display = 'block';
    }
    function hideCtxMenu() {
      ctxMenu.style.display = 'none';
    }

    document.getElementById('chartContainer').addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (!chart || crosshairBarIndex < 0) return;
      showCtxMenu(e.clientX, e.clientY);
    });
    document.addEventListener('click', hideCtxMenu);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideCtxMenu(); });

    document.getElementById('ctxCopyTime').onclick = () => {
      if (!lastCandleData || crosshairBarIndex < 0 || crosshairBarIndex >= lastCandleData.length) return;
      const ts = lastCandleData[crosshairBarIndex].timestamp;
      const d = new Date(ts);
      const text = `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
      navigator.clipboard.writeText(text).then(() => {
        document.getElementById('ctxCopyTime').textContent = '已复制';
        setTimeout(() => { document.getElementById('ctxCopyTime').textContent = '复制当前时间'; }, 800);
      });
      hideCtxMenu();
    };

    // Track crosshair position for context menu
    function setupCrosshairTracking() {
      if (!chart) return;
      chart.subscribeAction('onCrosshairChange', (data) => {
        if (data && data.dataIndex !== undefined) {
          crosshairBarIndex = data.dataIndex;
        }
      });
    }

    loadFromParams();
    panelSearchPdas();
  </script>
</body>
</html>
