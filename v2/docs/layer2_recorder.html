<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layer2 Structure Path Recorder</title>
  <style>
    :root {
      --bg: #18232b;
      --panel: #243742;
      --panel-soft: #304752;
      --panel-strong: #1f3039;
      --line: #708896;
      --text: #f4f1ea;
      --muted: #a9bac1;
      --accent: #4fd1b5;
      --accent-soft: rgba(79, 209, 181, 0.16);
      --danger: #ef9a9a;
      --warn: #d9bd7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    .shell { max-width: 1800px; margin: 0 auto; padding: 18px; }
    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 14px;
      border: 1px solid rgba(112, 136, 150, 0.55);
      border-radius: 8px;
      background: var(--panel);
      padding: 16px;
    }
    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: 0; }
    .sub { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .layout {
      display: grid;
      grid-template-columns: 420px minmax(520px, 1fr) 520px;
      gap: 14px;
      align-items: start;
    }
    .panel {
      border: 1px solid rgba(112, 136, 150, 0.48);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }
    .panel__header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(112, 136, 150, 0.24);
    }
    .panel__title { margin: 0; font-size: 15px; }
    .panel__body { padding: 14px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .field { margin-bottom: 10px; }
    label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid rgba(112, 136, 150, 0.62);
      border-radius: 6px;
      background: var(--panel-soft);
      color: var(--text);
      padding: 9px 10px;
      min-height: 38px;
    }
    textarea { min-height: 76px; resize: vertical; line-height: 1.5; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn-stack {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      width: 58px;
      flex: 0 0 58px;
    }
    .btn-stack .btn {
      width: 100%;
      min-width: 0;
      padding: 0 6px;
      white-space: nowrap;
    }
    .btn {
      min-height: 36px;
      border-radius: 6px;
      border: 1px solid rgba(112, 136, 150, 0.42);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      padding: 0 11px;
      cursor: pointer;
    }
    .btn:hover { border-color: rgba(79, 209, 181, 0.48); }
    .btn--primary {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(79, 209, 181, 0.42);
      font-weight: 700;
    }
    .btn--danger { color: var(--danger); }
    .btn--tiny { min-height: 28px; padding: 0 8px; font-size: 12px; }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border: 1px solid rgba(112, 136, 150, 0.36);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .status {
      margin-top: 10px;
      padding: 9px 10px;
      border: 1px solid rgba(112, 136, 150, 0.28);
      border-radius: 6px;
      color: var(--muted);
      background: rgba(0,0,0,0.10);
      font-size: 12px;
      line-height: 1.5;
    }
    .status[data-kind="ok"] { color: var(--accent); }
    .status[data-kind="warn"] { color: var(--warn); }
    .status[data-kind="danger"] { color: var(--danger); }
    .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .tab {
      flex: 1;
      min-height: 34px;
      border-radius: 6px;
      border: 1px solid rgba(112, 136, 150, 0.34);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      cursor: pointer;
    }
    .tab.active {
      color: var(--accent);
      border-color: rgba(79, 209, 181, 0.48);
      background: var(--accent-soft);
    }
    .list {
      display: grid;
      gap: 8px;
      max-height: 58vh;
      overflow: auto;
      padding-right: 3px;
    }
    .card {
      border: 1px solid rgba(112, 136, 150, 0.34);
      border-radius: 7px;
      background: rgba(31, 48, 57, 0.68);
      padding: 10px;
    }
    .card__top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 58px;
      gap: 8px;
      align-items: start;
      margin-bottom: 7px;
    }
    .card__title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .card__meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .path-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }
    .path-chip {
      border: 1px solid rgba(112, 136, 150, 0.36);
      border-radius: 6px;
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      cursor: pointer;
      padding: 8px 10px;
      min-width: 150px;
      text-align: left;
    }
    .path-chip.active {
      background: var(--accent-soft);
      border-color: rgba(79, 209, 181, 0.52);
      color: var(--text);
    }
    .time-ref-select { margin-top: 7px; }
    .refs {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
    }
    .ref-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 130px auto;
      gap: 8px;
      align-items: center;
      border: 1px solid rgba(112, 136, 150, 0.24);
      border-radius: 6px;
      padding: 8px;
      background: rgba(0,0,0,0.1);
    }
    .action-list {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
    }
    .action-row {
      display: grid;
      grid-template-columns: minmax(160px, 0.85fr) minmax(160px, 1fr) auto;
      gap: 8px;
      align-items: end;
    }
    pre {
      margin: 0;
      min-height: 74vh;
      max-height: 74vh;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid rgba(112, 136, 150, 0.34);
      border-radius: 7px;
      background: #101b22;
      color: #e9efe9;
      padding: 12px;
      line-height: 1.45;
      font-size: 12px;
    }
    @media (max-width: 1320px) {
      .layout { grid-template-columns: 390px minmax(0, 1fr); }
      .preview-panel { grid-column: 1 / -1; }
      pre { min-height: 420px; max-height: 520px; }
    }
    @media (max-width: 860px) {
      .topbar { grid-template-columns: 1fr; }
      .layout { grid-template-columns: 1fr; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .ref-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1>Layer2 Structure Path Recorder</h1>
        <p class="sub">临时黄金样本录入页：拉取 Layer1 PDA 与 session extreme，人工整理 structure path，导出可读 YAML。</p>
      </div>
      <div class="btn-row">
        <button class="btn btn--primary" id="addPathTop">新增 Path</button>
        <button class="btn" id="copyYamlTop">复制 YAML</button>
        <button class="btn" id="downloadYamlTop">下载 YAML</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="panel__header">
          <h2 class="panel__title">Context</h2>
          <span class="pill" id="contextCount">0 refs</span>
        </div>
        <div class="panel__body">
          <div class="grid-2">
            <div class="field">
              <label>API Base</label>
              <input id="apiBase" value="http://127.0.0.1:8765">
            </div>
            <div class="field">
              <label>Instrument</label>
              <input id="instrument" value="NQ">
            </div>
          </div>
          <div class="grid-3">
            <div class="field">
              <label>Sample Date</label>
              <input id="sampleDate" type="text" inputmode="numeric" value="2012-01-10" placeholder="YYYY-MM-DD">
            </div>
            <div class="field">
              <label>Lookback Days</label>
              <input id="lookbackDays" type="number" min="0" max="30" value="4">
            </div>
            <div class="field">
              <label>Lookahead Days</label>
              <input id="lookaheadDays" type="number" min="0" max="30" value="1">
            </div>
          </div>
          <div class="btn-row">
            <button class="btn btn--primary" id="loadContext">加载候选引用</button>
            <button class="btn" id="resetDraft">清空草稿</button>
          </div>
          <div class="status" id="status">页面会自动保存到浏览器 localStorage。先启动 price_lookup_api.py，再加载候选引用。</div>

          <div class="tabs" style="margin-top:14px;">
            <button class="tab active" data-tab="pda">PDA</button>
            <button class="tab" data-tab="group">Groups</button>
            <button class="tab" data-tab="extreme">Session Extremes</button>
          </div>

          <div id="pdaTab">
            <div class="grid-2">
              <div class="field">
                <label>PDA Role</label>
                <select id="pdaRole">
                  <option value="start_zone">start_zone</option>
                  <option value="target">target</option>
                  <option value="opposing_pda">opposing_pda</option>
                  <option value="tapped">tapped</option>
                  <option value="swept">swept</option>
                  <option value="respected">respected</option>
                  <option value="ignored">ignored</option>
                  <option value="created_by_path">created_by_path</option>
                </select>
              </div>
              <div class="field">
                <label>Filter</label>
                <input id="pdaFilter" placeholder="例如 4H bsl 2378">
              </div>
            </div>
            <div class="list" id="pdaList"></div>
          </div>

          <div id="groupTab" hidden>
            <div class="grid-2">
              <div class="field">
                <label>Group Role</label>
                <select id="groupRole">
                  <option value="start_zone">start_zone</option>
                  <option value="target">target</option>
                  <option value="swept">swept</option>
                  <option value="held">held</option>
                  <option value="opposing_liquidity">opposing_liquidity</option>
                  <option value="created_by_path">created_by_path</option>
                </select>
              </div>
              <div class="field">
                <label>Filter</label>
                <input id="groupFilter" placeholder="例如 daily_high ny_am 2378">
              </div>
            </div>
            <div class="list" id="groupList"></div>
          </div>

          <div id="extremeTab" hidden>
            <div class="grid-2">
              <div class="field">
                <label>Extreme Role</label>
                <select id="extremeRole">
                  <option value="start_context">start_context</option>
                  <option value="target">target</option>
                  <option value="swept">swept</option>
                  <option value="held">held</option>
                  <option value="formed_eq">formed_eq</option>
                  <option value="opposing_liquidity">opposing_liquidity</option>
                </select>
              </div>
              <div class="field">
                <label>Filter</label>
                <input id="extremeFilter" placeholder="例如 premarket high">
              </div>
            </div>
            <div class="list" id="extremeList"></div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel__header">
          <h2 class="panel__title">Structure Paths</h2>
          <div class="btn-row">
            <button class="btn btn--tiny btn--primary" id="addPath">新增</button>
            <button class="btn btn--tiny btn--danger" id="deletePath">删除当前</button>
          </div>
        </div>
        <div class="panel__body">
          <div class="path-list" id="pathList"></div>
          <form id="pathForm">
            <div class="grid-3">
              <div class="field">
                <label>ID</label>
                <input data-field="id" placeholder="path_20120110_001">
              </div>
              <div class="field">
                <label>Start Time</label>
                <input data-field="startTime" placeholder="2012-01-10 07:00">
                <select class="time-ref-select" id="startTimeRef"></select>
              </div>
              <div class="field">
                <label>End Time</label>
                <input data-field="endTime" placeholder="2012-01-10 10:04">
                <select class="time-ref-select" id="endTimeRef"></select>
              </div>
            </div>
            <div class="grid-3">
              <div class="field">
                <label>Direction</label>
                <select data-field="direction">
                  <option value=""></option>
                  <option value="up">up</option>
                  <option value="down">down</option>
                  <option value="consolidation">consolidation</option>
                </select>
              </div>
              <div class="field">
                <label>Role</label>
                <select data-field="role">
                  <option value=""></option>
                  <option value="impulse">impulse</option>
                  <option value="pullback">pullback</option>
                  <option value="reversal">reversal</option>
                  <option value="continuation">continuation</option>
                  <option value="liquidity_run">liquidity_run</option>
                  <option value="consolidation">consolidation</option>
                  <option value="transition">transition</option>
                </select>
              </div>
              <div class="field">
                <label>Path Type</label>
                <select data-field="pathType">
                  <option value=""></option>
                  <option value="internal_to_external">internal_to_external</option>
                  <option value="external_to_internal">external_to_internal</option>
                  <option value="internal_to_internal">internal_to_internal</option>
                  <option value="external_to_external">external_to_external</option>
                  <option value="unknown">unknown</option>
                </select>
              </div>
            </div>
            <div class="grid-3">
              <div class="field">
                <label>Primary TF</label>
                <select data-field="primaryTimeframe">
                  <option value="1H">1H</option>
                  <option value="4H">4H</option>
                  <option value="30M">30M</option>
                  <option value="15M">15M</option>
                  <option value="D">D</option>
                </select>
              </div>
              <div class="field">
                <label>Delivery</label>
                <select data-field="delivery">
                  <option value=""></option>
                  <option value="displacement">displacement</option>
                  <option value="grinding">grinding</option>
                  <option value="choppy">choppy</option>
                  <option value="overlapping">overlapping</option>
                </select>
              </div>
              <div class="field">
                <label>NY Open Lens TF</label>
                <select data-field="executionLensTimeframe">
                  <option value=""></option>
                  <option value="30M">30M</option>
                  <option value="15M">15M</option>
                  <option value="5M">5M</option>
                </select>
              </div>
            </div>
            <div class="grid-2">
              <div class="field">
                <label>NY Open Lens Window</label>
                <input data-field="executionLensWindow" placeholder="09:30-11:00">
              </div>
              <div class="field">
                <label>NY Open Lens Note</label>
                <input data-field="executionLensNote" placeholder="9:30 后用 30M 观察 sweep / displacement / reaction">
              </div>
            </div>
            <div class="field">
              <label>Main Actions</label>
              <div class="action-list" id="mainActionsList"></div>
              <button class="btn btn--tiny btn--primary" type="button" id="addMainAction">新增 Main Action</button>
            </div>
            <div class="field">
              <label>与上一段行情比值</label>
              <input data-field="previousPathRatio" placeholder="例如 0.5 / 1.0 / 1.5，后续可自动计算">
            </div>
            <div class="field">
              <label>Tags</label>
              <input data-field="tags" placeholder="continuation, pdh_sweep, am_premium">
            </div>
            <div class="field">
              <label>在之前行情 PDA 处如何反应：截图</label>
              <input data-field="priorPdaReactionImage" placeholder="截图文件名或路径">
            </div>
            <div class="field">
              <label>在之前行情 PDA 处如何反应：说明</label>
              <textarea data-field="priorPdaReactionNote" placeholder="文字说明：触达、拒绝、停顿、加速、回撤等。"></textarea>
            </div>
          </form>

          <div class="panel" style="margin-top:12px;">
            <div class="panel__header">
              <h3 class="panel__title">当前 Path 引用</h3>
            </div>
            <div class="panel__body">
              <div class="refs" id="refsList"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel preview-panel">
        <div class="panel__header">
          <h2 class="panel__title">YAML Preview</h2>
          <div class="btn-row">
            <button class="btn btn--tiny" id="copyYaml">复制</button>
            <button class="btn btn--tiny" id="downloadYaml">下载</button>
          </div>
        </div>
        <div class="panel__body">
          <pre id="yamlPreview"></pre>
        </div>
      </section>
    </main>
  </div>

  <script>
    const STORE_KEY = 'layer2_recorder_draft_v1';
    const LAYER2_TIMEFRAMES = ['D', '4H', '1H', '30M', '15M'];
    const state = {
      apiBase: 'http://127.0.0.1:8765',
      instrument: 'NQ',
      sampleDate: '2012-01-10',
      lookbackDays: 4,
      lookaheadDays: 1,
      activeTab: 'pda',
      activePathIndex: 0,
      pdaRecords: [],
      extremes: [],
      groups: [],
      groupsByMemberRef: {},
      paths: []
    };

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));

    function emptyPath() {
      const date = state.sampleDate || 'YYYYMMDD';
      const compact = date.replaceAll('-', '');
      const idx = String(state.paths.length + 1).padStart(3, '0');
      return {
        id: `path_${compact}_${idx}`,
        startTime: '',
        endTime: '',
        direction: '',
        primaryTimeframe: '1H',
        role: '',
        pathType: '',
        delivery: '',
        executionLensTimeframe: '',
        executionLensWindow: '',
        executionLensNote: '',
        mainActions: [{ type: '', ref: '' }],
        previousPathRatio: '',
        tags: '',
        priorPdaReactionImage: '',
        priorPdaReactionNote: '',
        pdaRefs: [],
        groupRefs: [],
        sessionExtremeRefs: []
      };
    }

    function saveDraft() {
      const draft = {
        apiBase: state.apiBase,
        instrument: state.instrument,
        sampleDate: state.sampleDate,
        lookbackDays: state.lookbackDays,
        lookaheadDays: state.lookaheadDays,
        activePathIndex: state.activePathIndex,
        paths: state.paths
      };
      localStorage.setItem(STORE_KEY, JSON.stringify(draft));
    }

    function loadDraft() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return;
        const draft = JSON.parse(raw);
        Object.assign(state, draft);
        (state.paths || []).forEach(path => {
          if (!path.mainActions) {
            path.mainActions = [{ type: path.mainActionType || '', ref: path.mainActionRef || '' }];
          }
          delete path.mainActionType;
          delete path.mainActionRef;
        });
      } catch (err) {
        console.warn(err);
      }
    }

    function setStatus(text, kind = '') {
      const el = $('#status');
      el.textContent = text;
      el.dataset.kind = kind;
    }

    function dateAdd(dateStr, days) {
      const d = new Date(dateStr + 'T12:00:00');
      d.setDate(d.getDate() + days);
      return d.toISOString().slice(0, 10);
    }

    function num(v) {
      return Number.isFinite(v) ? v : (typeof v === 'number' ? v : null);
    }

    function firstPrice(rec) {
      if (rec.price !== null && rec.price !== undefined) return rec.price;
      if (rec.priceCe !== null && rec.priceCe !== undefined) return rec.priceCe;
      if (rec.priceHigh !== null && rec.priceHigh !== undefined) return rec.priceHigh;
      if (rec.priceLow !== null && rec.priceLow !== undefined) return rec.priceLow;
      return null;
    }

    function shortTime(ts) {
      return String(ts || '').replace(':00', '');
    }

    function pdaLabel(rec) {
      const price = firstPrice(rec);
      const parts = [
        rec.tradeDate,
        rec.timeframe,
        String(rec.pdaType || '').toUpperCase(),
        rec.direction || '',
        price === null ? '' : String(price)
      ].filter(Boolean);
      return parts.join(' ');
    }

    function pdaTimeMeta(rec) {
      const parts = [];
      if (rec.occurrenceTime) parts.push(`出现 ${shortTime(rec.occurrenceTime)}`);
      if (rec.anchorTime && rec.anchorTime !== rec.occurrenceTime) parts.push(`锚点 ${shortTime(rec.anchorTime)}`);
      if (!parts.length && rec.confirmTime) parts.push(`确认 ${shortTime(rec.confirmTime)}`);
      if (rec.reviewRole) parts.push(rec.reviewRole);
      return parts.join(' · ');
    }

    function matchingGroupForPdaId(pdaId) {
      return (state.groupsByMemberRef[pdaId] || [])[0] || null;
    }

    function extremeRef(item, side) {
      return `pdext:${item.instrument}:${item.tradeDate}:${item.sessionName}:${side}`;
    }

    function extremeLabel(item, side) {
      const isHigh = side === 'high';
      return `${item.tradeDate} ${item.sessionName} ${side.toUpperCase()} ${isHigh ? item.highPrice : item.lowPrice} @ ${shortTime(isHigh ? item.highTime : item.lowTime)}`;
    }

    async function fetchJson(url) {
      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || res.statusText);
      return data.result;
    }

    async function loadContext() {
      syncTopInputs();
      const api = state.apiBase.replace(/\/$/, '');
      const from = dateAdd(state.sampleDate, -Number(state.lookbackDays || 0));
      const to = dateAdd(state.sampleDate, Number(state.lookaheadDays || 0));
      setStatus(`加载 ${from} -> ${to} 的候选引用...`);

      const tfUrls = LAYER2_TIMEFRAMES.map(tf => {
        const qs = new URLSearchParams({
          instrument: state.instrument,
          timeframe: tf,
          date_from: from,
          date_to: to,
          limit: tf === '15M' || tf === '30M' ? '300' : '1000'
        });
        return `${api}/v2/pda_records?${qs.toString()}`;
      });
      const extQs = new URLSearchParams({
        instrument: state.instrument,
        date_from: from,
        date_to: to
      });
      const groupQs = new URLSearchParams({
        instrument: state.instrument,
        date_from: from,
        date_to: to,
        limit: '1000'
      });

      try {
        const results = await Promise.all([
          ...tfUrls.map(url => fetchJson(url)),
          fetchJson(`${api}/v2/pd_extremes?${extQs.toString()}`),
          fetchJson(`${api}/v2/reference_groups?${groupQs.toString()}`)
        ]);
        const timeframeResults = results.slice(0, LAYER2_TIMEFRAMES.length);
        const ext = results[LAYER2_TIMEFRAMES.length];
        const groups = results[LAYER2_TIMEFRAMES.length + 1];
        state.pdaRecords = []
          .concat(...timeframeResults.map(result => result.records || []))
          .filter(rec => ['daily_high', 'daily_low', 'ict_midnight_day_high', 'ict_midnight_day_low', 'bsl', 'ssl', 'eqh', 'eql', 'fvg', 'ndog', 'nwog'].includes(rec.pdaType));
        state.extremes = ext.items || [];
        state.groups = groups.groups || [];
        state.groupsByMemberRef = {};
        await loadGroupsForPdas(api);
        renderContext();
        setStatus(`已加载 ${state.pdaRecords.length} 个 PDA，${state.groups.length} 个 group，${state.extremes.length} 组 session extreme。`, 'ok');
      } catch (err) {
        setStatus(`加载失败：${err.message}`, 'danger');
      }
    }

    async function loadGroupsForPdas(api) {
      const refs = state.pdaRecords.map(rec => rec.pdaId).filter(Boolean);
      const groupsByMemberRef = {};
      for (let i = 0; i < refs.length; i += 120) {
        const qs = new URLSearchParams();
        refs.slice(i, i + 120).forEach(ref => qs.append('member_ref', ref));
        const result = await fetchJson(`${api}/v2/reference_groups_for_members?${qs.toString()}`);
        Object.assign(groupsByMemberRef, result.groupsByMemberRef || {});
      }
      state.groupsByMemberRef = groupsByMemberRef;
    }

    function syncTopInputs() {
      state.apiBase = $('#apiBase').value.trim() || 'http://127.0.0.1:8765';
      state.instrument = $('#instrument').value.trim() || 'NQ';
      state.sampleDate = $('#sampleDate').value || state.sampleDate;
      state.lookbackDays = Number($('#lookbackDays').value || 0);
      state.lookaheadDays = Number($('#lookaheadDays').value || 0);
      saveDraft();
    }

    function renderContext() {
      $('#contextCount').textContent = `${state.pdaRecords.length + state.groups.length + state.extremes.length * 2} refs`;
      renderPdas();
      renderGroups();
      renderExtremes();
      renderTimePickers();
    }

    function renderPdas() {
      const filter = ($('#pdaFilter').value || '').toLowerCase().trim();
      const list = $('#pdaList');
      list.innerHTML = '';
      state.pdaRecords
        .filter(rec => !filter || JSON.stringify(rec).toLowerCase().includes(filter))
        .forEach(rec => {
          const card = document.createElement('div');
          card.className = 'card';
          const price = firstPrice(rec);
          const group = (state.groupsByMemberRef[rec.pdaId] || [])[0] || null;
          const groupText = group
            ? `<br><strong>Group:</strong> ${escapeHtml(group.groupId)} · ${escapeHtml(group.timeframes || '')} · ${escapeHtml(group.roles || '')}`
            : '';
          card.innerHTML = `
            <div class="card__top">
              <div>
                <div class="card__title">${escapeHtml(pdaLabel(rec))}</div>
                <div class="card__meta">${escapeHtml(rec.pdaId)}<br>${escapeHtml(pdaTimeMeta(rec))}${groupText}</div>
              </div>
              <div class="btn-stack">
                <button class="btn btn--tiny btn--primary" type="button" data-action="group">${group ? '添加组' : '添加'}</button>
                ${group ? '<button class="btn btn--tiny" type="button" data-action="pda">单条</button>' : ''}
              </div>
            </div>
            <div class="card__meta">low ${fmt(rec.priceLow)} / high ${fmt(rec.priceHigh)} / ce ${fmt(rec.priceCe)}${rec.note ? '<br>' + escapeHtml(rec.note) : ''}</div>
          `;
          const groupBtn = card.querySelector('[data-action="group"]');
          groupBtn.onclick = () => {
            if (group) addGroupRef(group, $('#pdaRole').value || 'target');
            else addPdaRef(rec, $('#pdaRole').value);
          };
          const pdaBtn = card.querySelector('[data-action="pda"]');
          if (pdaBtn) pdaBtn.onclick = () => addPdaRef(rec, $('#pdaRole').value);
          list.appendChild(card);
        });
    }

    function renderExtremes() {
      const filter = ($('#extremeFilter').value || '').toLowerCase().trim();
      const list = $('#extremeList');
      list.innerHTML = '';
      state.extremes.forEach(item => {
        ['high', 'low'].forEach(side => {
          const label = extremeLabel(item, side);
          if (filter && !label.toLowerCase().includes(filter)) return;
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card__top">
              <div>
                <div class="card__title">${escapeHtml(label)}</div>
                <div class="card__meta">${escapeHtml(extremeRef(item, side))}</div>
              </div>
              <div class="btn-stack"><button class="btn btn--tiny btn--primary" type="button">添加</button></div>
            </div>
            <div class="card__meta">window ${escapeHtml(shortTime(item.windowStart))} -> ${escapeHtml(shortTime(item.windowEnd))}</div>
          `;
          card.querySelector('button').onclick = () => addExtremeRef(item, side, $('#extremeRole').value);
          list.appendChild(card);
        });
      });
    }

    function fullGroup(group) {
      return state.groups.find(item => item.groupId === group.groupId) || group;
    }

    function timeframeRank(tf) {
      const rank = { D: 500, '4H': 400, '1H': 300, '30M': 200, '15M': 100 };
      return rank[String(tf || '').toUpperCase()] || 0;
    }

    function memberRoleRank(member) {
      const role = member.reviewRole || member.pdaType || member.sessionName || '';
      if (role === 'daily_high' || role === 'daily_low') return 40;
      if (role === 'ict_midnight_day_high' || role === 'ict_midnight_day_low') return 30;
      if (role.startsWith('h4_')) return 24;
      if (role.startsWith('h1_')) return 22;
      if (member.memberType === 'pd_extreme') return 10;
      if (role === 'unclassified') return 1;
      return 5;
    }

    function pdaByRef(ref) {
      return state.pdaRecords.find(rec => rec.pdaId === ref) || null;
    }

    function canonicalGroupMember(group) {
      const members = fullGroup(group).members || [];
      if (!members.length) return null;
      return members.slice().sort((a, b) => {
        if (a.memberType !== b.memberType) return a.memberType === 'pda' ? -1 : 1;
        const tfDiff = timeframeRank(b.timeframe) - timeframeRank(a.timeframe);
        if (tfDiff) return tfDiff;
        const roleDiff = memberRoleRank(b) - memberRoleRank(a);
        if (roleDiff) return roleDiff;
        return String(a.memberRef || '').localeCompare(String(b.memberRef || ''));
      })[0];
    }

    function groupLabel(group) {
      const g = fullGroup(group);
      const member = canonicalGroupMember(g);
      if (member) {
        const rec = member.memberType === 'pda' ? pdaByRef(member.memberRef) : null;
        if (rec) return `${pdaLabel(rec)} @ ${shortTime(member.eventTime || rec.occurrenceTime)}`;
        return member.label || `${g.tradeDate} ${String(g.side || '').toUpperCase()} ${g.price} @ ${shortTime(g.eventTime)}`;
      }
      return `${g.tradeDate} ${String(g.side || '').toUpperCase()} ${g.price} @ ${shortTime(g.eventTime)} (${g.memberCount})`;
    }

    function renderGroups() {
      const filter = ($('#groupFilter').value || '').toLowerCase().trim();
      const list = $('#groupList');
      list.innerHTML = '';
      state.groups
        .filter(group => !filter || JSON.stringify(group).toLowerCase().includes(filter))
        .forEach(group => {
          const members = (group.members || []).map(item => escapeHtml(item.label || item.memberRef)).join('<br>');
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card__top">
              <div>
                <div class="card__title">${escapeHtml(groupLabel(group))}</div>
                <div class="card__meta">${escapeHtml(group.groupId)}<br>${escapeHtml(group.timeframes || '')} · ${escapeHtml(group.roles || '')}</div>
              </div>
              <div class="btn-stack"><button class="btn btn--tiny btn--primary" type="button">添加</button></div>
            </div>
            <div class="card__meta">${members}</div>
          `;
          card.querySelector('button').onclick = () => addGroupRef(group, $('#groupRole').value);
          list.appendChild(card);
        });
    }

    function activePath() {
      if (!state.paths.length) state.paths.push(emptyPath());
      if (state.activePathIndex < 0 || state.activePathIndex >= state.paths.length) state.activePathIndex = 0;
      return state.paths[state.activePathIndex];
    }

    function addPath() {
      syncCurrentForm();
      state.paths.push(emptyPath());
      state.activePathIndex = state.paths.length - 1;
      renderAll();
    }

    function deletePath() {
      if (!state.paths.length) return;
      if (!confirm('删除当前 path？')) return;
      state.paths.splice(state.activePathIndex, 1);
      state.activePathIndex = Math.max(0, state.activePathIndex - 1);
      if (!state.paths.length) state.paths.push(emptyPath());
      renderAll();
    }

    function renderPathList() {
      const wrap = $('#pathList');
      wrap.innerHTML = '';
      state.paths.forEach((path, idx) => {
        const btn = document.createElement('button');
        btn.className = 'path-chip' + (idx === state.activePathIndex ? ' active' : '');
        btn.type = 'button';
        btn.innerHTML = `<strong>${escapeHtml(path.id || `path ${idx + 1}`)}</strong><br><span>${escapeHtml(path.startTime || '?')} -> ${escapeHtml(path.endTime || '?')}</span>`;
        btn.onclick = () => {
          syncCurrentForm();
          state.activePathIndex = idx;
          renderAll();
        };
        wrap.appendChild(btn);
      });
    }

    function renderForm() {
      const path = activePath();
      $$('#pathForm [data-field]').forEach(el => {
        el.value = path[el.dataset.field] || '';
      });
      renderPathRefControls();
      renderTimePickers();
    }

    function syncCurrentForm() {
      const path = activePath();
      $$('#pathForm [data-field]').forEach(el => {
        path[el.dataset.field] = el.value;
      });
      syncTopInputs();
    }

    function currentPathRefOptions() {
      const path = activePath();
      const options = [];
      (path.groupRefs || []).forEach(ref => {
        options.push({ value: `group:${ref.id}`, label: `Group: ${ref.label || ref.id}`, time: ref.eventTime || '' });
      });
      (path.pdaRefs || []).forEach(ref => {
        options.push({ value: `pda:${ref.id}`, label: `PDA: ${ref.label || ref.id}`, time: ref.eventTime || '' });
      });
      (path.sessionExtremeRefs || []).forEach(ref => {
        options.push({ value: `session:${ref.ref}`, label: `Session: ${ref.label || ref.ref}`, time: ref.time || '' });
      });
      return options;
    }

    function renderPathRefControls() {
      const path = activePath();
      const options = currentPathRefOptions();
      if (!path.mainActions || !path.mainActions.length) path.mainActions = [{ type: '', ref: '' }];
      path.mainActions.forEach(action => {
        if (action.ref && !options.some(item => item.value === action.ref)) action.ref = '';
      });
      renderMainActions(options);
    }

    function mainActionOptionsHtml(selected = '') {
      const actions = [
        ['', ''],
        ['sweep_external_liquidity', 'sweep / 突破外部 liquidity'],
        ['sweep_internal_liquidity', 'sweep 内部 liquidity'],
        ['pullback_to_previous_ote', '回撤到上一段行情的 OTE'],
        ['respect_fvg', '尊重某个 FVG'],
        ['pullback_to_key_level_breaker', '回撤到 key level / breaker'],
      ];
      return actions.map(([value, label]) => `<option value="${escapeAttr(value)}"${value === selected ? ' selected' : ''}>${escapeHtml(label)}</option>`).join('');
    }

    function refOptionsHtml(options, selected = '') {
      const rows = ['<option value="">选择当前 Path 引用...</option>'];
      options.forEach(item => {
        rows.push(`<option value="${escapeAttr(item.value)}"${item.value === selected ? ' selected' : ''}>${escapeHtml(item.label)}</option>`);
      });
      return rows.join('');
    }

    function renderMainActions(options = currentPathRefOptions()) {
      const path = activePath();
      if (!path.mainActions || !path.mainActions.length) path.mainActions = [{ type: '', ref: '' }];
      const wrap = $('#mainActionsList');
      if (!wrap) return;
      wrap.innerHTML = '';
      path.mainActions.forEach((action, idx) => {
        const row = document.createElement('div');
        row.className = 'action-row';
        row.innerHTML = `
          <div>
            <label>Main Action ${idx + 1}</label>
            <select data-action-index="${idx}" data-action-field="type">${mainActionOptionsHtml(action.type || '')}</select>
          </div>
          <div>
            <label>Action PDA / Group</label>
            <select data-action-index="${idx}" data-action-field="ref">${refOptionsHtml(options, action.ref || '')}</select>
          </div>
          <button class="btn btn--tiny btn--danger" type="button" data-action-remove="${idx}">移除</button>
        `;
        row.querySelectorAll('select').forEach(select => {
          select.onchange = () => {
            const actionIdx = Number(select.dataset.actionIndex);
            const field = select.dataset.actionField;
            path.mainActions[actionIdx][field] = select.value;
            renderYaml();
            saveDraft();
          };
        });
        row.querySelector('button').onclick = () => {
          path.mainActions.splice(idx, 1);
          if (!path.mainActions.length) path.mainActions.push({ type: '', ref: '' });
          renderMainActions();
          renderYaml();
        };
        wrap.appendChild(row);
      });
    }

    function pdaEventTime(rec) {
      return rec.occurrenceTime || rec.anchorTime || rec.confirmTime || '';
    }

    function timeOptionLabel(prefix, label, time) {
      return `${prefix}: ${label} @ ${shortTime(time)}`;
    }

    function buildTimeOptions() {
      const path = activePath();
      const optionMap = new Map();
      const addOption = (key, item) => {
        const existing = optionMap.get(key);
        if (!existing || item.priority > existing.priority) optionMap.set(key, item);
      };
      (path.groupRefs || []).forEach(group => {
        if (!group.eventTime) return;
        addOption(group.id, {
          time: group.eventTime,
          label: timeOptionLabel('Group', group.label || group.id, group.eventTime),
          sort: group.eventTime,
          priority: 100
        });
      });
      (path.pdaRefs || []).forEach(ref => {
        if (!ref.eventTime) return;
        const group = ref.groupId ? { groupId: ref.groupId } : matchingGroupForPdaId(ref.id);
        const key = group ? group.groupId : ref.id;
        addOption(key, {
          time: ref.eventTime,
          label: timeOptionLabel('PDA', ref.label || ref.id, ref.eventTime),
          sort: ref.eventTime,
          priority: group ? 80 : 60
        });
      });
      (path.sessionExtremeRefs || []).forEach(ref => {
        if (!ref.time) return;
        addOption(ref.ref, {
          time: ref.time,
          label: timeOptionLabel('Session', ref.label || ref.ref, ref.time),
          sort: ref.time,
          priority: 50
        });
      });
      const seen = new Set();
      return Array.from(optionMap.values())
        .sort((a, b) => String(a.sort).localeCompare(String(b.sort)))
        .filter(item => {
          const key = `${item.time}|${item.label}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
    }

    function renderTimePickers() {
      const options = buildTimeOptions();
      ['startTimeRef', 'endTimeRef'].forEach(id => {
        const select = $('#' + id);
        if (!select) return;
        const current = select.value;
        select.innerHTML = '<option value="">从当前 Path 引用选择时间...</option>';
        options.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.time;
          opt.textContent = item.label;
          select.appendChild(opt);
        });
        select.value = current && options.some(item => item.time === current) ? current : '';
      });
    }

    function applyTimeRef(field, value) {
      if (!value) return;
      const path = activePath();
      path[field] = value;
      const input = $(`#pathForm [data-field="${field}"]`);
      if (input) input.value = value;
      renderPathList();
      renderPathRefControls();
      renderYaml();
    }

    function addPdaRef(rec, role) {
      const path = activePath();
      const price = firstPrice(rec);
      if (path.pdaRefs.some(ref => ref.id === rec.pdaId && ref.role === role)) return;
      path.pdaRefs.push({
        id: rec.pdaId,
        role,
        label: pdaLabel(rec),
        price,
        timeframe: rec.timeframe,
        type: rec.pdaType,
        eventTime: pdaEventTime(rec),
        groupId: matchingGroupForPdaId(rec.pdaId)?.groupId || ''
      });
      renderAll();
    }

    function addGroupRef(group, role) {
      const path = activePath();
      if (!path.groupRefs) path.groupRefs = [];
      const existing = path.groupRefs.find(ref => ref.id === group.groupId && ref.role === role);
      if (existing) return;
      const ref = {
        id: group.groupId,
        role,
        label: groupLabel(group),
        price: group.price,
        side: group.side,
        eventTime: group.eventTime,
        memberCount: group.memberCount,
        roles: group.roles,
        timeframes: group.timeframes,
        primaryMember: canonicalGroupMember(group)
      };
      path.groupRefs.push(ref);
      renderAll();
    }

    function addExtremeRef(item, side, role) {
      const path = activePath();
      const ref = extremeRef(item, side);
      if (path.sessionExtremeRefs.some(x => x.ref === ref && x.role === role)) return;
      path.sessionExtremeRefs.push({
        ref,
        role,
        label: extremeLabel(item, side),
        price: side === 'high' ? item.highPrice : item.lowPrice,
        time: side === 'high' ? item.highTime : item.lowTime,
        session: item.sessionName,
        side
      });
      renderAll();
    }

    function removeRef(kind, idx) {
      const path = activePath();
      if (kind === 'pda') path.pdaRefs.splice(idx, 1);
      if (kind === 'group') path.groupRefs.splice(idx, 1);
      if (kind === 'extreme') path.sessionExtremeRefs.splice(idx, 1);
      renderAll();
    }

    function updateRefRole(kind, idx, value) {
      const path = activePath();
      if (kind === 'pda') path.pdaRefs[idx].role = value;
      if (kind === 'group') path.groupRefs[idx].role = value;
      if (kind === 'extreme') path.sessionExtremeRefs[idx].role = value;
      renderAll();
    }

    function renderRefs() {
      const path = activePath();
      const wrap = $('#refsList');
      wrap.innerHTML = '';
      if (!path.groupRefs) path.groupRefs = [];
      const addRow = (kind, ref, idx) => {
        const row = document.createElement('div');
        row.className = 'ref-row';
        row.innerHTML = `
          <div>
            <div class="card__title">${escapeHtml(ref.label || ref.id || ref.ref)}</div>
            <div class="card__meta">${escapeHtml(ref.id || ref.ref)} · ${fmt(ref.price)}</div>
          </div>
          <input value="${escapeAttr(ref.role || '')}">
          <button class="btn btn--tiny btn--danger" type="button">移除</button>
        `;
        row.querySelector('input').oninput = (e) => updateRefRole(kind, idx, e.target.value);
        row.querySelector('button').onclick = () => removeRef(kind, idx);
        wrap.appendChild(row);
      };
      path.pdaRefs.forEach((ref, idx) => addRow('pda', ref, idx));
      path.groupRefs.forEach((ref, idx) => addRow('group', ref, idx));
      path.sessionExtremeRefs.forEach((ref, idx) => addRow('extreme', ref, idx));
      if (!path.pdaRefs.length && !path.groupRefs.length && !path.sessionExtremeRefs.length) {
        wrap.innerHTML = '<div class="status">从左侧候选引用里点击“添加”。</div>';
      }
    }

    function yamlQuote(value) {
      if (value === null || value === undefined) return '""';
      const text = String(value);
      return '"' + text.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
    }

    function splitTags(text) {
      return String(text || '').split(',').map(x => x.trim()).filter(Boolean);
    }

    function pushList(lines, indent, key, values) {
      const vals = Array.isArray(values) ? values : splitTags(values);
      if (!vals.length) return;
      lines.push(`${indent}${key}:`);
      vals.forEach(v => lines.push(`${indent}  - ${yamlQuote(v)}`));
    }

    function buildYaml() {
      syncCurrentForm();
      const lines = [];
      lines.push(`date: ${yamlQuote(state.sampleDate)}`);
      lines.push(`instrument: ${yamlQuote(state.instrument)}`);
      lines.push('');
      lines.push('structure_paths:');
      state.paths.forEach(path => {
        lines.push(`  - id: ${yamlQuote(path.id || '')}`);
        if (path.startTime) lines.push(`    start_time: ${yamlQuote(path.startTime)}`);
        if (path.endTime) lines.push(`    end_time: ${yamlQuote(path.endTime)}`);
        if (path.primaryTimeframe) lines.push(`    primary_timeframe: ${yamlQuote(path.primaryTimeframe)}`);
        if (path.direction) lines.push(`    direction: ${path.direction}`);
        if (path.role) lines.push(`    role: ${path.role}`);
        if (path.pathType) lines.push(`    path_type: ${path.pathType}`);
        if (path.executionLensTimeframe || path.executionLensWindow || path.executionLensNote) {
          lines.push('    execution_lens:');
          lines.push('      anchor: "ny_open"');
          if (path.executionLensTimeframe) lines.push(`      timeframe: ${yamlQuote(path.executionLensTimeframe)}`);
          if (path.executionLensWindow) lines.push(`      window: ${yamlQuote(path.executionLensWindow)}`);
          if (path.executionLensNote) lines.push(`      note: ${yamlQuote(path.executionLensNote)}`);
        }
        if (path.delivery) {
          lines.push('    behavior:');
          if (path.delivery) lines.push(`      delivery: ${path.delivery}`);
        }
        const actions = (path.mainActions || []).filter(action => action.type || action.ref);
        if (actions.length) {
          lines.push('    main_actions:');
          actions.forEach(action => {
            lines.push('      -');
            if (action.type) lines.push(`        type: ${action.type}`);
            if (action.ref) lines.push(`        ref: ${yamlQuote(action.ref)}`);
          });
        }
        if (path.previousPathRatio) lines.push(`    previous_path_ratio: ${yamlQuote(path.previousPathRatio)}`);
        if (path.pdaRefs.length || (path.groupRefs || []).length || path.sessionExtremeRefs.length) {
          lines.push('    references:');
          if ((path.groupRefs || []).length) {
            lines.push('      groups:');
            path.groupRefs.forEach(ref => {
              lines.push(`        - id: ${yamlQuote(ref.id)}`);
              if (ref.role) lines.push(`          role: ${ref.role}`);
              if (ref.label) lines.push(`          label: ${yamlQuote(ref.label)}`);
              if (ref.price !== null && ref.price !== undefined) lines.push(`          price: ${ref.price}`);
              if (ref.side) lines.push(`          side: ${yamlQuote(ref.side)}`);
              if (ref.eventTime) lines.push(`          event_time: ${yamlQuote(ref.eventTime)}`);
              if (ref.memberCount !== null && ref.memberCount !== undefined) lines.push(`          member_count: ${ref.memberCount}`);
              if (ref.timeframes) lines.push(`          timeframes: ${yamlQuote(ref.timeframes)}`);
              if (ref.roles) lines.push(`          roles: ${yamlQuote(ref.roles)}`);
              if (ref.primaryMember) {
                lines.push('          primary_member:');
                if (ref.primaryMember.memberType) lines.push(`            type: ${yamlQuote(ref.primaryMember.memberType)}`);
                if (ref.primaryMember.memberRef) lines.push(`            ref: ${yamlQuote(ref.primaryMember.memberRef)}`);
                if (ref.primaryMember.label) lines.push(`            label: ${yamlQuote(ref.primaryMember.label)}`);
              }
            });
          }
          if (path.pdaRefs.length) {
            lines.push('      pdas:');
            path.pdaRefs.forEach(ref => {
              lines.push(`        - id: ${yamlQuote(ref.id)}`);
              if (ref.role) lines.push(`          role: ${ref.role}`);
              if (ref.label) lines.push(`          label: ${yamlQuote(ref.label)}`);
              if (ref.price !== null && ref.price !== undefined) lines.push(`          price: ${ref.price}`);
              if (ref.timeframe) lines.push(`          timeframe: ${yamlQuote(ref.timeframe)}`);
              if (ref.type) lines.push(`          type: ${yamlQuote(ref.type)}`);
              if (ref.eventTime) lines.push(`          event_time: ${yamlQuote(ref.eventTime)}`);
              if (ref.groupId) lines.push(`          group_id: ${yamlQuote(ref.groupId)}`);
            });
          }
          if (path.sessionExtremeRefs.length) {
            lines.push('      session_extremes:');
            path.sessionExtremeRefs.forEach(ref => {
              lines.push(`        - ref: ${yamlQuote(ref.ref)}`);
              if (ref.role) lines.push(`          role: ${ref.role}`);
              if (ref.label) lines.push(`          label: ${yamlQuote(ref.label)}`);
              if (ref.price !== null && ref.price !== undefined) lines.push(`          price: ${ref.price}`);
              if (ref.time) lines.push(`          time: ${yamlQuote(ref.time)}`);
            });
          }
        }
        pushList(lines, '    ', 'tags', path.tags);
        if (path.priorPdaReactionImage || path.priorPdaReactionNote) {
          lines.push('    prior_pda_reaction:');
          if (path.priorPdaReactionImage) lines.push(`      screenshot: ${yamlQuote(path.priorPdaReactionImage)}`);
          if (path.priorPdaReactionNote) lines.push(`      note: ${yamlQuote(path.priorPdaReactionNote)}`);
        }
      });
      return lines.join('\n') + '\n';
    }

    function renderYaml() {
      $('#yamlPreview').textContent = buildYaml();
      saveDraft();
    }

    function renderAll() {
      if (!state.paths.length) state.paths.push(emptyPath());
      renderPathList();
      renderForm();
      renderRefs();
      renderContext();
      renderYaml();
    }

    function fmt(value) {
      return value === null || value === undefined || value === '' ? '' : String(value);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[ch]));
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#096;');
    }

    async function copyYaml() {
      const yaml = buildYaml();
      await navigator.clipboard.writeText(yaml);
      setStatus('YAML 已复制。', 'ok');
    }

    function downloadYaml() {
      const yaml = buildYaml();
      const name = `${state.instrument || 'NQ'}_${state.sampleDate || 'layer2'}_structure_paths.yaml`;
      const blob = new Blob([yaml], { type: 'text/yaml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function bindEvents() {
      ['apiBase', 'instrument', 'sampleDate', 'lookbackDays', 'lookaheadDays'].forEach(id => {
        $('#' + id).addEventListener('input', () => {
          syncTopInputs();
          renderYaml();
        });
      });
      $('#loadContext').onclick = loadContext;
      $('#addPath').onclick = addPath;
      $('#addPathTop').onclick = addPath;
      $('#deletePath').onclick = deletePath;
      $('#startTimeRef').onchange = (event) => applyTimeRef('startTime', event.target.value);
      $('#endTimeRef').onchange = (event) => applyTimeRef('endTime', event.target.value);
      $('#addMainAction').onclick = () => {
        const path = activePath();
        if (!path.mainActions) path.mainActions = [];
        path.mainActions.push({ type: '', ref: '' });
        renderMainActions();
        renderYaml();
      };
      $('#copyYaml').onclick = copyYaml;
      $('#copyYamlTop').onclick = copyYaml;
      $('#downloadYaml').onclick = downloadYaml;
      $('#downloadYamlTop').onclick = downloadYaml;
      $('#resetDraft').onclick = () => {
        if (!confirm('清空当前浏览器草稿？')) return;
        localStorage.removeItem(STORE_KEY);
        location.reload();
      };
      $$('#pathForm [data-field]').forEach(el => {
        el.addEventListener('input', () => {
          syncCurrentForm();
          renderPathList();
          if (el.dataset.field === 'startTime' || el.dataset.field === 'endTime') renderPathRefControls();
          renderYaml();
        });
      });
      $$('.tab').forEach(btn => {
        btn.onclick = () => {
          state.activeTab = btn.dataset.tab;
          $$('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === state.activeTab));
          $('#pdaTab').hidden = state.activeTab !== 'pda';
          $('#groupTab').hidden = state.activeTab !== 'group';
          $('#extremeTab').hidden = state.activeTab !== 'extreme';
        };
      });
      $('#pdaFilter').oninput = renderPdas;
      $('#groupFilter').oninput = renderGroups;
      $('#extremeFilter').oninput = renderExtremes;
    }

    function hydrateInputs() {
      $('#apiBase').value = state.apiBase;
      $('#instrument').value = state.instrument;
      $('#sampleDate').value = state.sampleDate;
      $('#lookbackDays').value = state.lookbackDays;
      $('#lookaheadDays').value = state.lookaheadDays;
    }

    loadDraft();
    if (!state.paths || !state.paths.length) state.paths = [emptyPath()];
    hydrateInputs();
    bindEvents();
    renderAll();
  </script>
</body>
</html>
