# PDA 静态登记簿：第一层定稿候选模板
# 用途：
# 1. 只记录“价格向前走时留下了什么 PDA”
# 2. 不记录 tap / fill / invalidation，这些统一去 pda_events
# 3. 这份模板用于继续录 4H / 1H，先把第一层字段收稳

pdas:
  - id: "pda_YYYYMMDD_D_fvg_001"
    instrument: NQ
    timeframe: "D"              # W / D / 4H / 1H
    type: "fvg"                 # fvg / ob / bsl / ssl / nwog / ndog
    direction: bearish          # PDA 支持方向；bsl / ssl 可留空

    price:
    price_high:
    price_low:
    price_ce:

    created_date: "YYYY-MM-DD"  # PDA 形成日期
    verified_time: "YYYY-MM-DD" # PDA 被确认成立的时间；D/W 先写日期，低周期后续可写完整时间
    anchor_time: "YYYY-MM-DD"   # 锚定原始 K 线时间；若不适用可留空

    origin_start_date:          # 仅 OB 等区间型 PDA 使用
    origin_end_date:

    registry_status: active     # active / archived
    source: manual              # manual / imported / auto_scanner
    note: ""

  - id: "pda_YYYYMMDD_D_ob_001"
    instrument: NQ
    timeframe: "D"
    type: "ob"
    direction: bullish

    price:
    price_high:
    price_low:
    price_ce:

    created_date: "YYYY-MM-DD"
    verified_time: "YYYY-MM-DD"
    anchor_time: "YYYY-MM-DD"

    origin_start_date: "YYYY-MM-DD"
    origin_end_date: "YYYY-MM-DD"

    registry_status: active
    source: manual
    note: ""

  - id: "pda_YYYYMMDD_D_bsl_001"
    instrument: NQ
    timeframe: "D"
    type: "bsl"
    direction:

    price:
    price_high:
    price_low:
    price_ce:

    created_date: "YYYY-MM-DD"
    verified_time: "YYYY-MM-DD"
    anchor_time:

    origin_start_date:
    origin_end_date:

    registry_status: active
    source: manual
    note: ""

  - id: "pda_YYYYMMDD_D_ssl_001"
    instrument: NQ
    timeframe: "D"
    type: "ssl"
    direction:

    price:
    price_high:
    price_low:
    price_ce:

    created_date: "YYYY-MM-DD"
    verified_time: "YYYY-MM-DD"
    anchor_time:

    origin_start_date:
    origin_end_date:

    registry_status: active
    source: manual
    note: ""

# 当前暂定规则
# - direction 统一表示：这个 PDA 支持的预期方向
# - bsl / ssl 通常只填 price
# - fvg / ob / nwog / ndog 通常填 price_high / price_low / price_ce
# - tap / fill / invalidation 不进入本表，全部去 pda_events
# - created_time 暂时不用
# - fill_ratio 暂时不用
