# V2 系统配置
# 所有参数定义集中管理，代码和页面都从此文件读取

# 流畅度计算配置
fluency:
  # 评分范围
  score_min: 0
  score_max: 100

  # 权重配置 (总和必须为 1.0)
  weights:
    direction_consistency: 0.50
    efficiency: 0.15
    continuity: 0.15
    body_ratio: 0.15
    slope_stability: 0.05

  # 指标定义
  indicators:
    direction_consistency:
      name: 方向一致性
      formula: "(主导方向K线数 + 平K线数) / 总K线数"
      description: 同方向（含平K）K线占比
    efficiency:
      name: 推进效率
      formula: "|终点价格 - 起点价格| / Σ(H-L)"
      description: 净推进距离 / 总价格变化
    continuity:
      name: 连续性
      formula: "最大连续同方向K线数 / 总K线数"
      description: 最大连续同方向K线占比
    body_ratio:
      name: 实体占比
      formula: "avg|C-O| / avg(H-L)"
      description: 平均实体大小 / 平均K线范围
    slope_stability:
      name: 斜率稳定性
      formula: "max(1 - std/|mean|, 方向一致性×0.5)"
      description: 斜率波动的一致程度

  # 特殊处理
  processing:
    exclude_first_bar: true
    neutral_bar_handling: "按整体趋势方向计入"
    time_alignment: "向下取整到周期边界"

  # 可用时间周期 (分钟)
  bar_minutes_options:
    - value: 1
      label: "1m"
    - value: 5
      label: "5m"
    - value: 15
      label: "15m"
    - value: 60
      label: "1H"
      default: true
    - value: 240
      label: "4H"
    - value: 1440
      label: "1D"

# Path 字段定义
path:
  fields:
    - name: startTime
      type: datetime
      label: 开始时间
      description: 时间范围起点 (1m精度)
    - name: endTime
      type: datetime
      label: 结束时间
      description: 时间范围终点 (1m精度)
    - name: direction
      type: enum
      label: 方向
      options: ["bullish", "bearish"]
    - name: smoothness
      type: number
      label: 流畅度
      description: "0-100 分"
    - name: ratioToPrev
      type: number
      label: 与上一段比值
      description: "例: 1.5 = 比上一段长50%"
    - name: startOrigin
      type: enum
      label: 起点来源
      options: ["liquidity", "fvg", "ob", "nwog", "ndog", "breakout", "retest"]
    - name: endReason
      type: enum
      label: 终点原因
      options: ["liquidity", "fvg", "ob", "nwog", "ndog", "time", "reversal"]
      has_timeframe: ["fvg", "ob"]

# PDA 类型定义
pda_types:
  - id: bsl
    name: BSL
    full_name: 买方流动性
    category: point
    category_label: 单点
    fields: ["timeframe", "event_time", "price"]
  - id: ssl
    name: SSL
    full_name: 卖方流动性
    category: point
    category_label: 单点
    fields: ["timeframe", "event_time", "price"]
  - id: fvg
    name: FVG
    full_name: 公允价值缺口
    category: range
    category_label: 区间
    fields: ["timeframe", "event_time", "price_high", "price_low", "direction"]
  - id: ob
    name: OB
    full_name: 订单块
    category: range
    category_label: 区间
    fields: ["timeframe", "start_time", "end_time", "price_high", "price_low", "direction"]
  - id: eqh
    name: EQH
    full_name: 高点等高
    category: composite
    category_label: 组合
    fields: ["timeframe", "member_refs"]
  - id: eql
    name: EQL
    full_name: 低点等低
    category: composite
    category_label: 组合
    fields: ["timeframe", "member_refs"]

# 数据库配置
database:
  primary:
    path: "trading_data.duckdb"
    table: "futures_1m"
    description: "1m K线数据"
  v2_research:
    path: "v2/data/v2_research.duckdb"
    description: "V2 研究数据"
  instrument: "NQ"
  instrument_name: "纳斯达克期货"

# API 端点
api:
  base_url: "http://127.0.0.1:8765"
  endpoints:
    - path: "/v2/smoothness"
      method: GET
      description: "流畅度计算"
      params: ["start", "end", "bar_minutes"]
    - path: "/v2/config"
      method: GET
      description: "获取系统配置"
    - path: "/price"
      method: GET
      description: "价格查询"
    - path: "/v2/pda_records"
      method: GET
      description: "PDA 记录列表"
    - path: "/v2/pda_match"
      method: GET
      description: "PDA 匹配"
    - path: "/v2/bars"
      method: GET
      description: "K线数据查询"
      params: ["start", "end", "tf", "padding"]

# 元信息
meta:
  version: "2.0"
  updated: "2026-05-03"
  description: "NQ 期货 ICT 回测系统 V2 配置"
