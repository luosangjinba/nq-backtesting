<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>R13.6 Rectangle And Inspector Acceptance</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: #05070a; color: #dce3ec; }
      body { display: grid; grid-template-rows: auto 1fr; }
      .toolbar { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 12px; border-bottom: 1px solid #202630; background: #0a0e13; }
      button { min-height: 34px; padding: 0 14px; border: 1px solid #344153; border-radius: 6px; background: #141b24; color: #dce3ec; font-weight: 700; cursor: pointer; }
      button:hover, button:focus-visible { border-color: #4ea7ff; outline: none; }
      button[aria-pressed="true"] { border-color: #22d3ee; background: #0b3440; color: #8eeaff; }
      button.primary { border-color: #2563eb; background: #0b3b72; }
      button:disabled, input:disabled { cursor: not-allowed; opacity: .45; }
      [hidden] { display: none !important; }
      #legend { color: #758496; font-size: 12px; }
      #status { margin-left: auto; color: #9eabb9; font-size: 13px; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 310px; min-height: 0; }
      #chart { min-height: 0; position: relative; }
      #chart[data-controller-status="armed"], #chart[data-controller-status="drawing"] { cursor: crosshair; }
      #chart[data-controller-status="armed"] canvas, #chart[data-controller-status="drawing"] canvas { cursor: crosshair !important; }
      aside { overflow: auto; border-left: 1px solid #202630; background: #0a0e13; padding: 18px; }
      h1 { margin: 0 0 4px; font-size: 16px; }
      .hint { margin: 0 0 18px; color: #758496; font-size: 12px; line-height: 1.45; }
      .empty { padding: 18px 0; color: #8794a4; font-size: 13px; }
      form { display: grid; gap: 12px; }
      fieldset { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; padding: 12px; border: 1px solid #26303d; border-radius: 8px; }
      legend { padding: 0 6px; color: #aeb9c7; font-size: 12px; font-weight: 700; }
      label { display: grid; gap: 5px; color: #8f9cad; font-size: 11px; }
      label.wide { grid-column: 1 / -1; }
      input { width: 100%; min-height: 32px; border: 1px solid #303c4b; border-radius: 5px; background: #080c11; color: #e5ebf2; padding: 5px 7px; }
      input[type="color"] { padding: 3px; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; }
      .selected-id { margin-bottom: 12px; color: #7dd3fc; font: 11px ui-monospace, monospace; overflow-wrap: anywhere; }
      @media (max-width: 850px) { main { grid-template-columns: 1fr; grid-template-rows: minmax(360px, 1fr) auto; } aside { border-left: 0; border-top: 1px solid #202630; } }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="arm-rectangle" type="button" aria-pressed="false">Arm Rectangle</button>
      <button id="cancel-tool" type="button">Cancel / Escape</button>
      <span id="legend">Draw: arm → click start → move → click end (or drag-release) · Right-click/Escape cancels · Select: click a shape</span>
      <strong id="status">Loading…</strong>
    </div>
    <main>
      <div id="chart" data-controller-status="idle" data-scenario="loading"></div>
      <aside aria-label="Drawing inspector">
        <h1>Drawing Inspector</h1>
        <p class="hint">Typed Geometry and Style draft. Changes preview locally; Save performs one exact-revision command.</p>
        <div id="empty" class="empty">Click an accepted Segment or Rectangle.</div>
        <form id="inspector" hidden>
          <div id="selected-id" class="selected-id"></div>
          <fieldset>
            <legend>Geometry</legend>
            <label>Start time<input id="startEpochMs" data-field="startEpochMs" type="number" step="60000"></label>
            <label>End time<input id="endEpochMs" data-field="endEpochMs" type="number" step="60000"></label>
            <label id="start-price-label">Start price<input id="startPrice" data-field="startPrice" type="number" step="0.25"></label>
            <label id="end-price-label">End price<input id="endPrice" data-field="endPrice" type="number" step="0.25"></label>
            <label id="low-price-label">Low price<input id="lowPrice" data-field="lowPrice" type="number" step="0.25"></label>
            <label id="high-price-label">High price<input id="highPrice" data-field="highPrice" type="number" step="0.25"></label>
          </fieldset>
          <fieldset>
            <legend>Style</legend>
            <label>Stroke<input id="strokeColor" data-field="strokeColor" type="color"></label>
            <label>Width<input id="strokeWidth" data-field="strokeWidth" type="number" min="1" max="12" step="1"></label>
            <label id="fill-color-label">Fill<input id="fillColor" data-field="fillColor" type="color"></label>
            <label id="fill-opacity-label">Opacity<input id="fillOpacity" data-field="fillOpacity" type="number" min="0" max="1" step="0.05"></label>
          </fieldset>
          <div class="actions">
            <button id="cancel-edit" type="button">Cancel</button>
            <button id="save-edit" class="primary" type="button">Save</button>
          </div>
        </form>
      </aside>
    </main>
    <script type="module" src="./scenario.js"></script>
  </body>
</html>
