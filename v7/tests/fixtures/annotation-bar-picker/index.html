<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>R13.10b Exact Bar Picker Acceptance</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: #05070a; color: #dce3ec; }
      body { display: grid; grid-template-rows: auto 1fr; }
      .toolbar { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 8px 12px; border-bottom: 1px solid #202630; background: #0a0e13; }
      button { min-height: 34px; padding: 0 14px; border: 1px solid #344153; border-radius: 6px; background: #141b24; color: #dce3ec; font-weight: 700; cursor: pointer; }
      button:hover { border-color: #4ea7ff; }
      button[aria-pressed="true"] { border-color: #22d3ee; background: #0b3440; color: #8eeaff; }
      #legend { color: #758496; font-size: 12px; }
      #status { margin-left: auto; color: #a8b1bd; font-size: 13px; }
      #chart { min-height: 0; position: relative; }
      #chart[data-picker-status="armed"], #chart[data-picker-status="armed"] canvas { cursor: crosshair !important; }
      .value { color: #8eeaff; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="arm" type="button" aria-pressed="false">Pick exact Bar</button>
      <button id="cancel" type="button">Cancel / Escape</button>
      <span id="legend">Arm → hover a candle → click once · Cyan candidate → Lime accepted · Right-click cancels</span>
      <strong id="status">Loading…</strong>
    </div>
    <div id="chart" data-scenario="loading" data-picker-status="idle"></div>
    <script type="module" src="./scenario.js"></script>
  </body>
</html>
