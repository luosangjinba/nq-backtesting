<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>R13.10c Deterministic Fair Value Gap</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05070a; color: #dce7f3; }
      body { display: grid; grid-template-rows: auto 1fr; }
      header { display: flex; align-items: center; gap: 9px; min-height: 82px; padding: 12px 18px; border-bottom: 1px solid #1d2b38; background: #081018; }
      .copy { min-width: 290px; margin-right: auto; }
      h1 { margin: 0; font-size: 16px; }
      p { margin: 4px 0 0; color: #8fa3b7; font-size: 12px; }
      .legend { display: flex; gap: 14px; }
      .bullish { color: #10b981; } .bearish { color: #f43f5e; }
      button { border: 1px solid #29455c; border-radius: 6px; padding: 9px 11px; color: #dce7f3; background: #102131; font-weight: 700; cursor: pointer; }
      button:hover:not(:disabled), button[data-active="true"] { border-color: #38bdf8; background: #123a53; }
      button:disabled { cursor: not-allowed; opacity: .4; }
      #status { min-width: 205px; color: #a9bdd0; font: 12px ui-monospace, SFMono-Regular, monospace; text-align: right; }
      main { min-height: 0; display: grid; grid-template-rows: auto 1fr; }
      .chart-head { display: flex; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #15222d; font-size: 13px; }
      #projection-count { color: #7f95a9; font: 12px ui-monospace, SFMono-Regular, monospace; }
      #chart { min-height: 0; }
    </style>
  </head>
  <body data-scenario="loading">
    <header>
      <div class="copy">
        <h1>R13.10c · Strict Three-Bar FVG</h1>
        <p>Evidence Bundle → package-validated Artifact → Rectangle + midpoint + label</p>
        <p class="legend"><span class="bullish">Green: Bullish FVG</span><span class="bearish">Red: Bearish FVG</span></p>
      </div>
      <button id="construct-bullish" type="button">Construct bullish</button>
      <button id="construct-bearish" type="button">Construct bearish</button>
      <button id="before" type="button">Before observed</button>
      <button id="after" type="button">After observed</button>
      <button id="disable" type="button">Disable package</button>
      <button id="enable" type="button" disabled>Enable package</button>
      <output id="status">Starting…</output>
    </header>
    <main>
      <div class="chart-head"><strong>NQ · 1m · exact loaded Bars</strong><span id="projection-count">0 projections</span></div>
      <div id="chart"></div>
    </main>
    <script>
      globalThis.addEventListener('error', (event) => {
        document.body.dataset.error = `${event.error?.name ?? 'Error'}:${event.error?.message ?? event.message}`;
        document.body.dataset.scenario = 'failed';
      });
      globalThis.addEventListener('unhandledrejection', (event) => {
        document.body.dataset.error = `${event.reason?.name ?? 'Error'}:${event.reason?.message ?? event.reason}`;
        document.body.dataset.scenario = 'failed';
      });
    </script>
    <script type="module" src="./scenario.js?v=h111-20260810a"></script>
  </body>
</html>
