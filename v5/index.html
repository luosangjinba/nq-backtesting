<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>V5 FX Replay</title>
    <link rel="stylesheet" href="./src/styles/app.css">
  </head>
  <body>
    <div id="v5-app" class="app-shell" data-v5-root>
      <header class="top-bar">
        <div>
          <div class="eyebrow">V5</div>
          <h1>FX Replay</h1>
        </div>
        <nav class="route-tabs" aria-label="V5 routes">
          <button type="button" data-route-link="setup">Setup</button>
          <button type="button" data-route-link="chart">Chart</button>
        </nav>
      </header>
      <main class="workspace" data-route-outlet>
        <section class="panel">
          <h2>Loading</h2>
          <p>Starting V5 shell.</p>
        </section>
      </main>
    </div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
