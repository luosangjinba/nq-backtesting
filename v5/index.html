<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>V5 FX Replay</title>
    <link rel="stylesheet" href="./src/styles/app.css">
  </head>
  <body>
    <div id="v5-app" class="app-shell" data-v5-root>
      <header class="top-bar">
        <div>
          <div class="eyebrow">V5</div>
          <h1>FX Replay</h1>
        </div>
        <div class="runtime-badge">Shell</div>
      </header>
      <main class="workspace">
        <section class="panel">
          <h2>Session Setup</h2>
          <p>V5 shell is ready for the setup route.</p>
        </section>
        <section class="panel panel-muted">
          <h2>Chart Replay</h2>
          <p>Chart, bars, and replay runtime are intentionally not loaded yet.</p>
        </section>
      </main>
    </div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
