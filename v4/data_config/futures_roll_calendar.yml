# V4 futures raw-contract roll calendar.
#
# Purpose:
# - Databento continuous symbols do not match the existing DB roll behavior.
# - Use raw quarterly contracts and explicit ET roll dates.
# - This file is configuration only; it is not an import log.
#
# Semantics:
# - `roll_date_et` is a US/Eastern calendar date.
# - Bars whose ET-naive timestamp date is before `roll_date_et` use `old_contract`.
# - Bars whose ET-naive timestamp date is on/after `roll_date_et` use `new_contract`.
# - Existing DB rows remain authoritative; future importers must be insert-only.

version: 1
timezone: America/New_York
dataset: GLBX.MDP3
schema: ohlcv-1m
rolls:
  - instrument: ES
    old_contract: ESZ5
    new_contract: ESH6
    roll_date_et: 2025-12-14
    status: validated
    note: Validated against ES DB overlap; 0 missing, 0 duplicate, max OHLC diff 0.25.
  - instrument: NQ
    old_contract: NQZ5
    new_contract: NQH6
    roll_date_et: 2025-12-14
    status: inferred_no_db_overlap
    note: NQ DB stops before this roll; inferred from ES validation and 2025 ES/NQ shared roll behavior.
  - instrument: ES
    old_contract: ESH6
    new_contract: ESM6
    roll_date_et: 2026-03-13
    status: validated
    note: Validated against ES DB overlap after correcting candidate date from 2026-03-15 to 2026-03-13; 0 missing, 0 duplicate, max OHLC diff 0.25. Databento flagged 2026-03-15/16 as degraded quality.
  - instrument: NQ
    old_contract: NQH6
    new_contract: NQM6
    roll_date_et: 2026-03-16
    status: volume_validated
    note: 'Volume audit resolved conflict: NQM6 first overtakes NQH6 on 2026-03-16; ES 2026-03 remains validated on 2026-03-13; no DB overlap exists for direct NQ validation.'
  - instrument: ES
    old_contract: ESM6
    new_contract: ESU6
    roll_date_et: 2026-06-14
    status: future_candidate
    note: Candidate for daily refresh after June 2026 roll.
  - instrument: NQ
    old_contract: NQM6
    new_contract: NQU6
    roll_date_et: 2026-06-14
    status: future_candidate
    note: Candidate for daily refresh after June 2026 roll.
