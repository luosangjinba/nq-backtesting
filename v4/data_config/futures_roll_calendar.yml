# V4 futures raw-contract roll calendar.
#
# Purpose:
# - Direct Databento continuous mappings change at 00:00 UTC and split CME sessions.
# - Use raw quarterly contracts and explicit New York roll boundaries.
# - Ordinary acquisition remains insert-only; historical repair uses a separate guarded path.
#
# Semantics:
# - `roll_date_et` is the human-facing CME trade date.
# - `effective_at_et` is the exact source-contract transition boundary.
# - New session-aligned transitions use the prior 18:00 CME session open.

version: 2
timezone: America/New_York
dataset: GLBX.MDP3
schema: ohlcv-1m
rolls:
  - instrument: NQ
    old_contract: NQH5
    new_contract: NQM5
    roll_date_et: '2025-03-17'
    effective_at_et: 2025-03-16T18:00
    boundary_policy: cme_trade_date_session_open
    status: manual_confirmed
    evidence_type: historical_trade_date_liquidity_repair
    note: 'Historical repair: NQM5 had 1,380 minutes and 83.69% of NQH5 volume on
      trade date 2025-03-17; session-open boundary satisfies the expiry-week hard
      horizon.'
    confirmed_at: '2026-08-02T08:36:16-04:00'
  - instrument: NQ
    old_contract: NQM5
    new_contract: NQU5
    roll_date_et: '2025-06-16'
    effective_at_et: 2025-06-15T18:00
    boundary_policy: cme_trade_date_session_open
    status: volume_confirmed
    evidence_type: historical_trade_date_liquidity_repair
    note: 'Historical repair: NQU5 first complete-session volume dominance was 1.5484x
      on trade date 2025-06-16.'
    confirmed_at: '2026-08-02T08:36:16-04:00'
  - instrument: NQ
    old_contract: NQU5
    new_contract: NQZ5
    roll_date_et: '2025-09-15'
    effective_at_et: 2025-09-14T18:00
    boundary_policy: cme_trade_date_session_open
    status: manual_confirmed
    evidence_type: historical_trade_date_liquidity_audit
    note: 'Boundary retained: NQZ5 had 1,375 minutes and 98.88% of NQU5 volume on
      trade date 2025-09-15; later Databento evidence includes a degraded date.'
    confirmed_at: '2026-08-02T08:36:16-04:00'
  - instrument: ES
    old_contract: ESZ5
    new_contract: ESH6
    roll_date_et: 2025-12-14
    effective_at_et: 2025-12-14T00:00
    boundary_policy: legacy_midnight
    status: validated
    note: Validated against ES DB overlap; 0 missing, 0 duplicate, max OHLC diff 0.25.
  - instrument: NQ
    old_contract: NQZ5
    new_contract: NQH6
    roll_date_et: '2025-12-15'
    effective_at_et: 2025-12-14T18:00
    boundary_policy: cme_trade_date_session_open
    status: volume_confirmed
    evidence_type: historical_trade_date_liquidity_repair
    note: 'Historical repair: NQH6 first complete-session volume dominance was 1.2602x
      on trade date 2025-12-15.'
    confirmed_at: '2026-08-02T08:36:16-04:00'
  - instrument: ES
    old_contract: ESH6
    new_contract: ESM6
    roll_date_et: 2026-03-13
    effective_at_et: 2026-03-13T00:00
    boundary_policy: legacy_midnight
    status: validated
    note: Validated against ES DB overlap after correcting candidate date from 2026-03-15
      to 2026-03-13; 0 missing, 0 duplicate, max OHLC diff 0.25. Databento flagged
      2026-03-15/16 as degraded quality.
  - instrument: NQ
    old_contract: NQH6
    new_contract: NQM6
    roll_date_et: 2026-03-16
    effective_at_et: 2026-03-16T00:00
    boundary_policy: legacy_midnight
    status: volume_validated
    note: 'Volume audit resolved conflict: NQM6 first overtakes NQH6 on 2026-03-16;
      ES 2026-03 remains validated on 2026-03-13; no DB overlap exists for direct
